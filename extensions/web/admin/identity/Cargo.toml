[package]
name = "systemprompt-web-admin-identity"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Identity domain of the admin dashboard for the systemprompt.io template: users and their sessions, SAML single sign-on and developer sign-in, groups, projects, roles and the access-control rules."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Foundation
systemprompt-web-shared = { workspace = true }
systemprompt-web-admin-core = { workspace = true }
# Audit: uses identifiers, loader, models, oauth, security — requires `full`.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-security = { workspace = true }

# Database
sqlx = { workspace = true }

# Web framework
axum = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Crypto & encoding (developer login codes, SAML relay state, groups.yaml
# digests)
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

# SAML 2.0 relying party: pure-Rust XML-DSig, no libxml2/xmlsec.
saml = { workspace = true }
# Fetches the IdP federation metadata from `idp_metadata_url`.
reqwest = { workspace = true }

# Utilities
urlencoding = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
