[package]
name = "systemprompt-web-admin-farm"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Agent farm domain of the admin dashboard for the systemprompt.io template: farms synced from a Git marketplace, headless coding-agent runs queued on core's agent_runs executor and attributed to a user, and the eval suites scored over them."
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.cargo-machete]
# Why: register_subject_attribute_provider! expands to ::inventory paths,
# which machete cannot see.
ignored = ["inventory"]

[dependencies]
# Foundation
systemprompt-web-shared = { workspace = true }
systemprompt-web-admin-core = { workspace = true }
inventory = { workspace = true }
systemprompt = { workspace = true, features = ["full"] }

# Database
sqlx = { workspace = true }

# Web framework
axum = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Fly Machines API and the worker wire format
reqwest = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

# Logging
tracing = { workspace = true }

# Eval assertion patterns
regex = "1.13"

# Run report output hashes
hex = { workspace = true }

# Source capture and run workspaces
walkdir = { workspace = true }

[lints]
workspace = true
