[package]
name = "systemprompt-web-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Admin dashboard composition root for the systemprompt.io template: merges the catalog, governance, identity, platform and analytics route fragments behind the session middleware and role gates."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Foundation
systemprompt-web-shared = { workspace = true }
systemprompt-web-admin-core = { workspace = true }
systemprompt-web-admin-analytics = { workspace = true }
systemprompt-web-admin-catalog = { workspace = true }
systemprompt-web-admin-governance = { workspace = true }
systemprompt-web-admin-identity = { workspace = true }
systemprompt-web-admin-platform = { workspace = true }
# Uses database, identifiers, marketplace, oauth — requires `full`.
systemprompt = { workspace = true, features = ["full"] }

# Database
sqlx = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
urlencoding = { workspace = true }

[lints]
workspace = true
