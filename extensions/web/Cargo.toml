[package]
name = "systemprompt-web-extension"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Web extension for the systemprompt.io template: content, navigation, template rendering and the admin plane's composition root for the self-hosted AI governance binary."
repository.workspace = true
homepage.workspace = true
publish = false

# extension_migrations!() expands to ::systemprompt_extension paths; machete
# cannot see macro-expansion usage.
[package.metadata.cargo-machete]
ignored = ["systemprompt-extension", "inventory"]

[lints]
workspace = true

[dependencies]
# Core facade - provides all systemprompt types via unified API.
# Audit: uses ai, database, extension, loader, models, traits — requires `full`
# (ai + loader are gated by the `full` feature).
systemprompt = { workspace = true, features = ["full"] }

# Local sub-crates
systemprompt-web-shared = { workspace = true }
systemprompt-web-admin-analytics = { workspace = true }
systemprompt-web-admin-catalog = { workspace = true }
systemprompt-web-admin-farm = { workspace = true }
systemprompt-web-admin-governance = { workspace = true }
systemprompt-web-admin-identity = { workspace = true }
systemprompt-web-admin-platform = { workspace = true }
systemprompt-web-admin-core = { workspace = true }
systemprompt-web-content = { workspace = true }
systemprompt-web-site = { workspace = true }
systemprompt-web-jobs = { workspace = true }
# Registers the `onepassword` secrets source; linked for its inventory entry.
systemprompt-secrets-onepassword = { workspace = true }

# Extension framework — direct dep so the `extension_migrations!()` macro
# expansion (`::systemprompt_extension::Migration`) resolves.
systemprompt-extension = { workspace = true }
inventory = { workspace = true }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

# Utilities
chrono = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

[build-dependencies]
systemprompt-extension = { workspace = true }
