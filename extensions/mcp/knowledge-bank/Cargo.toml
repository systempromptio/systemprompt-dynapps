[package]
name = "systemprompt-mcp-knowledge-bank"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Knowledge-bank MCP server: the project-context RAG engine — per-user Atlassian ingestion into one shared pgvector index, hybrid retrieval and reranking, with per-document access control."
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "systemprompt-mcp-knowledge-bank"
path = "src/main.rs"

[dependencies]
# Audit: uses database, identifiers, logging, mcp, models, system (api), traits — requires `full`.
systemprompt = { workspace = true, features = ["full"] }

anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true

rmcp.workspace = true

axum.workspace = true
reqwest = { workspace = true, features = ["form", "query"] }
urlencoding.workspace = true

sqlx.workspace = true
chrono.workspace = true
rand.workspace = true
uuid.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
regex.workspace = true
futures.workspace = true
htmd.workspace = true
glob.workspace = true
pdf-extract.workspace = true
zip.workspace = true
base64.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
tempfile.workspace = true
calamine.workspace = true
quick-xml.workspace = true

schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true

systemprompt-mcp-shared.workspace = true

[lints]
workspace = true
