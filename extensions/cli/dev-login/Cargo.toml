[package]
name = "systemprompt-dev-login"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Development-only CLI extension for the Dynapps instance: prints a single-use admin-console login link."
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "systemprompt-dev-login"
path = "src/main.rs"

[dependencies]
# Audit: uses config (ProfileBootstrap, SecretsBootstrap), logging, models, system (AppContext) — requires `full`.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-web-admin-identity = { workspace = true }
# Links the governance crate so its register_authz_hook! lands in the inventory;
# the profile sets governance.authz.hook.mode = extension and AppContext refuses
# to start without one.
systemprompt-web-admin-governance = { workspace = true }

anyhow.workspace = true
rustls.workspace = true
tracing.workspace = true
clap.workspace = true
tokio.workspace = true

[lints]
workspace = true
