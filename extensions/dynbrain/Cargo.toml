[package]
name = "dynbrain"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The Brain for the Dynapps instance: documentation spaces with article trees, a variant per language, revisions, typed properties and inherited permissions, stored in Postgres with pgvector for retrieval."
repository.workspace = true
homepage.workspace = true
publish = false

# extension_migrations!() expands to ::systemprompt_extension paths; machete
# cannot see macro-expansion usage.
[package.metadata.cargo-machete]
ignored = ["systemprompt-extension"]

[lints]
workspace = true

[dependencies]
# Audit: uses extension (Extension, SchemaDefinition) and identifiers (UserId).
systemprompt = { workspace = true }
# Direct dep so the `extension_migrations!()` expansion resolves.
systemprompt-extension = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# The content hash of a variant.
sha2 = { workspace = true }
hex = { workspace = true }
# A `link` property must be an absolute http(s) URL.
url = { workspace = true }

[build-dependencies]
systemprompt-extension = { workspace = true }
