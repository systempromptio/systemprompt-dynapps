[package]
name = "dynwork-chats"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "DynWork cloud chats for the Dynapps instance: chat threads, messages and live reply events stored in the user's own systemprompt instance, so DynWork Mobile and every DynWork desktop read the same chats whether a desktop is on or not."
repository.workspace = true
homepage.workspace = true
publish = false

# extension_migrations!() expands to ::systemprompt_extension paths; machete
# cannot see macro-expansion usage.
[package.metadata.cargo-machete]
ignored = ["systemprompt-extension"]

[lints]
workspace = true

[dependencies]
# Audit: uses extension (Extension, SchemaDefinition), identifiers (UserId),
# traits (BackgroundTasks) and, through `full`, `ai` (AiService, the model a
# reply streams from), as the farm admin does.
systemprompt = { workspace = true, features = ["full"] }
# Direct dep so the `extension_migrations!()` expansion resolves.
systemprompt-extension = { workspace = true }

# The desktop and mobile JWT checks and the phone's device row, used as the
# relay defines them rather than copied.
dynwork-relay = { workspace = true }

axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# A reply runs as a task the extension owns; its events fan out to `/log`
# followers over a broadcast, and `interrupt` cancels it with a token.
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
# The request context of a model call: one context id per thread (v5).
uuid = { workspace = true, features = ["v5"] }
# The optional `services/config/dynwork-chats.yaml` (`inactive_days`, ...).
serde_yaml = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

[build-dependencies]
systemprompt-extension = { workspace = true }
