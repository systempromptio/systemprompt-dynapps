<template>
  <div class="lead-detail-container">
    <lightning-card
      title="Lead Information"
      icon-name="standard:lead"
      aria-label="Lead Information Card">

      <div slot="header" class="slds-var-m-bottom_medium"></div>

      <!-- Loading State -->
      <template if:true={isLoading}>
        <div class="slds-var-p_medium" role="status" aria-label="Loading lead information">
          <lightning-spinner
            alternative-text="Loading lead data"
            size="medium">
          </lightning-spinner>
        </div>
      </template>

      <!-- Error State -->
      <template if:true={error}>
        <lightning-illustration
          message-title="Unable to Load Lead"
          message-body={error}
          size="small"
          variant="404">
        </lightning-illustration>
      </template>

      <!-- Success State -->
      <template if:true={hasRecord}>
        <div class="slds-var-p_medium">
          <div class="slds-grid slds-wrap">
            <!-- Lead Name -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_medium">
              <div class="slds-form-element">
                <label for="lead-name" class="slds-form-element__label">
                  <abbr class="slds-required" title="required">*</abbr> Name
                </label>
                <div class="slds-form-element__control">
                  <div
                    id="lead-name"
                    class="slds-var-p_small slds-border_bottom"
                    role="textbox"
                    aria-readonly="true">
                    {leadName}
                  </div>
                </div>
              </div>
            </div>

            <!-- Lead Status -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-m-bottom_medium">
              <div class="slds-form-element">
                <label for="lead-status" class="slds-form-element__label">
                  <abbr class="slds-required" title="required">*</abbr> Status
                </label>
                <div class="slds-form-element__control">
                  <div
                    id="lead-status"
                    class="slds-badge slds-var-p_small"
                    role="textbox"
                    aria-readonly="true"
                    aria-label="Lead status: {leadStatus}">
                    {leadStatus}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

    </lightning-card>
  </div>
</template>
