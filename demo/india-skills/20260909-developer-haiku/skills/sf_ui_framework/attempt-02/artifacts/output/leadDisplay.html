<template>
  <div class="slds-box slds-theme_default">
    <div class="slds-page-header">
      <div class="slds-page-header__row">
        <h1 class="slds-page-header__title">Lead Information</h1>
      </div>
    </div>

    <template if:true={isLoading}>
      <div class="slds-spinner_container" role="status" aria-label="Loading">
        <div class="slds-spinner slds-spinner_medium">
          <div class="slds-spinner__dot-a"></div>
          <div class="slds-spinner__dot-b"></div>
        </div>
      </div>
    </template>

    <template if:true={hasError}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        <span class="slds-assistive-text">Error</span>
        <h2 class="slds-text-heading_small">{errorMessage}</h2>
      </div>
    </template>

    <template if:true={hasData}>
      <div class="slds-form">
        <div class="slds-form__item">
          <label class="slds-form__label" for="lead-name">Lead Name</label>
          <div class="slds-form-element__static slds-form-element__static_large">
            <span id="lead-name" class="slds-text-body_regular">{leadRecord.Name}</span>
          </div>
        </div>

        <div class="slds-form__item">
          <label class="slds-form__label" for="lead-status">Status</label>
          <div class="slds-form-element__static slds-form-element__static_large">
            <span id="lead-status" class="slds-badge slds-badge_success">
              {leadRecord.Status}
            </span>
          </div>
        </div>

        <div class="slds-m-top_medium">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleRefresh}
            aria-label="Refresh lead data"
          >
            Refresh
          </button>
        </div>
      </div>
    </template>
  </div>
</template>
