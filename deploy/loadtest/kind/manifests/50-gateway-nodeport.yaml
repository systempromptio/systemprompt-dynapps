# Host access to the gateway pods (host port 18080 via kind-config.yaml) for
# manual calls and the core harness. In-cluster generators use the chart's
# ClusterIP Service `dynapps-gateway` instead, which avoids the kind proxy hop.
apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  namespace: loadtest
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: dynapps
    app.kubernetes.io/component: gateway
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30080}]
