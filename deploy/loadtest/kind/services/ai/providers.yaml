providers:
  mock-anthropic:
    credential: anthropic
    display_name: Mock Anthropic (load test)
    description: Core mock inference server, primary deployment for the load-test rig.
    governance:
      european: false
      no_retain: true
    enabled: true
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: false
      tools: false
      structured_output: false
      system_prompts: false
      image_resolution_config: false
      reasoning: false
      prompt_caching: false
    resilience:
      request_timeout_ms: 60000
      connect_timeout_ms: 10000
      stream_idle_timeout_ms: 60000
      retry_attempts: 3
      retry_base_delay_ms: 200
      retry_max_delay_ms: 10000
      breaker_failure_threshold: 5
      breaker_open_cooldown_ms: 30000
      breaker_half_open_probes: 1
      max_concurrent: 16
    google_search_enabled: false
    endpoints:
      eu:
        wire: anthropic
        url: http://mock-eu.loadtest.svc.cluster.local:9100
        price_multiplier: 1.1
      messages:
        wire: anthropic
        url: http://mock-primary.loadtest.svc.cluster.local:9100
