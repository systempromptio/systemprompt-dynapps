# Load-test provider catalog (deploy/loadtest/kind). Mounted over
# /app/services/ai/providers.yaml by values-kind.yaml. Two Anthropic-wire
# providers, both core's mock inference server inside the cluster, so the rig
# makes no paid call: mock-anthropic is the primary of every claude-* chain,
# mock-anthropic-eu the failover (hidden aliases matched on upstream_model,
# the same shape as vertex-anthropic-eu). Entry shape copied from the shipped
# e2e-mock provider. The endpoint has no /v1: core appends /messages and the
# mock serves POST /messages at its root. Any api key value works.
providers:
- name: mock-anthropic
  display_name: Mock Anthropic (load test)
  description: >-
    Core mock inference server, primary deployment for the load-test rig.
  wire: anthropic
  surface: anthropic
  endpoint: http://mock-primary.loadtest.svc.cluster.local:9100
  api_key_secret: anthropic
  governance:
    european: false
    no_retain: true
  models:
  - id: claude-sonnet-5
    pricing:
      input_per_million: 3.0
      output_per_million: 15.0
      cache_read_per_million: 0.0
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: false
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 200000
      max_output_tokens: 8192
  - id: claude-haiku-4-5
    pricing:
      input_per_million: 1.0
      output_per_million: 5.0
      cache_read_per_million: 0.0
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: false
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 200000
      max_output_tokens: 8192
  - id: claude-opus-5
    pricing:
      input_per_million: 5.0
      output_per_million: 25.0
      cache_read_per_million: 0.0
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: false
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 200000
      max_output_tokens: 8192
