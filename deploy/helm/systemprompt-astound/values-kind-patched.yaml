# Overlay on values-kind.yaml for images >= 0.65.0 (Phase 3): the prepared
# statement leak is fixed (statement cache 100), so the baseline's 120 s pool
# recycle is removed (null deletes the key from the merged values).
#   LOADTEST_IMAGE_TAG=loadtest-local LOADTEST_VALUES=values-kind-patched.yaml just loadtest-kind-deploy
profile:
  overrides:
    database:
      pool:
        max_lifetime_secs: null
