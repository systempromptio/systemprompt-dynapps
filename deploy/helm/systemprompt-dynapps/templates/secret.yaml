{{- if eq .Values.secrets.mode "inline" }}
# Development only: secrets.json lives in the release values. Use csi or
# existingSecret anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dynapps.secretName" . }}
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.json: {{ required "secrets.inline.json is required with secrets.mode inline" .Values.secrets.inline.json | quote }}
{{- else if not (has .Values.secrets.mode (list "csi" "existingSecret")) }}
{{- fail "secrets.mode must be one of csi, existingSecret, inline" }}
{{- end }}
