{{- if .Values.gateway.autoscaling.enabled }}
{{- $a := .Values.gateway.autoscaling }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "astound.fullname" . }}-gateway
  labels:
    {{- include "astound.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "astound.fullname" . }}-gateway
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage }}
    {{- if $a.customMetric.enabled }}
    - type: Pods
      pods:
        metric:
          name: {{ $a.customMetric.name }}
        target:
          type: AverageValue
          averageValue: {{ $a.customMetric.targetAverageValue | quote }}
    {{- end }}
  {{- with $a.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
