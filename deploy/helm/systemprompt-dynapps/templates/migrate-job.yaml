{{- if .Values.migrate.enabled }}
{{- $fullname := include "dynapps.fullname" . -}}
{{- $name := printf "%s-migrate" $fullname -}}
{{- $hook := "pre-install,pre-upgrade" -}}
# Every object the Job needs is its own hook copy: on a first install the
# release's ConfigMap, SecretProviderClass and KSA do not exist yet when
# pre-install hooks run. The KSA `<fullname>-migrate` needs the same Workload
# Identity binding as the app KSA (docs/install/gke.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ . }}
    {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-profile
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  profile.yaml: |
    {{- include "dynapps.profile" (dict "ctx" . "role" "all") | nindent 4 }}
{{- if eq .Values.secrets.mode "csi" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}-secrets
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  {{- include "dynapps.spcSpec" . | nindent 2 }}
{{- else if eq .Values.secrets.mode "inline" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  secrets.json: {{ .Values.secrets.inline.json | quote }}
{{- end }}
---
# One-shot schema migration + admin bootstrap (image argument `migrate`).
# Runs before any new pod; a failure stops the upgrade with the old pods intact.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "0"
    # Keep a failed Job for its logs; the next upgrade replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "dynapps.labels" . | nindent 8 }}
        {{- include "dynapps.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      {{- $secretName := ternary (printf "%s-secrets" $name) (include "dynapps.secretName" .) (eq .Values.secrets.mode "inline") }}
      {{- include "dynapps.podSpec" (dict "ctx" . "role" "all" "component" "migrate" "profileConfigMap" (printf "%s-profile" $name) "serviceAccount" $name "spc" (printf "%s-secrets" $name) "secretName" $secretName "job" true "args" (list "migrate") "resources" .Values.migrate.resources) | nindent 6 }}
{{- end }}
