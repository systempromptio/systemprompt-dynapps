{{- if eq .Values.secrets.mode "csi" }}
# Google Secret Manager -> secrets.json file, through the Secret Store CSI
# driver. Read with the pod's KSA (Workload Identity); the GSA needs
# roles/secretmanager.secretAccessor on the secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "dynapps.fullname" . }}-secrets
  labels:
    {{- include "dynapps.labels" . | nindent 4 }}
spec:
  {{- include "dynapps.spcSpec" . | nindent 2 }}
{{- end }}
