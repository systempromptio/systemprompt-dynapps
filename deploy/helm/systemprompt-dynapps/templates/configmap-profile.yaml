{{- range $role := list "gateway" "admin" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dynapps.fullname" $ }}-profile-{{ $role }}
  labels:
    {{- include "dynapps.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
data:
  profile.yaml: |
    {{- include "dynapps.profile" (dict "ctx" $ "role" $role) | nindent 4 }}
{{- end }}
