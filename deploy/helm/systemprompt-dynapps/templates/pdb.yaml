{{- range $c := list "gateway" "api" "worker" }}
{{- $pdb := (index $.Values $c).pdb }}
{{- if $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dynapps.fullname" $ }}-{{ $c }}
  labels:
    {{- include "dynapps.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
spec:
  minAvailable: {{ $pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "dynapps.selectorLabels" (dict "ctx" $ "component" $c) | nindent 6 }}
{{- end }}
{{- end }}
