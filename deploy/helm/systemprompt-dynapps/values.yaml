# Default values for systemprompt-dynapps.
# Every value a GKE operator MUST set is marked REQUIRED; values-gke-example.yaml
# shows a complete set. Runbook: docs/install/gke.md.

nameOverride: ""
fullnameOverride: ""

image:
  # Private GHCR by default. Cloudfresh mirrors it to Artifact Registry, e.g.
  # europe-west1-docker.pkg.dev/<project>/dynapps/systemprompt-dynapps
  repository: ghcr.io/systempromptio/systemprompt-dynapps
  # Defaults to Chart.appVersion. Versioned tags are immutable; never use latest.
  tag: ""
  # Pin the verified digest (cosign verify, deploy/self-host/README.md §6) in production.
  digest: ""
  pullPolicy: IfNotPresent
# e.g. [{name: ghcr-pull}] when pulling from GHCR; empty for Artifact Registry
# with the node service account granted roles/artifactregistry.reader.
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Profile: rendered into a ConfigMap per role from the values below. It is the
# Kubernetes form of deploy/self-host/profile.yaml.template; secrets never
# appear here (they come from secrets.json, see `secrets`).
# ---------------------------------------------------------------------------
profile:
  # REQUIRED. Public https URL users and the bridge reach, e.g. https://ai.example.com
  externalUrl: ""
  # REQUIRED. E-mail of the bootstrap `admin` user (first SSO sign-in).
  adminEmail: ""
  # Load balancer source ranges whose X-Forwarded-For is trusted. The GKE
  # external Application Load Balancer connects from the Google Front End ranges.
  trustedProxies:
    - 35.191.0.0/16
    - 130.211.0.0/22
  # Per-pod concurrency ceiling; past it the pod answers 503 + Retry-After and
  # /readyz reports {"status":"saturated"}, so the load balancer moves traffic.
  maxInFlight: 512
  maxConcurrentStreams: 256
  logLevel: normal
  # database.pool.max_connections_by_role. Postgres must admit
  # sum(replicas(role) x (pool(role) + 2)) plus migration and operator sessions.
  maxConnectionsByRole:
    gateway: 20
    api: 20
    worker: 40
  # Uploaded and generated files. GKE uses one bucket every pod sees, reached
  # through Workload Identity (the GSA needs roles/storage.objectAdmin on it).
  storage:
    backend: gcs
    bucket: ""          # REQUIRED with backend gcs
    prefix: dynapps/files
    credentials: workload_identity
  # Requests per second per client address, one bucket per route group; same
  # meanings as deploy/self-host/profile.yaml.template. Behind the GKE load
  # balancer the client address is the X-Forwarded-For hop it trusts.
  rateLimits:
    disabled: false
    oauth_public_per_second: 10
    oauth_auth_per_second: 10
    contexts_per_second: 100
    tasks_per_second: 50
    artifacts_per_second: 50
    agent_registry_per_second: 50
    agents_per_second: 20
    mcp_registry_per_second: 50
    mcp_per_second: 200
    stream_per_second: 100
    content_per_second: 50
    gateway_per_second: 100
    bridge_auth_per_second: 20
    burst_multiplier: 3
  retention:
    logs_days: 14
    analytics_events_days: 30
    ai_request_messages_days: 30
    ai_request_payload_raw_days: 7
    governance_decisions_days: 180
    mcp_tool_executions_days: 180
    outbox_processed_days: 7
  # Deep-merged over the generated profile last (lists replace). Use it for any
  # profile key this chart does not surface, e.g. rate_limits or governance.
  overrides: {}

# ---------------------------------------------------------------------------
# secrets.json (deploy/self-host/SECRETS.md lists every key). It is copied,
# together with profile.yaml, into an in-memory profile directory by an init
# container, because the server reads both from one directory.
# Rotation = update the secret version, then `kubectl rollout restart`.
# ---------------------------------------------------------------------------
secrets:
  # csi            Google Secret Manager through the Secret Store CSI driver (GKE add-on).
  # existingSecret a Kubernetes Secret you manage (External Secrets, Config Sync, ...).
  # inline         the chart creates a Secret from `inline.json`. Development only.
  # onepassword    no secrets.json: the profile gets a `secrets.source: external`
  #                block (kind onepassword) and the pod reads the vault at boot and
  #                every refreshSecs, with the token from `onepassword.tokenSecret`.
  #                See deploy/self-host/SECRETS.md#1password.
  mode: csi
  # Name of the file inside the source; the copy is always secrets.json.
  fileName: secrets.json
  csi:
    # GKE Secret Manager add-on. For the open-source driver + GCP provider use
    # driver secrets-store.csi.k8s.io and provider gcp.
    driver: secrets-store-gke.csi.k8s.io
    provider: gke
    # REQUIRED with mode csi: full resource name of the secret version holding the
    # whole secrets.json document. Pin a version number in production, so a
    # restart never picks up an unreviewed rotation.
    secretVersion: ""   # projects/<project>/secrets/dynapps-secrets-json/versions/1
  existingSecret:
    name: ""
    key: secrets.json
  inline:
    json: ""
  onepassword:
    # cli (service account through the `op` binary in the image) or connect
    # (a self-hosted 1Password Connect server at connectUrl).
    backend: cli
    connectUrl: ""
    # REQUIRED with mode onepassword.
    vault: ""
    # Reload interval in seconds (core floors it at 60); 0 disables refresh.
    refreshSecs: 300
    # One secrets.json key per op://<vault>/<item>/<field> reference ...
    items: {}
    #   anthropic: op://dynapps-prod/platform/anthropic
    #   encryption_master_key: op://dynapps-prod/identity/encryption_master_key
    # ... or every CONCEALED/STRING field of one item, keyed by field label.
    item: ""
    # Env var the token is exposed as; use OP_CONNECT_TOKEN with backend connect.
    tokenEnv: OP_SERVICE_ACCOUNT_TOKEN
    # Kubernetes Secret holding the service-account (or Connect) token.
    tokenSecret:
      name: ""
      key: token

# ---------------------------------------------------------------------------
# Database: Cloud SQL for PostgreSQL 16 through the Cloud SQL Auth Proxy, run
# as a native sidecar (restartPolicy: Always init container, Kubernetes 1.29+)
# so it starts before the app and ends with the migrate Job. secrets.json
# database_url then points at 127.0.0.1, e.g. with IAM database auth:
#   postgres://dynapps-gw%40<project>.iam@127.0.0.1:5432/systemprompt?sslmode=disable
# ---------------------------------------------------------------------------
cloudSqlProxy:
  enabled: true
  image:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: "2.14.1"
  # REQUIRED. <project>:<region>:<instance>
  instanceConnectionName: ""
  port: 5432
  autoIamAuthn: true
  privateIp: true
  extraArgs: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  # REQUIRED on GKE: the Google service account bound through Workload
  # Identity (roles/cloudsql.client, roles/cloudsql.instanceUser,
  # roles/secretmanager.secretAccessor, roles/storage.objectAdmin on the bucket).
  gcpServiceAccount: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Migrations: a one-shot Job (image argument `migrate`: infra db migrate, then
# admin bootstrap) run as a pre-install/pre-upgrade hook. Pods never migrate
# on boot (database.migrate_on_boot: false) and refuse a behind schema. The
# hook uses its own KSA, `<fullname>-migrate`, which needs the same Workload
# Identity binding as the app KSA.
# ---------------------------------------------------------------------------
migrate:
  enabled: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

# ---------------------------------------------------------------------------
# Gateway role: /v1 inference, bridge, OAuth, well-known, health. No
# scheduler, MCP or agent workers. Scales horizontally.
# ---------------------------------------------------------------------------
gateway:
  replicas: 3
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
    # Optional per-pod custom metric (needs the Custom Metrics Stackdriver
    # Adapter or Prometheus Adapter). core 0.63 exports
    # http_in_flight_saturation (0..1 of server.max_in_flight) on /metrics
    # when server.metrics_port is set, so this works once an adapter is installed.
    customMetric:
      enabled: false
      name: http_in_flight_saturation
      targetAverageValue: "0.7"
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies: [{type: Pods, value: 1, periodSeconds: 120}]
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{type: Percent, value: 100, periodSeconds: 60}]
  pdb:
    enabled: true
    minAvailable: 2
  topologySpread: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ---------------------------------------------------------------------------
# API role: the console, agent, MCP, content, stream, messaging, extension and
# static routes. No scheduler and no MCP or agent processes: MCP and agent
# requests are forwarded to the worker that owns them. Scales horizontally.
# An api pod serves web/dist and the services cache read-only and never
# renders them; see pod.sharedWeb.
# ---------------------------------------------------------------------------
api:
  replicas: 2
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    customMetric:
      enabled: false
      name: http_in_flight_saturation
      targetAverageValue: "0.7"
    behavior: {}
  pdb:
    enabled: true
    minAvailable: 1
  topologySpread: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ---------------------------------------------------------------------------
# Worker role: the scheduler and the MCP server and agent processes. Workers
# compete for one lease: the holder owns every process, the others stand by
# and take over when it goes. 1 replica is enough; 2 gives a warm standby.
# Each pod advertises http://<pod IP>:<service.port> to the api replicas
# (server.advertise_url from the downward-API POD_IP); the worker port is on
# no load balancer. No PDB by default (a 1-replica PDB blocks node drains).
# ---------------------------------------------------------------------------
worker:
  replicas: 1
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
  pdb:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Shared pod settings
pod:
  # The server has no graceful shutdown: preStop waits for the load balancer to
  # deregister the pod before SIGTERM; streams get the rest of the grace period.
  preStopSleepSeconds: 30
  terminationGracePeriodSeconds: 120
  # Sizes of the per-pod scratch volumes (emptyDir sizeLimit).
  volumes:
    storage: 10Gi      # /app/storage: journal (data/), exports, scratch, files cache
    web: 1Gi           # /app/web: rendered public site (publish_pipeline at boot)
    servicesCache: 1Gi
    logs: 2Gi
    tmp: 1Gi           # memory-backed /tmp for MCP children
    home: 512Mi        # /home/app: LibreOffice profile for document exports
  extraEnv: []
  # An existing ReadWriteMany PVC (e.g. Filestore) holding web/ and
  # services-cache/: the worker renders the public site and composes the
  # services bundle cache into it and the api pods mount it read-only.
  # Required whenever api pods run (api.replicas > 0 or api.autoscaling):
  # the render fails without it, since an api pod never renders the site.
  sharedWeb:
    existingClaim: ""
  # Extra volumes and mounts, added to the gateway, api, worker and migrate pods.
  # Typical use: a ConfigMap mounted over single files under /app/services
  # (subPath) to override ai/providers.yaml or gateway/policies.yaml without
  # rebuilding the image.
  # Hosts core may reach over plain http (SYSTEMPROMPT_TRUSTED_HTTP_HOSTS).
  trustedHttpHosts: []
  extraVolumes: []
  extraVolumeMounts: []

probes:
  startup:   {path: /livez,  periodSeconds: 5,  failureThreshold: 120}
  liveness:  {path: /livez,  periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 5}
  readiness: {path: /readyz, periodSeconds: 5,  failureThreshold: 2, timeoutSeconds: 3}

service:
  type: ClusterIP
  port: 8080

# Prometheus listener (server.metrics_port): gateway_overhead_seconds,
# gateway_upstream_duration_seconds, http_load_shed_total,
# systemprompt_quota_denials_total, systemprompt_usage_anomaly_total,
# http_request_duration_seconds.
metrics:
  enabled: true
  port: 9090
  # Google Cloud Managed Service for Prometheus
  podMonitoring:
    enabled: false
    interval: 30s
  # prometheus-operator
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}

# ---------------------------------------------------------------------------
# North-south traffic. Choose ONE of ingress (GKE Ingress + BackendConfig) or
# gatewayApi (GKE Gateway controller). /v1 goes to the gateway pods, everything
# else to the api pods.
# ---------------------------------------------------------------------------
routing:
  host: ""              # REQUIRED, e.g. ai.example.com
  gatewayPaths: ["/v1"]
  # Long enough for streamed completions.
  backendTimeoutSec: 600
  drainingTimeoutSec: 60

ingress:
  enabled: true
  staticIpName: ""      # kubernetes.io/ingress.global-static-ip-name
  managedCertificate:
    enabled: true
  # Existing TLS Secret instead of a ManagedCertificate.
  tlsSecretName: ""
  sslPolicy: ""         # FrontendConfig sslPolicy, e.g. dynapps-modern-tls
  annotations: {}

gatewayApi:
  enabled: false
  gatewayClassName: gke-l7-global-external-managed
  # Attach to an existing Gateway instead of creating one.
  existingGateway: ""
  certificateMapName: ""   # networking.gke.io/certmap
  staticAddressName: ""

# ---------------------------------------------------------------------------
# NetworkPolicy (GKE Dataplane V2 enforces it). Egress allow-list: DNS, the
# metadata server (Workload Identity), Cloud SQL private IP (proxy, 3307),
# Private Google Access ranges (443). AI providers outside Google (e.g.
# api.anthropic.com failover) need `extraEgress` or allowPublicHttps.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # REQUIRED with the proxy: the Cloud SQL private services access range.
  cloudSqlCidrs: []
  googleApisCidrs:
    - 199.36.153.8/30    # private.googleapis.com
    - 199.36.153.4/30    # restricted.googleapis.com
  # Allows 443 to any public address (RFC 1918 excluded). Needed unless DNS
  # steers *.googleapis.com to the ranges above, and for non-Google providers.
  allowPublicHttps: false
  ingressFromCidrs:
    - 35.191.0.0/16      # Google Front End and health checks
    - 130.211.0.0/22
  # Namespace label selector allowed to scrape the metrics port.
  metricsFromNamespaceLabels:
    kubernetes.io/metadata.name: gmp-system
  extraEgress: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}
  seccompProfile: {type: RuntimeDefault}
