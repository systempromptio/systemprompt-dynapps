# One Dynapps gateway node. Identical on every node; the only per-node
# input is the profile directory rendered by render-profile.sh (and even that
# is the same content everywhere). See README.md.
#
#   export SYSTEMPROMPT_TAG=0.72.0 DYNAPPS_PROFILE_DIR=/etc/dynapps/profile
#   docker compose -f docker-compose.node.yml run --rm app migrate   # once, first node
#   docker compose -f docker-compose.node.yml up -d
#
# The profile sets database.migrate_on_boot: false, so `up` never migrates;
# `run --rm app migrate` is the one-shot schema step (README.md §5).
services:
  app:
    image: ghcr.io/systempromptio/systemprompt-dynapps:${SYSTEMPROMPT_TAG:?pin a release, e.g. 0.72.0}
    restart: unless-stopped
    # The server has no graceful shutdown: drain the node at the load balancer
    # before stopping it, and give in-flight requests this long to finish.
    stop_grace_period: 30s
    environment:
      SYSTEMPROMPT_PROFILE_DIR: /app/.systemprompt/profiles/self-host
      # Read by the readiness probe before the profile is loaded. Must equal
      # secrets.json database_url; render-profile.sh writes both.
      DATABASE_URL: ${DATABASE_URL:?export the primary's URL (same value as secrets.json database_url)}
      # A private CA is named in the database URL itself
      # (`?sslrootcert=/etc/dynapps/pg-ca.pem`); mount the bundle below.
    volumes:
      - ${DYNAPPS_PROFILE_DIR:?path to the rendered profile directory}:/app/.systemprompt/profiles/self-host:ro
      - app_web:/app/web
      # Per-node runtime state (gateway accounting receipts); never share it.
      # Must be writable by uid 1000 (the image creates it so; a bind mount must be chowned).
      - app_storage_data:/app/storage/data
      # - /etc/dynapps/pg-ca.pem:/etc/dynapps/pg-ca.pem:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # Prometheus metrics (server.metrics_port): reachable from the compose
    # network only, never published on the host.
    expose:
      - "9090"
    healthcheck:
      # During boot the same path answers 200 {"status":"starting"}; only a
      # body containing "healthy" means the node may take traffic.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health | grep -q '\"healthy\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  app_web:
  app_storage_data:
