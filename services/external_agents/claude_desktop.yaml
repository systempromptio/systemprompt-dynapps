# Claude Desktop — external-agent (super-agent) catalog entry.
#
# Distinct from A2A agents under services/agents/. External agents are native
# apps and CLI tools that run off our infrastructure and point their inference
# endpoint at this gateway.

external_agents:
  claude_desktop:
    id: claude_desktop
    display_name: "Claude Desktop"
    kind: desktop_app
    enabled: true
    description: "Anthropic's native macOS/Windows desktop app for Claude. Routes inference through this gateway."
    platforms: [macos, windows]
    docs_url: "https://claude.ai/download"
    desktop_policy:
      schema_version: 1
      settings:
        modelPrefer1mContext: true
        alwaysStartWithDefaultModel: true
        modelDiscoveryEnabled: false
        toolSearchEnabled: true
        disableAutoUpdates: false
        autoUpdaterEnforcementHours: 72
        configRecheckIntervalMinutes: 2
        relaunchEnforcementHours: 24
        mcpToolTimeoutSec: 300
        inferenceStreamIdleTimeoutSec: 300
        chatAdvancedFileAnalysisEnabled: true
        disableBundledSkills: false
        builtinToolPolicy:
          WebSearch: allow
          WebFetch: allow
        deploymentDisplayName: Dynapps
        otlpDesktopLogLevel: info
        otlpTracesEnabled: true
        otlpContentCapture: []
