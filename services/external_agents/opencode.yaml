# OpenCode — external-agent (super-agent) catalog entry.
#
# OpenCode is one host with two installs: the `opencode` CLI/TUI and the
# Electron desktop app. Both read the same admin-managed `opencode.json`, so the
# bridge governs either with one profile; the desktop app needs no CLI on PATH.
#
# enabled: false removes the opencode host from every user's bridge manifest
# on this installation (gateway instance_enabled_hosts gate). Deleting this
# file would RE-enable the host: absent from the catalog means enabled.


external_agents:
  opencode:
    id: opencode
    display_name: "OpenCode"
    kind: cli_tool
    enabled: true
    description: "The open-source OpenCode coding agent (terminal and desktop app). Routes inference through this gateway."
    platforms: [macos, windows, linux]
    docs_url: "https://opencode.ai/"
