ai:
  default_provider: anthropic
  default_max_output_tokens: 2048
  sampling:
    enable_smart_routing: false
    fallback_enabled: false
  providers:
    anthropic:
      enabled: true
      google_search_enabled: true
      default_model: claude-sonnet-5-5
    # Added 2026-10-17 (user-approved) for the Claude cost comparison; not
    # the default provider.
    deepseek:
      enabled: true
      google_search_enabled: false
      default_model: deepseek-flash
    # Anthropic-only by customer requirement (2026-10-16): the secrets for the
    # providers below were removed. Restore = uncomment here and in
    # services/ai/providers.yaml, then add the secret to the profile.
    # vertex-anthropic:
    #   enabled: false
    #   google_search_enabled: true
    #   default_model: claude-sonnet-5-5
    # gemini:
    #   enabled: false
    #   google_search_enabled: true
    #   default_model: gemini-3.8-flash
    # cerebras:
    #   enabled: false
    #   google_search_enabled: false
    #   default_model: cerebras.gpt-oss-120b
  mcp:
    auto_discover: true
    connect_timeout_ms: 5000
    execution_timeout_ms: 30000
    retry_attempts: 3
  history:
    retention_days: 30
    log_tool_executions: true
