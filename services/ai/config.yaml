ai:
  default_provider: anthropic
  default_max_output_tokens: 4096
  sampling:
    enable_smart_routing: false
    fallback_enabled: true
  providers:
    anthropic:
      enabled: true
      google_search_enabled: false
      default_model: claude-sonnet-5
    # Why: the conversation_judge job judges through Gemini 3.8 Flash
    # (response schema enforced by the API) in-process via AiService, which
    # only registers providers enabled here; the gateway catalog alone is not
    # enough. The public endpoint, not Vertex: AiService has no OAuth path.
    gemini:
      enabled: true
      google_search_enabled: false
      default_model: gemini-3.8-flash
  mcp:
    auto_discover: true
    connect_timeout_ms: 5000
    execution_timeout_ms: 30000
    retry_attempts: 3
  history:
    retention_days: 30
    log_tool_executions: true
