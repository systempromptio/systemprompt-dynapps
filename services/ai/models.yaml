# Models: identity, capabilities, limits and base price, each stated once.
# `clients` decides which client families list a model: Claude hosts see the
# claude-* ids, OpenCode sees DeepSeek and the Go models, and the e2e mock is
# never advertised. DeepSeek rates are the PEAK list rates (off-peak is half),
# which keeps the Claude cost comparison conservative; OpenCode Go rates are
# its published per-token list prices, kept for cost comparison only.
models:
  claude-haiku-5-5:
    upstream_model: claude-haiku-5-5
    capabilities:
      vision: true
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
    limits:
      context_window: 1000000
      max_output_tokens: 128000
    pricing:
      input_per_million: 0.1
      output_per_million: 0.5
      cache_read_per_million: 0.01
      cache_write_per_million: 0.125
      per_image_cents: null
    clients:
    - claude
