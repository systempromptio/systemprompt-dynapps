# Gateway: the one default model and the policy routes. Routing itself is
# deployments.yaml; a route here only aliases, pins or narrows.
# `default_model` is the bare catalog id: Claude Code's `[1m]` marker is
# derived from limits.context_window and never written in config.
gateway:
  enabled: true
  routes: []
  default_model: claude-sonnet-5-5
  quota_fault_mode: closed
  automatic_prompt_caching: true
  auth_scheme: bearer
  inference_path_prefix: /v1
  # The bridge discovers these at /.well-known/systemprompt-bridge. The identity
  # path is the Dynapps envelope (SSO issuer, directory groups, department,
  # seat) rather than core's stock /v1/bridge/whoami, and the hosts it shows
  # before the first sync follow services/external_agents (codex_cli is off).
  bridge_instance:
    device_link_path: /bridge-auth/device-link
    identity_path: /api/public/bridge/whoami
    branding:
      display_name: Dynapps
  bridge_releases:
    repo: systempromptio/systemprompt-dynapps
    token_secret: DYNAPPS_RELEASE_TOKEN
    tag_prefix: v
    assets:
      linux-aarch64: dynapps-bridge-linux-aarch64.tar.gz
      linux-x86_64: dynapps-bridge-linux-x86_64.tar.gz
      macos: dynapps-bridge-macos.zip
      windows: dynapps-bridge-windows.exe
