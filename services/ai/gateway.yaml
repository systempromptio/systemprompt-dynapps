# Gateway routes — which requested model patterns map onto which provider in
# providers.yaml, plus the default provider/model the bridge advertises.
# Shipped in the image alongside the catalog it references.
# Edit by hand or with: systemprompt admin config gateway ...
gateway:
  enabled: true
  routes:
  # Failover: when Anthropic exhausts its transient-retry budget (429/503),
  # answers any other 5xx, or the connection itself fails, the same governed
  # request is re-bound to Vertex and served as Gemini 3.8 Flash. The audit
  # row records `served_provider: vertex`, the request is repriced at the
  # Vertex catalog rate, and `gateway_upstream_failovers_total{from,to,reason}`
  # counts it. A per-provider circuit breaker skips a primary that keeps
  # failing. `fallback_upstream_model` is the Vertex catalog id: boot
  # validation resolves pricing and governance through it (vertex carries
  # the same no_retain flag as anthropic, and this route declares no
  # `requires:`). See /documentation/enterprise-model-routing.
  - id: claude-star-4203d1
    model_pattern: claude-*
    provider: anthropic
    fallback_provider: vertex
    fallback_upstream_model: vertex-gemini-3.8-flash
  # Vertex routes and the core Vertex rate card are one change, not two.
  # At boot, every model Vertex publishes that the rate card prices is added
  # to its provider's catalog — so a rate-card id that matches none of the
  # patterns below is priced but unreachable, and nothing in either file says
  # so. Adding a rate-card entry means adding or widening a route here in the
  # same change; `systemprompt admin config catalog discovery` shows what the
  # last discovery pass actually found.
  - model_pattern: vertex-gemini-*
    provider: vertex
  - model_pattern: gemini-*
    provider: gemini
  - id: vertex-qwen
    model_pattern: qwen.*
    provider: vertex-maas
  - id: vertex-glm
    model_pattern: zai.*
    provider: vertex-maas
  # No moonshotai.* or deepseek.* route: their only rate-card entries retire
  # on 2026-10-21 and are no longer declared above, and the gateway refuses
  # to boot a route that reaches no priced model.
  - id: vertex-gpt-oss
    model_pattern: openai.gpt-oss-*
    provider: vertex-maas
  - model_pattern: gpt-oss-120b
    provider: cerebras
  - id: openai-gpt-41
    model_pattern: gpt-4.1*
    provider: openai
  - id: openai-o4-mini
    model_pattern: o4-mini
    provider: openai-responses
  - id: e2e-mock-route
    model_pattern: e2e-mock-*
    provider: e2e-mock
  default_provider: anthropic
  default_model: claude-sonnet-5
  allow_unlisted_models: false
  # Closed: a quota window whose subject cannot be resolved — no provider,
  # provider error, or a user with no value — refuses the request instead of
  # passing it uncounted. Every subject policies.yaml names (user, group,
  # project, role, organization) has a provider in extensions/web/admin/src/authz,
  # so a fault here is a bug to surface, not traffic to wave through.
  quota_fault_mode: closed
  auth_scheme: bearer
  inference_path_prefix: /v1
  bridge_releases:
    repo: Astound-Digital/systemprompt-astound
    token_secret: ASTOUND_RELEASE_TOKEN
    tag_prefix: v
    assets:
      windows: astound-bridge-windows.exe
      linux-x86_64: astound-bridge-linux-x86_64.tar.gz
      linux-aarch64: astound-bridge-linux-aarch64.tar.gz
