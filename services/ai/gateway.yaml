# Gateway routes — which requested model patterns map onto which provider in
# providers.yaml, plus the default provider/model the bridge advertises.
# Shipped in the image alongside the catalog it references.
# Edit by hand or with: systemprompt admin config gateway ...
gateway:
  enabled: true
  routes:
  - id: pi-gpt-oss-120b
    model_pattern: gpt-oss-120b
    provider: cerebras
  - id: claude-star-4203d1
    model_pattern: claude-*
    provider: anthropic
  - id: gpt-star-d0e2e6
    model_pattern: gpt-*
    provider: openai
    upstream_model: gpt-5-mini
  - id: gemini-star-5db635
    model_pattern: gemini-*
    provider: gemini
  - id: e2e-mock-route
    model_pattern: e2e-mock-*
    provider: e2e-mock
  default_provider: anthropic
  default_model: claude-sonnet-5
  allow_unlisted_models: false
  auth_scheme: bearer
  inference_path_prefix: /v1
