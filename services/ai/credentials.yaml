# Credentials: who authenticates and who pays. A platform credential names a
# profile secret; a personal one is stored per member (Settings, or the bridge)
# under its credential id and shown once in Settings, however many endpoints
# it serves. Claude is served only by the customer's Anthropic key (a customer
# requirement); OpenCode Go is billed to each member's own Go subscription.
credentials:
  anthropic:
    kind: platform
    secret: anthropic
  deepseek:
    kind: platform
    secret: deepseek
  opencode-go:
    kind: personal
    label: OpenCode Go
