- name: vertex
  # The same Gemini models served from Vertex AI, which authenticates with an
  # OAuth access token rather than an API key -- the gateway mints one from the
  # service-account JSON in the `vertex` secret and refreshes it hourly.
  #
  # The ids are prefixed because a model id must be unique across the whole
  # catalog, and the public-endpoint copies above already claim the bare names.
  # `upstream_model` carries the real name, so a client asking for
  # `vertex-gemini-2.5-flash` reaches Google's `gemini-2.5-flash`. The endpoint
  # is project- and location-scoped; the wire appends
  # /models/{upstream_model}:generateContent.
  wire: gemini
  surface: gemini
  endpoint: https://us-central1-aiplatform.googleapis.com/v1/projects/vast-nectar-453310-d7/locations/us-central1/publishers/google
  api_key_secret: vertex
  governance:
    european: false
    no_retain: true
  models:
  - id: vertex-gemini-2.5-pro
    upstream_model: gemini-2.5-pro
    pricing:
      input_per_million: 1.25
      output_per_million: 10.0
      per_image_cents: null
    capabilities:
