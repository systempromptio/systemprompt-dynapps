# Provider catalog — every upstream this deployment can dispatch to, with the
# models it serves, their pricing, capabilities, limits and governance flags.
# Implementation configuration shipped in the image: the same file boots every
# environment. Credentials are NOT here — each entry names its key by
# api_key_secret, and the profile secret store supplies it.
# Edit by hand or with: systemprompt admin config catalog ...
