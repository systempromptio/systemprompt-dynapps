providers:
  anthropic:
    credential: anthropic
    display_name: Anthropic
    description: Claude models on Anthropic's own API, authenticated with the anthropic key. Serves every claude-* request on this installation.
    governance:
      european: false
      no_retain: true
    enabled: true
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: false
      tools: false
      structured_output: false
      system_prompts: false
      image_resolution_config: false
      reasoning: false
      prompt_caching: false
    resilience:
      request_timeout_ms: 60000
      connect_timeout_ms: 10000
      stream_idle_timeout_ms: 60000
      retry_attempts: 3
      retry_base_delay_ms: 200
      retry_max_delay_ms: 10000
      breaker_failure_threshold: 5
      breaker_open_cooldown_ms: 30000
      breaker_half_open_probes: 1
      max_concurrent: 16
    google_search_enabled: false
    endpoints:
      api:
        wire: anthropic
        url: https://api.anthropic.com/v1
  deepseek:
    credential: deepseek
    display_name: DeepSeek
    description: DeepSeek models on DeepSeek's own API (Anthropic-compatible endpoint), authenticated with the deepseek key. Served only when a deepseek-* id is requested.
    governance:
      european: false
      no_retain: false
    enabled: true
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: false
      tools: false
      structured_output: false
      system_prompts: false
      image_resolution_config: false
      reasoning: false
      prompt_caching: false
    resilience:
      request_timeout_ms: 60000
      connect_timeout_ms: 10000
      stream_idle_timeout_ms: 60000
      retry_attempts: 3
      retry_base_delay_ms: 200
      retry_max_delay_ms: 10000
      breaker_failure_threshold: 5
      breaker_open_cooldown_ms: 30000
      breaker_half_open_probes: 1
      max_concurrent: 16
    google_search_enabled: false
    endpoints:
      api:
        wire: anthropic
        url: https://api.deepseek.com/anthropic/v1
  e2e-mock:
    credential: anthropic
    display_name: E2E mock (loopback)
    description: Loopback Anthropic-wire mock for the Playwright suite on 127.0.0.1; never advertised to clients and unreachable on hosts without the mock running.
    governance:
      european: false
      no_retain: true
    enabled: true
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: false
      tools: false
      structured_output: false
      system_prompts: false
      image_resolution_config: false
      reasoning: false
      prompt_caching: false
    resilience:
      request_timeout_ms: 60000
      connect_timeout_ms: 10000
      stream_idle_timeout_ms: 60000
      retry_attempts: 3
      retry_base_delay_ms: 200
      retry_max_delay_ms: 10000
      breaker_failure_threshold: 5
      breaker_open_cooldown_ms: 30000
      breaker_half_open_probes: 1
      max_concurrent: 16
    google_search_enabled: false
    endpoints:
      api:
        wire: anthropic
        url: http://127.0.0.1:18091/v1
  opencode-go:
    credential: opencode-go
    display_name: OpenCode Go
    description: OpenCode Go models (GLM, Kimi, DeepSeek, MiMo) on the Chat Completions endpoint, authenticated with the member's own Go subscription key.
    user_agent: systemprompt-gateway (opencode-go; dynapps)
    forward_headers:
    - x-opencode-session
    governance:
      european: false
      no_retain: false
    enabled: true
    capabilities:
      vision: false
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: false
      tools: false
      structured_output: false
      system_prompts: false
      image_resolution_config: false
      reasoning: false
      prompt_caching: false
    resilience:
      request_timeout_ms: 60000
      connect_timeout_ms: 10000
      stream_idle_timeout_ms: 60000
      retry_attempts: 3
      retry_base_delay_ms: 200
      retry_max_delay_ms: 10000
      breaker_failure_threshold: 5
      breaker_open_cooldown_ms: 30000
      breaker_half_open_probes: 1
      max_concurrent: 16
    google_search_enabled: false
    endpoints:
      anthropic:
        wire: anthropic
        url: https://opencode.ai/inference/go/anthropic/v1
        accepted_betas: []
      chat:
        wire: openai-chat
        url: https://opencode.ai/inference/go/openai/v1
