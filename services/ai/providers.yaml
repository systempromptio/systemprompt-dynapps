- name: cerebras
  # Cerebras, an OpenAI-compatible endpoint. Present so the openai-chat outbound
  # wire has a provider with a credential that actually resolves: vertex-maas is
  # the only other one and its api_key_secret has never been configured, so every
  # model behind it 502s and the wire itself was untestable end to end.
  display_name: Cerebras
  description: >-
    OpenAI-compatible inference on Cerebras hardware; serves GPT-OSS 120B at low latency.
  wire: openai-chat
  surface: openai
  endpoint: https://api.cerebras.ai/v1
  #
  # Why: Cerebras publishes a flat per-token price with no prompt-cache tier
  # (cerebras.ai/pricing, read 2026-09-05), so both cache rates are an explicit
  # 0.0. That is a declaration that the provider bills no cache reads, not an
  # omission -- boot refuses a model whose cache_read_per_million is absent.
  api_key_secret: cerebras
  governance:
    european: false
    no_retain: true
  models:
  - id: gpt-oss-120b
    pricing:
      input_per_million: 0.35
      output_per_million: 0.75
      cache_read_per_million: 0.0
      cache_write_per_million: 0.0
      per_image_cents: null
    capabilities:
