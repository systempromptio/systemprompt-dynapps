- name: vertex-maas
  # Third-party open models on Vertex AI Model-as-a-Service, OpenAI-compatible
  # surface. The wire appends /chat/completions. Advertised under the openai
  # surface so gateway model discovery lists them in Claude Code's picker;
  # `backend` would hide them. Vertex MaaS authenticates with a Google OAuth
  # token, not a static key, so `vertex_maas` must hold a credential the
  # gateway can present as a bearer.
  wire: openai-chat
  surface: openai
  endpoint: https://aiplatform.googleapis.com/v1beta1/projects/enterprise-ai-505512/locations/global/endpoints/openapi
  api_key_secret: vertex_maas
  governance:
    european: false
    no_retain: true
  models:
