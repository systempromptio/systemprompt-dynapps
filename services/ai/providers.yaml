- name: openai
  # OpenAI on its native chat-completions surface. Restored after 62bc8104
  # removed it during the Vertex migration: the `openai` credential was live the
  # whole time and no provider referenced it, so the openai-chat outbound wire
  # had exactly one keyed provider (cerebras) and the richest models we can
  # reach were unreachable. Model ids must not collide with the openai-responses
  # entry below -- ProviderRegistry::validate hoists its seen_models set outside
  # the provider loop, so a shared id is a DuplicateModel boot failure.
  wire: openai-chat
  surface: openai
  endpoint: https://api.openai.com/v1
  api_key_secret: openai
  governance:
    european: false
    no_retain: true
  models:
  - id: gpt-4.1
    pricing:
      input_per_million: 2.0
      output_per_million: 8.0
      cache_read_per_million: 0.5
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 1047576
      max_output_tokens: 32768
  - id: gpt-4.1-mini
    pricing:
      input_per_million: 0.4
      output_per_million: 1.6
      cache_read_per_million: 0.1
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
