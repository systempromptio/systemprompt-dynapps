- name: gemini
  # Google Gemini. Two credential types serve these models and a deployment has
  # one or the other, so the endpoint is chosen to match the credential:
  #
  #   API key       generativelanguage.googleapis.com/v1beta   (this entry)
  #   service acct  aiplatform.googleapis.com/.../publishers/google  (Vertex)
  #
  # Both speak the gemini wire, which appends /models/{id}:generateContent and
  # sends the credential on x-goog-api-key. The Vertex host rejects API-key auth
  # outright -- "API keys are not supported by this API", HTTP 401
  # CREDENTIALS_MISSING -- so it needs an OAuth access token minted from a
  # service account and refreshed hourly, which the gateway cannot yet do. Until
  # it can, an API key against the endpoint below is the only working Gemini
  # credential. See docs/install/vertex.md.
  wire: gemini
  surface: gemini
  endpoint: https://generativelanguage.googleapis.com/v1beta
  api_key_secret: gemini
  governance:
    european: false
    no_retain: true
  models:
  - id: gemini-2.5-pro
    pricing:
      input_per_million: 1.25
      output_per_million: 10.0
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 1000000
      max_output_tokens: 65536
      max_thinking_budget: 32768
  - id: gemini-2.5-flash
    pricing:
      input_per_million: 0.3
      output_per_million: 2.5
      per_image_cents: null
    capabilities:
      vision: true
      audio_input: false
      video_input: false
      image_generation: false
      audio_generation: false
      streaming: true
      tools: true
      structured_output: true
      system_prompts: true
      image_resolution_config: false
    limits:
      context_window: 1000000
      max_output_tokens: 65536
      max_thinking_budget: 24576
  - id: gemini-2.5-flash-lite
    pricing:
