# Session evaluation — the LLM-as-judge engine.
#
# Every session that closes is scored once per criterion below. Scoring runs in
# the `session_evaluation` job, never inside a hook request: /hooks/track only
# records events, and the job discovers closed sessions from those records.
# Judge calls go through the gateway as the job actor (`actor_kind = job`,
# `request_kind = utility`), so they are priced and audited but never counted
# against the person whose session is being judged.
#
# The switch is `hooks.evaluation: true` on the plugin that owns the governance
# hooks (services/plugins/astound-commons). Without that flag this file is
# validated and ignored. `enabled: false` here pauses scoring without touching
# the plugin. Whether closed sessions are queued WITHOUT a click is the
# profile's call, not this file's: `evaluation.automatic: true` in
# profile.yaml (production) makes the job queue every closed session each
# minute; anywhere else (default) sessions are scored only from the console —
# Evaluate now on a session page or a Conversations row, or Queue closed
# sessions / Run pending now on /admin/analysis/evaluation.
#
# Each criterion is either `judge` — the model reads the inputs and returns a
# 0-100 score with rationale and evidence — or `metric` — the score is computed
# from the session's own requests against the thresholds under `metric:` and the
# model is asked only to explain it. The instructions files are shown verbatim on
# /admin/analysis/evaluation, and every run records the hash of this directory.
#
# Models must be listed under the provider in services/ai/providers.yaml and the
# provider must be enabled in services/ai/config.yaml; boot fails otherwise.
evaluation:
  enabled: true
  session_close:
    # A session closes on SessionEnd. Hosts whose adapter has no end-of-session
    # event (Codex CLI) close after this many minutes without any event.
    quiet_minutes: 20
    # Sessions with fewer user prompts than this are never scored.
    min_user_prompts: 1
    # Sessions that started earlier than this are never enqueued, so a fresh
    # deploy does not judge months of history.
    lookback_hours: 72
  worker:
    batch_size: 16
    lease_seconds: 120
    max_attempts: 5
  judge_defaults:
    provider: anthropic
    model: claude-sonnet-5
    max_output_tokens: 2048
  criteria:
    - name: intent
      scoring: judge
      instructions: criteria/intent.md
      inputs: [user_messages, last_assistant_message, skills, session_metadata]
    - name: quality
      scoring: judge
      model: claude-opus-5
      instructions: criteria/quality.md
      inputs: [user_messages, last_assistant_message, transcript_tail, skills, session_metadata, activity]
    - name: speed
      scoring: metric
      instructions: criteria/speed.md
      inputs: [metrics, user_messages]
      metric:
        target_minutes_per_prompt: 4.0
        target_latency_ms: 20000
    - name: cost
      scoring: metric
      instructions: criteria/cost.md
      inputs: [metrics, user_messages]
      metric:
        budget_microdollars_per_prompt: 250000
        expected_cache_read_ratio: 0.5
