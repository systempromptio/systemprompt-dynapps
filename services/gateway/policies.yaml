# Gateway policy baseline. Ingested into `ai_gateway_policies` at boot by
# run_gateway_policy_load. Carries quota_windows and safety config. Model
# exposure lives in the profile's provider registry (profile.providers in
# .systemprompt/profiles/<name>/profile.yaml), not here.
#
# Spec fields (systemprompt_ai::GatewayPolicySpec):
#   quota_mode, quota_windows, safety { mode, scanners, block_categories,
#                                       block_response_categories, history }
#
# safety.scanners names resolve against the gateway's SafetyScannerRegistry:
# the built-in `heuristic` scanner plus any extension-registered scanner. The
# admin extension registers `secrets` and `pii_extended`
# (extensions/web/admin/src/gateway_safety.rs). A request whose content yields
# a finding in `block_categories` is denied before the upstream call, with an
# `ai_safety_findings` audit row.
#
# `block_response_categories` does the same for the reply, and applies to
# buffered replies only — a streamed reply is already on the wire when the scan
# runs, so its findings are recorded and never block.
#
# `secrets` is egress-only: it returns nothing for requests, because the
# `secret_scan` governance policy already covers ingress and runs first. Listing
# it under `block_categories` therefore does nothing — it belongs in
# `block_response_categories`. `pii_extended` scans both directions.
#
# SAFETY SCANNING IS ON, BLOCKING IS OFF as of 2026-09-04 (REQ-030/033/036,
# switched on 2026-08-25 for the enterprise rollout). Every listed scanner still
# runs and every finding is still written to `ai_safety_findings` —
# `persist_findings` does not consult `block_categories`, so emptying the block
# lists narrows nothing about what is audited.
#
# Both block lists are empty on purpose. This plane and the governance chain
# (services/governance/config.yaml) were relaxed together on 2026-09-04 because
# false positives were denying ordinary developer traffic and blocking all work
# on this instance. The precedent is the file's own history: `jailbreak` and
# `pii_credit_card` came out of `block_categories` on 2026-08-31 after they
# denied real traffic in production (`category=pii_credit_card
# scanner=heuristic`, and a subagent prompt caught by the phrase "you are now").
# Rather than keep trimming the list one category at a time on evidence that
# only arrives as a broken workflow, nothing blocks and everything is audited.
#
# This is a stopgap, not the destination. Core is gaining a WARN mode (Stream
# D2) in which every scanner evaluates, nothing blocks, and a report shows what
# WOULD have blocked. When that lands here, `safety.mode: warn` comes on and the
# original block lists — `[pii_ssn]` on requests, `[secret, pii_ssn]` on
# responses — are restored underneath it, so the report is meaningful. Re-adding
# a category to a live block list before then is a review-visible act: tests pin
# these lists.
#
# WARN MODE (2026-09-04). `safety.mode: warn` below removes every refusal on
# this plane while leaving every scanner running and every finding persisted —
# including the `blocked` column, which stays false throughout, so the report
# can say exactly how many calls each category would have refused. The block
# lists are kept intact and are the point: under enforce they are the
# behaviour, under warn they are the hypothesis being measured.
#
# The quota windows are the third plane on an inference request and have their
# own switch, `quota_mode: warn`, set below for the same window. Every window is
# still reserved against and every ceiling still evaluated; a breach is written
# to `governance_decisions` as a `warn` under policy `quota` instead of
# answering 429. Without it, "nothing blocks" would have been false: the $2/day
# clamp below is sized to be hit by ordinary development and would have kept
# refusing while the other two planes only recorded.
#
# This pairs with `governance.mode: warn` in services/governance/config.yaml.
# Read all three back together:
#   systemprompt infra logs governance report --since 7d
# The second table there is this plane. A category with many findings and zero
# blocks is one warn mode is currently absorbing; a category with no findings
# at all is a scanner earning nothing. Restore `mode: enforce` per plane once
# the numbers say which is which.
#
# The `heuristic` block below pins the phrase list explicitly rather than
# inheriting core's builtin. As with services/governance/config.yaml, the values
# here ARE the live behaviour, never a silent core default.
#
# The quota windows below are the house-wide clamp — this instance has no
# per-customer plans. The per-user hourly window is a runaway backstop sitting
# far above normal use. The daily `organization` window (core's subject for the
# whole installation) was a deliberate $2/day hard clamp that ordinary traffic
# WILL hit; on 2026-09-04 it was raised to $200/day so a working day of
# development is not stopped by it. THAT IS A SPEND DECISION AND NEEDS ED'S
# CONFIRMATION — it is a real ceiling and it now permits a hundred times the
# previous daily spend. Cost ceilings are enforced one request late by design (a
# request's cost is known after its response).

policies:
  - name: default-quotas
    enabled: true
    spec:
      # Warn, not enforce, for the 2026-09-04 measurement window — see the
      # header. The windows below are unchanged and are the hypothesis.
      quota_mode: warn
      quota_windows:
        # Per user, hourly: a runaway agent stops within the hour without any
        # normal developer session ever noticing the ceiling.
        - subject: user
          window_seconds: 3600
          max_requests: 600
          max_cost_microdollars: 20000000
        # Installation-wide, daily: a $200/day ceiling (2026-09-04; was $2).
        # The old clamp stopped ordinary development mid-afternoon. This is
        # still a real ceiling and still sized to cap an accident, but it now
        # permits a full working day of gateway traffic.
        - subject: organization
          window_seconds: 86400
          max_cost_microdollars: 200000000
      safety:
        mode: warn
        scanners: [heuristic, secrets, pii_extended]
        # Empty on both sides: everything is scanned and audited, nothing is
        # denied. Restored to [pii_ssn] / [secret, pii_ssn] under `safety.mode:
        # warn` when core's warn mode lands — see the header.
        block_categories: []
        block_response_categories: []
        # Off: request history is not rescanned. Every prior turn was already
        # scanned as its own request, and rescanning re-persists the same
        # finding every turn while walking the whole conversation again.
        history: off
        heuristic:
          phrases:
            - "ignore previous instructions"
            - "ignore all previous"
            - "disregard prior instructions"
            - "forget your instructions"
            - "act as dan"
            - "developer mode enabled"
            - "pretend you have no restrictions"
