plugin:
  id: astound-india-sfcore
  name: "Astound India — Salesforce Core"
  description: "Story intake, Apex and declarative builds, validation rules and deploy troubleshooting on Salesforce Core. For the India development workspace."
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [development, salesforce, apex, core]
  license: proprietary
  category: development
  # `source: explicit` everywhere. Left to default the plugin would claim
  # every skill and agent on the instance, which is how the marketplace once
  # showed every plugin with all 230 skills.
  skills:
    source: explicit
    include:
      - sf_story_intake
      - sf_apex_build
      - sf_declarative_build
      - sf_validate_rules
      - sf_deploy_troubleshoot
  agents:
    source: explicit
    include: []
  # Every skill searches the shared knowledge bank for project context before it acts.
  # No hooks — astound-admin is the one governance-hook owner.
  mcp_servers:
    source: explicit
    include:
      - knowledge-bank
  content_sources: {}
