plugin:
  id: astound-india-ba
  name: "Astound India — Business Analysis"
  description: "Draft stories, break down epics, write bug reports, analyse impact and check definition of ready and done. For the business-analysis team in the India development workspace."
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [business-analysis, stories, epics, requirements]
  license: proprietary
  category: productivity
  # `source: explicit` everywhere. Left to default the plugin would claim
  # every skill and agent on the instance, which is how the marketplace once
  # showed every plugin with all 230 skills.
  skills:
    source: explicit
    include:
      - ba_story_draft
      - ba_epic_breakdown
      - ba_bug_report
      - ba_impact_analysis
      - ba_dor_dod_check
  agents:
    source: explicit
    include: []
  # Every skill searches the shared knowledge bank for project context before it acts.
  # No hooks — astound-admin is the one governance-hook owner.
  mcp_servers:
    source: explicit
    include:
      - knowledge-bank
  content_sources: {}
