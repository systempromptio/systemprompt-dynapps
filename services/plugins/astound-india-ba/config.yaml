plugin:
  id: astound-india-ba
  name: Astound India — Business Analysis
  description: All 16 upstream business-analysis skills, with authenticated Atlassian,
    Salesforce and GitHub connectors.
  version: 2.0.0
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
  - business-analysis
  - stories
  - epics
  - requirements
  license: proprietary
  category: business
  skills:
    source: explicit
    include:
    - ba_bug_logging
    - ba_change_request
    - ba_confluence_management
    - ba_dor_dod_validation
    - ba_epic_creation
    - ba_impact_analysis
    - ba_jira_management
    - ba_notification_sending
    - ba_release_management
    - ba_requirement_tracing
    - ba_scheduled_reporting
    - ba_session_memory
    - ba_sprint_planning
    - ba_story_drafting
    - ba_tracker_management
    - ba_transcript_management
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
    - atlassian
    - salesforce
    - github
  content_sources: {}
