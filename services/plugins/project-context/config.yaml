plugin:
  id: project-context
  name: "Project Context — Knowledge Bank"
  description: "Project memory for Astound engagements: search Confluence, Jira, meeting notes, ADRs and specs with citations through the knowledge-bank MCP server, plus the skill that teaches an agent to scope every query and weigh hits by authority and date."
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [knowledge, rag, confluence, jira, adrs, specs, project-context]
  license: proprietary
  category: development
  skills:
    source: explicit
    include:
      - project_context
  agents:
    source: explicit
    include: []
  # Every signed-in user may reach the server (services/access-control/roles.yaml);
  # what each caller sees is decided per document at query time (REQ-052).
  mcp_servers:
    source: explicit
    include:
      - knowledge-bank
  content_sources: {}
