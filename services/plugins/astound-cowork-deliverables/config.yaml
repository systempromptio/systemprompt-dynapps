plugin:
  id: astound-cowork-deliverables
  name: "Astound Cowork — Deliverables"
  description: "Client presentations, stakeholder updates and meeting summaries for knowledge workers, grounded in Salesforce and the shared knowledge bank."
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [cowork, presentations, stakeholders, meetings]
  license: proprietary
  category: productivity
  # `source: explicit` everywhere. Left to default the plugin would claim
  # every skill and agent on the instance, which is how the marketplace once
  # showed every plugin with all 230 skills.
  skills:
    source: explicit
    include:
      - client_presentation
      - stakeholder_update
      - meeting_summary
  agents:
    source: explicit
    include: []
  # Salesforce for the account and opportunity data; the knowledge bank for everything the engagement has written down.
  # No hooks — astound-admin is the one governance-hook owner.
  mcp_servers:
    source: explicit
    include:
      - knowledge-bank
      - salesforce
  content_sources: {}
