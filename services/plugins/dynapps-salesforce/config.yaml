plugin:
  id: astound-salesforce
  name: "Astound Digital — Salesforce"
  description: "Salesforce sales workflows adapted from Salesforce's public Sales Cloud plugin, with dynamic Headless 360 widgets. Google Workspace evidence returns when its connector is live; google_workspace_test checks it."
  version: "1.1.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [astound, salesforce, sales, crm, pipeline]
  license: Apache-2.0
  category: business
  skills:
    source: explicit
    # calendar_events, inbox_sweep and voice_profile read only Google
    # Workspace; they return when its connector works (IAM on 148780456827).
    include:
      - account_context
      - account_tiering
      - call_follow_up
      - call_prep
      - close_plan
      - customer_health
      - customer_voice
      - daily_briefing
      - deal_advance_gap
      - deal_review
      - deal_signals
      - deal_slip_scenario
      - draft_outreach
      - expansion_whitespace
      - find_internal_answer
      - forecast_narrative
      - google_workspace_test
      - handle_objection
      - lead_triage
      - pipeline_review
      - query_activity_history
      - renewal_radar
      - rep_context
      - research_prospect
      - salesforce_hygiene_check
      - stakeholder_map
      - team_pipeline
      - using_display_widget
      - weekly_wrap
      - win_loss_review
  agents:
    source: explicit
    include: []
  mcp_servers:
    source: explicit
    include:
      - salesforce
      - google_workspace
  content_sources: {}
  artifacts:
    source: explicit
    include: []
