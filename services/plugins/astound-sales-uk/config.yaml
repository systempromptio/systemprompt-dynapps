plugin:
  id: astound-sales-uk
  name: Astound — Sales UK
  description: Basic CRM for the UK business — client discovery, meeting prep, account reporting and
    external research, over Salesforce and the Jira/Confluence delivery record.
  version: 2.0.0
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
  - astound
  - business
  - reporting
  license: proprietary
  category: business
  skills:
    source: explicit
    include:
    - uk_sales_client_discovery
    - uk_sales_client_prep
    - uk_sales_client_report
    - uk_sales_client_research
  agents:
    source: explicit
    include: []
  # Salesforce for the account, contact and opportunity records; Atlassian for the
  # delivery evidence a client conversation has to reconcile against. Salesforce
  # has no connection on this instance yet, so every skill here treats the CRM
  # half as the one that may be missing and says so in its own output.
  mcp_servers:
    source: explicit
    include:
    - salesforce
    - atlassian
  content_sources: {}
