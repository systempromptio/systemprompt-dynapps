plugin:
  id: astound-europe-dev
  name: "Astound Europe Dev — Core Platform Workflow"
  description: "Everyday development skills plus a data-residency review pass for EU-hosted services, for engineers on the core platform. No MCP server and no credentials required."
  version: "1.0.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [development, platform, residency, code-review]
  license: proprietary
  category: development
  # `source: explicit` everywhere. Left to default the plugin would claim
  # every skill and agent on the instance, which is how the marketplace once
  # showed every plugin with all 230 skills.
  skills:
    source: explicit
    include:
      - systematic_debugging
      - git_commit
      - code_review
      - residency_review
  agents:
    source: explicit
    include: []
  # No server and no hooks: every skill here is prose the agent follows with
  # its own tools, and astound-admin is the one governance-hook owner.
  mcp_servers:
    source: explicit
    include: []
  content_sources: {}
