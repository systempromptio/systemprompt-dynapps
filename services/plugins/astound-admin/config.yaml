plugin:
  id: astound-admin
  name: "Astound Admin — Control Plane"
  description: "Admin control plane: project delivery, cost and adoption, governance incidents, access reviews, and AI operations. Five deterministic live dashboards, with Cowork-only setup."
  version: "3.1.0"
  enabled: true
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [admin, governance, analytics, users, audit, operations, control-plane]
  license: proprietary
  category: admin
  skills:
    source: explicit
    include:
      - admin_activity_report
      - admin_user_report
      - systemprompt_cli
      - admin_cost_report
      - admin_project_report
      - admin_ai_operations
      - systemprompt_setup_admin
      - demonstrate_rag
  # The Slack-facing operator agent. It declares its own admin-only rule in
  # services/access-control/roles.yaml, which opts it out of the marketplace
  # cascade the same way every other member of this plugin does.
  agents:
    source: explicit
    include:
      - admin_console
  # The admin CLI-passthrough server. Gated to the admin role twice over: an
  # entity rule in services/access-control/roles.yaml keeps it out of a
  # non-admin's signed manifest, and oauth.scopes in services/mcp/systemprompt.yaml
  # rejects the call at runtime if it gets there anyway.
  mcp_servers:
    source: explicit
    include:
      - systemprompt
      - atlassian
  content_sources: {}
  # Dashboards seeded into the Cowork Artifacts library for users of this
  # plugin. Selection is plugin-driven (core's selected_artifact_ids), so an
  # artifact reaches a client only if a selected plugin names it here.
  artifacts:
    source: explicit
    include:
      - admin-users-directory
      - admin-activity-requests
      - admin-usage-costs
      - admin-project-delivery
      - admin-ai-operations
  # No hooks here. Claude Code runs plugin hooks session-globally and one
  # plugin must own them; astound-dev does, because it reaches every signed-in
  # user while this plugin reaches admins only — hooks declared here left
  # every non-admin session ungoverned and unrecorded (no plugin_usage_events,
  # so no skill invocations on the dashboard).
