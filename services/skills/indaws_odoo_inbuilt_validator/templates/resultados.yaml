# Resultados del recorrido del vertical inbuilt.
#
# Una entrada por camino del catalogo, ni una mas ni una menos:
# `scripts/verificar_cobertura.py` rechaza el informe si sobra o falta alguna.
#
# Campos:
#   id          obligatorio, el del catalogo (A-01 ... G-10)
#   estado      pendiente | ok | defecto | bloqueado
#   evidencia   lista de rutas relativas al directorio de resultados.
#               Obligatoria en `ok` y en `defecto`. Tiene que existir en disco
#               y no estar vacia.
#   observacion obligatoria en `defecto` y en `bloqueado`. Numeros medidos, no
#               adjetivos.
#   fecha       AAAA-MM-DD del recorrido
#   canal       api | visual-auto | humano (opcional, informativo)
#
# REGLAS
#   - `ok` solo si se ha VISTO el resultado. Si no se pudo comprobar es
#     `bloqueado`, y se dice por que.
#   - Un `defecto` que ya este en references/defectos-conocidos.md se cita por su
#     numero en la observacion; no se reporta como nuevo.
#   - La aritmetica de certificacion no se da por buena con un solo periodo.

resultados: []

