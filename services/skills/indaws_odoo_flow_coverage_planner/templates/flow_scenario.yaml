# Plantilla de flujo CUSTOM — CONTRATO EJECUTABLE REAL del odoo-flow-tester.
# Validar con: python3 <odoo-flow-tester>/scripts/validate_flow.py este_archivo.yaml
# (Reemplaza los valores PLACEHOLDER_* por los reales. Mantiene formato valido para validar.)
#
# CONTRATO (validator + examples/*.json) — PREVALECE sobre flow_schema.md:
#   requeridos: flow_id (^CHAIN_[A-Z][A-Z0-9_]+$), flow_name, steps
#   version: odoo_version    ·    preconditions: LISTA PLANA de busquedas de maestros
#   create/update -> 'values' (NO 'data')
#   acciones validas: create | delete | execute | multi_update | return_picking | scrap | search | update
#   NO existen atajos confirm/cancel/deliver/invoice/pay -> usar action: execute + method: <metodo>
#   solo datos TRANSACCIONALES en steps; maestros en preconditions; cada create -> entrada revert

flow_id: CHAIN_AREA_DESC
flow_name: "Nombre legible del escenario"
description: "Que funcionalidad del modulo custom valida este flujo (10-500 chars)"
odoo_version: "19.0"
environment: staging

data:
  qty: 2
  price_unit: 100.0

preconditions:
  - model: res.partner
    domain: [["customer_rank", ">", 0]]
    fields: ["id", "name"]
    save_as: partner_id
    min_records: 1
  - model: product.product
    domain: [["sale_ok", "=", true]]
    fields: ["id", "name"]
    save_as: product_id
    min_records: 1

steps:
  - step: 1
    name: "Crear registro principal"
    action: create
    model: sale.order
    values:
      partner_id: "{pre.partner_id}"
      client_order_ref: "{prefix}"
      order_line:
        - [0, 0, {product_id: "{pre.product_id}", product_uom_qty: "{data.qty}", price_unit: "{data.price_unit}"}]
    save_as: rec_id
    assertions:
      - field: state
        expected: "draft"

  - step: 2
    name: "Ejecutar metodo (estandar o custom del modulo)"
    action: execute
    model: sale.order
    method: action_confirm
    ids: ["{result.rec_id}"]
    assertions:
      - field: state
        expected: "sale"

assertions:
  - model: sale.order
    id: "{result.rec_id}"
    field: state
    expected_any: ["draft", "sale"]
    description: "Estado coherente tras la operacion"

revert:
  - step: 2
    action: execute
    model: sale.order
    method: action_cancel
    ids: ["{result.rec_id}"]
    context:
      disable_cancel_warning: true
  - step: 1
    action: delete
    model: sale.order
    ids: ["{result.rec_id}"]

cleanup:
  strategy: auto
  recover_sequences: true
  prefix_field_map:
    sale.order: client_order_ref
