  escribe lo aceptado por la propia persona, avisando de lo que pisa. Usar cuando pidan "cómo tengo la
  semana", "planifícame", "coloca mis horas", "planifica el arranque de X", cuando acepten propuestas
  ("mete la 1 y la 3"), cuando dispare la tarea programada de la mañana, o para dar de alta o de baja
