<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

.frow.sel{background:#faf7f9}.frow .nm{font-weight:600}.frow .ty{color:var(--mu);font-family:monospace;font-size:10.5px}.frow .x{margin-left:auto;cursor:pointer;color:#aab}.frow .x:hover{color:var(--rd)}
.frow.bad{background:#fdf0f0}

.o_alert{border-radius:6px;padding:8px 12px;margin:6px 0 10px;font-size:12.5px;border:1px solid;display:flex;gap:7px}.o_alert.w{background:#fff8e6;border-color:#ffe08a;color:#8a6d00}
.oe_bbox{display:flex;gap:1px;justify-content:flex-end;margin:2px 0 2px}.oe_stat{border:1px solid var(--bd);border-radius:4px;padding:4px 14px;text-align:center;min-width:84px;background:#fff}.oe_stat b{display:block;font-size:15px;color:var(--o-purple)}.oe_stat span{font-size:10.5px;color:var(--mu)}
.zhead{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd);background:#fbfbfc;padding:5px 12px}.wbtn{border:1px solid var(--o-purple);color:var(--o-purple);background:#fff;border-radius:4px;padding:5px 11px;font-size:12px;font-weight:600}
.sb{display:flex;margin-left:auto}.stg{background:#f1f1f4;color:var(--mu);font-size:12px;padding:8px 20px 8px 26px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-left:-10px}.stg.cur{background:var(--o-purple);color:#fff;font-weight:600}
.body{padding:8px 22px 18px}.oe_title h1{font-size:26px;font-weight:700;margin:6px 0 12px}
.groups{display:flex;flex-wrap:wrap;gap:2px 36px}.grp{flex:1 1 44%;min-width:260px}
.fld{display:flex;align-items:center;padding:5px 2px;border-bottom:1px dotted #eee}.fld label{width:150px;color:var(--mu);font-size:12.5px}.fld .v{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.req label:after{content:" *";color:var(--rd)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--bd);margin:14px 0 0}.tab{padding:8px 14px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:600}.tab.act{color:var(--o-purple);border-bottom-color:var(--o-purple)}.pane{display:none;padding:10px 0}.pane.act{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--mu);font-weight:600;font-size:11px;padding:7px 8px;border-bottom:1px solid var(--bd);text-transform:uppercase}td{padding:7px 8px;border-bottom:1px solid #f0f0f2}.num{text-align:right}.add{color:var(--link);padding:8px;font-size:12.5px}
.kbboard{display:flex;gap:12px;overflow-x:auto;padding:8px 16px 16px}.kbcol{background:#eef0f3;border-radius:8px;padding:8px;min-width:230px}.kbcol .kh{font-weight:700;color:var(--mu);padding:4px 6px 8px;display:flex;justify-content:space-between}.kbcard{background:#fff;border:1px solid var(--bd);border-left:3px solid var(--o-purple);border-radius:6px;padding:10px 20px 10px 10px;margin-bottom:8px;position:relative;overflow:hidden}.kf{display:flex;justify-content:space-between;padding:2px 0}.kf .kl{color:var(--mu);font-size:11px}
.kmenu{position:absolute;top:4px;right:7px;color:#aab;cursor:pointer;font-weight:700}.kribbon{position:absolute;top:0;right:0;background:var(--rd);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:0 0 0 6px}
.kprog{display:flex;height:5px;border-radius:3px;overflow:hidden;margin:0 4px 8px}.kprog i{height:100%}
.withsp{display:flex;align-items:flex-start}.spcontent{flex:1;min-width:0}
.spanel{width:186px;flex:0 0 186px;border-right:1px solid var(--bd);padding:8px;background:#fbfbfc;font-size:12px}.spanel h4{font-size:10px;text-transform:uppercase;color:var(--mu);letter-spacing:.3px;margin:11px 4px 5px}.spanel h4:first-child{margin-top:2px}
.spitem{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;cursor:pointer}.spitem:hover{background:#f0eef2}.spitem.on{background:#f3e9f0;font-weight:600;color:var(--o-purple)}
.spcount{margin-left:auto;color:var(--mu);font-size:10px;background:#ececf0;border-radius:9px;padding:0 6px}
.spck{width:12px;height:12px;border:1px solid var(--bd);border-radius:3px;flex:0 0 12px}.spck.on{background:var(--o-purple);border-color:var(--o-purple)}
.eebanner{background:#efe7ff;color:#5b3fb8;border:1px solid #d9c9ff;border-radius:6px;padding:6px 12px;margin:8px;font-size:12px}.vtab.ee{position:relative}.vtab.ee:after{content:"EE";position:absolute;top:-4px;right:-4px;background:#8a5cff;color:#fff;font-size:8px;font-weight:700;border-radius:3px;padding:0 3px}.gee{background:#2a1a4a;color:#c9b3ff}
.gph{padding:16px}.gph .bars{display:flex;align-items:flex-end;gap:14px;height:190px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0 14px 0 8px}.gph .bar{flex:1;background:var(--o-purple);border-radius:4px 4px 0 0;position:relative;min-width:24px}.gph .bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}.gph .xax{display:flex;gap:14px;padding:4px 14px 0 8px}.gph .xax div{flex:1;text-align:center;font-size:10.5px;color:var(--mu)}
.pvt{padding:12px}.pvt table{border:1px solid var(--bd)}.pvt th,.pvt td{border:1px solid var(--bd)}.pvt .rh{font-weight:600;background:#faf7f9;text-align:left}
.cal{padding:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd)}.calgrid .dow{background:#faf7f9;text-align:center;font-size:10px;font-weight:700;color:var(--mu);padding:4px}.calgrid .day{background:#fff;min-height:54px;padding:3px;font-size:10.5px}.calgrid .day .dn{color:var(--mu)}.calev{background:#e7f1ff;color:#0d6efd;border-radius:3px;padding:1px 4px;font-size:9.5px;margin-top:2px;overflow:hidden;white-space:nowrap}
.gnt{padding:12px}.gnthead{display:flex;font-size:10px;color:var(--mu);border-bottom:1px solid var(--bd)}.gnthead span{flex:1;text-align:center;padding:3px 0}.gnthead .gh0{flex:0 0 120px}.gntrow{display:flex;align-items:center;height:30px;border-bottom:1px solid #f0f0f2}.gntlbl{width:120px;flex:0 0 120px;font-size:11.5px;font-weight:600;color:var(--mu)}.gnttrack{flex:1;position:relative;height:100%}.gntbar{position:absolute;top:6px;height:16px;border-radius:4px;background:var(--o-purple);opacity:.85}
.coh{padding:12px}.coh td{text-align:center;font-variant-numeric:tabular-nums}
.mapv{display:flex;height:340px}.mapcanvas{flex:1;background:linear-gradient(135deg,#dfe9f3,#eef3f8);position:relative}.mappin{position:absolute;width:13px;height:13px;background:var(--rd);border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 3px rgba(0,0,0,.3)}.maplist{width:210px;flex:0 0 210px;border-left:1px solid var(--bd);overflow:auto;padding:8px;font-size:12px}.maplist .mi{padding:6px;border-bottom:1px solid #f0f0f2}
.o_priority i{font-style:normal;color:var(--am)}.o_status{width:11px;height:11px;border-radius:50%;background:#0d6efd;display:inline-block;vertical-align:middle}.o_status_label{margin-left:4px}.o_tag{background:#e7f1ff;color:#0d6efd;border-radius:11px;padding:1px 9px;font-size:11px;font-weight:600}.o_switch{width:30px;height:16px;background:var(--gn);border-radius:9px;position:relative;display:inline-block}.o_switch:after{content:"";position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:2px;right:2px}.av{width:20px;height:20px;border-radius:50%;background:var(--o-purple);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.chip{font-size:9px;font-weight:700;border-radius:3px;padding:0 5px;font-family:monospace;margin-left:5px}.c-std{background:#e2f7e9;color:var(--std)}.c-studio{background:#e7f1ff;color:var(--studio)}.c-dev{background:#fdecec;color:var(--dev)}.c-ee{background:#efe7ff;color:var(--ee)}.c-bad{background:#dc3545;color:#fff}
.right{background:#0b1f3a;color:#dde6f5}.right h3{color:#8fb4ff;font-size:12px;margin:8px 0 6px}.right pre{background:#000;border-radius:6px;padding:8px;font-size:9.5px;overflow:auto;max-height:180px;color:#a8e6a8;white-space:pre-wrap}
.g b{border-radius:6px;padding:3px 8px;font-size:11px;margin-right:5px}.gstd{background:#123a1e;color:#7ee2a0}.gstudio{background:#0f2a4a;color:#8fc0ff}.gdev{background:#3a1414;color:#ff9a9a}
.btn{background:var(--o-purple);color:#fff;border:none;border-radius:6px;padding:8px;width:100%;font-weight:700;cursor:pointer;margin-top:6px}.code{background:#000;color:#a8e6a8;border-radius:6px;padding:8px;font-family:monospace;font-size:9.5px;white-space:pre;overflow:auto;max-height:240px}
.disc{max-width:1000px;margin:10px auto;font-size:11px;color:#9aa0a6;text-align:center}
code{background:rgba(255,255,255,.08);padding:0 4px;border-radius:3px}
</style></head><body>

<div class="top"><h1>⚙️ Mockup Studio Odoo</h1><div class="vtabs" id="vtabs"></div><span class="sp"></span><span style="font-size:11px;color:#e9d5f0">field-first · 1 modelo → vistas coherentes → código</span></div>
<div class="app">
  <div class="col mdl">
    <h3>Modelo <input id="mname" value="x_taller_orden" style="width:120px;padding:2px 5px;border:1px solid var(--bd);border-radius:4px;font-size:12px" onchange="MODEL.name=this.value;render()"></h3>
    <select id="preset" onchange="loadPreset(this.value)" style="width:100%;padding:5px 6px;border:1px solid var(--bd);border-radius:5px;font-size:12px;margin-bottom:8px">
      <option value="">— Plantilla (preset) —</option>
      <option value="taller_or">Taller · Orden de reparación (demo)</option>
      <option value="doc_lineas">Documento con líneas (cabecera + o2m)</option>
      <option value="tablero">Tablero por etapas (kanban)</option>
      <option value="maestro_detalle">Ficha maestro-detalle</option>
    </select>
    <div class="fadd">
      <input id="flabel" placeholder="Etiqueta (p.ej. Kilómetros)">
      <div class="r2"><select id="ftype" onchange="syncW()"></select><select id="fwidget"></select></div>
      <div class="r2"><select id="forigin"><option value="new">nuevo</option><option value="std">existente</option></select><label style="font-size:11px;color:var(--mu);display:flex;align-items:center;gap:4px"><input type="checkbox" id="fcompute"> computed</label></div>
      <button onclick="addField()">＋ Añadir campo</button>
      <button onclick="addCustom()" style="background:#3a1414;margin-top:5px">＋ Bloque a medida (OWL / dev)</button>
    </div>
    <h3>Campos (<span id="fcount">0</span>)</h3>
    <div id="flist"></div>
  </div>
  <div class="col canvas"><div class="cp">Órdenes / <b id="bc">x_taller_orden</b> · <span id="vlab" style="color:var(--o-purple);font-weight:600"></span></div><div class="sheet" id="sheet"></div>
    <div class="disc">Studio de mockups · spec 2 capas · widgets validados contra fuente · no funcional</div></div>
  <div class="col right">
    <h3>■ Presupuesto</h3><div class="g" id="tally"></div>
    <h3>■ Spec (2 capas)</h3><pre id="spec"></pre>
    <button class="btn" onclick="showCode()">⟨/⟩ Ver código Odoo</button>
    <div id="codebox"></div>
  </div>
</div>

<script>
/* matriz tipo↔widget (de fuente) */
const TYPE_W={char:["char","badge","email","phone","url","text"],text:["text"],integer:["integer","handle","priority"],float:["float","float_time","monetary","percentage","progressbar"],monetary:["monetary"],boolean:["boolean_toggle","boolean"],date:["date","remaining_days"],datetime:["datetime"],selection:["selection","badge","state_selection","priority","radio","statusbar","label_selection"],many2one:["many2one","many2one_avatar","badge"],many2many:["many2many_tags","many2many_checkboxes"],one2many:["one2many"],html:["html"],binary:["binary","image"]};
const DEF_W={char:"char",text:"text",integer:"integer",float:"float",monetary:"monetary",boolean:"boolean_toggle",date:"date",datetime:"datetime",selection:"selection",many2one:"many2one",many2many:"many2many_tags",one2many:"one2many",html:"html",binary:"binary"};
const PYT={char:"Char",text:"Text",integer:"Integer",float:"Float",monetary:"Monetary",boolean:"Boolean",date:"Date",datetime:"Datetime",selection:"Selection",many2one:"Many2one",one2many:"One2many",many2many:"Many2many",html:"Html",binary:"Binary"};
/* modelo inicial (ejemplo Autosur) */
let MODEL={name:"x_taller_orden",inherit:"repair.order",fields:[
  {name:"name",type:"char",widget:"char",label:"Nombre",origin:"std"},
  {name:"partner_id",type:"many2one",widget:"many2one",label:"Cliente",origin:"std",comodel:"res.partner"},
  {name:"user_id",type:"many2one",widget:"many2one_avatar",label:"Responsable",origin:"std",comodel:"res.users"},
  {name:"priority",type:"selection",widget:"priority",label:"Prioridad",origin:"std"},
  {name:"tag_ids",type:"many2many",widget:"many2many_tags",label:"Etiquetas",origin:"std",comodel:"repair.tags"},
  {name:"km",type:"integer",widget:"integer",label:"Kilómetros",origin:"new",required:true},
  {name:"riesgo",type:"selection",widget:"state_selection",label:"Riesgo cliente",origin:"new",compute:true},
  {name:"state",type:"selection",widget:"statusbar",label:"Estado",origin:"new",compute:true},
  {name:"importe",type:"monetary",widget:"monetary",label:"Importe",origin:"new",compute:true},
  {name:"diagnostico_ids",type:"one2many",widget:"one2many",label:"Diagnósticos",origin:"new",comodel:"x_taller_diag"}
]};
/* PRESETS — patrones comunes en un clic */
const PRESETS={
  taller_or:()=>({name:"x_taller_orden",inherit:"repair.order",fields:[
    {name:"name",type:"char",widget:"char",label:"Nombre",origin:"std"},
    {name:"partner_id",type:"many2one",widget:"many2one",label:"Cliente",origin:"std",comodel:"res.partner"},
    {name:"user_id",type:"many2one",widget:"many2one_avatar",label:"Responsable",origin:"std",comodel:"res.users"},
    {name:"priority",type:"selection",widget:"priority",label:"Prioridad",origin:"std"},
    {name:"tag_ids",type:"many2many",widget:"many2many_tags",label:"Etiquetas",origin:"std",comodel:"repair.tags"},
    {name:"km",type:"integer",widget:"integer",label:"Kilómetros",origin:"new",required:true},
    {name:"riesgo",type:"selection",widget:"state_selection",label:"Riesgo cliente",origin:"new",compute:true},
    {name:"state",type:"selection",widget:"statusbar",label:"Estado",origin:"new",compute:true},
    {name:"importe",type:"monetary",widget:"monetary",label:"Importe",origin:"new",compute:true},
    {name:"diagnostico_ids",type:"one2many",widget:"one2many",label:"Diagnósticos",origin:"new",comodel:"x_taller_diag"}]}),
  doc_lineas:()=>({name:"x_documento",inherit:null,fields:[
    {name:"name",type:"char",widget:"char",label:"Referencia",origin:"new"},
    {name:"partner_id",type:"many2one",widget:"many2one",label:"Cliente",origin:"new",comodel:"res.partner"},
    {name:"date",type:"date",widget:"date",label:"Fecha",origin:"new"},
    {name:"state",type:"selection",widget:"statusbar",label:"Estado",origin:"new"},
    {name:"note",type:"html",widget:"html",label:"Notas",origin:"new"},
    {name:"amount_total",type:"monetary",widget:"monetary",label:"Total",origin:"new",compute:true},
    {name:"line_ids",type:"one2many",widget:"one2many",label:"Líneas",origin:"new",comodel:"x_documento_line"}]}),
  tablero:()=>({name:"x_tarea",inherit:null,fields:[
    {name:"name",type:"char",widget:"char",label:"Título",origin:"new"},
    {name:"user_id",type:"many2one",widget:"many2one_avatar",label:"Responsable",origin:"new",comodel:"res.users"},
    {name:"priority",type:"selection",widget:"priority",label:"Prioridad",origin:"new"},
    {name:"state",type:"selection",widget:"statusbar",label:"Etapa",origin:"new"},
    {name:"date_deadline",type:"date",widget:"date",label:"Fecha límite",origin:"new"},
    {name:"tag_ids",type:"many2many",widget:"many2many_tags",label:"Etiquetas",origin:"new",comodel:"x_tarea_tag"}]}),
  maestro_detalle:()=>({name:"x_ficha",inherit:null,fields:[
    {name:"name",type:"char",widget:"char",label:"Nombre",origin:"new"},
    {name:"partner_id",type:"many2one",widget:"many2one",label:"Contacto",origin:"new",comodel:"res.partner"},
    {name:"user_id",type:"many2one",widget:"many2one_avatar",label:"Responsable",origin:"new",comodel:"res.users"},
    {name:"active",type:"boolean",widget:"boolean_toggle",label:"Activo",origin:"new"},
    {name:"description",type:"html",widget:"html",label:"Descripción",origin:"new"},
    {name:"detalle_ids",type:"one2many",widget:"one2many",label:"Detalle",origin:"new",comodel:"x_ficha_detalle"}]})
};
function loadPreset(k){if(!k||!PRESETS[k])return;MODEL=PRESETS[k]();sel=null;cur="form";document.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('act',b.dataset.v==='form'));render();}
let cur="form",uid=0,sel=null;
function slug(s){return (s||'campo').toLowerCase().normalize('NFD').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'campo';}
function validW(f){return f.widget==='owl_custom'||(TYPE_W[f.type]||[]).includes(f.widget);}
function classify(f){if(f.widget==='owl_custom')return 'dev';if(['gantt','cohort','map'].includes(cur))return 'ee';if(f.origin==='std')return 'std';if(f.compute)return 'dev';if(DEF_W[f.type]&&validW(f))return 'studio';return 'dev';}
function fDates(){return MODEL.fields.filter(f=>['date','datetime'].includes(f.type));}
function fNums(){return MODEL.fields.filter(f=>['monetary','float','integer'].includes(f.type));}
function fGroups(){return MODEL.fields.filter(f=>['selection','many2one'].includes(f.type));}
function fPartner(){return MODEL.fields.find(f=>f.type==='many2one'&&/partner|cliente|proveedor|direcc/i.test(f.name+f.label))||MODEL.fields.find(f=>f.type==='many2one');}
function chipC(c){const m={std:"nativo",studio:"Studio",dev:"dev",ee:"EE",bad:"⚠"};return '<span class="chip c-'+c+'">'+m[c]+'</span>';}
/* widgets UI */
function wv(f){switch(f.widget){
  case "many2one_avatar":return '<span class="av">JS</span> J. Soler';
  case "many2many_tags":return '<span class="o_tag">Etiqueta</span> <span class="o_tag">Otra</span>';
  case "state_selection":return '<span class="o_status" style="background:#f0ad4e"></span><span class="o_status_label">En curso</span>';
  case "badge":return '<span class="o_tag" style="background:#f0e7f4;color:#714B67">Valor</span>';
  case "priority":return '<span class="o_priority"><i>★</i><i>★</i><i style="color:#ccc">★</i></span>';
  case "monetary":return '1.150,00 €';case "many2one":return '<span style="color:var(--link)">Registro rel.</span>';
  case "boolean_toggle":return '<span class="o_switch"></span>';case "integer":return '348.920';case "date":return '04/07/2026';
  case "char":return 'Texto de ejemplo';default:return 'valor…';}}
/* editor de campos */
function fieldEditorInit(){const ty=document.getElementById('ftype');ty.innerHTML=Object.keys(DEF_W).map(t=>'<option>'+t+'</option>').join('');syncW();}
function syncW(){const t=document.getElementById('ftype').value;document.getElementById('fwidget').innerHTML=(TYPE_W[t]||[t]).map(w=>'<option'+(w===DEF_W[t]?' selected':'')+'>'+w+'</option>').join('');}
function addField(){const lab=document.getElementById('flabel').value.trim();if(!lab){alert('Pon una etiqueta.');return;}

  // Vistas analíticas/temporales (CE) + Enterprise, solo si el modelo tiene los campos que exige cada una
  const nums=fNums(),grps=fGroups(),dts=fDates(),part=fPartner();const nameF=(MODEL.fields.find(x=>x.name==='name')||MODEL.fields[0]);let X=[];
  const rec=(id,arch,ee)=>(ee?'<!-- Requiere Odoo Enterprise ('+ee+') -->\n':'')+'<record id="view_'+rid+'_'+id+'" model="ir.ui.view">\n  <field name="model">'+MODEL.name+'</field>\n  <field name="arch" type="xml">\n'+arch+'\n  </field>\n</record>';
  if(nums.length&&grps.length)X.push(rec('graph','    <graph type="bar">\n      <field name="'+grps[0].name+'"/>\n      <field name="'+nums[0].name+'" type="measure"/>\n    </graph>'));
  if(nums.length&&grps.length)X.push(rec('pivot','    <pivot>\n      <field name="'+grps[0].name+'" type="row"/>\n'+(grps[1]?'      <field name="'+grps[1].name+'" type="col"/>\n':'')+'      <field name="'+nums[0].name+'" type="measure"/>\n    </pivot>'));
  if(dts.length)X.push(rec('calendar','    <calendar date_start="'+dts[0].name+'"'+(dts[1]?' date_stop="'+dts[1].name+'"':'')+' mode="month"'+(grps[0]?' color="'+grps[0].name+'"':'')+'>\n      <field name="'+nameF.name+'"/>\n    </calendar>'));
  if(dts.length>=2)X.push(rec('gantt','    <gantt date_start="'+dts[0].name+'" date_stop="'+dts[1].name+'"'+(grps[0]?' default_group_by="'+grps[0].name+'"':'')+'/>','web_gantt'));
  if(dts.length>=2)X.push(rec('cohort','    <cohort date_start="'+dts[0].name+'" date_stop="'+dts[1].name+'" interval="week" mode="churn"/>','web_cohort'));
  if(part)X.push(rec('map','    <map res_partner="'+part.name+'"/>','web_map'));
  return f.join('\n')+'\n\n'+L.join('\n')+'\n\n'+K.join('\n')+(S.length?'\n\n'+S.join('\n'):'')+(X.length?'\n\n'+X.join('\n\n'):'');}
function showCode(){document.getElementById('codebox').innerHTML='<h3 style="color:#8fb4ff">models/'+MODEL.name.replace(/\./g,'_')+'.py</h3><pre class="code">'+esc(emitPy())+'</pre><h3 style="color:#8fb4ff">views/…_views.xml</h3><pre class="code">'+esc(emitXml())+'</pre>';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* render global */
function render(){
  document.getElementById('mname').value=MODEL.name;document.getElementById('bc').textContent=MODEL.name;document.getElementById('vlab').textContent='vista '+cur;
  const EE=['gantt','cohort','map'];const ALT={gantt:'calendar / lista ordenada',cohort:'pivot / graph',map:'lista + campo dirección'};
  const R={form:renderForm,list:renderList,kanban:renderKanban,calendar:renderCalendar,graph:renderGraph,pivot:renderPivot,gantt:renderGantt,cohort:renderCohort,map:renderMap};
  const inner=(R[cur]||renderForm)();
  const banner=EE.includes(cur)?'<div class="eebanner">🔒 Vista <b>'+cur+'</b> — requiere <b>Odoo Enterprise</b> (módulo <code>web_'+cur+'</code>). En CE no existe; alternativa nativa: '+ALT[cur]+'.</div>':'';
  document.getElementById('sheet').innerHTML= banner+(['list','kanban'].includes(cur)?'<div class="withsp">'+renderSearchPanel()+'<div class="spcontent">'+inner+'</div></div>':inner);
  renderFields();
  let c={std:0,studio:0,dev:0,ee:0};MODEL.fields.forEach(f=>{c[validW(f)?classify(f):'dev']++;});
  document.getElementById('tally').innerHTML='<b class="gstd">nativo '+c.std+'</b><b class="gstudio">Studio '+c.studio+'</b><b class="gdev">dev '+c.dev+'</b>'+(c.ee?'<b class="gee">EE '+c.ee+'</b>':'');
  document.getElementById('spec').textContent=JSON.stringify(buildSpec(),null,1);
  document.getElementById('codebox').innerHTML='';
}
function switchV(v){cur=v;document.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('act',b.dataset.v===v));render();}
(function(){const t=document.getElementById('vtabs');const EE=['gantt','cohort','map'];[["form","Formulario"],["list","Lista"],["kanban","Kanban"],["calendar","Calendario"],["graph","Gráfico"],["pivot","Pivot"],["gantt","Gantt"],["cohort","Cohorte"],["map","Mapa"]].forEach(([v,l])=>{const b=document.createElement('button');b.className='vtab'+(v==='form'?' act':'')+(EE.includes(v)?' ee':'');b.dataset.v=v;b.textContent=l;b.onclick=()=>switchV(v);t.appendChild(b);});})();
fieldEditorInit();render();
</script>
