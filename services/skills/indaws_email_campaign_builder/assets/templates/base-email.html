<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: Verdana, sans-serif !important; }
  </style>
  <![endif]-->
  <style type="text/css">
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .fluid { max-width: 100% !important; height: auto !important; }
      .stack-column { display: block !important; width: 100% !important; max-width: 100% !important; }
      .center-on-narrow { text-align: center !important; display: block !important; margin-left: auto !important; margin-right: auto !important; float: none !important; }
      .cta-button { width: 100% !important; max-width: 100% !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: 'Montserrat', Verdana, sans-serif;">

  <!-- Preheader (hidden text shown in inbox preview) -->
  <div style="display: none; font-size: 1px; color: #f4f4f7; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;">
    {{PREHEADER}}
  </div>

  <!-- Email wrapper -->
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f4f4f7;">
    <tr>
      <td align="center" style="padding: 20px 10px;">

        <!-- Email container -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" class="email-container" style="max-width: 600px; width: 100%;">

          <!-- HEADER -->
          <tr>
            <td style="background-color: #1C265D; padding: 30px 40px; text-align: left; border-radius: 8px 8px 0 0;">
              <img src="https://www.indaws.es/web/image/website/1/logo" alt="Indaws" width="140" style="display: block; max-width: 140px; height: auto;">
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="background-color: #ffffff; padding: 40px 40px 20px 40px;">

              <!-- Heading -->
              <h1 style="margin: 0 0 20px 0; font-family: 'Montserrat', Verdana, sans-serif; font-size: 24px; font-weight: 700; color: #6B68FA; text-transform: uppercase; line-height: 1.2; letter-spacing: 0.02em;">
                {{HEADING}}
              </h1>

              <!-- Body content -->
              <div style="font-family: 'Montserrat', Verdana, sans-serif; font-size: 16px; font-weight: 400; color: #1C265D; line-height: 1.6;">
                {{BODY_CONTENT}}
              </div>

            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td style="background-color: #ffffff; padding: 10px 40px 40px 40px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto;">
                <tr>
                  <td style="border-radius: 6px; background-color: #6B68FA;">
                    <a href="{{CTA_URL}}" target="_blank" class="cta-button" style="display: inline-block; padding: 14px 32px; font-family: 'Montserrat', Verdana, sans-serif; font-size: 14px; font-weight: 700; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px; background-color: #6B68FA;">
                      {{CTA_TEXT}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- DIVIDER -->
          <tr>
            <td style="background-color: #ffffff; padding: 0 40px;">
              <hr style="border: 0; border-top: 1px solid #8AC2DB; margin: 0;">
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background-color: #ffffff; padding: 30px 40px; border-radius: 0 0 8px 8px;">

              <!-- Company info -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td style="font-family: 'Montserrat', Verdana, sans-serif; font-size: 12px; color: #1C265D; line-height: 1.6; text-align: center;">
                    <img src="https://www.indaws.es/web/image/website/1/logo" alt="Indaws" width="80" style="display: inline-block; max-width: 80px; height: auto; margin-bottom: 10px;"><br>
                    <strong>Indaws</strong> — Tu partner tecnológico<br>
                    Valencia, España<br>
                    <a href="https://www.indaws.es" style="color: #6B68FA; text-decoration: none;">www.indaws.es</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top: 15px; font-family: 'Montserrat', Verdana, sans-serif; font-size: 11px; color: #8AC2DB; line-height: 1.5; text-align: center;">
                    Has recibido este email porque formas parte de nuestra comunidad.<br>
                    <a href="{{UNSUBSCRIBE_URL}}" style="color: #8AC2DB; text-decoration: underline;">Darme de baja</a> &nbsp;|&nbsp;
                    <a href="https://www.indaws.es/privacy" style="color: #8AC2DB; text-decoration: underline;">Política de privacidad</a><br>
                    &copy; {{YEAR}} Indaws. Todos los derechos reservados.
                  </td>
                </tr>
              </table>

            </td>
          </tr>

        </table>
        <!-- /Email container -->

      </td>
    </tr>
  </table>
  <!-- /Email wrapper -->

</body>
</html>
