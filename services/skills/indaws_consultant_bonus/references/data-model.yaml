  aitor:  {emp_id: 45,  user_id: 282, override_si_consultor: {individual: 80, equipo: 80},
           nota: "perfil mixto 80/80 SOLO en periodos en que es consultor (p.ej. Q1 2026). En Q2 2026 pasó a KAM -> fuera de los 3 equipos."}
  angel:  {emp_id: 60,  user_id: 425, equipo_ficha: servicios, simular_en: [tokyo, servicios]}    # PM Servicios + consultor Tokyo
  maria_erades: {emp_id: 199, user_id: 1133, equipo: monaco}   # ejemplo alerta 0.7 recurrente
  anna_pm:      {emp_id: 229, user_id: 1268, equipo: monaco, rol: pm}   # ejemplo alerta sobre-ejecución
