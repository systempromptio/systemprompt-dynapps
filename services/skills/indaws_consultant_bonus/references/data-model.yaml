# =============================================================================
# MODELO DE DATOS — consultant-bonus (Dynapps Spain / ex-Indaws)
# Fuente de verdad de DÓNDE se lee cada dato en Odoo. Verificado contra Odoo real.
# Acceso SOLO LECTURA vía MCP de Odoo (whoami / orm_search_read / orm_execute_kw).
# NUNCA orm_create / orm_write / orm_unlink en este skill.
# =============================================================================

conexion:
  via: MCP                       # NO odoo-pilot, NO scripts bash. Tools del MCP de Odoo.
  preguntar_nombre_mcp: true     # El MCP puede no llamarse "odoo-indaws". Preguntar al usuario.
  tools:
    whoami: >
      Identidad del usuario autenticado (login, nombre, email, departamento,
      puesto, manager). Se usa para POSICIONAR a la persona automáticamente en
      modo CONSULTOR. El usuario puede pedir "trabaja como si fuera X" y se cambia el foco.
    orm_search_read: >
      Lectura genérica. limit máx 500 -> paginar con offset.
    orm_execute_kw: >
      Llamada a método. Usar method="read_group" para SUMAR x_studio_bonus_unit_amount
      en el servidor (por employee_id, o por date:month). method="fields_get" para
      introspección. Mucho más fiable que traerse miles de líneas.
  IMPORTANTE_context: >
    ⚠️ El proxy MCP RECHAZA el parámetro `context` (active_test, lang, etc.) -> da
    "Internal server error". NUNCA pasar `context`. El idioma ya sale en es_ES por
    defecto. Para incluir archivados, usar el DOMINIO ["active","in",[true,false]]
    (no context active_test).
  read_group_reglas: >
    Un solo nivel de groupby, lazy:false, solo campos ':sum'. NUNCA agrupar por
    proyecto/tarea de forma masiva (explota a cientos de miles de filas). El groupby
    por employee_id ya devuelve unit_amount y x_studio_bonus_unit_amount por persona.
  nota_sudo: >
    Los orm_* corren como superusuario (bypass de record rules): Dirección lee a
    todos. whoami sigue devolviendo a la persona real que pregunta.

# -----------------------------------------------------------------------------
equipos:                         # crm.team — SOLO estos 3
  tokyo:     {id: 28}
  servicios: {id: 32}
  monaco:    {id: 33}            # "Mónaco" con tilde
  # Paris(30) y demás quedan FUERA.

# -----------------------------------------------------------------------------
hr.employee:
  equipo:        x_studio_team_id      # m2o crm.team — EL equipo del empleado (manda este, no el del proyecto)
  departamento:  department_id         # 1 = Consultoría, 4 = Desarrollo
  puesto:        job_id                # leer job_id.name: "junior" -> junior; "senior"/"medior" -> con experiencia
  puesto_txt:    job_title             # PM = contiene "Director de proyectos"
  usuario:       user_id               # m2o res.users (cruce con horas/demos)
  alta:          create_date           # ÚNICO criterio de alta (regla de incorporaciones)
  activo:        active
  # NO usar: departure_date (no se rellena), billable_time_target (=0), date_start/contract_date_start
  deteccion_rol:
    desarrollo: department_id == 4              # cuenta para objetivo de equipo, NO cobra bonus
    pm:         job_title contiene "Director de proyectos"
    consultor:  department_id == 1 and not pm
  POBLACION_equipo: >                            # ⭐ C1 — cómo construir la lista de miembros del equipo
    SIEMPRE incluir activos Y archivados: dominio ["active","in",[true,false]] junto con
    el filtro x_studio_team_id. Además, la población final = UNIÓN de (a) esos miembros y
    (b) TODO employee_id que tenga partes (account.analytic.line) en el periodo con
    bonus>0, aunque su empleado/usuario esté archivado (gente que se fue a mitad de
    trimestre pero imputó horas). NUNCA asumir un nº fijo de personas; comparar el conteo
    activos vs activos+archivados y avisar si difieren.

# -----------------------------------------------------------------------------
account.analytic.line:               # PARTES DE HORA
  bonus:        x_studio_bonus_unit_amount   # ⭐ horas computables (×0.7 YA aplicado si fuera de plazo). SUMAR DIRECTO.
  horas_brutas: unit_amount
  facturables:  billable_unit_amount         # facturabilidad propia Indaws (≠ timesheet_invoice_type estándar)
  no_fact:      unbillable_unit_amount
  empleado:     employee_id
  usuario:      user_id
  proyecto:     project_id
  tarea:        task_id
  fecha:        date
  excluir_si:   [holiday_id != false, global_leave_id != false]   # vacaciones/festivos automáticos
  # Para el objetivo se usa SIEMPRE x_studio_bonus_unit_amount. NO usar timesheet_invoice_type.
  penalizacion_0_7: >                          # ⭐ M1 — sin groupby masivo
    La penalización por retraso (proxy de "proyectos fuera de plazo") = diferencia
    unit_amount − x_studio_bonus_unit_amount POR EMPLEADO. Ambos campos ya vienen en el
    read_group principal por employee_id. NO agrupar por proyecto/tarea para esto.

# -----------------------------------------------------------------------------
project.project:
  fecha_fin_planificada: date          # la que dispara el 0.7 (ya viene resuelto en el campo bonus)
  equipo_proyecto:       xx_team_id             # equipo del PROYECTO (≠ del empleado; usado solo en caso Ángel)
  etapa:                 stage_id              # "Migraciones", "En proceso"...
  excluir_internos:      [1, 100, 279]         # Interno, INDAWS, INDAWS FORMACIONES
  tipologia: derivar_de(name + stage_id)       # normalizar al vuelo: Migración/Implantación/Ampliación/Análisis/Soporte...

# -----------------------------------------------------------------------------
project.task:                        # TAREAS DE REPARTO (solo análisis, NO se suma aparte)
  deteccion_dominio: [["name", "ilike", "[reparto]"]]   # con corchetes (preciso, evita falsos positivos)
  beneficiarios: timesheet_ids -> account.analytic.line agrupado por employee_id
  # user_ids va VACÍO -> NO sirve. Las horas de reparto YA son partes dentro de la tarea
  # (y por tanto YA están en x_studio_bonus_unit_amount del total). Mostrar tareas candidatas y confirmar.

# -----------------------------------------------------------------------------
mail.activity:                       # DEMOS  (antes crm.lead — los campos de Studio fueron BORRADOS)
  # Los tres campos que se usaban aquí ya NO EXISTEN en crm.lead: cualquier consulta que
  # los mencione devuelve "Invalid field". Las demos históricas se migraron a actividades
  # conservando fecha y responsable, así que los trimestres pasados siguen siendo calculables.
  tipo: >                                       # ⭐ RESOLVER POR NOMBRE, nunca hardcodear el id
    mail.activity.type con name='Demo' y res_model='crm.lead'.
    En producción es el 38, pero cambia entre instancias.
  dominio: >
    [["activity_type_id","=",<tipo>], ["res_model","=","crm.lead"],
     ["active","=",false], ["date_done",">=",<inicio>], ["date_done","<=",<fin>]]
  campos:        [res_id, user_id, date_done]   # res_id = la oportunidad; user_id = quien la HIZO
  demo_hecha: >                                 # ⭐ una demo HECHA es una actividad CERRADA:
    active=False. La fecha es date_done, NO date_deadline. Una demo agendada y no hecha NO cuenta.
  ver_archivadas: >                             # ⭐ EL GOTCHA. Las actividades cerradas quedan
    ARCHIVADAS. Sin verlas la consulta devuelve CERO (medido Q2 2026: 96 con, 0 sin).
    El dominio de arriba YA lleva ["active","=",false] explícito, que es lo que desactiva el
    filtro implícito en Odoo. Si el cliente permite contexto, añadir además {"active_test": false};
    por MCP NO se puede (ver GOTCHA 1: rechaza context con "Internal server error"), y por eso el
    ["active","=",false] del dominio es OBLIGATORIO, no opcional.

  # ⭐⭐ REGLA DE CONTEO: UNA DEMO POR OPORTUNIDAD COMO MÁXIMO
  # Antes era automático (el lead tenía UN campo de fecha). Ahora un lead puede tener VARIAS
  # actividades Demo, y contarlas todas INFLARÍA el bonus.
  conteo: >
    1) traer las actividades Demo cerradas con date_done en el periodo;
    2) AGRUPAR POR res_id (la oportunidad);
    3) cada grupo = UNA demo, tenga las actividades que tenga;
    4) participantes = conjunto de user_id DISTINTOS de las actividades de ese grupo;
    5) +4h ÷ nº de participantes, planas (sin 0.7);
    6) al equipo del EMPLEADO (hr.employee.x_studio_team_id), no al team_id del lead.
  verificado_q2_2026: >
    96 actividades cerradas · 79 oportunidades distintas (ES EL NÚMERO QUE CUENTA) ·
    13 oportunidades con más de una actividad · participantes por oportunidad: 69×1, 8×2, 2×3 ·
    horas = 79 × 4 = 316 h. Si el cálculo da 96, se están contando ACTIVIDADES, no oportunidades.
  regla: "+4h por demo (=oportunidad) / nº de participantes; planas (sin 0.7); al equipo del EMPLEADO"

# -----------------------------------------------------------------------------
res.users:                           # DESPIDOS / SALIDAS
  detectar:        [["active", "in", [false]], ["share", "=", false]]   # order write_date desc; SIN context
  # Para listar archivados NO se usa context active_test (lo rechaza el MCP); el dominio
  # ["active","in",[false]] o ["active","in",[true,false]] basta.
  fecha_baja_aprox: write_date         # ÚNICO criterio de baja (departure_date NO se usa)
  cruce:           employee_id          # a veces roto al archivar -> fallback por login/email
  # write_date es aproximación -> MOSTRAR al usuario y CONFIRMAR antes de calcular. Excluir externos.

# -----------------------------------------------------------------------------
hr.leave:                            # VACACIONES (para alertas)
  empleado: employee_id
  estado:   state                      # confirm = planificada sin aprobar; validate1/validate = aprobada
  rango:    [request_date_from, request_date_to]
  dias:     number_of_days
hr.employee_dias_restantes: [allocation_remaining_display, virtual_remaining_leaves]
alertas_vacaciones:
  no_cogidas:       sin hr.leave 'validate' en el año
  planif_sin_aprob: hr.leave en 'confirm'
  sin_planificar:   sin registros futuros

# -----------------------------------------------------------------------------
casos_especiales_confirmados:        # referencias (valores por defecto, SIEMPRE confirmables por periodo)
