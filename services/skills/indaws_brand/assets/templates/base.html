<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DOCUMENT_TITLE}} | Indaws</title>
  <style>
    /* ── Indaws Brand Fonts ── */
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('../fonts/Montserrat-Italic-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }

    /* ── Indaws Brand Colors ── */
    :root {
      --indaws-warm-yellow: #E5B92B;
      --indaws-blue-lilac: #6B68FA;
      --indaws-blue-space: #1C265D;
      --indaws-light-sky: #8AC2DB;
      --indaws-white: #FFFFFF;
      --indaws-gradient-blue: linear-gradient(135deg, #6B68FA 0%, #8AC2DB 100%);
      --indaws-gradient-yellow: linear-gradient(135deg, #8AC2DB 0%, #E5B92B 100%);
    }

    /* ── PDF Page Rules (print-safe) ── */
    @page { size: A4; margin: 25mm; }
    @page :first { margin: 0; }

    /* ── Base Reset & Typography ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', Verdana, sans-serif;
      font-weight: 400;
      color: var(--indaws-blue-space);
      line-height: 1.6;
      background-color: var(--indaws-white);
      text-align: justify;
      word-break: break-word;
    }

    /* ── Headings ── */
    h1, h2 {
      font-family: 'Montserrat', Verdana, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--indaws-blue-lilac);
      line-height: 1.2;
    }

    h1 { font-size: 2.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.75rem; margin-bottom: 1rem; }

    h3, h4 {
      font-family: 'Montserrat', Verdana, sans-serif;
      font-weight: 600;
      color: var(--indaws-blue-space);
      line-height: 1.3;
    }

    h3 { font-size: 1.25rem; margin-bottom: 0.75rem; }
    h4 { font-size: 1.1rem; margin-bottom: 0.5rem; }

    /* ── Body Text ── */
    p {
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    /* ── Links & CTAs ── */
    a {
      color: var(--indaws-blue-lilac);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .cta-button {
      display: inline-block;
      background-color: var(--indaws-warm-yellow);
      color: var(--indaws-blue-space);
      font-family: 'Montserrat', Verdana, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .cta-button:hover {
      opacity: 0.9;
      text-decoration: none;
    }

    /* ── Layout ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ── Header ── */
    .header {
      background-color: var(--indaws-blue-space);
      padding: 1.5rem 0;
    }

    .header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      height: 40px;
      width: auto;
    }

    /* ── Main Content ── */
    .main-content {
      padding: 3rem 0;
    }

    /* ── Footer ── */
    .footer {
      background-color: var(--indaws-blue-space);
      color: var(--indaws-white);
      padding: 2rem 0;
      font-size: 0.85rem;
    }

    .footer .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      height: 30px;
      width: auto;
    }

    .footer a {
      color: var(--indaws-light-sky);
    }

    /* ── Utility: Brand Backgrounds ── */
    .bg-blue-space {
      background-color: var(--indaws-blue-space);
      color: var(--indaws-white);
    }

    .bg-blue-space h1,
    .bg-blue-space h2 { color: var(--indaws-white); }

    .bg-blue-lilac {
      background-color: var(--indaws-blue-lilac);
      color: var(--indaws-white);
    }

    .bg-blue-lilac h1,
    .bg-blue-lilac h2 { color: var(--indaws-white); }

    .bg-gradient {
      background: var(--indaws-gradient-blue);
      color: var(--indaws-white);
    }

    .bg-gradient h1,
    .bg-gradient h2 { color: var(--indaws-white); }

    /* ── Utility: Accent & Highlight ── */
    .text-accent { color: var(--indaws-warm-yellow); }
    .text-lilac { color: var(--indaws-blue-lilac); }
    .text-muted { color: var(--indaws-light-sky); }

    /* ── Dark Background Variant ── */
    .dark-theme {
      background-color: var(--indaws-blue-space);
      color: var(--indaws-white);
    }

    .dark-theme h1,
    .dark-theme h2 { color: var(--indaws-white); }

    .dark-theme h3,
    .dark-theme h4 { color: var(--indaws-light-sky); }

    /* ── PDF: Page Break Rules (print-safe) ── */
    .cover-page {
      background-color: var(--indaws-blue-space);
      color: var(--indaws-white);
      height: 297mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem;
      page-break-after: always;
    }

    .page {
      padding: 2rem 1.2rem 1rem;
      page-break-after: always;
    }
    .page:last-of-type { page-break-after: auto; }

    .highlight-box,
    .callout-gradient,
    .timeline-item,
    .sql-block { page-break-inside: avoid; }

    thead { display: table-header-group; }
    tr { page-break-inside: avoid; }
    h2, h3 { page-break-after: avoid; }

    /* ── PDF: Impact Cards (flexbox, print-safe) ── */
    .impact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin: 1.5rem 0;
    }
    .impact-card {
      background: var(--indaws-blue-space);
      color: var(--indaws-white);
      border-radius: 10px;
      padding: 1.3rem 1rem;
      text-align: center;
      flex: 1 1 0;
      min-width: 130px;
      page-break-inside: avoid;
    }
    .impact-card .number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--indaws-warm-yellow);
      display: block;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }
    .impact-card .label {
      font-size: 0.75rem;
      opacity: 0.85;
      line-height: 1.3;
    }

    /* ── PDF: SQL Code Blocks ── */
    .sql-block {
      background-color: var(--indaws-blue-space);
      border-left: 4px solid var(--indaws-warm-yellow);
      padding: 1.2rem 1.5rem;
      border-radius: 0 6px 6px 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.72rem;
      color: #e0e0e0;
      line-height: 1.8;
      page-break-inside: avoid;
    }
    .sql-block .kw { color: #E5B92B; font-weight: 700; }
    .sql-block .cm { color: #8AC2DB; }

    /* ── PDF: Highlight & Callout Boxes ── */
    .highlight-box {
      background-color: #f4f2ff;
      border-left: 4px solid var(--indaws-blue-lilac);
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 6px 6px 0;
    }

    .callout-gradient {
      background: linear-gradient(135deg, #6B68FA 0%, #8AC2DB 100%);
      color: var(--indaws-white);
      padding: 1.5rem 2rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: center;
    }

    /* ── PDF: Data Tables ── */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      font-size: 0.85rem;
    }
    table thead tr {
      background-color: var(--indaws-blue-space);
      color: var(--indaws-white);
    }
    table th {
      padding: 0.6rem 0.8rem;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }
    table td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid #e8e8f0;
    }
    table tbody tr:nth-child(even) { background-color: #f9f9fc; }

    /* ── PDF: Generic Code Blocks (pre) ── */
    pre {
      background-color: var(--indaws-blue-space);
      color: #e0e0e0;
      border-left: 3px solid var(--indaws-warm-yellow);
      padding: 0.6rem 0.8rem;
      border-radius: 0 4px 4px 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.65rem;
      line-height: 1.6;
      page-break-inside: avoid;
      margin: 0.5rem 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: hidden;
    }
    pre code {
      background: none;
      color: inherit;
      padding: 0;
      font-size: inherit;
    }

    /* ── PDF: Diagram Blocks (ASCII art, flow diagrams) ── */
    pre.diagram-block {
      background-color: #f4f2ff;
      color: var(--indaws-blue-space);
      border-left: 3px solid var(--indaws-blue-lilac);
    }

    /* ── PDF: Metadata Grid (for technical documents) ── */
    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin: 0 0 1rem 0;
      border: 1px solid #e0ddf0;
      border-radius: 4px;
      overflow: hidden;
    }
    .metadata .item {
      flex: 1 1 50%;
      padding: 0.5rem 0.8rem;
      border-bottom: 0.5px solid #e0ddf0;
      font-size: 0.8rem;
    }
    .metadata .item:nth-child(odd) {
      border-right: 0.5px solid #e0ddf0;
    }
    .metadata .item strong {
      color: var(--indaws-blue-lilac);
      font-weight: 700;
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.1rem;
    }

    /* ── PDF: Inline Code ── */
    code {
      font-family: 'Courier New', Courier, monospace;
      background-color: #f0eeff;
      color: var(--indaws-blue-space);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.85em;
    }

    /* ── PDF: Timeline ── */
    .timeline {
      position: relative;
      padding-left: 1.8rem;
      margin: 1.2rem 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--indaws-blue-lilac);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 1.2rem;
      padding-left: 0.8rem;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -1.45rem;
      top: 0.3rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--indaws-blue-lilac);
      border: 2px solid var(--indaws-white);
    }

    /* ── Utility: Text Alignment ── */
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .text-accent { color: var(--indaws-warm-yellow); font-weight: 700; }
    .text-lilac { color: var(--indaws-blue-lilac); font-weight: 600; }
  </style>
</head>
<body>

  <!-- Header: Logo aligned left on dark background -->
  <header class="header">
    <div class="container">
      <img src="../logos/logotipo-indaws-color-white-gradient_blue.svg"
           alt="Indaws" class="header-logo">
      <!-- Navigation or additional header content here -->
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      {{CONTENT}}
    </div>
  </main>

  <!-- Footer: Logo aligned left on dark background -->
  <footer class="footer">
    <div class="container">
      <img src="../logos/logotipo-indaws-color-white-gradient_blue.svg"
           alt="Indaws" class="footer-logo">
      <span>&copy; {{YEAR}} Indaws. Todos los derechos reservados.</span>
    </div>
  </footer>

</body>
</html>
