<!--
  PATTERN: tab selector → panel (tabs). Hook class: s_iw_tabs
  Behavior: a LIST of options on one side; selecting one changes the PANEL on the other side
  (title + text + visual). The active option is highlighted (here: a line that grows + brand color).
  AGNOSTIC content: fill each panel with anything (image, form, chart, text…).

  MECHANICS — NATIVE Bootstrap tabs, NO custom JS:
    - Each option is a <button class="nav-link" data-bs-toggle="tab" data-bs-target="#panelId">.
    - Each panel is a <div class="tab-pane" id="panelId">. One starts with `show active`.
    - Bootstrap (already loaded on Odoo's frontend) handles the show/hide and adds/removes the `.active` class
      on the active button. Do NOT write JS: just these data-attrs + CSS for the look.
    - build_page_arch PRESERVES `data-bs-*`, `id`, `role`, classes and `<button>` (it only strips `data-oe-*`,
      inline `<script>/<style>` and `position:fixed|sticky`). The active-state CSS is INJECTED.

  ACTIVE STATE (the brand "underline/line") — styled via CSS, not inline:
    - Put a <span class="iw-tab-dash"> inside the button; in `.nav-link.active .iw-tab-dash` you enlarge it
      and give it the brand color. As the line grows, the label shifts → the design's effect.
    - Highlight alternatives: background, left-border, bold… change it in the CSS, not in the markup.

  RESPONSIVE: on mobile the list (col-12/col-lg-4) sits on top and the panel below; on `lg+`, side by side.
  Vertical or horizontal: it's just the direction of the `.nav` (flex-column vs not). Here vertical.

  === CSS to inject ONCE (custom_code_footer or ir.asset) — hardcode the BRAND hex (see GOTCHA #15) ===
  .s_iw_tabs .nav-link{display:flex;align-items:center;gap:16px;width:100%;padding:9px 0;border:0;border-radius:0;background:none;color:#111;font-weight:600;letter-spacing:.05em;text-align:left;}
  .s_iw_tabs .nav-link .iw-tab-dash{display:inline-block;height:2px;width:26px;background:#111;flex-shrink:0;transition:width .25s ease,background-color .25s ease;}
  .s_iw_tabs .nav-link:hover{color:#5EBFBA;}
  .s_iw_tabs .nav-link.active{color:#5EBFBA;background:none;}
  .s_iw_tabs .nav-link.active .iw-tab-dash{width:88px;background:#5EBFBA;}

  Contract: `.s_iw_tabs` wraps the row. `.nav[role=tablist]` with buttons `data-bs-target="#id"`;
  `.tab-content` with `.tab-pane#id`. One button `.active` + its pane `.show active` at the start.
  Unique IDs per instance (if you put two selectors on the page, don't repeat ids).

  PERF: a hidden `.tab-pane` is `display:none` but its <img>s STILL DOWNLOAD at page load.
  Give every <img> inside a NON-active pane `loading="lazy" decoding="async"` — the browser then
  fetches it only when the pane is shown. The active pane's image loads normally.
-->
<div class="s_iw_tabs row g-4 g-lg-5" data-name="Selector with panel">
  <div class="col-lg-4">
    <div class="nav flex-column" role="tablist" aria-orientation="vertical">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#iwtab-1" type="button" role="tab"><span class="iw-tab-dash"></span><span>Option 1</span></button>
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#iwtab-2" type="button" role="tab"><span class="iw-tab-dash"></span><span>Option 2</span></button>
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#iwtab-3" type="button" role="tab"><span class="iw-tab-dash"></span><span>Option 3</span></button>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="tab-content">
      <div class="tab-pane fade show active" id="iwtab-1" role="tabpanel">
        <div class="row align-items-center g-4">
          <div class="col-md-6"><h3 class="fw-bold mb-3">{{TITLE 1}}</h3><p>{{TEXT 1}}</p></div>
          <div class="col-md-6"><div class="wc-ph rounded-4 w-100" style="aspect-ratio:1/1;"></div></div>
        </div>
      </div>
      <div class="tab-pane fade" id="iwtab-2" role="tabpanel">
        <div class="row align-items-center g-4">
          <div class="col-md-6"><h3 class="fw-bold mb-3">{{TITLE 2}}</h3><p>{{TEXT 2}}</p></div>
          <div class="col-md-6"><div class="wc-ph rounded-4 w-100" style="aspect-ratio:1/1;"></div></div>
        </div>
      </div>
      <div class="tab-pane fade" id="iwtab-3" role="tabpanel">
        <div class="row align-items-center g-4">
          <div class="col-md-6"><h3 class="fw-bold mb-3">{{TITLE 3}}</h3><p>{{TEXT 3}}</p></div>
          <div class="col-md-6"><div class="wc-ph rounded-4 w-100" style="aspect-ratio:1/1;"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
