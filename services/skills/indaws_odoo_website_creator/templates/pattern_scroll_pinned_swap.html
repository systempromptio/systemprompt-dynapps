<!--
  PATTERN: scroll-pinned swap / scrollytelling (no module). Hook class: s_iw_scrollswap
  Behavior: a stage is PINNED (sticky) while you scroll VERTICALLY; the content of the active step
  (text) + a VISUAL change in place, in sync. The VISUAL is AGNOSTIC (a phone, an <img>,
  a chart…). No autoplay; it's driven by scroll.

  RESPONSIVE — ALL-DEVICE (pin+swap at ALL widths, does NOT degrade to stacked):
    - Desktop/tablet (md+): text on one side + visual on the other (2 columns), both pinned, swapping.
    - Mobile (<md): SAME pin+swap, without un-pinning. What makes it fit is NOT turning off the pin, but
      SHRINKING the visual per breakpoint (max-width ~150px mobile → 210 sm → 280 md) so visual+text
      coexist in the viewport while pinned. The stage is sticky at all widths (in
      Odoo it works because #wrapwrap uses overflow-x:clip). Validated all-device on a real home page.

  KEYS (why the old degraded version broke on mobile):
    1. Do NOT add any @media that sets `.iw-sticky-stage`/`.iw-step` to `static`: the pin applies at ALL
       widths. If you un-pin on mobile, the responsive breaks.
    2. What makes it fit on mobile is the SMALL `max-width` of the visual (150→210→280 per breakpoint),
       not un-pinning or hiding steps.
    3. The stage column must STRETCH: use `align-items-center`/`align-items-stretch` on the row,
       NEVER `align-items-start`, or the sticky has no travel and there's no swap.
    4. It works because Odoo's `#wrapwrap` uses `overflow-x:clip` → `position:sticky` applies at all widths.
    5. LONG TEXT on mobile (paragraphs, not 3 words): the `.iw-step` items are `position:absolute` CENTERED
       (`justify-content:center`) inside a fixed-height `.iw-text-stage`; if the content EXCEEDS that height
       it OVERFLOWS UPWARD and OVERLAPS the visual (which on mobile sits ON TOP of the text). Fix it WITHOUT
       un-pinning: at `<768px` TOP-align the steps (`justify-content:flex-start` → the text grows
       DOWNWARD, never against the visual), raise the `min-height` of `.iw-text-stage` and shrink the visual a bit.
       See the `@media(max-width:767.98px)` in the CSS. (Don't confuse this with un-pinning: the pin and swap continue.)

  Mechanics:
    - .iw-sticky-stage (sticky) contains: steps (.iw-step absolutely positioned, only .active visible, faded) +
      the visual (.iw-screen, only .active displayed).
    - invisible .iw-trigger (~85vh) provide the scroll; whichever crosses the center activates the .iw-step and .iw-screen of its index.
    - sticky in injected CSS (never inline; build_page_arch strips position:sticky).

  ⚠️ COMMON FAILURE — injecting ONLY one of the two blocks. This pattern needs TWO injected pieces:
    (a) the CSS (sticky + visual max-width per breakpoint) and (b) the JS (IntersectionObserver that does
    the swap). If the CSS is missing, there's no pin; if the JS is missing, there's no step change → you see a long list
    with all the steps at once. It really happened on a real home page (`s_iw_scrollphone`): the footer only
    had one block, the other was missing → it had to be added afterward. VERIFY in the browser (mobile AND
    desktop) that it really pins and changes. And when deploying to another instance, copy ALL the blocks
    the page uses from the footer (not just one).

  Contract: data-iw-trigger=i → activates data-iw-step=i and data-iw-screen=i. Starts with i=0 .active.
  Neutral placeholders: explicit grey (`.wc-ph{background:#e9ecef}`), NOT `bg-light` (which is a palette color).

  === CSS to inject ONCE — pin+swap ALL-DEVICE (NO @media that turns off the pin) ===
  .s_iw_scrollswap .iw-scroller{position:relative;}
  .s_iw_scrollswap .iw-sticky-stage{position:sticky;top:80px;min-height:calc(100vh - 100px);min-height:calc(100dvh - 100px);display:flex;align-items:center;}
  /* ^ the dvh line fixes mobile Safari (100vh includes the collapsed URL bar → stage taller than
     the visible screen); browsers without dvh keep the 100vh line. Keep BOTH, in this order. */
  .s_iw_scrollswap .iw-trigger{height:85vh;}
  /* the VISUAL shrinks on mobile and grows per breakpoint → visual+text fit while pinned */
  .s_iw_scrollswap .iw-visual{max-width:150px;}                 /* mobile (phone mockup; raise it if your visual is landscape) */
  @media(min-width:768px){.s_iw_scrollswap .iw-visual{max-width:210px;}}
  @media(min-width:992px){.s_iw_scrollswap .iw-visual{max-width:280px;}}
  .s_iw_scrollswap .iw-text-stage{position:relative;min-height:200px;}
  @media(min-width:992px){.s_iw_scrollswap .iw-text-stage{min-height:340px;}}
  .s_iw_scrollswap .iw-step{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .4s ease;pointer-events:none;}
  .s_iw_scrollswap .iw-step.active{opacity:1;transform:none;pointer-events:auto;}
  .s_iw_scrollswap .iw-screen{display:none;}  .s_iw_scrollswap .iw-screen.active{display:block;}
  /* LONG TEXT on mobile: top-align the steps (they grow DOWNWARD, don't invade the visual) + taller box +
     slightly smaller visual. Does NOT touch position → the pin+swap continues at all widths (see KEY 5). */
  @media(max-width:767.98px){
    .s_iw_scrollswap .iw-visual{max-width:140px;}
    .s_iw_scrollswap .iw-text-stage{min-height:380px;}
    .s_iw_scrollswap .iw-step{justify-content:flex-start;}
  }
  /* PERF/a11y: swap becomes instant (no fade/slide) for reduced-motion users; pin+swap still work */
  @media (prefers-reduced-motion: reduce){
    .s_iw_scrollswap .iw-step{transition:none;transform:none;}
  }

  === JS to inject ONCE ===
  (function(){function init(){document.querySelectorAll('.s_iw_scrollswap').forEach(function(sec){
   var tr=sec.querySelectorAll('[data-iw-trigger]'),st=sec.querySelectorAll('[data-iw-step]'),sc=sec.querySelectorAll('[data-iw-screen]');
   if(!tr.length||!('IntersectionObserver' in window))return;
   function setA(i){st.forEach(function(s){s.classList.toggle('active',s.getAttribute('data-iw-step')===i);});sc.forEach(function(s){s.classList.toggle('active',s.getAttribute('data-iw-screen')===i);});}
   var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){setA(e.target.getAttribute('data-iw-trigger'));}});},{rootMargin:'-50% 0px -50% 0px',threshold:0});
   tr.forEach(function(t){io.observe(t);});});}
   if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);})();

  Placeholders: {{TITLE}}, {{SUBTITLE}}. Repeat .iw-step and add a .iw-screen + .iw-trigger of the same index.
-->
<section class="s_iw_scrollswap pt48 pb48" data-snippet="s_iw_scrollswap" data-name="{{TITLE}}">
  <div class="container">
    <h2 class="fw-bold text-center mb-2 text-primary">{{TITLE}}</h2>
    <p class="text-center mb-3 mx-auto" style="max-width:700px;">{{SUBTITLE}}</p>
  </div>
  <div class="iw-scroller">
    <div class="iw-sticky-stage">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-12 col-md-6 order-2 order-md-1">
            <div class="iw-text-stage">
              <div class="iw-step active" data-iw-step="0"><h3 class="fw-bold text-primary">Step 1</h3><p>Text for step 1.</p></div>
              <div class="iw-step" data-iw-step="1"><h3 class="fw-bold text-primary">Step 2</h3><p>Text for step 2.</p></div>
            </div>
          </div>
          <div class="col-12 col-md-6 order-1 order-md-2">
            <!-- VISUAL (agnostic: phone, <img>, chart…). Here a neutral frame with screens that change. -->
            <div class="iw-visual mx-auto rounded-4 overflow-hidden shadow-sm" style="position:relative;aspect-ratio:4 / 3;background:#fff;">
              <div class="iw-screen active" data-iw-screen="0" style="position:absolute;inset:0;"><div class="d-flex h-100 align-items-center justify-content-center wc-ph fw-bold text-primary">Visual 1</div></div>
              <div class="iw-screen" data-iw-screen="1" style="position:absolute;inset:0;"><div class="d-flex h-100 align-items-center justify-content-center wc-ph fw-bold text-primary">Visual 2</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="iw-trigger" data-iw-trigger="0"></div>
    <div class="iw-trigger" data-iw-trigger="1"></div>
  </div>
</section>
