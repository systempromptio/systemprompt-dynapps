<!--
  PATTERN: decorative spinning/oscillating dome (half-sphere dome). Hook class: s_iw_globe
  Behavior: a circular/spherical image (dotted globe, planet, disc…) is shown as HALF a sphere
  (a dome) peeking out from an edge, with a gentle spin/oscillation. Decorative, behind the content.

  TWO TECHNIQUES (reusable separately):

  1) HALF sphere via MASK (you don't crop the PNG): a wrapper with `overflow:hidden` whose HEIGHT is HALF
     the width of the image → only the top half is visible. The <img> goes full width (height:auto), so its
     CENTER lands on the BOTTOM EDGE of the wrapper. When rotating with `transform-origin:50% 50%`, the dome spins on
     that edge → it looks like a real globe spinning (not a disc). Place it `right`/`left`/centered as you like, full-bleed.

  2) OSCILLATE instead of spinning 360° (key with 2D renders): a globe PNG is a FLAT render — when spun 360°
     it ends up showing the "empty"/asymmetric face (the area with no dots). If you do NOT want that face to appear, do NOT use
     a full spin: use a gentle OSCILLATION (`±30°`, ease-in-out) that always keeps the good band on top.
     If you do want a full turn, `rotate(0→360deg)` linear (but expect to see the whole sphere).

  build_page_arch KEEPS `transform`, `animation`, `overflow`, `opacity` inline (it only removes position
  fixed|sticky, <script>/<style> and on*). The @keyframes/animation is INJECTED (custom_code_footer or ir.asset).

  SCOPE NOTE: this is a "live" 2D globe, NOT a real 3D one. An **Auto-rotating 3D Globe** (spinning the sphere
  showing the correct map at each angle, scrollytelling) is WebGL MODULE development (three.js/globe.gl with an
  equirectangular texture) or a pre-rendered VIDEO/sprite of the spinning globe. Detect it and offer it as a higher
  Tier; don't fake it with the 2D spin.

  === CSS to inject ONCE (custom_code_footer or ir.asset) ===
  @keyframes iw-globe-spin{0%{transform:rotate(-30deg);}50%{transform:rotate(30deg);}100%{transform:rotate(-30deg);}}
  .iw-globe-spin{animation:iw-globe-spin 26s ease-in-out infinite;transform-origin:50% 50%;will-change:transform;}
  .iw-globe-spin.iw-idle{animation-play-state:paused;}
  @media (prefers-reduced-motion: reduce){.iw-globe-spin{animation:none;}}
  /* Alternative full turn (you will see the whole sphere): 0%{rotate(0)} 100%{rotate(360deg)} + animation ... linear */

  === PERF JS to inject ONCE — pause the spin while off-screen (recommended) ===
  The infinite spin costs CPU/battery even when scrolled out of view; this pauses it via `.iw-idle`
  (identical look on screen; state self-heals on load, so a builder-Save persisting it is harmless):
  (function(){function init(){var els=document.querySelectorAll('.iw-globe-spin');
   if(!els.length||!('IntersectionObserver' in window))return;
   var io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('iw-idle',!e.isIntersecting);});},{rootMargin:'100px'});
   els.forEach(function(el){io.observe(el);});}
   if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);})();

  PERF (image): it's decorative → `decoding="async" fetchpriority="low"` so it never competes with
  real content (LCP). Add `loading="lazy"` too if the dome sits below the fold; if it's in the hero,
  keep it eager (low priority already keeps it out of the critical path).

  Contract: `.s_iw_globe` = mask wrapper (position:absolute, overflow:hidden, height ≈ width/2). Inside, the
  <img class="iw-globe-spin"> at `width:100%;height:auto`. `aria-hidden="true"` + `alt=""` (it's decorative).
  Hide it on mobile if it covers the text (`d-none d-md-block`) and lower the opacity so it stays a background.
-->
<div class="s_iw_globe position-absolute d-none d-md-block" aria-hidden="true"
     style="right:-4%;bottom:0;width:min(1000px,62vw);height:min(500px,31vw);overflow:hidden;z-index:0;pointer-events:none;">
  <img src="/web/image/{{GLOBE_ATTACHMENT_ID}}" alt="" class="iw-globe-spin d-block" style="width:100%;height:auto;opacity:.45;" decoding="async" fetchpriority="low"/>
</div>
