<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== PALETA DYNAPPS · extendida (digital) ===== */
  --midnight:#050543; --deep:#030330; --surface:#070757;
  --violet:#951CF3; --carmine:#FF575D; --orange:#FF7759; --tangerine:#FF7E23;
  --snow:#F5F5FA; --off-white:#F6F5F8;
  --tw:rgba(255,255,255,.92); --td:rgba(255,255,255,.56); --tdd:rgba(255,255,255,.30);
  --lm:#7272A8;
  --grey-100:#E8E7EC; --grey-200:#CDCBD4; --grey-400:#9290A6; --grey-600:#65637A;
  --grad:linear-gradient(45deg,var(--violet) 0%,var(--carmine) 52%,var(--orange) 100%);
  --grad-h:linear-gradient(90deg,var(--violet) 0%,var(--carmine) 52%,var(--orange) 100%);
  --ok:#0FBF8F;        /* semáforo: el verde no existe en la marca */
  --amber:#FFB03D;     /* PRIORITARIA · tinte de Sunset Tangerine */
  /* superficie · NOCHE */
  --bg:var(--midnight); --bg2:var(--deep);
  --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.07);
  --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.22);
  --t1:var(--tw); --t2:var(--td); --t3:var(--tdd); --track:rgba(255,255,255,.13);
  --chrome:rgba(5,5,67,.92);
}
:root[data-t="dia"]{
  --bg:var(--snow); --bg2:#fff;
  --panel:#fff; --panel2:rgba(5,5,67,.05);
  --card:#fff; --line:var(--grey-100); --line2:var(--grey-200);
  --t1:var(--midnight); --t2:var(--grey-600); --t3:var(--grey-400); --track:var(--grey-100);
  --chrome:rgba(255,255,255,.95);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--t1);
  font-family:'Readex Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s}
body{background:
  radial-gradient(1200px 660px at 6% -10%,rgba(149,28,243,.15),transparent 62%),
  radial-gradient(1000px 560px at 98% 106%,rgba(255,126,35,.10),transparent 62%),var(--bg)}
:root[data-t="dia"] body{background:
  radial-gradient(1000px 560px at 6% -10%,rgba(149,28,243,.07),transparent 62%),
  radial-gradient(900px 500px at 98% 106%,rgba(255,126,35,.07),transparent 62%),var(--bg)}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ BARRA SUPERIOR ============ */
#top{position:fixed;inset:0 0 auto 0;height:58px;z-index:60;display:flex;align-items:center;
  gap:12px;padding:0 18px;background:var(--chrome);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
#top:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad-h);opacity:.45}
.logo{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:14.5px;white-space:nowrap}
.ap{width:15px;height:15px;border-radius:50%;background:var(--grad);display:inline-block;transform:translateY(2px)}
.logo em{font-style:normal;font-weight:400;color:var(--t2);font-size:13px}
.grp{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.views{margin-left:auto}
.v,.tb{all:unset;height:31px;padding:0 15px;border-radius:9px;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;font-size:13px;font-weight:500;color:var(--t1);position:relative}
.tb{min-width:33px;padding:0 11px}
.v:hover,.tb:hover{background:var(--line)}
.v.on,.tb.on{background:var(--violet);color:#fff}
.tb .n{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;
  background:var(--carmine);color:#fff;font-size:10.5px;font-weight:600;display:none;
  align-items:center;justify-content:center;padding:0 4px}
.pr{all:unset;height:31px;padding:0 15px;border-radius:9px;background:var(--violet);color:#fff;
  font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pr:hover{background:#A93BFF}
svg.ic{width:16px;height:16px;display:block}

/* ============ ZONA PRINCIPAL ============ */
#zone{position:fixed;inset:58px 0 52px 0;overflow:hidden}
#scroll{position:absolute;inset:0;overflow:auto;padding:24px 26px 40px}
#board{max-width:1660px;margin:0 auto;zoom:1}

/* --- título --- */
.hero{border-radius:22px;padding:26px 32px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--deep),#13136f);border:1px solid rgba(255,255,255,.10)}
.hero:before{content:'';position:absolute;inset:0;
  background:radial-gradient(760px 280px at 93% 0%,rgba(255,126,35,.20),transparent 60%),
             radial-gradient(540px 250px at 3% 100%,rgba(149,28,243,.30),transparent 62%)}
.hero>*{position:relative}
.hero .k{font-size:10.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--tangerine)}
.hero h1{margin:8px 0 0;font-size:33px;font-weight:700;line-height:1.05;color:#fff}
.hero h1 em{font-style:normal;color:var(--tangerine)}
.hero .meta{margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.64)}
.hero .meta b{color:var(--tangerine);font-weight:600}
.hero .team{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.who{font-size:12px;padding:6px 14px;border-radius:100px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.20);color:#fff}
.hkpi{position:absolute;right:32px;top:26px;display:flex;text-align:right}
.hkpi div{padding-left:24px;margin-left:24px;border-left:1px solid rgba(255,255,255,.16)}
.hkpi div:first-child{border:0;margin:0;padding:0}
.hkpi b{display:block;font-size:25px;font-weight:600;color:#fff;line-height:1}
.hkpi s{display:block;text-decoration:none;font-size:11px;color:rgba(255,255,255,.56);margin-top:5px}

/* --- GANTT --- */
.gantt{margin-top:20px;border-radius:22px;background:var(--panel);border:1px solid var(--line);
  padding:20px 26px 22px}
.gh{display:flex;align-items:center;gap:14px}
.gh h3{margin:0;font-size:15.5px;font-weight:600}
.gh .sub{font-size:11.5px;color:var(--t3);letter-spacing:.16em;text-transform:uppercase}
.gh .rt{margin-left:auto;display:flex;gap:6px}
.mini{all:unset;font-size:11.5px;padding:7px 13px;border-radius:100px;border:1px solid var(--line);
  color:var(--t2);background:var(--panel2)}
.mini:hover{border-color:var(--violet);color:var(--t1)}
.grid{position:relative;margin-top:14px;--gut:436px}
.months{position:relative;height:15px;margin-left:var(--gut);margin-right:56px;border-bottom:1px solid var(--line);padding-bottom:7px}
.months .today{transform:none}
.months span:not(.today){position:absolute;font-size:10.5px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--t3);transform:translateX(2px)}
.hitos{position:relative;margin-left:var(--gut);margin-right:56px;height:24px;margin-top:5px}
.hito{position:absolute;top:0}
.hito i{position:absolute;left:-5px;top:2px;width:9px;height:9px;transform:rotate(45deg);
  border:1.5px solid var(--tangerine);font-style:normal}
.hito.d i{background:var(--tangerine)}
.hito b{position:absolute;left:0;top:14px;font-size:9px;color:var(--t3);font-weight:500;transform:translateX(-50%)}
.row{display:flex;align-items:center;height:38px;border-radius:10px;padding:0 0 0 4px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.open{border-radius:12px 12px 0 0}
.srow.inz,.zsep.inz{border-radius:0}
.zclose{height:10px;border-radius:0 0 12px 12px;margin-bottom:12px}
.plus{all:unset;box-sizing:border-box;width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
  color:var(--t1);flex:none;background:var(--panel2)}
.plus:hover{background:var(--violet);border-color:var(--violet);color:#fff}
.sdot{width:11px;height:11px;border-radius:50%;flex:none;margin:0 11px}
.rn{font-size:14px;font-weight:600;width:198px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:11.5px;color:var(--t2);width:76px;text-align:right;flex:none}
.rd{all:unset;font-size:10.5px;padding:5px 0;width:77px;box-sizing:border-box;display:inline-block;text-align:center;border-radius:100px;border:1px solid var(--line2);
  color:var(--t2);margin-left:10px;flex:none}
.rd:hover{background:var(--violet);border-color:var(--violet);color:#fff}
.track{flex:1;height:38px;position:relative;margin-left:14px}
.bar{position:absolute;top:11px;height:16px;border-radius:5px;cursor:pointer}
.bar.thin{top:14px;height:10px}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--carmine);z-index:2}
.todaystrip{position:relative;height:22px;margin-left:var(--gut);margin-right:56px}
.todaylbl{position:absolute;top:0;transform:translateX(-50%);font-size:9.5px;font-weight:600;
  background:var(--carmine);color:#fff;padding:2px 6px;border-radius:5px;white-space:nowrap;z-index:3}
.srow{display:flex;align-items:center;height:29px;padding-left:46px;border-radius:8px;cursor:pointer}
.srow:hover{filter:brightness(1.12)}
:root[data-t="dia"] .srow:hover{filter:brightness(.96)}
.srow .zt{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--t3);
  width:44px;flex:none;text-transform:uppercase}
.sn{font-size:12px;color:var(--t1);width:332px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx{font-size:10.5px;color:var(--t3);width:56px;text-align:right;flex:none}
.zsep{display:flex;align-items:center;gap:10px;padding:7px 0 3px 46px}
.zsep b{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.zsep i{flex:1;height:1px;background:var(--line);font-style:normal}
.zsep span{font-size:10px;color:var(--t3)}

/* --- PIPELINE DEV --- */
.pipew{margin-top:20px}
.pipebody{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1250px){.pipebody{grid-template-columns:repeat(2,1fr)}}
.pl9{border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:180px}
.pl9h{padding:10px 14px;border-bottom:2px solid;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pl9h .n{font-size:10.5px;background:var(--panel2);border-radius:100px;padding:2px 9px;color:var(--t2);font-weight:600}
.pl9b{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:62vh}
.ptc{border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--card);cursor:pointer}
.ptc:hover{border-color:var(--line2)}
.ptc.sf-b{border-left-color:#2F6FED}.ptc.sf-g{border-left-color:var(--ok)}.ptc.sf-o{border-left-color:var(--tangerine)}.ptc.sf-r{border-left-color:var(--carmine)}
.ptc .tt9{font-size:12px;font-weight:600;line-height:1.3}
.ptc .pp9{font-size:10px;color:var(--t3);margin-top:3px}
.ptc .mm9{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:9.5px;color:var(--t2)}
.ptc .zc9{font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2)}
.pipleg{grid-column:1/-1;font-size:10.5px;color:var(--t2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.prosec{grid-column:1/-1;border:1px solid rgba(11,132,132,.5);border-radius:14px;background:rgba(15,163,163,.06)}
.prosec summary{cursor:pointer;padding:12px 16px;font-size:12px;font-weight:700;color:#0FA3A3;list-style:none}
.prosec summary::-webkit-details-marker{display:none}
.prosec summary::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}
.prosec[open] summary::before{transform:rotate(90deg)}
.prosec .prog9{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:2px 14px 14px}
@media(max-width:1250px){.prosec .prog9{grid-template-columns:repeat(2,1fr)}}
.ptabs{grid-column:1/-1;display:flex;gap:8px}
.ptabs .pt{font:inherit;font-size:11.5px;font-weight:600;padding:6px 16px;border-radius:20px;cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--t2)}
.ptabs .pt:hover{color:var(--t1);border-color:var(--t3)}
.ptabs .pt.on{background:var(--violet);border-color:var(--violet);color:#fff}
.pah9{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:8px 2px 1px;opacity:.9}
.pci{padding:7px 10px;border-radius:9px;background:var(--card);border:1px solid var(--line);cursor:pointer;
  font-size:11.5px;line-height:1.35}
.pci:hover{border-color:var(--violet)}
.pci .mt{display:flex;gap:8px;justify-content:space-between;color:var(--t3);font-size:9.5px;margin-top:3px}
.pci .hi9{font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:5px;margin-right:6px;
  background:var(--violet);color:#fff;vertical-align:1px}
.pci .hi9.alta9{background:var(--carmine)}
.pipebody.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1250px){.pipebody.c3{grid-template-columns:repeat(2,1fr)}}
.ptool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ptool input{font:inherit;font-size:12px;padding:8px 16px;border-radius:100px;border:1px solid var(--line2);
  background:var(--card);color:var(--t1);width:300px;outline:none}
.ptool input:focus{border-color:var(--violet)}
.ptool input::placeholder{color:var(--t3)}
.ptool .glb{font-size:12px;font-weight:600;color:var(--t2);margin-left:12px}
.ptool .pt.sm{padding:8px 18px;font-size:11.5px;font-weight:700;border-radius:100px;
  background:var(--card);border:1px solid var(--line2);color:var(--t1)}
.ptool .pt.sm:hover{border-color:var(--t3);color:var(--t1)}
.ptool .pt.sm.on{background:var(--violet);border-color:var(--violet);color:#fff}
:root[data-t="dia"] .ptool .pt.sm{box-shadow:0 1px 3px rgba(5,5,67,.08)}

/* --- VISTA RESUMEN --- */
#sumw{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.sutrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1250px){.sutrow{grid-template-columns:repeat(2,1fr)}}
.sut{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:16px 18px}
.sut s{display:block;text-decoration:none;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3)}
.sut b{display:block;font-size:29px;font-weight:700;margin-top:6px;line-height:1.1}
.sut u{display:block;text-decoration:none;font-size:11px;color:var(--t2);margin-top:5px}
.sut .spark{margin-top:12px;height:6px;border-radius:4px;background:var(--track);position:relative}
.sut .spark i{display:block;height:100%;border-radius:4px;background:#0FA36B}
.sut .spark em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t1);border-radius:1px}
.sumgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media(max-width:1250px){.sumgrid{grid-template-columns:1fr}}
.chpanel.full{grid-column:1/-1}
.heatrow{display:flex;gap:10px;padding:2px 0 0;flex-wrap:wrap}
.hcell{flex:1;min-width:84px;max-width:130px;height:86px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent}
.hcell b{font-size:22px;font-weight:700;line-height:1}
.hcell s{font-size:10px;text-decoration:none;opacity:.85;text-align:center}
.hcell.venc{background:var(--carmine);color:#fff}
.hcell.att{background:var(--tangerine);color:#fff}
.hcell.prog{background:var(--lm);color:#fff}
.hcell.gok{background:var(--ok);color:#fff}
.hcell.empty{background:transparent;border:1.5px dashed var(--line2);color:var(--t3)}
.chpanel{border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.chpanel.ok9{color:var(--ok);font-size:12.5px;font-weight:600}
.chh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chh h4{margin:0;font-size:13px}
.chh .sub9{font-size:10.5px;color:var(--t3)}
.lgd{font-size:10px;color:var(--t2);display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap}
.lgd i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.chn{font-size:9.5px;color:var(--t3);margin-top:10px}
.mrow{display:grid;grid-template-columns:12px 150px 1fr 86px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.mrow:hover .ml{color:var(--t1)}
.mdot{width:10px;height:10px;border-radius:3px;flex:none}
.ml{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{height:14px;display:flex;gap:2px;background:var(--track);border-radius:4px;position:relative}
.mbar i{height:100%}
.mbar i:first-child{border-radius:4px 0 0 4px}
.mbar i:nth-last-child(2){border-radius:0 4px 4px 0}
.mbar em{position:absolute;top:-5px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--t1);transform:translateX(-4px)}
.mv{font-size:10.5px;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums}
.mesw{display:flex;gap:12px;align-items:flex-end;min-height:158px;padding-top:4px}
.mcol{flex:1;max-width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
.mstk{width:26px;display:flex;flex-direction:column-reverse;gap:2px}
.mstk i{width:100%;border-radius:2px}
.mstk i:last-child{border-radius:4px 4px 2px 2px}
.mct{font-size:10.5px;color:var(--t1);font-variant-numeric:tabular-nums}
.mlb{font-size:9.5px;color:var(--t3);white-space:nowrap}
.mlb.venc{color:var(--carmine);font-weight:700}
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donutbig{font-size:34px;font-weight:600;fill:var(--t1)}
.donutctr{font-size:12px;fill:var(--t2)}
.dlegend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.dlegend .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t2)}
.dlegend .row i{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.dlegend .row b{color:var(--t1);font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.hitl{position:relative;height:74px;margin-top:6px}
.hitl .ln{position:absolute;left:0;right:0;top:32px;height:2px;background:var(--track);border-radius:1px}
.hitd{position:absolute;top:26px;width:12px;height:12px;transform:rotate(45deg);border-radius:3px;margin-left:-6px}
.hitlb{position:absolute;top:48px;font-size:9px;color:var(--t3);transform:translateX(-50%);white-space:nowrap}
.hitlb.up{top:8px}
.hitgl{position:absolute;top:12px;bottom:12px;width:0;border-left:2px dashed var(--carmine);opacity:.7}
.blqrow{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:11.5px}
.blqrow:hover{background:var(--panel2)}
.blqrow .bk9{font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--carmine);color:#fff;flex:none}
.blqrow .bk9.it9{background:var(--tangerine)} /* antes #E06A10: unificado con el naranja único del board */
.blqrow s{text-decoration:none;color:var(--t3);font-size:10px;margin-left:auto;white-space:nowrap;flex:none}
.mcol{cursor:pointer}
.mcol:hover .mlb{color:var(--t1)}
#ckPop .lst9{display:flex;gap:9px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
#ckPop .lst9:hover{background:var(--panel2)}

<script>
/*__DATA__*/

/* rampa de tonos sobre el degradado oficial de marca */
const STOPS=[[149,28,243],[255,87,93],[255,119,89],[255,126,35]];
function ramp(k,n){
  const t=k/(Math.max(n-1,1))*(STOPS.length-1), i=Math.min(STOPS.length-2,Math.floor(t)), f=t-i;
  return '#'+STOPS[i].map((v,j)=>Math.round(v+(STOPS[i+1][j]-v)*f).toString(16).padStart(2,'0')).join('');
}
AREAS.forEach((a,i)=>a.c=ramp(i,AREAS.length));

/* ===================== UTILIDADES ===================== */
const D0=new Date(D_INI), D1=new Date(D_FIN), SPAN=D1-D0, DAY=864e5;
const NOW=new Date(TODAY);
const pc=d=>((new Date(d)-D0)/SPAN*100);
const fm=d=>{if(!d)return"—";const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)};
const LV={ok:'var(--ok)',naranja:'var(--tangerine)',rojo:'var(--carmine)',futuro:'var(--lm)',sindato:'var(--lm)'};
const CRST={sent:'enviada',received:'respondida',cancelled:'cancelada'};
const crState=c=>{const p=[];if(c.d)p.push(c.d+' en borrador');if(c.s)p.push(c.s+' enviada'+(c.s>1?'s':''));
  if(c.rc)p.push(c.rc+' respondida'+(c.rc>1?'s':''));return p.join(' · ')||'sin detalle'};
const LVT={ok:'En plazo',naranja:'Atención',rojo:'Desviada',futuro:'No iniciada',sindato:'Sin checklist'};
const ALVT={ok:'En plazo',naranja:'Atención',rojo:'Riesgo alto',futuro:'No iniciada',sindato:'Sin checklist'};

const ARCH=new Set();
try{(JSON.parse(localStorage.getItem('board-arch-'+PID)||'[]')).forEach(x=>ARCH.add(x))}catch(e){}
const saveArch=()=>{try{localStorage.setItem('board-arch-'+PID,JSON.stringify([...ARCH]))}catch(e){}};

function risk(t){
  const [id,,ini,fin,,us,st,,chk,done]=t;
  const real=chk[0]?chk[1]/chk[0]:0;
  if(done)return{lvl:'ok',txt:'Completada',exp:1,real:(chk[0]?real:1),blk:[]};
  const blk=[];
  if(!ini||!fin)blk.push({s:'Sin fechas planificadas',d:'No entra en el Gantt ni computa avance esperado.'});
  if(st==='Pendiente Cliente')blk.push({s:'Etapa: Pendiente Cliente',d:'El avance depende de una respuesta del cliente.'});
  if(st==='A planificar')blk.push({s:'Etapa: A planificar',d:'Sin hueco reservado en la planificación del equipo.'});
  if(!us.length)blk.push({s:'Sin responsable asignado',d:'Nadie la tiene en su cola de trabajo.'});
  if(!chk[0])blk.push({s:'Sin checklist',d:'Sin items validables no hay avance real que medir: el semáforo no la juzga.'});
  if(!ini||!fin)return{lvl:'naranja',txt:'Sin fechas',exp:0,real,blk};
  const a=new Date(ini), b=new Date(fin);
  const exp=NOW<=a?0:NOW>=b?1:(NOW-a)/(b-a);
  const gap=real-exp;
  let lvl,txt;
  if(NOW<a){lvl='futuro';txt='No iniciada'}
  else if(!chk[0]){lvl='sindato';txt='Sin checklist'}
  else if(real>=1){lvl='ok';txt='Completada'}
  else if(NOW>b){lvl='rojo';txt='Vencida sin cerrar'}
  else if(gap>=-.05){lvl='ok';txt='En plazo'}
  else if(gap>=-.20){lvl='naranja';txt='Atención'}
  else{lvl='rojo';txt='Desviada'}
  return{lvl,txt,exp,real,blk};
}
const live=a=>a.z.flatMap(z=>z.t).filter(t=>!ARCH.has(t[0]));
function areaLvl(ts){
  const l=ts.map(t=>risk(t).lvl);
  if(l.includes('rojo'))return'rojo';
  if(l.includes('naranja'))return'naranja';
  if(l.length&&l.every(v=>v==='futuro'))return'futuro';
  if(l.length&&l.every(v=>v==='futuro'||v==='sindato'))return'sindato';
  return'ok';
}
const allT=()=>AREAS.flatMap(a=>a.z.flatMap(z=>z.t));
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
const q=s=>document.querySelector(s);

/* pasos = los 18 bloques, en orden de proyecto */
const STEPS=[];

/* ===================== RENDER ===================== */
let view='general';
function board(){
  const T=allT(), n=T.length;
  const CK=sum(T,t=>t[8][0]), CKO=sum(T,t=>t[8][1]);
  const nCR=Object.values(CR).reduce((s,c)=>s+c.n,0);
  const nCRd=Object.values(CR).reduce((s,c)=>s+(c.d||0),0);
  const expAll=CK?Math.round(100*sum(T.filter(t=>t[2]&&t[3]),t=>risk(t).exp*t[8][0])/CK):0;
  const sinR=T.filter(t=>!t[5].length).length;
  const nRoj=T.filter(t=>risk(t).lvl==='rojo').length;
  const nNar=T.filter(t=>risk(t).lvl==='naranja').length;
  const showP=view==='pipe', showS=view==='sum';
  const showG=view!=='areas'&&!showP&&!showS, showC=view!=='gantt'&&!showP&&!showS, showH=view==='general', showR=view==='general';

  q('#board').innerHTML=`
  ${showH?`<div class="hero">
    <div class="k">Plan de proyecto · cronología</div>
    <h1>${PROJ.name}${PROJ.em?` <em>${PROJ.em}</em>`:''}</h1>
    <div class="meta">${fm(D_INI)} → ${fm(D_FIN)}${PROJ.golive?` · salida <b>${fm(PROJ.golive)}</b>`:''}</div>
    <div class="team">${EQUIPO.map(p=>`<span class="who">${p}</span>`).join('')}</div>
    <div class="hkpi">
      <div><b>${n}</b><s>tareas</s></div>
      <div><b>${AREAS.length}</b><s>áreas</s></div>
      <div><b>${CKO}/${CK}</b><s>items validados</s></div>
      ${HITOS.length?`<div><b>${HITOS.filter(h=>h[2]).length}/${HITOS.length}</b><s>hitos</s></div>`:''}</div>
  </div>`:''}

  ${showG?`<div class="gantt">
    <div class="gh"><h3>Cronología por área</h3><span class="sub">${MESES.length?MESES[0][1]+' → '+MESES[MESES.length-1][1]:''}</span>
      <div class="rt"><button class="mini" id="expAll">Desplegar todo</button>
      <button class="mini" id="colAll">Plegar todo</button></div></div>
    <div class="grid" id="grid"></div></div>`:''}

  ${showC?`<div class="slab">Áreas del proyecto · clica para ampliar</div>
    <div class="cards" id="cards"></div>`:''}

  ${showP?`<div class="pipew" id="pipew"></div>`:''}

  ${showS?`<div id="sumw"></div>`:''}

  ${showR?`<div class="riskrow">
    <span class="lb">Riesgos</span>
    <span class="rkv al"><b>${HALLAZGOS.filter(h=>h.lvl==='rojo').length}</b> altos</span>
    <span class="rkv wa"><b>${HALLAZGOS.filter(h=>h.lvl!=='rojo').length}</b> de atención</span>
    <span class="rkv"><b>${CKO}/${CK}</b> items validados · ${expAll}% esperado hoy</span>
    <span class="rkv sec"><b>${nCRd}</b> peticiones al cliente sin enviar</span>
    <span class="rkv sec"><b>${sinR}/${n}</b> sin responsable</span>
    <span class="rkv sec"><b>${nRoj} / ${nNar}</b> tareas desviadas / atención</span>
    <button class="rkmore" id="rkT">Ver el desglose</button></div>
   <div class="rkdet" id="rkD">${HALLAZGOS.map(h=>{
     const c=h.lvl==='rojo'?'var(--carmine)':'var(--tangerine)';
     return `<div class="rkc"><span class="tg" style="background:${c}">${h.lvl==='rojo'?'RIESGO ALTO':'ATENCIÓN'}</span>
       <h5>${h.t}</h5><p>${h.d}</p></div>`}).join('')}</div>`:''}`;

  if(showG)grid();
  if(showC)cards();
  if(showP)pipe();
  if(showS)resumen();
  if(showR){
    q('#rkT').onclick=()=>{const d=q('#rkD');d.classList.toggle('on');
      q('#rkT').textContent=d.classList.contains('on')?'Ocultar el desglose':'Ver el desglose'};
  }
  if(showG){
    q('#expAll').onclick=()=>{AREAS.forEach((a,i)=>OPEN.add(i));grid()};

function grid(){
  const tin=pc(TODAY)>=0&&pc(TODAY)<=100;
  let h=`<div class="todaystrip">${tin?`<span class="today" style="left:${pc(TODAY)}%"><span class="todaylbl">HOY ${fm(TODAY).slice(0,5)}</span></span>`:''}</div>
   <div class="months">${tin?`<span class="today" style="left:${pc(TODAY)}%"></span>`:''}${MESES.map(([d,m])=>`<span style="left:${pc(d)}%">${m}</span>`).join('')}</div>
   <div class="hitos">${tin?`<span class="today" style="left:${pc(TODAY)}%"></span>`:''}${HITOS.map(([d,nn,ok])=>
    `<div class="hito${ok?' d':''}" style="left:${pc(d)}%" title="Hito ${nn} · ${fm(d)}"><i></i><b>H${nn}</b></div>`).join('')}</div>`;
  AREAS.forEach((a,ai)=>{
    const ts=live(a), o=OPEN.has(ai), lv=areaLvl(ts);
    const dts=ts.filter(t=>t[2]&&t[3]);
    const s=dts.map(t=>t[2]).sort()[0], e=dts.map(t=>t[3]).sort().slice(-1)[0];
    const tint=o?`background:${a.c}14;box-shadow:inset 3px 0 0 ${a.c}`:'';
    h+=`<div class="row${o?' open':''}" data-r="${ai}" style="${o?`background:${a.c}24;box-shadow:inset 3px 0 0 ${a.c}`:''}">
      <button class="plus" data-p="${ai}" title="${o?'Plegar':'Desplegar'} ${a.n}">${o?'−':'+'}</button>
      <span class="sdot" style="background:${LV[lv]}" title="Salud: ${ALVT[lv]}"></span>
      <span class="rn" style="color:${a.c}">${ai+1}. ${a.n}</span>
      <span class="rm">${ts.length} tareas</span>
      <button class="rd" data-d="${ai}">Detalles</button>
      <span class="track">
        <span class="today" style="left:${pc(TODAY)}%"></span>
        ${s?`<span class="bar" style="left:${pc(s)}%;width:${pc(e)-pc(s)}%;background:${a.c};opacity:${o?.4:.95}"></span>`
           :`<span style="position:absolute;top:12px;left:2px;font-size:10.5px;color:var(--t3)">sin fechas planificadas</span>`}
      </span><span class="sx"></span></div>`;
    if(o)a.z.forEach((z,zi)=>{
      const zt=z.t.filter(t=>!ARCH.has(t[0]));
      if(!zt.length)return;
      const zi_t=sum(zt,t=>t[8][0]), zi_o=sum(zt,t=>t[8][1]);
      h+=`<div class="zsep inz" style="${tint}"><b style="color:${a.c}">${z.n}</b><i></i>
        <span class="zbar"><b style="width:${zi_t?(zi_o/zi_t*100).toFixed(0):0}%;background:${zi_o?'var(--tangerine)':'var(--lm)'}"></b></span>
        <span>${zi_o}/${zi_t} items · ${zt.length} tarea${zt.length>1?'s':''}</span></div>`;
      zt.forEach(t=>{
        const r=risk(t), cr=CR[t[0]];
        h+=`<div class="srow inz" data-t="${t[0]}" data-a="${ai}" style="${tint}">
          <span class="zt">${z.p}</span>
          <span class="sn">${t[1].replace(/^\[[^\]]+\]\s*/,'')}</span>
          <span class="track"><span class="today" style="left:${pc(TODAY)}%"></span>
          ${t[2]&&t[3]?`<span class="bar thin" style="left:${pc(t[2])}%;width:${pc(t[3])-pc(t[2])}%;
            background:${a.c};opacity:.92;outline:${r.lvl==='rojo'?'2px solid var(--carmine)':'none'}"></span>`
            :`<span style="position:absolute;top:8px;left:2px;font-size:10px;color:var(--t3)">sin fechas</span>`}
          </span>
          <span class="sx">${t[8][1]}/${t[8][0]}${cr?' · CR '+cr.n:''}</span></div>`;
      });
    });
    if(o)h+=`<div class="zclose" style="${tint}"></div>`;
  });
  q('#grid').innerHTML=h;
  q('#grid').querySelectorAll('[data-p]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();const i=+b.dataset.p;OPEN.has(i)?OPEN.delete(i):OPEN.add(i);grid()});
  q('#grid').querySelectorAll('[data-d]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();openSheet(+b.dataset.d)});
  q('#grid').querySelectorAll('.row').forEach(r=>r.onclick=()=>{
    const i=+r.dataset.r;OPEN.has(i)?OPEN.delete(i):OPEN.add(i);grid()});
  q('#grid').querySelectorAll('.srow').forEach(r=>r.onclick=()=>openSheet(+r.dataset.a,null,+r.dataset.t));
}

function cards(){

    const ts=live(a), lv=areaLvl(ts);
    const dts=ts.filter(t=>t[2]&&t[3]);
    const s=dts.map(t=>t[2]).sort()[0], e=dts.map(t=>t[3]).sort().slice(-1)[0];
    const cr=sum(ts,t=>CR[t[0]]?CR[t[0]].n:0);

      <div class="m">${ts.length} tareas · ${a.z.length} subbloque${a.z.length>1?'s':''} · ${sum(ts,t=>t[8][1])}/${sum(ts,t=>t[8][0])} items</div>
      <div class="m2">${s?fm(s)+' → '+fm(e):'sin fechas planificadas'}</div>
      <div class="minit">${s?`<b style="left:${pc(s)}%;width:${pc(e)-pc(s)}%;background:${a.c}"></b>`:''}
        <u style="left:${pc(TODAY)}%"></u></div>

}

/* ===================== PIPELINE DEV ===================== */
function nrm10(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function tbk9(st){var n=nrm10(st)
 if(/esper|bloquead|standby|pendiente cliente/.test(n))return 'blk'
 if(/pasar a produccion|subir a produccion|to merge/.test(n)||n==='release')return 'pro'
 if(/hecho|done|realizado|completado|cerrado|produccion|terminado|cancel/.test(n))return 'off'
 if(/review|testeo|test|qa|validacion|acceptance|prueba|aceptacion/.test(n))return 'tst'
 if(/a planificar|sin asignar|nuevo|tareas base|backlog|analysis|analisis/.test(n)||n==='new'||n===''||n==='pendiente'||n==='inicio')return 'pln'
 return 'prc'}
/* bucket por Estado de item de checklist — compartido por la vista Pipeline (pestaña Checklist) y el popup */
const BK9=[['pen','Pendiente','#7272A8'],['prc','En progreso','#951CF3'],['esp','En espera','#E06A10'],
           ['don','Hecho','#0FA36B'],['can','Cancelado','var(--t3)']]; // paleta validada (dataviz, ambos temas)
function bof9(dn,es){var n=nrm10(es);
 if(/cancel/.test(n))return 'can';
 if(dn||/hecho|done|realizado|completad/.test(n))return 'don';
 if(/espera|bloquead|standby/.test(n))return 'esp';
 if(/progreso|proceso|curso/.test(n))return 'prc';
 return 'pen'}
let pipeMode='dev';
function mkptc(o,k){ var t=o.t, sf=TSF[t[0]];
 var c=document.createElement('div');
 c.className='ptc'+(sf?' sf-'+sf[0]:(k!=='pln'?' sf-r':''));
 c.title=sf?('últ. parte '+fm(sf[1])+' — clic: abrir en su área'):
   (k==='pln'?'sin partes (backlog) — clic: abrir en su área':'sin partes en 14 días — clic: abrir en su área');
 var tt=document.createElement('div');tt.className='tt9';tt.textContent=dtxt(t[1].replace(/^\[[^\]]+\]\s*/,'')||t[1]);
 var pp=document.createElement('div');pp.className='pp9';
 pp.textContent=dtxt(AREAS[o.ai].n)+' · '+fm(t[2])+' → '+fm(t[3])+(t[5].length?' · '+t[5].map(u=>dtxt(U[u]?U[u].split(' ')[0]:u)).join(', '):' · sin responsable');
 var mm=document.createElement('div');mm.className='mm9';
 var zc=document.createElement('span');zc.className='zc9';zc.textContent=(o.z.p!=='FUNC'?o.z.p:'DEV');mm.appendChild(zc);
 var ck=document.createElement('span');ck.textContent=t[8][1]+'/'+t[8][0]+' items';mm.appendChild(ck);
 if(sf){var lp=document.createElement('span');lp.textContent='últ. parte '+fm(sf[1]).slice(0,5);mm.appendChild(lp)}
 c.appendChild(tt);c.appendChild(pp);c.appendChild(mm);
 c.onclick=()=>openSheet(o.ai,null,t[0]);
 return c;}
/* filtro + agrupaciones (como panel-desarrollo): pipeQ busca, pipeGrp agrupa dentro de cada columna */
let pipeQ='', pipeGrp={dev:'none',chk:'area',cr:'area'};
const PGOPT={dev:[['none','Sin agrupar'],['area','Área'],['resp','Responsable'],['tipo','Tipo']],
             chk:[['area','Área'],['resp','Responsable'],['tarea','Tarea'],['none','Sin agrupar']],
             cr:[['area','Área'],['tarea','Tarea'],['none','Sin agrupar']]};
function pmatch(hay){ return !pipeQ || nrm10(hay).indexOf(nrm10(pipeQ))>=0 }
function hesc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
// Los datos vienen HTML-escapados del generador (esc()): eso es correcto para innerHTML y
// MENTIRA para textContent/createTextNode/.title, donde la entidad se ve literal. dtxt() la
// deshace justo en ese borde. Decodificar hacia texto no puede inyectar marcado.
function dtxt(s){ return String(s==null?'':s).replace(/&lt;/g,'<').replace(/&gt;/g,'>')
  .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&') }
function pleg(vis){ return pipeQ?'<b>filtro "'+hesc(pipeQ)+'" · '+vis+' coinciden</b> · ':'' }
function tstrip(t){ return t[1].replace(/^\[[^\]]+\]\s*/,'')||t[1] }
// etiqueta de grupo por modo; '' = sin agrupar
function pglabel(o){ var g=pipeGrp[pipeMode];
 if(g==='none')return '';
 if(g==='area')return AREAS[o.ai].n;
 if(g==='tipo')return o.z?(o.z.p!=='FUNC'?o.z.p:'DEV'):'';
 if(g==='tarea')return tstrip(o.t);
 if(g==='resp'){ if(o.it&&pipeMode==='chk')return o.it[5]||'Sin responsable';
   var us=o.t[5]||[]; return us.length?(U[us[0]]||us[0]):'Sin responsable' }
 return ''}
function pgcolor(o){ return pipeGrp[pipeMode]==='area'?AREAS[o.ai].c:'var(--t2)' }
function pgsort(arr,sec){ // orden: grupo (área = orden del plan; resto alfabético) y secundario dentro
 var g=pipeGrp[pipeMode];
 arr.sort((p,q2)=>{
   if(g==='area'){ if(p.ai!==q2.ai)return p.ai-q2.ai }
   else if(g!=='none'){ var lp=nrm10(pglabel(p)), lq=nrm10(pglabel(q2));
     if(lp!==lq)return lp<lq?-1:1 }
   return sec(p,q2)});}
function pgfill(bd,arr,render){ // pinta filas con subcabecera cuando cambia el grupo
 var g=pipeGrp[pipeMode], prev=null;
 arr.forEach(o=>{
   if(g!=='none'){ var lb=pglabel(o);
     if(lb!==prev){ prev=lb;
       var ah=document.createElement('div');ah.className='pah9';
       ah.style.color=pgcolor(o);ah.textContent=lb;bd.appendChild(ah);}}
   bd.appendChild(render(o));});
 if(!arr.length){var e9=document.createElement('div');e9.className='pah9';e9.textContent='— vacío —';bd.appendChild(e9)}}
function mkcol9(lb,c,n){ var col=document.createElement('div');col.className='pl9';
 var hd=document.createElement('div');hd.className='pl9h';
 hd.style.borderColor=c;hd.style.color=c;
 var hs=document.createElement('span');hs.textContent=lb;
 var hn=document.createElement('span');hn.className='n';hn.textContent=n;
 hd.appendChild(hs);hd.appendChild(hn);col.appendChild(hd);return col}
function pipe(){
 var w=q('#pipew');w.innerHTML='';
 var tabs=document.createElement('div');tabs.className='ptabs';
 [['dev','Tareas técnicas'],['chk','Checklist'],['cr','Peticiones cliente']].forEach(([m,lb])=>{
   var b=document.createElement('button');b.className='pt'+(pipeMode===m?' on':'');
   b.textContent=lb;b.onclick=()=>{pipeMode=m;pipe()};tabs.appendChild(b)});
 w.appendChild(tabs);
 var tool=document.createElement('div');tool.className='ptool';
 var inp=document.createElement('input');inp.type='search';inp.id='pq9';
 inp.placeholder='Buscar módulo, tarea, texto…';inp.value=pipeQ;
 inp.oninput=function(){pipeQ=this.value;pipeBody()};
 tool.appendChild(inp);
 var gl=document.createElement('span');gl.className='glb';gl.textContent='Agrupar:';tool.appendChild(gl);
 PGOPT[pipeMode].forEach(([g,lb])=>{
   var b=document.createElement('button');b.className='pt sm'+(pipeGrp[pipeMode]===g?' on':'');
   b.textContent=lb;b.onclick=()=>{pipeGrp[pipeMode]=g;
     tool.querySelectorAll('.pt').forEach(x=>x.classList.toggle('on',x===b));pipeBody()};
   tool.appendChild(b)});
 w.appendChild(tool);
 var body=document.createElement('div');body.id='pipebody';body.className='pipebody';
 w.appendChild(body);
 pipeBody();}
function pipeBody(){
 var w=q('#pipebody');w.innerHTML='';
 w.classList.toggle('c3',pipeMode==='cr');
 if(pipeMode==='chk'){pipeChk(w);return}
 if(pipeMode==='cr'){pipeCr(w);return}
 var cols={pln:[],prc:[],tst:[],blk:[]}, pro=[], off=0;
 AREAS.forEach((a,ai)=>a.z.forEach(z=>{
   z.t.forEach(t=>{ if(ARCH.has(t[0]))return;
     if(z.p==='FUNC' && !TDEV.has(t[0]))return; // técnica = prefijo [X] o etiqueta Desarrollo
     var b=tbk9(t[6]); if(b==='off'){off++;return}
     if(!pmatch(AREAS[ai].n+' '+t[1]+' '+z.p+' '+(t[5]||[]).map(u=>U[u]||'').join(' ')))return;
     if(b==='pro'){pro.push({t:t,ai:ai,z:z});return}
     cols[b].push({t:t,ai:ai,z:z});});}));
 var ordSf={b:0,g:1,o:2,r:3,x:4};
 var bySf=(p,q2)=>{
   var sp=TSF[p.t[0]]?TSF[p.t[0]][0]:'x', sq=TSF[q2.t[0]]?TSF[q2.t[0]][0]:'x';
   if(ordSf[sp]!==ordSf[sq])return ordSf[sp]-ordSf[sq];
   return ((p.t[3]||'9999')<(q2.t[3]||'9999'))?-1:1;};
 Object.values(cols).forEach(arr=>pgsort(arr,bySf)); pgsort(pro,bySf);
 var CT={pln:['A planificar','#7272A8'],prc:['En proceso','#A93BFF'],tst:['Testeo · review','#0FA3A3'],blk:['Bloqueado','#FF575D']};
 Object.keys(cols).forEach(k=>{
   var col=mkcol9(CT[k][0],CT[k][1],cols[k].length);
   var bd=document.createElement('div');bd.className='pl9b';
   pgfill(bd,cols[k],o=>mkptc(o,k));
   col.appendChild(bd);w.appendChild(col);});
 // cola de despliegue: "Pasar a producción" como sección bajo el kanban (igual que panel-desarrollo)
 var sec=document.createElement('details');sec.className='prosec';sec.open=false;
 var sm=document.createElement('summary');
 sm.innerHTML=pro.length
   ?'🚀 Pasar a producción · <b>'+pro.length+'</b> — cola de despliegue: hecho pendiente de subir/validar en producción'
   :'🚀 Pasar a producción · 0 — cola de despliegue vacía';
 sec.appendChild(sm);
 if(pro.length){ var gd=document.createElement('div');gd.className='prog9';
   pro.forEach(o=>gd.appendChild(mkptc(o,'pro')));sec.appendChild(gd); }
 w.appendChild(sec);
 var leg=document.createElement('div');leg.className='pipleg';
 leg.innerHTML=pleg(cols.pln.length+cols.prc.length+cols.tst.length+cols.blk.length+pro.length)+'Técnicas = prefijo [DEV]/[INTEG]/[MIGR]… en el nombre o etiqueta "Desarrollo" en Odoo (el resto de Funcional queda fuera) · semáforo por última actividad registrada: <span><b style="color:#2F6FED">&#9679;</b> &lt;24h</span> <span><b style="color:var(--ok)">&#9679;</b> &le;72h háb.</span> <span><b style="color:var(--tangerine)">&#9679;</b> &gt;72h</span> <span><b style="color:var(--carmine)">&#9679;</b> parada o sin partes</span> · '+off+' finalizadas/canceladas fuera · clic en una tarjeta abre su hoja de área';
 w.appendChild(leg);}

/* pestaña Checklist: kanban de TODOS los items de checklist por Estado */
function pipeChk(w){
 var cols={pen:[],prc:[],esp:[],don:[]}, can=0, tot=0;
 AREAS.forEach((a,ai)=>a.z.forEach(z=>z.t.forEach(t=>{
   if(ARCH.has(t[0]))return;
   (CHK[t[0]]||[]).forEach(it=>{ tot++;
     var b=bof9(it[3],it[6]); if(b==='can'){can++;return}
     if(!pmatch(a.n+' '+t[1]+' '+it[0]+' '+(it[5]||'')))return;
     cols[b].push({it:it,t:t,ai:ai,a:a,z:z});});})));
 var sec=(p,q2)=>{
   if(p.it[2]!==q2.it[2])return q2.it[2]-p.it[2];           // HITO primero
   var pf=p.it[4]||'9999', qf=q2.it[4]||'9999';
   return pf<qf?-1:(pf>qf?1:0);};                           // fecha fin más próxima
 Object.values(cols).forEach(arr=>pgsort(arr,sec));
 BK9.forEach(([k,lb,c])=>{ if(k==='can')return;
   var col=mkcol9(lb,c,cols[k].length);
   var bd=document.createElement('div');bd.className='pl9b chkb';
   pgfill(bd,cols[k],o=>{
     var it=o.it, r=document.createElement('div');r.className='pci';
     r.title=dtxt(tstrip(o.t))+' — clic: checklist completo';
     var nm=document.createElement('div');
     if(it[2]){var hc=document.createElement('span');hc.className='hi9';hc.textContent='HITO';nm.appendChild(hc)}
     nm.appendChild(document.createTextNode(dtxt(it[0])));
     var mt=document.createElement('div');mt.className='mt';

function tcard(t,a){
  const [id,name,ini,fin,hrs,us,st,prio,chk]=t, r=risk(t), cr=CR[id], ck=CHK[id];
  const pre=(name.match(/^\[[^\]]+\]/)||[''])[0];
  return `<div class="tc${ARCH.has(id)?' arch':''}" data-tid="${id}">
    <div class="r1">
      <span class="chip" style="background:${a.c}26;color:${a.c};border:1px solid ${a.c}80">${pre||'FUNCIONAL'}</span>
      ${prio?`<span class="chip pri">${prio>=3?'URGENTE':'PRIORITARIA'}</span>`:''}
      <span class="sd"><i style="background:${LV[r.lvl]}"></i>${r.txt}</span>
      <button class="xx" data-x="${id}" title="Proponer archivar">×</button></div>
    <h5>${name.replace(/^\[[^\]]+\]\s*/,'')}</h5>
    <div class="tm">${fm(ini)} → ${fm(fin)} · ${us.length?us.map(u=>U[u]).join(', '):'sin responsable'} · ${st}</div>
    <div class="pb"><b style="width:${(r.real*100).toFixed(0)}%;background:${LV[r.lvl]}"></b>
      <u style="left:${(r.exp*100).toFixed(0)}%"></u></div>
    <div class="fo">${chk[1]}/${chk[0]} items · ${r.txt}
      <button class="go" data-o="${id}">Odoo ↗</button></div>
    ${chk[0]?`<div class="blks"><div class="cksum" data-ck="${id}">Checklist · ${chk[1]} de ${chk[0]}<span>ver todos ▸</span></div></div>`:''}
    ${cr?`<details class="blks"><summary>Peticiones al cliente (${cr.n})${cr.a?' · '+cr.a+' altas':''}</summary>
      <div class="bdy"><div class="bkd">${crState(cr)} · límite más próximo ${fm(cr.l)}</div>
        ${cr.i.map(([nm,p,d,st])=>`<div class="cri"><b>${p?'ALTA':'—'}</b>${nm}
          <s>límite ${fm(d)}${st&&st!=='draft'?' · '+(CRST[st]||st):''}</s></div>`).join('')}
      </div></details>`:''}
    ${r.blk.length?`<details class="blks"><summary>Bloqueantes (${r.blk.length})</summary>
      <div class="bdy">${r.blk.map(b=>`
        <div class="bkt">${b.s}</div><div class="bkd">${b.d}</div>`).join('')}
      </div></details>`:''}
  </div>`;
}
function wireCards(){
  q('#sheet').querySelectorAll('.blks').forEach(d=>d.onclick=ev=>ev.stopPropagation());
  q('#sheet').querySelectorAll('[data-o]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();window.open(TURL+b.dataset.o,'_blank','noopener')});
  q('#sheet').querySelectorAll('[data-ck]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();openCk(+b.dataset.ck)});
  q('#sheet').querySelectorAll('[data-x]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();const id=+b.dataset.x;
    ARCH.has(id)?ARCH.delete(id):ARCH.add(id);saveArch();tray();board();openSheet(curArea)});
}

/* ===================== POPUP CHECKLIST ===================== */
function openCk(id){
  const t=allT().find(x=>x[0]===id); if(!t)return;
  const items=CHK[id]||[], chk=t[8];
  // mini-pipeline por Estado del item (mismos buckets/colores que la pestaña Checklist de la vista Pipeline)
  const g={pen:[],prc:[],esp:[],don:[],can:[]};
  items.forEach(it=>g[bof9(it[3],it[6])].push(it));
  const row=([nm,w,hi,dn,ff,rs])=>`<div class="ck">
     <span class="box${dn?' on':''}"></span><span class="txt${dn?' don':''}">${nm}</span>
     ${hi?'<span class="w h">HITO</span>':(w>=3?'<span class="w">'+w+'</span>':'')}
     ${ff?`<span class="ff">${fm(ff)}</span>`:''}
     ${rs?`<span class="ini" title="${rs}">${rs.split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase()}</span>`:''}
   </div>`;
  const gsec=BK9.filter(([k])=>g[k].length);
  q('#ckPop').innerHTML=`<div class="x" id="ckX" title="Cerrar">×</div>
   <div class="eyebrow" style="color:var(--violet)">Checklist completo · #${id}</div>
   <h4>${t[1].replace(/^\[[^\]]+\]\s*/,'')||t[1]}</h4>
   <div class="sm">${chk[1]} de ${chk[0]} items validados</div>
   ${gsec.length>1?`<div class="ckpipe">${gsec.map(([k,lb,c])=>`<b><i style="background:${c}"></i>${lb} ${g[k].length}</b>`).join('')}</div>`:''}
   ${gsec.map(([k,lb,c])=>`<div class="ckg" style="color:${c}"><span>${lb}</span><b>${g[k].length}</b></div>
     <div class="ckgi ${k}">${g[k].map(row).join('')}</div>`).join('')
     ||'<div class="ck"><span class="txt" style="color:var(--t3)">Sin items</span></div>'}`;
  q('#ckWrap').classList.add('on');
  q('#ckPop').scrollTop=0;
  q('#ckX').onclick=closeCk;
}
function closeCk(){q('#ckWrap').classList.remove('on')}
q('#ckWrap').onclick=ev=>{if(ev.target.id==='ckWrap')closeCk()};

/* ===================== DAILY PLANNER ===================== */
function daily(){
  const in7=d=>{const x=(new Date(d)-NOW)/DAY;return x>=-30&&x<=7};
  const vence=[];
  Object.entries(CR).forEach(([id,c])=>{ if(in7(c.l)){
    const t=allT().find(x=>x[0]===+id); if(!t)return;
    vence.push({h:c.n+(c.n>1?' peticiones':' petición')+' · '+t[1].replace(/^\[[^\]]+\]\s*/,''),
      s:'<em>vence '+fm(c.l)+'</em>'+(c.a?'<span class="pill">'+c.a+' de prioridad alta</span>':''),id:+id});
  }});
  allT().forEach(t=>{ if(t[2]&&in7(t[2]))
    vence.push({h:'Arranca: '+t[1].replace(/^\[[^\]]+\]\s*/,''),
      s:'inicio '+fm(t[2])+(t[8][0]?'<span class="pill">'+t[8][0]+' items</span>':''),id:t[0]}) });
  const avanza=allT().filter(t=>t[5].length&&risk(t).lvl!=='ok').slice(0,5).map(t=>({
    h:t[1].replace(/^\[[^\]]+\]\s*/,''),
    s:t[5].map(u=>U[u].split(' ')[0]).join(', ')+
      '<span class="pill">'+(t[2]?'arranca '+fm(t[2]):'sin fechas')+'</span>',id:t[0]}));
  const mov=MOV;
  const grp=(t,arr)=>`<div class="dgrp"><div class="dgt">${t}<b>${arr.length}</b></div>
    ${arr.map(x=>`<div class="dit" data-go="${x.id}"><div class="h">${x.h}</div><div class="s">${x.s}</div></div>`).join('')
      ||'<div class="dit" style="cursor:default"><div class="s">Nada por ahora</div></div>'}</div>`;
  q('#daily').innerHTML=`<div class="x" id="dX">×</div>
   <div class="eyebrow">Sugerencias del día</div>
   <h4>Qué vence y en qué puedes avanzar</h4>
   <div class="upd">Del último refresco · ${fm(TODAY)}</div>
   ${grp('Vence esta semana',vence)}${grp('Puedes avanzar ya',avanza)}${grp('Replanificado vs plan inicial',mov)}`;
  q('#dX').onclick=()=>{q('#daily').classList.remove('on');q('#bDaily').classList.remove('on')};
  q('#daily').querySelectorAll('[data-go]').forEach(d=>d.onclick=()=>{
    const id=+d.dataset.go;
    AREAS.forEach((a,ai)=>a.z.forEach(z=>{if(z.t.some(t=>t[0]===id))openSheet(ai,null,id)}))});
}

/* ===================== BANDEJA ===================== */
function tray(){
  const el=q('#trayN');el.textContent=ARCH.size;el.style.display=ARCH.size?'flex':'none';
}
q('#bTray').onclick=()=>{
  const list=[...ARCH].map(id=>{const t=allT().find(x=>x[0]===id);
    return t?`<div class="dit" style="cursor:default"><div class="h">${t[1]}</div>
      <div class="s">#${id}</div></div>`:''}).join('');
  q('#daily').innerHTML=`<div class="x" id="dX">×</div>
   <div class="eyebrow">Propuestas de archivo</div>
   <h4>${ARCH.size} tarea${ARCH.size===1?'':'s'} marcada${ARCH.size===1?'':'s'}</h4>
   <div class="upd">La marca es local: oculta la tarea del Gantt pero no archiva en Odoo.
     Archívala allí y desaparecerá sola en el refresco diario.</div>
   <div class="dgrp">${list||'<div class="dit" style="cursor:default"><div class="s">Nada marcado. Usa la × de cada tarea.</div></div>'}</div>
   <div class="dgrp"><button class="mini" onclick="window.open('${ODOO}','_blank','noopener')">Abrir el proyecto en Odoo ↗</button>
   ${ARCH.size?'<button class="mini" id="clr" style="margin-left:6px">Quitar marcas</button>':''}</div>`;
  q('#daily').classList.add('on');
  q('#dX').onclick=()=>q('#daily').classList.remove('on');
  const c=q('#clr');if(c)c.onclick=()=>{ARCH.clear();saveArch();tray();board();q('#bTray').click()};
};

/* ===================== PETICIONES VENCIDAS ===================== */
const crOvItems=c=>(c.i||[]).filter(it=>it[2]&&it[2]<TODAY&&it[3]!=='received');
function crBadge(){
  let n=0;Object.values(CR).forEach(c=>n+=crOvItems(c).length);
  const el=q('#crN');el.textContent=n;el.style.display=n?'flex':'none';
}
function crOver(){
  const list=[];
  Object.entries(CR).forEach(([id,c])=>{
    const t=allT().find(x=>x[0]===+id); if(!t)return;
    const ov=crOvItems(c);
    if(ov.length)list.push({id:+id,t,ov,old:ov.map(x=>x[2]).sort()[0]});
  });
  list.sort((a,b)=>a.old<b.old?-1:1);
  const tot=list.reduce((s,x)=>s+x.ov.length,0);
  q('#daily').innerHTML=`<div class="x" id="dX">×</div>
   <div class="eyebrow" style="color:var(--carmine)">Peticiones al cliente vencidas</div>
   <h4>${tot} fuera de plazo en ${list.length} tarea${list.length===1?'':'s'}</h4>
   <div class="upd">Límite anterior a hoy y sin respuesta del cliente · ${fm(TODAY)}</div>
   ${list.map(g=>`<div class="dgrp"><div class="dgt">${g.t[1].replace(/^\[[^\]]+\]\s*/,'')}<b>${g.ov.length}</b></div>
     ${g.ov.map(([nm,p,d,st])=>{const dd=Math.round((NOW-new Date(d))/DAY);
       return `<div class="dit" data-go="${g.id}"><div class="h">${p?'<em style="font-style:normal;color:var(--carmine);font-weight:700;font-size:9px;margin-right:6px">ALTA</em>':''}${nm}</div>
       <div class="s"><em>límite ${fm(d)} · ${dd}d de retraso</em><span class="pill">${CRST[st]||'borrador'}</span></div></div>`}).join('')}
   </div>`).join('')||'<div class="dgrp"><div class="dit" style="cursor:default"><div class="s">Ninguna petición vencida</div></div></div>'}`;
  q('#dX').onclick=()=>{q('#daily').classList.remove('on');q('#bCR').classList.remove('on')};
  q('#daily').querySelectorAll('[data-go]').forEach(dd=>dd.onclick=()=>{
    const id=+dd.dataset.go;
    AREAS.forEach((a,ai)=>a.z.forEach(z=>{if(z.t.some(t=>t[0]===id))openSheet(ai,null,id)}))});
}
q('#bCR').onclick=e=>{
  const d=q('#daily'), on=e.currentTarget.classList.contains('on');
  if(d.classList.contains('on')&&on){d.classList.remove('on');e.currentTarget.classList.remove('on')}
  else{crOver();d.classList.add('on');q('#bDaily').classList.remove('on');e.currentTarget.classList.add('on')}};

/* ===================== NAVEGACIÓN ===================== */
function setView(v){
  view=v;board();
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  q('#scroll').scrollTop=0;
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{closeSheet();setView(b.dataset.view)});
function goStep(i){
  if(i<0||i>=STEPS.length)return;
  step=i;const s=STEPS[i];
  openSheet(s.ai,s.zi);
  q('#btitle').innerHTML=s.lab;
  document.querySelectorAll('.bd').forEach((d,k)=>d.classList.toggle('on',k===i));
  q('#bPrev').disabled=i===0;q('#bNext').disabled=i===STEPS.length-1;
}
q('#bNext').onclick=()=>goStep(step+1);
q('#bPrev').onclick=()=>goStep(step<=0?0:step-1);
q('#bUp').onclick=()=>{
  if(step<0)return;
  const cur=STEPS[step].ai;
  for(let i=step-1;i>=0;i--)if(STEPS[i].ai<cur){goStep(STEPS.findIndex(s=>s.ai===STEPS[i].ai));return}
  goStep(0);
};
q('#bHome').onclick=()=>{closeSheet();step=-1;setView('general');
  q('#btitle').textContent='Cronología y orden planteado de proyecto';
  document.querySelectorAll('.bd').forEach(d=>d.classList.remove('on'))};
q('#bdots').innerHTML=STEPS.map((s,i)=>`<span class="bd" title="${s.lab}" data-s="${i}"></span>`).join('');
q('#bdots').querySelectorAll('[data-s]').forEach(d=>d.onclick=()=>goStep(+d.dataset.s));
q('#blg').innerHTML=[['var(--ok)','En plazo'],['var(--tangerine)','Atención'],
  ['var(--carmine)','Desviada'],['var(--lm)','No iniciada / sin checklist']]
  .map(([c,l])=>`<i><b style="background:${c}"></b>${l}</i>`).join('');

/* zoom, tema, cliente, daily */
let K=1;
/* el zoom compensa el ancho: escala la UI pero el horizonte temporal siempre cabe en la ventana */
const setK=k=>{K=Math.max(.6,Math.min(1.6,k));const b=q('#board');b.style.zoom=K;
  b.style.width=(100/K).toFixed(3)+'%';b.style.maxWidth=Math.round(1660/K)+'px'};
q('#zIn').onclick=()=>setK(K+.1); q('#zOut').onclick=()=>setK(K-.1);
q('#bTheme').onclick=e=>{
  const dia=document.documentElement.getAttribute('data-t')==='dia';
  document.documentElement.setAttribute('data-t',dia?'noche':'dia');
  e.currentTarget.textContent=dia?'☾':'☀';
  try{localStorage.setItem('board-tema',dia?'noche':'dia')}catch(x){}};
try{if(localStorage.getItem('board-tema')==='dia'){
  document.documentElement.setAttribute('data-t','dia');q('#bTheme').textContent='☀'}}catch(e){}
q('#bDaily').onclick=e=>{
  const d=q('#daily');
  if(d.classList.contains('on')&&e.currentTarget.classList.contains('on')){d.classList.remove('on');e.currentTarget.classList.remove('on')}
  else{daily();d.classList.add('on');q('#bCR').classList.remove('on');e.currentTarget.classList.add('on')}};
q('#bProj').onclick=()=>window.open(ODOO,'_blank','noopener');

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){goStep(step+1)}
  else if(e.key==='ArrowLeft'){goStep(step<=0?0:step-1)}
  else if(e.key==='Escape'){if(q('#ckWrap').classList.contains('on'))closeCk();else closeSheet()}
  else if(e.key==='+'||e.key==='='){setK(K+.1)}
  else if(e.key==='-'){setK(K-.1)}
});

board();tray();crBadge();
</script>
</body>
</html>
