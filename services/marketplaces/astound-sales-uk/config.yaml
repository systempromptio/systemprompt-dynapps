marketplace:
  id: astound-sales-uk
  name: Astound — Sales UK
  description: Basic CRM for the UK group — client discovery, meeting prep, account reporting
    and external research over Salesforce and the Jira/Confluence delivery record.
  version: 2.0.0
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
  - astound
  - business
  - reporting
  license: proprietary
  # Who reaches this workspace is declared in services/access-control/rules.yaml
  # (entity marketplace/astound-sales-uk), the single source of entitlement on this instance.
  plugins:
    source: explicit
    include:
    - astound-sales-uk
  mcp_servers:
    source: explicit
    include:
    - atlassian
    - salesforce
    - google_rag
  agents:
    source: explicit
    include: []
