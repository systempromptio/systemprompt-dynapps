marketplace:
  id: astound-sales-uk
  name: Astound — Sales UK
  description: Basic CRM for the UK group — client discovery, meeting prep, account reporting
    and external research over Salesforce and the Jira/Confluence delivery record.
  version: 2.0.0
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
  - astound
  - business
  - reporting
  license: proprietary
  access:
    default_included: false
    roles: []
    rules:
    - rule_type: group
      values:
      - uk
      access: allow
      justification: UK business team client intelligence
  plugins:
    source: explicit
    include:
    - astound-sales-uk
  mcp_servers:
    source: explicit
    include:
    - atlassian
    - salesforce
    - google_rag
  agents:
    source: explicit
    include: []
