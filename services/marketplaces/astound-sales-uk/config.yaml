marketplace:
  id: astound-sales-uk
  name: Astound — Sales UK
  description: Key-account intelligence for the UK group — Client 360, account status, suggestions
    and the pipeline and renewals review over Salesforce, Google Workspace and the Jira/Confluence
    delivery record, with the UK Client Report dashboard.
  version: 3.0.0
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
  - astound
  - business
  - reporting
  license: proprietary
  # Who reaches this workspace is declared in services/access-control/rules.yaml
  # (entity marketplace/astound-sales-uk), the single source of entitlement on this instance.
  plugins:
    source: explicit
    include:
    - astound-sales-uk
  mcp_servers:
    source: explicit
    include:
    - atlassian
    - salesforce-crm-uk
    - salesforce-crm-us
    - salesforce-crm-dev
    - google_workspace
  agents:
    source: explicit
    include: []
