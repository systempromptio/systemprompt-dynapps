marketplace:
  id: astound-super-admin
  name: "Astound Digital — Super Admin"
  description: "The single administrator control plane: a daily brief with a traffic-light view of critical projects, critical-project and AI-usage reporting over Jira and Confluence evidence, and direct CLI access to the instance."
  version: "2.0.0"
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [admin, governance, reporting, atlassian, operations]
  license: proprietary
  # Who reaches this workspace is declared in services/access-control/rules.yaml
  # (entity marketplace/astound-super-admin), the single source of entitlement on this instance.
  # Why: the UK sales bundle rides along here. rules.yaml grants the plugin and
  # its skills to super_admin, but a plugin only reaches a user through a
  # marketplace — so without this line those grants were inert and a super_admin
  # who was not in the `uk` group got nothing from them.
  plugins:
    source: explicit
    include:
      - astound-super-admin
      - astound-sales-uk
  mcp_servers:
    source: explicit
    include:
      - systemprompt
      - atlassian
      - salesforce-us
      - salesforce-uk
      - salesforce-dev
  agents:
    source: explicit
    include: []
