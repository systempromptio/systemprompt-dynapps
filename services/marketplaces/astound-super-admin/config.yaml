marketplace:
  id: astound-super-admin
  name: "Astound Digital — Super Admin"
  description: "The single administrator control plane: a daily brief with a traffic-light view of critical projects, critical-project and AI-usage reporting over Jira and Confluence evidence, and direct CLI access to the instance."
  version: "2.0.0"
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords: [admin, governance, reporting, atlassian, operations]
  license: proprietary
  # Access is authored HERE, not in services/access-control/roles.yaml: the
  # startup loader ingests this block into access_control_rules, and a rule in
  # both files would be a second truth that can only drift.
  #
  # This workspace absorbed the former `systemprompt-admin` marketplace, so it
  # names every administrator role rather than `super_admin` alone — splitting the
  # control plane across two marketplaces was how an admin ended up holding half
  # of it. `default_included: false` keeps it closed to every other role.
  access:
    default_included: false
    roles: [admin, platform_admin, super_admin]
    justification: "One control plane for every administrator of this instance"
  plugins:
    source: explicit
    include:
      - astound-super-admin
  mcp_servers:
    source: explicit
    include:
      - systemprompt
      - atlassian
  agents:
    source: explicit
    include: []
