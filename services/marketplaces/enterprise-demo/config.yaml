marketplace:
  id: enterprise-demo
  name: "Astound Digital — Platform Workspace"
  description: "Everyday development workspace for Astound Digital: debugging, commits, and code review. Administrators receive the separate systemprompt-admin marketplace."
  version: "6.0.0"
  visibility: public
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - admin
    - productivity
  license: proprietary
  access:
    default_included: true
    roles: [user]
    rules:
      - rule_type: group
        values: [india-devs]
        access: deny
        justification: "India developers receive the dedicated India marketplace only"
    justification: "Public platform workspace for signed-in users"
  plugins:
    include:
      - astound-dev
  mcp_servers:
    source: explicit
    include: []
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills and
  # artifacts only.
  agents:
    include: []
