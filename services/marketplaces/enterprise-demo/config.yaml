marketplace:
  id: enterprise-demo
  name: "Astound Digital — Platform Workspace"
  description: "The Astound Digital workspace: everyday development skills (debugging, commits, code review) for every signed-in user, and the admin control plane (activity and user reports, CLI reference, and the systemprompt MCP server) for admins. The knowledge bank, Atlassian and Salesforce connectors and the full skill suite are work in progress — preserved on the backup/full-marketplace-and-skills branch."
  version: "5.0.0"
  visibility: public
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - systemprompt
    - admin
    - productivity
  license: proprietary
  access:
    default_included: true
    roles: [user]
    rules:
      - rule_type: group
        values: [india-devs]
        access: deny
        justification: "India developers receive the dedicated India marketplace only"
    justification: "Public platform workspace for signed-in users"
  plugins:
    include:
      - astound-admin
      - astound-dev
  mcp_servers:
    source: explicit
    include:
      - systemprompt
    exclude: []
  # No agents are published by this marketplace. Plugins ship skills and
  # artifacts only.
  agents:
    include: []
