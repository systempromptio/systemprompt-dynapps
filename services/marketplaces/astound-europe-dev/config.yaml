marketplace:
  id: astound-europe-dev
  name: "Astound Digital — Europe Development"
  description: "Development workspace for the Commerce Cloud / Storefront Next estate (the europe-devs group, Systemprompt-Commerce in the directory): planning, implementing and proving Storefront Next changes, cartridge review, B2C release notes and deploy runbooks, and a data-residency review pass. Ships the knowledge-bank MCP server. The storefront project reaches it too, so a hand-assigned engineer on the build gets the workspace without a group move."
  version: "2.0.0"
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - systemprompt
    - astound
  license: proprietary
  # Access is authored HERE, not in services/access-control/roles.yaml: the
  # startup loader ingests this block into access_control_rules, and a rule in
  # both files would be a second truth that can only drift.
  #
  # `default_included: false` is load-bearing. A user outside every listed
  # value matches no rule at this dimension and falls through to the entity
  # default, which must therefore be closed — otherwise the group gate would
  # be additive and this workspace would reach everyone.
  #
  # `roles` stays empty on purpose. A role grant is the widest band there is
  # (precedence 200) and would reopen the workspace to every holder of that
  # role regardless of group.
  #
  # The `project` rule is the narrowest band there is (140): an engineer
  # hand-assigned to the storefront build in the dashboard reaches this
  # workspace without being moved into the group.
  access:
    default_included: false
    roles: []
    rules:
      # No india-devs deny: the resolver is deny-overrides, so the deny that
      # used to sit here made every india-devs member — administrators
      # included — unable to hold this workspace beside their own. The gate
      # above already excludes anyone without the role or group it names.
      - rule_type: group
        values: [europe-devs]
        access: allow
        justification: "Commerce Cloud / Storefront Next workspace for the europe-devs group"
      - rule_type: project
        values: [storefront]
        access: allow
        justification: "Engineers assigned to the storefront build reach the Europe workspace"
  plugins:
    source: explicit
    include:
      - astound-europe-storefront
      - astound-europe-delivery
  mcp_servers:
    source: explicit
    include:
      - knowledge-bank
    exclude: []
  # No agents. This workspace ships skills through its plugins and nothing else.
  agents:
    source: explicit
    include: []
