marketplace:
  id: astound-india-dev
  name: "Astound Digital — India Development"
  description: "Development workspace for the Salesforce Core build and the business-analysis team (the india-devs group, Systemprompt-Core in the directory): story intake, Apex and declarative builds, validation rules and deploy troubleshooting, plus the BA story, epic, bug and impact-analysis skills. Includes all 34 upstream skills and authenticated Atlassian, Salesforce and GitHub connectors."
  version: "3.2.0"
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - systemprompt
    - astound
  license: proprietary
  # Who reaches this workspace is declared in services/access-control/rules.yaml
  # (entity marketplace/astound-india-dev), the single source of entitlement on this instance.
  plugins:
    source: explicit
    include:
      - astound-india-sfcore
      - astound-india-ba
  mcp_servers:
    source: explicit
    include:
      - atlassian
      - salesforce
      - github
    exclude: []
  # No agents. This workspace ships skills through its plugins and nothing else.
  agents:
    source: explicit
    include: []
