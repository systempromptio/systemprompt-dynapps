marketplace:
  id: astound-india-dev
  name: "Astound Digital — India Development"
  description: "Development workspace for the Salesforce Core build and the business-analysis team (the india-devs group, Systemprompt-Core in the directory): story intake, Apex and declarative builds, validation rules and deploy troubleshooting, plus the BA story, epic, bug and impact-analysis skills. Includes all 34 upstream skills and authenticated Atlassian, Salesforce and GitHub connectors."
  version: "3.0.0"
  visibility: private
  author:
    name: Astound Digital
    email: ed@systemprompt.io
  keywords:
    - systemprompt
    - astound
  license: proprietary
  # Access is authored HERE, not in services/access-control/roles.yaml: the
  # startup loader ingests this block into access_control_rules, and a rule in
  # both files would be a second truth that can only drift.
  #
  # `default_included: false` is load-bearing. A user outside every listed
  # value matches no rule at this dimension and falls through to the entity
  # default, which must therefore be closed — otherwise the group gate would
  # be additive and this workspace would reach everyone.
  #
  # `roles` stays empty on purpose. A role grant is the widest band there is
  # (precedence 200) and would reopen the workspace to every holder of that
  # role regardless of group.
  access:
    default_included: false
    roles: []
    rules:
      - rule_type: group
        values: [india-devs]
        access: allow
        justification: "Salesforce Core and BA workspace for the india-devs group"
  plugins:
    source: explicit
    include:
      - astound-india-sfcore
      - astound-india-ba
  mcp_servers:
    source: explicit
    include:
      - atlassian
      - salesforce
      - github
    exclude: []
  # No agents. This workspace ships skills through its plugins and nothing else.
  agents:
    source: explicit
    include: []
