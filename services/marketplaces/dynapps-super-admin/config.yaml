marketplace:
  id: dynapps-super-admin
  name: "Dynapps — Super Admin"
  description: "The single administrator control plane: AI-usage reporting from this platform's own audit tables, and direct CLI access to the instance."
  version: "2.0.0"
  visibility: private
  author:
    name: Dynapps
    email: ed@systemprompt.io
  keywords: [admin, governance, reporting, operations]
  license: proprietary
  # Who reaches this workspace is declared in services/access-control/rules.yaml
  # (entity marketplace/dynapps-super-admin), the single source of entitlement on this instance.
  plugins:
    source: explicit
    include:
      - dynapps-super-admin
  mcp_servers:
    source: explicit
    include:
      - systemprompt
  agents:
    source: explicit
    include: []
