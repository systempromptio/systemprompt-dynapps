# Scheduler Configuration
# Background jobs and scheduled tasks.
#
# Every job declares an explicit `owner:` — a real users.name that authorizes
# this job's actions. The configured owner becomes JobContext.actor for every
# `execute()` call and is the principal recorded in audit rows.
#
# No "system" user. No magic strings. `admin` is the bootstrap admin user
# created at install time (`just setup-local`). Deployments that want a
# different authorizer should change `owner:` to a different admin's username.

scheduler:
  enabled: true
  jobs:
    # Core jobs (defined in systemprompt-core)
    - name: managed_inventory_refresh
      extension: core
      owner: admin
      schedule: "0 * * * * *"
      enabled: true

    - name: cleanup_anonymous_users
      extension: core
      owner: admin
      schedule: "0 0 3 * * *"
      enabled: true
      # Anonymous fingerprint rows are 98 % of `users` in production (scanner
      # bursts); a week is long enough for a returning visitor to be re-linked.
      enforce: true
      parameters:
        retention_days: "7"

    - name: cleanup_empty_contexts
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true
      enforce: true

    - name: cleanup_inactive_sessions
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    # The one retention job. Windows come from `retention:` in the profile
    # (defaults: logs 30 d, analytics_events 90 d, ai_request_messages =
    # ai.history.retention_days, mcp_tool_executions 365 d, processed
    # event_outbox 7 d); deletes run in 5 000-row batches. `enforce: true`
    # is what makes it delete — without it the job only reports what it
    # would remove, which is how a self-hosted instance grew a history no
    # analytics rebuild could fit in memory. The console shows the windows
    # and the last run at /admin/configuration; the manual trigger is
    # `systemprompt infra jobs run database_cleanup`.
    - name: database_cleanup
      extension: core
      owner: admin
      schedule: "0 0 4 * * *"
      enabled: true
      enforce: true

    - name: oauth_cleanup
      extension: core
      owner: admin
      schedule: "0 5 3 * * *"
      enabled: true

    - name: user_rate_limit_prune
      extension: core
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true
      enforce: true

    # Primary group/project recompute for the membership changes nothing
    # announces (directory sign-ins rewriting AD membership).
    - name: scope_defaults_recompute
      extension: web
      owner: admin
      schedule: "0 15 * * * *"
      enabled: true

    # Web extension jobs (publishing pipeline). Hourly: the bootstrap entry
    # publishes at boot and content edits go through `just publish` or
    # `systemprompt infra jobs run publish_pipeline`; every run regenerates
    # the whole site unconditionally, so a tighter cadence only repeats
    # identical output.
    - name: publish_pipeline
      extension: web
      owner: admin
      schedule: "0 0 * * * *"
      enabled: true

    # Standalone core jobs, running on each job's built-in default schedule
    # (no `schedule:` override). Security jobs run in observe-and-log mode
    # because `enforce:` defaults to false.
    - name: no_js_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: ghost_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: mcp_session_cleanup
      extension: core
      owner: admin
      enabled: true

    - name: file_ingestion
      extension: core
      owner: admin
      enabled: true

    - name: behavioral_analysis
      extension: core
      owner: admin
      enabled: true

    - name: malicious_ip_blacklist
      extension: core
      owner: admin
      enabled: true

    # Standalone web extension jobs
    - name: content_analytics_aggregation
      extension: web
      owner: admin
      enabled: true

    - name: secret_migration
      extension: web
      owner: admin
      enabled: true

    - name: usage_daily_rollup
      extension: web
      owner: admin
      enabled: true

    # Nightly measured gateway overhead (NFR-1.6): p50/p95/p99 of total minus
    # upstream latency for the previous UTC day, per wire dialect, into
    # gateway_overhead_daily (last 400 days kept). Shown on /admin.
    - name: gateway_overhead_rollup
      extension: web
      owner: admin
      schedule: "0 10 0 * * *"
      enabled: true

    # Hourly usage spike detection (REQ-031): requests/cost/errors vs the
    # trailing-week hourly baseline, persisted to usage_anomalies and
    # warned to the log on first detection per window.
    - name: usage_anomaly
      extension: web
      owner: admin
      enabled: true

    # Per-user spike detection (FR-13.3): a user's previous-hour spend or
    # request rate against their own 7-day baseline. Complements the
    # instance-wide job above; this one feeds alerting through
    # systemprompt_usage_anomaly_total{kind} and the `usage_anomaly` event.
    - name: usage_anomaly_scan
      extension: core
      owner: admin
      enabled: true

    # Drops expired Gemini thought signatures (hourly).
    - name: thought_signature_cleanup
      extension: core
      owner: admin
      enabled: true

    # Re-probes the Vertex AI publisher listing and reports the delta. Off:
    # no Vertex provider is configured on this Anthropic-only installation.
    - name: vertex_discovery
      extension: core
      owner: admin
      enabled: false

    # Ships the audit trail to the OTLP collector the profile names under
    # `observability.otlp` (core job, every 15 s by its own schedule). Tails
    # ai_requests / tool_call_ledger / governance_decisions as spans and the
    # logs table as log records, by watermark in otlp_export_state; a batch
    # is acknowledged before its cursor moves. No-op on a profile without
    # the block. Ledger and manual run: /admin/system/observability.
    - name: otlp_export
      extension: core
      owner: admin
      enabled: true

    # Hourly validity sweep (web extension): revokes expired group/project
    # membership, manual roles, access rules and device certificates, and
    # pulls live credentials when an expiry removes a manage role.
    - name: access_expiry
      extension: web
      owner: admin
      enabled: true

    # Re-reads an external secrets source (secrets.external, e.g. 1Password)
    # every refresh_secs (web extension). Wakes each minute and reloads only
    # when due; a no-op on every other source. Logs changed key names only.
    - name: secrets_refresh
      extension: web
      owner: admin
      enabled: true

    # Expires raw evidence older than 90 days — hook events, gateway
    # requests and what hangs off them — in batches of 5,000 rows per table,
    # one short transaction each, within a 15-minute budget (web extension).
    # conversation_facts and conversation_skill_facts are kept.
    - name: plugin_usage_retention
      extension: web
      owner: admin
      enabled: true

    # The nightly accounting audit on the agent farm (web extension). At
    # 02:00 UTC it queues one run of `accounting_night_audit` on the
    # `dynapps-night-audit` farm (services/web/config/agent-farms.yaml) onto
    # core's agent_runs, launched as `launcher`; the farm runs in `user`
    # mode, so the run spends that person's own dynapps-odoo and dynbrain
    # grants. The run records `triggered_via = scheduler`, is launched as the
    # suite's `case` so the judge scores it when it ends, and the job only
    # queues it. Where the launcher is not an active person (every
    # environment but production) the tick logs that and queues nothing.
    # Manual run: `systemprompt infra jobs run farm_scheduled_run`.
    - name: farm_scheduled_run
      extension: web
      owner: admin
      schedule: "0 0 2 * * *"
      enabled: true
      parameters:
        farm: dynapps-night-audit
        agent: accounting_night_audit
        launcher: ed@systemprompt.io
        case: nightly_previous_month

    # Data lifecycle: measure daily, archive raw weeks before they expire,
    # archive the rollups monthly (kept forever) and run the health check.
    # Archives land under storage/exports/{weekly,monthly}/ and are listed on
    # /admin/configuration?tab=lifecycle. Parameters: weeks_back / keep_weeks
    # (26) on the weekly job, months_back / keep_months (0 = forever) on the
    # monthly one.
    - name: retention_daily_report
      extension: web
      owner: admin
      schedule: "0 30 4 * * *"
      enabled: true

    - name: retention_export_weekly
      extension: web
      owner: admin
      schedule: "0 0 2 * * 0"
      enabled: true

    - name: retention_export_monthly
      extension: web
      owner: admin
      schedule: "0 30 2 1 * *"
      enabled: true

    # Audit hash chain sealer (NFR-5.6): links new ai_requests and
    # ai_safety_findings rows into the chain every 30 s, one replica at a time
    # (advisory lock). The gateway insert path does not lock the chain head;
    # the seal lags by at most one interval. Schema 51_audit_integrity.sql.
    - name: audit_chain_seal
      extension: web
      owner: admin
      schedule: "*/30 * * * * *"
      enabled: true

    # Audit hash chain (NFR-5.6): re-hashes the last two days of the
    # ai_requests and ai_safety_findings chains, records one
    # audit_chain_verifications row per table and fails the run on any break.
    # Schema 51_audit_integrity.sql; see /documentation/data-retention.
    - name: audit_chain_verify
      extension: web
      owner: admin
      schedule: "0 45 4 * * *"
      enabled: true

    # Calendar-month quota windows (web extension, interim until core has
    # calendar windows). Five minutes past UTC midnight: rewrites every
    # monthly window in ai_gateway_policies to run out at month end and
    # carries yesterday's bucket into today's. Idempotent for the day, so
    # `systemprompt infra jobs run quota_month_window` is always safe.
    - name: quota_month_window
      extension: web
      owner: admin
      enabled: true

    # The conversation judge (web extension): the one AI label on top of the
    # deterministic conversation record. Every five minutes: queue every
    # conversation with at least one turn that is quiet for `quiet_minutes`
    # or whose harness session ended, lease `batch_size`, read each
    # transcript and ask the model below — in one structured call — for a
    # title, a summary, the intent category, an outcome and a single 0–100
    # completion score (did the assistant deliver what was originally asked).
    # Feeds every /admin/analysis page. Judge calls are audited as this job's
    # actor and excluded from every conversation view;
    # `daily_cost_cap_microdollars` stops a run once the day's judge spend
    # reaches it. Re-judge one:
    # `systemprompt infra jobs run conversation_judge -p context_id=<id>`.
    # Gated by `hooks.judge` on the governance-owning plugin and by the
    # profile's `judge.automatic`; the manual `context_id` run bypasses
    # the latter.
    - name: conversation_judge
      extension: web
      owner: admin
      schedule: "0 */5 * * * *"
      enabled: true
      parameters:
        provider: anthropic
        model: claude-haiku-5-5
        batch_size: "20"
        daily_cost_cap_microdollars: "2000000"
        quiet_minutes: "30"

    # The conversation rollup (web extension): keeps `conversation_facts` —
    # the per-conversation deterministic record every Analysis page reads —
    # current, with its per-skill rows (`conversation_skill_facts`, which the
    # Versions pages read). Every minute it re-derives the rows of each
    # conversation touched on any plane (gateway, hooks, governance, tools,
    # artifacts) since a stored watermark, so each change is folded in once.
    # `-p all=true` rebuilds every row (the backfill after an upgrade).
    - name: conversation_rollup
      extension: web
      owner: admin
      enabled: true

    # Core projection drainers: trace_facts_rollup every 30 s (overridden
    # above), the rest on their built-in schedule, once a minute at a
    # staggered second. Each drains a queue its source
    # table's triggers fill into the stored facts a list view reads, so an
    # empty queue is a cheap no-op. backfill_rollups is the same shape: it
    # drains the hours migrations queued for the hourly AI, tool and
    # agent-task rollups, 24 hours per batch, and idles once they are done.
    - name: trace_facts_rollup
      extension: core
      owner: admin
      schedule: "*/30 * * * * *"
      enabled: true

    - name: ai_request_tool_flag_rollup
      extension: core
      owner: admin
      enabled: true

    - name: user_context_counters_rollup
      extension: core
      owner: admin
      enabled: true

    - name: log_summary_rollup
      extension: core
      owner: admin
      enabled: true

    - name: tool_row_facts_rollup
      extension: core
      owner: admin
      enabled: true

    - name: analytics_event_link_facts_rollup
      extension: core
      owner: admin
      enabled: true

    - name: session_bot_type_rollup
      extension: core
      owner: admin
      enabled: true

    - name: backfill_rollups
      extension: core
      owner: admin
      enabled: true

    # publish_pipeline sub-steps. The composite above runs each of these every
    # hour in dependency order; scheduling them independently would
    # double-run them, so they are disabled here (an explicit entry also
    # records the decision and silences the boot warning).
    - name: blog_content_ingestion
      extension: web
      owner: admin
      enabled: false

    - name: bundle_admin_css
      extension: web
      owner: admin
      enabled: false

    - name: copy_extension_assets
      extension: web
      owner: admin
      enabled: false

    - name: site_content_prerender
      extension: web
      owner: admin
      enabled: false

    - name: content_prerender
      extension: core
      owner: admin
      enabled: false

    - name: page_prerender
      extension: core
      owner: admin
      enabled: false

    - name: sitemap_generation
      extension: web
      owner: admin
      enabled: false

    - name: llms_txt_generation
      extension: web
      owner: admin
      enabled: false

    - name: robots_txt_generation
      extension: web
      owner: admin
      enabled: false

  # Run once, serially, at startup before the cron loop begins.
  #
  # governance_bootstrap is boot-only: it has no `jobs` entry (so it is never
  # cron-scheduled) and declares an empty schedule. Its owner defaults to the
  # system admin. It materialises the profile's gateway-route entities and
  # projects services/access-control + gateway-policy YAML into the authz tables
  # so authorization is correct at app start.
  bootstrap_jobs:
    - governance_bootstrap
    - managed_inventory_refresh
    - database_cleanup
    - cleanup_inactive_sessions
    # Publish web assets before the cron loop: web/dist is generated, not
    # shipped in the image, so without this the site 404s until the first
    # publish_pipeline tick.
    - publish_pipeline
