# Salesforce org registry — one entry per hosted-MCP server that fronts an org.
#
# Salesforce has no central authorization server: every org is its own login,
# holds its own user records, needs its own External Client App, and a sandbox
# is served by a different hosted MCP endpoint. So an org is chosen BEFORE
# consent, and this file is where the choice is declared. Each key is the id of
# a `services/mcp/<id>.yaml` server (`salesforce` for the default production
# org, `salesforce-<slug>` for every other org); the connector reads the org's
# domain, app credentials and endpoint from here, never from global secrets.
#
# Loaded directly by the admin extension at boot (not via config.yaml
# includes). Boot fails on a malformed entry, a missing/disabled/internal
# server, or an endpoint that does not match `environment`. Boot does NOT fail
# on a missing secret — the org shows as "not provisioned" on the profile page
# until a Salesforce admin has created the app and the operator has stored its
# key and secret under the names given here.
#
# Fields:
#   label              shown on the profile page and bridge account card
#   my_domain          HTTPS My Domain origin; sandboxes end .sandbox.my.salesforce.com
#   environment        production | sandbox — selects the hosted MCP endpoint the
#                      server file must declare
#   org_id             optional 15/18-char org id; when set, a consent that lands
#                      in a different org is rejected and must be redone
#   client_id_secret   NAME of the secret holding the External Client App consumer key
#   client_secret      NAME of the secret holding its consumer secret
#   private_key_secret optional NAME of the PEM secret for JWT-bearer pre-authorization
#   groups             group ids entitled to connect; empty = every active user
#
# Sandbox refresh deletes the app and every user's grant. After the admin
# re-creates the app: POST /api/public/admin/connectors/<id>/reprovision.

orgs:
  salesforce:
    label: "Astound Digital (production)"
    my_domain: https://astound.my.salesforce.com
    environment: production
    client_id_secret: salesforce_mcp_client_id
    client_secret: salesforce_mcp_client_secret
    private_key_secret: salesforce_private_key
    groups: []

  # salesforce-client-a-uat:
  #   label: "Client A — UAT sandbox"
  #   my_domain: https://client-a--uat.sandbox.my.salesforce.com
  #   environment: sandbox
  #   org_id: 00DXXXXXXXXXXXXXXX
  #   client_id_secret: salesforce_client_a_uat_client_id
