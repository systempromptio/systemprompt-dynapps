# Read directly by core from services/config/files.yaml (not an `includes:`
# entry). Issue reports are on: the `systemprompt` server serves core's
# report_issue / issue_attachment / issues_list / issue_status tools while this
# is set, and omits them otherwise. Attachments need `documents` on as well,
# so until the document store is enabled a report carries no files.
files:
  issues:
    enabled: true
  documents:
    enabled: true
    # Live sessions: snapshot cadence and the owner lease. Each replica
    # advertises its own address, resolved from the environment when this file
    # is read: FLY_PRIVATE_IP on Fly, POD_IP under Helm (each platform sets only
    # its own). Left empty, core advertises 127.0.0.1 and warns, which suits a
    # single local instance.
    collab:
      snapshotAfterSecs: 30
      snapshotAfterUpdates: 200
      owner:
        enabled: true
        advertisePort: 8080
        advertiseHost: ${FLY_PRIVATE_IP:-}${POD_IP:-}
