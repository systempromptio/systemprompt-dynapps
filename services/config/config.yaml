# SystemPrompt Services Configuration
# Thin aggregator — every top-level resource file is listed here explicitly.
# Skills and plugins are auto-discovered from nested directories
# (services/skills/<id>/config.yaml, services/plugins/<id>/config.yaml).
# This instance ships no A2A agents: the only one it ever had existed to give
# the inbound Slack slash command something to dispatch to, and that pipeline
# is gone.

includes:
  # MCP servers
  # Only `atlassian` and the internal `systemprompt` control plane are
  # reachable. `salesforce` and `github` are declared so the catalog and the
  # group grants keep naming them, but neither has a connection yet.
  - ../mcp/systemprompt.yaml
  - ../mcp/evaluation-fixture.yaml
  - ../mcp/salesforce.yaml
  - ../mcp/atlassian.yaml
  - ../mcp/github.yaml

  # AI, scheduler, content
  # Note: ../web/config.yaml is NOT included here — the web domain validator
  # reads it directly as WebConfigRaw (branding at top level). Including it
  # via the aggregator would require a `web:` wrapper, which is incompatible.
  - ../ai/config.yaml
  # Provider catalog and gateway routes. These were profile sections until
  # core 0.44; they are implementation configuration and ship in the image.
  - ../ai/providers.yaml
  - ../ai/gateway.yaml
  - ../scheduler/config.yaml

  # External agents (super-agents — native apps + CLI tools that run off our infra, distinct from A2A agents above)
  - ../external_agents/claude_desktop.yaml
  - ../external_agents/codex_cli.yaml
  - ../external_agents/hermes.yaml

settings:
  # Why: more than one marketplace is enabled, so the instance has to say which
  # one is the default. astound-commons is the baseline workspace every
  # signed-in user reaches; the group- and role-scoped ones are additive and are
  # gated by `access.rules` in their own files.
  default_marketplace_id: astound-commons
  agent_port_range: [9000, 9999]
  mcp_port_range: [5000, 5999]
  auto_start_enabled: true
  schema_validation_mode: "strict"
