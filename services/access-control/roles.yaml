# Role-scoped access control rules.
#
# This file is the BOOTSTRAP source of truth. On startup the publish pipeline
# reads it and upserts each rule into `access_control_rules` (rule_type=role).
# Dashboard edits write to the database only — there is NO write-back to this
# file. To make a rule permanent across deployments, edit this file in the
# source repo and redeploy.
#
# Schema:
#   rules:
#     - entity_type:    gateway_route | mcp_server | plugin | agent | marketplace | skill | hook
#                       | slack_workspace  (written by services/slack/*.yaml, not here)
#       entity_id:      string id of the entity        (exactly one of entity_id / entity_match)
#       entity_match:   glob pattern over catalog ids  (exactly one of entity_id / entity_match)
#       access:         allow | deny  (default: allow)
#       default_included: bool        (default: false)
#       roles:          list of role names to grant (or deny) access
#
# Example:
#
# rules:
#   - entity_type: gateway_route
#     entity_match: "*"
#     access: allow
#     roles: [admin, developer]
#   - entity_type: mcp_server
#     entity_id: systemprompt
#     access: allow
#     roles: [platform_admin, admin]

rules:
  # MARKETPLACE RULES ARE NOT WRITTEN HERE. Every marketplace's `access` block
  # in services/marketplaces/*/config.yaml is ingested into the same table at
  # startup (acl_yaml_loader.rs -> ingest_marketplace_access), so a rule here
  # would be a second truth for the same entity that can only drift. The
  # baseline grant that used to sit at this spot — enterprise-demo to
  # `roles: [user]` — now lives in that marketplace's own file, and the three
  # group-scoped marketplaces carry `access.rules` at rule_type `group`.

  # Skills, plugins, agents, and mcp servers shipped with enterprise-demo need NO
  # per-entity rule: they inherit the marketplace grant above via the parent
  # cascade in marketplace_filter.rs (the bridge listing) and authz.rs (runtime
  # authz). Add an entity-level rule here only to DENY a specific member — an
  # entity-level deny overrides the inherited marketplace allow (deny-overrides).
  #
  # The astound-dev plugin and its skills (systematic_debugging, git_commit,
  # code_review) therefore have NO rule here on purpose: they are for every
  # signed-in user and inherit the grant above. A rule naming any of them
  # would close it to the roles that rule lists.

  # This instance defines exactly one A2A agent, `admin_console` (the Slack
  # slash command dispatches to it). Its rule sits with the rest of the admin
  # control plane below.
  #
  # `slack_workspace` rules are NOT written here. They are projected from
  # `authz.allowed_roles` in services/slack/*.yaml at startup — see
  # extensions/web/admin/src/repositories/config/acl_yaml_loader.rs — so the
  # Slack app file stays the single place that says who may drive a workspace.

  # Entities confined to a group or a project are NOT granted here. They are
  # gated via the `group` (150) and `project` (140) subject dimensions — see
  # access-control/{groups,projects}.yaml and each marketplace's own
  # `access.rules`. A role grant on any of those entities would reopen them to
  # every user, because `role` (200) is the widest band of the four.

  # `platform_admin` is named beside `admin` on every admin-plane rule below.
  # It is the strictly stronger role — it alone edits AD mappings and grants
  # `platform_admin` itself — so an entity open to `admin` and closed to
  # `platform_admin` would be a hole, not a tightening.
  #
  # `project_manager` is the semi-admin role AD grants via
  # `Systemprompt-ProjectManagers-*` (services/web/config/adfs.yaml). It is
  # named on the ordinary-user grants below so a PM keeps that surface even
  # if the directory ever stops pairing it with `user`, and it is deliberately
  # ABSENT from every rule below: the systemprompt MCP server, the
  # astound-admin plugin, the admin_console agent and the seven admin skills stay
  # admin-only. A PM's dashboard access is enforced in Rust
  # (`UserContext::is_console`), not here.

  # Admin control plane (astound-admin plugin). These entities are members of
  # the private systemprompt-admin marketplace. Explicit rules also enforce
  # admin access when resources are addressed directly. Declaring a rule opts
  # the entity out of the
  # marketplace cascade — the resolver falls back to a parent only when the
  # entity declares no rules at all — and that is what makes `roles: [admin]`
  # below restrictive rather than merely additive. Each entry therefore closes
  # its entity to every role but admin, in the signed manifest and at runtime
  # authz alike. The systemprompt MCP server is additionally gated by
  # oauth.scopes in services/mcp/systemprompt.yaml.
  - entity_type: mcp_server
    entity_id: systemprompt
    access: allow
    default_included: false
    roles: [platform_admin, admin]
  # The knowledge-bank MCP server: every signed-in role may search and sync,
  # and what each caller sees is decided per document by
  # knowledge_document_grants inside the retrieval queries, not here.
  # `default_included: false` so a caller holding none of these roles never
  # reaches the server (NFR-AUTHZ-1). Declaring the rule also opts the server
  # out of the marketplace cascade, which is what keeps it closed rather than
  # inherited from every marketplace that carries it.
  - entity_type: mcp_server
    entity_id: knowledge-bank
    access: allow
    default_included: false
    roles: [user, admin, project_manager]
  # Pilot connector grants are owned by access-control/groups.yaml.
  - entity_type: agent
    entity_id: admin_console
    access: allow
    default_included: false
    roles: [platform_admin, admin]
  - entity_type: plugin
    entity_id: astound-admin
    access: allow
    default_included: false
    roles: [platform_admin, admin]
  - entity_type: skill
    entity_id: admin_user_report
    access: allow
    default_included: false
    roles: [platform_admin, admin]
  - entity_type: skill
    entity_id: admin_activity_report
    access: allow
    default_included: false
    roles: [platform_admin, admin]
  - entity_type: skill
    entity_id: systemprompt_cli
    access: allow
    default_included: false
    roles: [platform_admin, admin]

  - entity_type: skill
    entity_id: admin_cost_report
    access: allow
    default_included: false
    roles: [platform_admin, admin]

  - entity_type: skill
    entity_id: admin_project_report
    access: allow
    default_included: false
    roles: [platform_admin, admin]

  - entity_type: skill
    entity_id: admin_ai_operations
    access: allow
    default_included: false
    roles: [platform_admin, admin]

  - entity_type: skill
    entity_id: systemprompt_setup_admin
    access: allow
    default_included: false
    roles: [platform_admin, admin]

  # Slack inbound surface. Wildcard grant over every Slack channel for the
  # `user` role — the role federated Slack users are minted with (see
  # services/slack/dev.yaml authz.allowed_roles). Channels inherit their
  # workspace grant via authz parent inheritance. Tighten entity_match to
  # specific channel ids (e.g. "C0ABC*") for production. To demonstrate a
  # denial, add a channel-specific `access: deny` rule below — an entity-level
  # deny overrides this inherited allow (deny-overrides).
  - entity_type: slack_channel
    entity_match: "*"
    access: allow
    default_included: true
    roles: [user, project_manager]

  # gateway routes shipped with enterprise-demo — wildcard grant over every
  # route in the catalog. Per-route enumeration was retired alongside the
  # gateway_model EntityKind in core 0.11.x.
  - entity_type: gateway_route
    entity_match: "*"
    access: allow
    default_included: true
    roles: [user, admin, platform_admin, project_manager]

  # NOTE: gateway routes are granted by the wildcard above and NOTHING ELSE.
  # Never add a `gateway_route` rule with a literal `entity_id` here.
  #
  # Route ids are generated, not authored: core derives them as
  # synthesize_route_id(model_pattern, provider) = slug + "-" + fnv1a6, e.g.
  # ("claude-*", "anthropic") -> claude-star-4203d1. There is no id a human can
  # work out from the model name, so a hand-written one names a route that does
  # not exist. The governance bootstrap hands core the profile's real route ids
  # as the authoritative catalog, so such an id fails the boot by name, and
  # scripts/validate-services.sh rejects it in CI without needing a profile.

  # Admins use their own linked Atlassian identity; India retains its group grant.
  - entity_type: mcp_server
    entity_id: atlassian
    access: allow
    default_included: false
    roles: [platform_admin, admin]
