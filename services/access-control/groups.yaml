# Entities confined to members of named GROUPS.
#
# This file is the BOOTSTRAP source of truth. On startup the loader
# (extensions/web/admin/src/repositories/config/member_grants_yaml_loader.rs)
# projects every grant into `access_control_rules` at rule_type=group — one
# allow row per (entity, group) — and forces the entity's default closed, so a
# user outside every listed group cannot reach it whatever roles.yaml says.
#
# The groups themselves are declared in services/web/config/groups.yaml, which
# also maps the AD groups the directory asserts onto them. A group named here
# must exist there or the rule can never match anyone.
#
# Schema:
#   grants:
#     - entity_type: plugin | mcp_server | agent | marketplace | skill | gateway_route
#       entity_id:   string id of the entity
#       members:     one or more group ids
#
# EMPTY IS THE CORRECT STATE, and not an oversight. Marketplace entitlement is
# authored beside the marketplace — `access.rules` in
# services/marketplaces/*/config.yaml, ingested by core at the same startup —
# so restating it here would be a second truth that can only drift. Reach for a
# grant here only for an entity that is NOT a marketplace and must be confined
# to a group: adding one means REMOVING that entity's roles.yaml rule at the
# same time, because this dimension (precedence 150) loses to `role` (200).
grants:
  - entity_type: mcp_server
    entity_id: requirements-workflow
    members: [europe-devs]
  - entity_type: mcp_server
    entity_id: atlassian
    members: [india-devs, europe-devs, uk]
  - entity_type: mcp_server
    entity_id: github
    members: [india-devs, europe-devs]
  - entity_type: mcp_server
    entity_id: salesforce
    members: [india-devs, europe-devs, uk]
  # The knowledge bank carries no group rule: roles.yaml opens it to every
  # signed-in user and per-document grants decide what each caller sees, so
  # an india-devs member sees only what their own Atlassian account synced.
  # A deny here (2026-09-07 to 2026-09-08) locked out the one group the
  # Atlassian MCP is confined to, and with it the end-to-end proof.

  # Sales tools are shared with Super Admin via the explicit role grants.
  - entity_type: plugin
    entity_id: astound-sales-uk
    members: [uk]
  - entity_type: skill
    entity_id: uk_sales_client_discovery
    members: [uk]
  - entity_type: skill
    entity_id: uk_sales_account_report
    members: [uk]
  - entity_type: skill
    entity_id: uk_sales_client_research
    members: [uk]
