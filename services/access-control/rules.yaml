# Access control — the one declarative source of entitlement on this instance.
#
# Every entity a signed-in person can be allowed or refused — marketplaces,
# plugins, skills, MCP servers, gateway routes — is declared here and nowhere
# else. The runtime enforces the DATABASE (`access_control_rules` +
# `access_control_entities`); this file is what the database is expected to
# contain. On boot the server SEEDS an empty database from this file and
# otherwise only COMPARES the two and reports drift. It never overwrites:
# reconciling code and database is a deliberate act on
# /admin/sync (Insert only · Overwrite from code · Export from
# dashboard). Full explanation: /documentation/access-control.
#
# How a decision is made (core resolver, narrowest band wins):
#   person (0) → project (140) → group (150) → connected server (160)
#   → linked account (170) → role (200)
# The narrowest band in which the person matches ANY rule decides; inside that
# band a deny beats an allow. An entity that declares any rule is CLOSED to
# everyone its rules do not name unless `default: open`. An entity with no
# rules at all inherits from its parent (skill → plugin → marketplace).
#
# Shape:
#   entities:
#     - entity: <kind>/<id>       kind ∈ marketplace | plugin | skill | mcp_server |
#                                 agent | gateway_route | hook
#                                 (gateway_route and hook take only the glob `*`,
#                                 expanded against the live catalog: route ids are
#                                 generated, never hand-written)
#       owner: bundle:<name>     OPTIONAL — the entity arrives in a remote services
#                                 bundle (deploy/kit/known-kits.json), not this tree;
#                                 it may be absent until that bundle is active and is
#                                 reported on /admin/sync as "awaiting its bundle"
#       default: open | closed   what an unmatched person gets (default: closed)
#       why: "..."               REQUIRED — lands on every rule row as its justification
#       valid_until: <RFC 3339>  OPTIONAL — every rule of the entity lapses at this
#                                 instant; a past value means "not declared", and the
#                                 hourly access_expiry sweep deletes the rows
#       allow:                   band → subjects; a band may also be
#         role: [...]              { values: [...], why: "..." } to override the why
#         group: [...]
#         project: [...]
#         connector: [...]       value = the server id; matches people whose Connections
#                                 page shows that server as connected (a live OAuth grant)
#         salesforce: [...]      value = the server id; matches people who linked that org
#       deny: {}                 same bands
#
# Groups and projects named here must exist in services/web/config/groups.yaml.
# scripts/validate-services.sh checks all of this in CI.

entities:
  # ─── Workspaces (marketplaces) ───────────────────────────────────────────
  - entity: marketplace/astound-commons
    default: open
    why: >-
      Baseline workspace and governance-hook carrier for every signed-in
      user. Open so a person the directory placed in no group still gets the
      commons; this is the only workspace that reaches everyone.
    allow:
      role: [user]

  # Arrives as a signed bundle from Astound-Digital/sfscore-claude-india-kit;
  # the kit owns the content, this file owns who reaches it
  # (docs/india-marketplace.md).
  - entity: marketplace/astound-india-dev
    owner: bundle:india
    default: closed
    why: >-
      Salesforce Core and business-analysis workspace for the india-devs
      group, published by the india kit.
    allow:
      group: [india-devs]

  - entity: marketplace/astound-salesforce
    default: closed
    why: >-
      Salesforce sales workspace for the business-users group. Membership
      alone grants it; the Salesforce connector is linked from inside the
      workspace and Salesforce still refuses anyone without a user in the org.
    allow:
      group: [business-users]

  # Arrives as a signed bundle from Astound-Digital/sfnext-claude-dev-kit; the
  # kit owns the content, this file owns who reaches it. Declared here even
  # while the bundle is not pinned (docs/sfnext-marketplace.md).
  - entity: marketplace/astound-europe-dev
    owner: bundle:sfnext
    default: closed
    why: >-
      Europe development workspace (Commerce Cloud / Storefront Next),
      published by the sfnext kit; reaches the europe-devs group and the
      storefront delivery project.
    allow:
      group: [europe-devs]
      project: [storefront]

  - entity: marketplace/astound-super-admin
    default: closed
    why: >-
      One control plane for every administrator of this instance. Salesforce
      sales workflows are delivered through their own connection-scoped
      marketplace.
    allow:
      role: [admin, platform_admin, super_admin]

  # ─── Admin control plane ──────────────────────────────────────────────────
  # platform_admin is always named beside admin: it is the strictly stronger
  # role, so an entity open to admin and closed to platform_admin is a hole.
  # project_manager is deliberately absent from every admin-plane rule; a PM's
  # console access is enforced in Rust (UserContext::is_console), not here.
  - entity: mcp_server/systemprompt
    default: closed
    why: >-
      The admin MCP server. Gated a second time by oauth.scopes in
      services/mcp/systemprompt.yaml; super_admin is named so a holder of the
      admin plugin never holds a control plane with no controls.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: plugin/astound-super-admin
    default: closed
    why: Admin plugin; closed to every role but the administrators named.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/systemprompt_cli
    default: closed
    why: Admin skill shipped by astound-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_critical_projects
    default: closed
    why: Admin skill shipped by astound-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_ai_usage
    default: closed
    why: Admin skill shipped by astound-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_person_activity
    default: closed
    why: Admin skill shipped by astound-super-admin; it reads every user's conversation history.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_daily_brief
    default: closed
    why: Admin skill shipped by astound-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  # ─── Model routes ─────────────────────────────────────────────────────────
  - entity: gateway_route/*
    default: open
    why: >-
      Every model route is reachable by every signed-in role. Usage is shaped
      by governance and quotas, not by entitlement. Route ids are generated
      (slug + fnv1a6), so only the glob is ever written here.
    allow:
      role: [user, admin, platform_admin, project_manager, super_admin]

  # ─── Delivery connectors ──────────────────────────────────────────────────
  # Closed on purpose: a person outside the listed groups sees no server rather
  # than a "connect your account first" error on every call. Admins reach
  # Atlassian through the role band with their own connected account.
  - entity: mcp_server/atlassian
    default: closed
    why: >-
      Jira/Confluence for the delivery groups and the storefront project;
      administrators use their own connected Atlassian account.
    allow:
      role: [platform_admin, admin, super_admin]
      group: [india-devs, europe-devs, uk]
      project: [storefront]

  # Open like the connector it fronts: a person must be able to reach the
  # connector before they hold the marketplace it grants, or nobody could ever
  # connect. Salesforce still refuses anyone without a user in the org.
  - entity: mcp_server/salesforce
    default: open
    why: Salesforce connector for the sales workspace, as the signed-in user.
    allow:
      role: [user, admin, platform_admin, project_manager, super_admin]

  # Identity-backed, client-hosted: the instance signs who is calling, so this
  # band is the whole access decision. Starts with the SFCore delivery group;
  # widens to project allocation as teams are assigned.
  - entity: mcp_server/sfcore_dev
    default: closed
    why: >-
      SFCore dev workflow server hosted by the SFCore team; it trusts the
      identity this instance signs, so only entitled users may reach it.
    allow:
      role: [platform_admin, admin, super_admin]
      group: [india-devs]

  - entity: mcp_server/google_workspace
    default: closed
    why: >-
      Org-wide Drive, Gmail and Calendar search through Agent Search; Google
      filters every result to what the user can already open, so the band only
      decides who sees the connector. Open to the UK pilot and the
      business-users group, whose Salesforce sales workspace draws on it; IAM
      in astound-knowledge-uk-sales is granted to the whole astounddigital.com
      domain, so widening needs no Google change. The connector band keeps the
      server for anyone who has already connected it, which is what lets the
      connection-gated search skills stay usable if the person's group changes.
    allow:
      group: [uk, business-users]
      connector: [google_workspace]
      role: [super_admin]
