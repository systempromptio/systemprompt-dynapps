# Access control — the one declarative source of entitlement on this instance.
#
# Every entity a signed-in person can be allowed or refused — marketplaces,
# plugins, skills, MCP servers, gateway routes — is declared here and nowhere
# else. The runtime enforces the DATABASE (`access_control_rules` +
# `access_control_entities`); this file is what the database is expected to
# contain. On boot the server SEEDS an empty database from this file and
# otherwise only COMPARES the two and reports drift. It never overwrites:
# reconciling code and database is a deliberate act on
# /admin/sync (Insert only · Overwrite from code · Export from
# dashboard). Full explanation: /documentation/access-control.
#
# How a decision is made (core resolver, narrowest band wins):
#   person (0) → project (140) → group (150) → connected server (160)
#   → linked account (170) → role (200)
# The narrowest band in which the person matches ANY rule decides; inside that
# band a deny beats an allow. An entity that declares any rule is CLOSED to
# everyone its rules do not name unless `default: open`. An entity with no
# rules at all inherits from its parent (skill → plugin → marketplace).
#
# Shape:
#   entities:
#     - entity: <kind>/<id>       kind ∈ marketplace | plugin | skill | mcp_server |
#                                 agent | gateway_route | hook
#                                 (gateway_route and hook take only the glob `*`,
#                                 expanded against the live catalog: route ids are
#                                 generated, never hand-written)
#       owner: bundle:<name>     OPTIONAL — the entity arrives in a remote services
#                                 bundle (deploy/kit/known-kits.json), not this tree;
#                                 it may be absent until that bundle is active and is
#                                 reported on /admin/sync as "awaiting its bundle"
#       default: open | closed   what an unmatched person gets (default: closed)
#       why: "..."               REQUIRED — lands on every rule row as its justification
#       valid_until: <RFC 3339>  OPTIONAL — every rule of the entity lapses at this
#                                 instant; a past value means "not declared", and the
#                                 hourly access_expiry sweep deletes the rows
#       allow:                   band → subjects; a band may also be
#         role: [...]              { values: [...], why: "..." } to override the why
#         group: [...]
#         project: [...]
#         connector: [...]       value = the server id; matches people whose Connections
#                                 page shows that server as connected (a live OAuth grant)
#         salesforce: [...]      value = the server id; matches people who linked that org
#       deny: {}                 same bands
#
# Groups and projects named here must exist in services/web/config/groups.yaml.
# scripts/validate-services.sh checks all of this in CI.

entities:
  # ─── Workspaces (marketplaces) ───────────────────────────────────────────
  - entity: marketplace/dynapps-commons
    default: open
    why: >-
      Baseline workspace and governance-hook carrier for every signed-in
      user. Open so a person the directory placed in no group still gets the
      commons; this is the only workspace that reaches everyone.
    allow:
      role: [user]

  - entity: marketplace/dynapps-salesforce
    default: closed
    why: >-
      Salesforce sales workspace for the staff group. Membership alone
      grants it; the Salesforce connector is linked from inside the
      workspace and Salesforce still refuses anyone without a user in the org.
    allow:
      group: [staff]

  - entity: marketplace/dynapps-super-admin
    default: closed
    why: >-
      One control plane for every administrator of this instance. Salesforce
      sales workflows are delivered through their own connection-scoped
      marketplace.
    allow:
      role: [admin, platform_admin, super_admin]

  - entity: marketplace/dynapps-agent-farm
    owner: bundle:dynapps-agent-farm
    default: closed
    why: >-
      Odoo delivery agent farm shipped by the dynapps-agent-farm kit. Farm runs
      execute as the requesting person through the gateway, so only someone who
      already holds the workspace may launch one: administrators, the staff
      group and the Odoo delivery project.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]
      project: [odoo-delivery]

  - entity: marketplace/dynapps-engineering
    default: closed
    why: >-
      Engineering workspace: the agent-farm run tools and the skill that
      explains them. Developers and project managers launch and read runs of
      their own and of their projects; administrators see every run.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  # The Dynapps portal servers are hosted by Dynapps on portal.dynapps.es and
  # used as each person's own Odoo account, so only people who hold one —
  # Dynapps staff — are offered them. The skill inherits from the plugin.
  - entity: marketplace/dynapps-portal
    default: closed
    why: >-
      Dynapps' own Odoo control and DynBrain knowledge servers, used as the
      Odoo portal account each staff member connects; nobody outside Dynapps
      holds such an account.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/dynapps-portal
    default: closed
    why: >-
      Carries the dynapps-odoo and dynbrain servers and the skill that routes
      between them, for Dynapps staff with a portal.dynapps.es account.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  # ─── Dynapps Spain skills (generated by scripts/import-indaws-skills.sh) ──
  # The marketplace, plugins and skills are generated from the pinned upstream
  # repositories (services/vendor/indaws.lock); these blocks are not. Skills
  # declare no rules and inherit from their plugin.
  - entity: marketplace/indaws-dynapps-spain
    default: closed
    why: >-
      Dynapps Spain's own Claude Code skills, built by Indaws and served
      governed through this instance. Every staff member reaches the
      workspace; the plugins below narrow the sensitive teams.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-common
    default: closed
    why: Dynapps Spain common Odoo connection, importation, Git and documentation skills every Dynapps Spain employee uses.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-consultant
    default: closed
    why: Dynapps Spain consulting team's analysis, configuration and project-delivery skills.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-marketing
    default: closed
    why: Dynapps Spain marketing team's campaign, content and brand skills.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-sales
    default: closed
    why: Dynapps Spain sales team's CRM, qualification and quotation skills.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-demo
    default: closed
    why: Dynapps Spain demo team's preparation and follow-up skills for Odoo demos.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-odoo-knowledge
    default: closed
    why: Dynapps Spain read-only Odoo 18/19 knowledge base, useful to every team.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-farm
    default: closed
    why: Dynapps Spain agent-farm guide skill; the farm itself still refuses anyone outside its own workspace.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/indaws-developer
    default: closed
    why: Dynapps Spain Odoo development skills; for developers and the Odoo delivery project.
    allow:
      role: [developer, admin, platform_admin, super_admin]
      project: [odoo-delivery]

  - entity: plugin/indaws-migration-lab
    default: closed
    why: Dynapps Spain Odoo migration budgeting, execution and billing skills; for developers, project managers and the Odoo delivery project.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]
      project: [odoo-delivery]

  - entity: plugin/indaws-devops
    default: closed
    why: Dynapps Spain Dyncloud cluster, GitOps and secrets runbooks; for developers and the Odoo delivery project only.
    allow:
      role: [developer, admin, platform_admin, super_admin]
      project: [odoo-delivery]

  - entity: plugin/indaws-hr
    default: closed
    why: >-
      Dynapps Spain HR skills reach employee records, leave, payroll and recruitment data (GDPR); administrators only until Dynapps names an HR group.
    allow:
      role: [admin, platform_admin, super_admin]

  - entity: plugin/indaws-management
    default: closed
    why: >-
      Dynapps Spain management skills read accounting, payroll, contracts and billing; administrators only until Dynapps names a management group.
    allow:
      role: [admin, platform_admin, super_admin]
  # ─── Admin control plane ──────────────────────────────────────────────────
  # platform_admin is always named beside admin: it is the strictly stronger
  # role, so an entity open to admin and closed to platform_admin is a hole.
  # project_manager is deliberately absent from every admin-plane rule; a PM's
  # console access is enforced in Rust (UserContext::is_console), not here.
  - entity: mcp_server/systemprompt
    default: closed
    why: >-
      The admin MCP server. Gated a second time by oauth.scopes in
      services/mcp/systemprompt.yaml; super_admin is named so a holder of the
      admin plugin never holds a control plane with no controls.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: mcp_server/agent-farm
    default: closed
    why: >-
      The agent-farm MCP server. Gated a second time by oauth.scopes (user)
      in services/mcp/agent-farm.yaml; the server narrows every run tool to
      the caller's own and project runs, so the role band here only decides
      who sees the server at all.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  - entity: plugin/dynapps-engineering
    default: closed
    why: Engineering plugin; the agent-farm server and its guide skill.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  - entity: skill/agent_farm_runs
    default: closed
    why: Guide skill shipped by dynapps-engineering.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  - entity: plugin/dynapps-super-admin
    default: closed
    why: Admin plugin; closed to every role but the administrators named.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/systemprompt_cli
    default: closed
    why: Admin skill shipped by dynapps-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_critical_projects
    default: closed
    why: Admin skill shipped by dynapps-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_ai_usage
    default: closed
    why: Admin skill shipped by dynapps-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_person_activity
    default: closed
    why: Admin skill shipped by dynapps-super-admin; it reads every user's conversation history.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/admin_daily_brief
    default: closed
    why: Admin skill shipped by dynapps-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  # ─── Model routes ─────────────────────────────────────────────────────────
  - entity: gateway_route/*
    default: open
    why: >-
      Every model route is reachable by every signed-in role. Usage is shaped
      by governance and quotas, not by entitlement. Route ids are generated
      (slug + fnv1a6), so only the glob is ever written here.
    allow:
      role: [user, admin, platform_admin, project_manager, super_admin]

  # ─── Delivery connectors ──────────────────────────────────────────────────
  # Closed on purpose: a person outside the listed group sees no server rather
  # than a "connect your account first" error on every call. Admins reach
  # Atlassian through the role band with their own connected account.
  - entity: mcp_server/atlassian
    default: closed
    why: >-
      Jira/Confluence for Dynapps staff and the odoo-delivery project;
      administrators use their own connected Atlassian account; workflow
      service accounts write back with an attached Atlassian API token.
    allow:
      role: [platform_admin, admin, super_admin]
      group: [staff, service-accounts]
      project: [odoo-delivery]

  # Closed: GitHub is reached by workflow service accounts, whose credential
  # the broker issues only to a workflow write-back or farm caller. Admins see
  # the server so they can inspect it; nobody else does.
  - entity: mcp_server/github
    default: closed
    why: >-
      Workflow write-backs to GitHub act as a per-definition service account
      holding a GitHub App installation; people are not granted it.
    allow:
      role: [platform_admin, admin, super_admin]
      group: [service-accounts]

  # Closed by default, open to every signed-in person and to service accounts.
  # A person acts as the Odoo account they linked on the connectors page; a
  # farm service account acts as its sealed odoo_api_key, opened only for a
  # farm or workflow caller. Nobody without a credential reaches Odoo at all.
  - entity: mcp_server/odoo
    default: closed
    why: >-
      Odoo CRM/accounting tools. People use them as their own linked Odoo
      account; governed farm runs use a service account holding an
      odoo_api_key machine credential. Destructive and erasure tools are
      refused a second time by scope_check and tool_blocklist
      (services/governance/config.yaml) for every caller kind unless the
      caller is admin or holds odoo_destructive.
    allow:
      role:
        values: [user, platform_admin, admin, super_admin, odoo_destructive]
        why: >-
          Every signed-in person may use Odoo as themselves. odoo_destructive
          is the role an admin grants a person or service account so its
          delete, anonymise and erase tools pass governance; it is revoked
          afterwards, and holding it implies seeing the server it unlocks.
      group: [service-accounts]

  # Open like the connector it fronts: a person must be able to reach the
  # connector before they hold the marketplace it grants, or nobody could ever
  # connect. Salesforce still refuses anyone without a user in the org.
  - entity: mcp_server/salesforce
    default: open
    why: >-
      Salesforce connector for the sales workspace, as the signed-in user;
      workflow service accounts write back with client credentials.
    allow:
      role: [user, admin, platform_admin, project_manager, super_admin]
      group: [service-accounts]

  # Closed to everyone but staff and administrators: the portal refuses anyone
  # without a portal.dynapps.es account, so offering the Connect row more
  # widely only produces failed consents. Not opened to service accounts — no
  # machine credential exists for the portal; every call is a person's grant.
  - entity: mcp_server/dynapps-odoo
    default: closed
    why: >-
      Dynapps' Odoo control MCP on portal.dynapps.es, used as the staff
      member's own Odoo account through a per-user OAuth grant; Odoo's record
      rules scope what each person sees and changes.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: mcp_server/dynbrain
    default: closed
    why: >-
      DynBrain, the Dynapps RAG knowledge system on portal.dynapps.es, queried
      as the staff member's own Odoo account through a per-user OAuth grant.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]
