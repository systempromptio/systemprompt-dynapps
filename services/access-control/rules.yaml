# Access control — the one declarative source of entitlement on this instance.
#
# Every entity a signed-in person can be allowed or refused — marketplaces,
# plugins, skills, MCP servers, gateway routes — is declared here and nowhere
# else. The runtime enforces the DATABASE (`access_control_rules` +
# `access_control_entities`); this file is what the database is expected to
# contain. On boot the server SEEDS an empty database from this file and
# otherwise only COMPARES the two and reports drift. It never overwrites:
# reconciling code and database is a deliberate act on
# /admin/sync (Insert only · Overwrite from code · Export from
# dashboard). Full explanation: /documentation/access-control.
#
# How a decision is made (core resolver, narrowest band wins):
#   person (0) → project (140) → group (150) → connected server (160)
#   → role (200)
# The narrowest band in which the person matches ANY rule decides; inside that
# band a deny beats an allow. An entity that declares any rule is CLOSED to
# everyone its rules do not name unless `default: open`. An entity with no
# rules at all inherits from its parent (skill → plugin → marketplace).
#
# Shape:
#   entities:
#     - entity: <kind>/<id>       kind ∈ marketplace | plugin | skill | mcp_server |
#                                 agent | gateway_route | hook | model
#                                 (gateway_route and hook take only the glob `*`;
#                                 model takes an id or a glob; a glob is stored as
#                                 written and matched when a request is decided)
#       owner: bundle:<name>     OPTIONAL — the entity arrives in a remote services
#                                 bundle (deploy/kit/known-kits.json), not this tree;
#                                 it may be absent until that bundle is active and is
#                                 reported on /admin/sync as "awaiting its bundle"
#       default: open | closed   what an unmatched person gets (default: closed)
#       why: "..."               REQUIRED — lands on every rule row as its justification
#       allow:                   band → subjects; a band may also be
#         role: [...]              { values: [...], why: "..." } to override the why
#         group: [...]
#         project: [...]
#         connector: [...]       value = the server id; matches people whose Connections
#                                 page shows that server as connected (a live OAuth grant)
#       deny: {}                 same bands
#
# Groups and projects named here must exist in services/web/config/groups.yaml.
# scripts/validate-services.sh checks all of this in CI.

# documents: core registers each document folder as a `folder/<uuid>` entity
# when the folder is created; a folder is closed by declaring an entity for
# that uuid here, and its documents inherit the folder's decision.
entities:
  # ─── Workspaces (marketplaces) ───────────────────────────────────────────
  - entity: marketplace/dynapps-commons
    default: open
    why: >-
      Baseline workspace and governance-hook carrier for every signed-in
      user. Open so a person the directory placed in no group still gets the
      commons; this is the only workspace that reaches everyone.
    allow:
      role: [user]

  - entity: marketplace/dynapps-super-admin
    default: closed
    why: >-
      One control plane for every administrator of this instance.
    allow:
      role: [admin, platform_admin, super_admin]

  - entity: marketplace/dynapps-agent-farm
    owner: bundle:dynapps-agent-farm
    default: closed
    why: >-
      The nightly accounting-audit farm shipped by the dynapps-agent-farm kit.
      Farm runs execute as the launching person through the gateway, so only
      someone who already holds the workspace may launch one: administrators,
      the staff group and the Odoo delivery project.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]
      project: [odoo-delivery]

  - entity: marketplace/dynapps-engineering
    default: closed
    why: >-
      Engineering workspace: the agent-farm run tools and the skill that
      explains them. Developers and project managers launch and read runs of
      their own and of their projects; administrators see every run.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  # The Dynapps portal servers are hosted by Dynapps on portal.dynapps.es and
  # used as each person's own Odoo account, so only people who hold one —
  # Dynapps staff — are offered them. The skill inherits from the plugin.
  - entity: marketplace/dynapps-portal
    default: closed
    why: >-
      Dynapps' own Odoo control and DynBrain knowledge servers, used as the
      Odoo portal account each staff member connects; nobody outside Dynapps
      holds such an account.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/dynapps-portal
    default: closed
    why: >-
      Carries the dynapps-odoo and dynbrain servers and the skill that routes
      between them, for Dynapps staff with a portal.dynapps.es account.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  # ─── Dynapps Spain skills (generated by scripts/import-dynapps-skills.sh) ──
  # The plugins and skills are generated from the pinned upstream repositories
  # (services/vendor/dynapps.lock); these blocks are not. dynapps-showcase
  # and dynapps-farm ship in dynapps-portal. Skills
  # declare no rules and inherit from their plugin.
  - entity: plugin/dynapps-showcase
    default: closed
    why: >-
      Dynapps Spain's most important workflows (lead data collection,
      value-based quotations, brand, SEO audit, ticket solving, development
      assessment and planning), kept as the one light plugin every staff
      member installs.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]

  - entity: plugin/dynapps-farm
    default: closed
    why: >-
      The agent-farm launcher skill and the accounting auditor it demos. The
      auditor reads Odoo through each person's own portal account, and the
      farm itself still refuses anyone outside its own workspace.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff]
  # ─── Admin control plane ──────────────────────────────────────────────────
  # platform_admin is always named beside admin: it is the strictly stronger
  # role, so an entity open to admin and closed to platform_admin is a hole.
  # project_manager is deliberately absent from every admin-plane rule; a PM's
  # console access is enforced in Rust (UserContext::is_console), not here.
  - entity: mcp_server/systemprompt
    default: closed
    why: >-
      The admin MCP server. Gated a second time by oauth.scopes in
      services/mcp/systemprompt.yaml; super_admin is named so a holder of the
      admin plugin never holds a control plane with no controls.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: mcp_server/agent-farm
    default: closed
    why: >-
      The agent-farm MCP server. Gated a second time by oauth.scopes (user)
      in services/mcp/agent-farm.yaml; the server narrows every run tool to
      the caller's own and project runs, so the role band here only decides
      who sees the server at all.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  - entity: mcp_server/documents
    default: closed
    why: >-
      The documents MCP server: every tool authorizes the caller through the
      document store's own grants and folder entities, so this band only
      decides who sees the server at all. Every signed-in user reaches it;
      oauth.scopes (user) in services/mcp/documents.yaml gates it a second
      time.
    allow:
      role: [user, developer, project_manager, admin, platform_admin, super_admin]

  - entity: plugin/dynapps-engineering
    default: closed
    why: Engineering plugin; the agent-farm server and its guide skill.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  - entity: skill/agent_farm_runs
    default: closed
    why: Guide skill shipped by dynapps-engineering.
    allow:
      role: [developer, project_manager, admin, platform_admin, super_admin]

  - entity: plugin/dynapps-super-admin
    default: closed
    why: Admin plugin; closed to every role but the administrators named.
    allow:
      role: [platform_admin, admin, super_admin]

  - entity: skill/systemprompt_cli
    default: closed
    why: Admin skill shipped by dynapps-super-admin.
    allow:
      role: [platform_admin, admin, super_admin]

  # ─── Models ───────────────────────────────────────────────────────────────
  - entity: model/*
    default: open
    why: >-
      Every model is reachable by every signed-in role. Usage is shaped by
      governance and quotas, not by entitlement. A request no declared route
      matches is decided on its model, so the glob covers the whole catalog.
    allow:
      role: [user, admin, platform_admin, project_manager, super_admin]

  # ─── Delivery connectors ──────────────────────────────────────────────────
  # Closed to everyone but staff, administrators and service accounts: the
  # portal refuses anyone without a portal.dynapps.es account, so offering the
  # Connect row more widely only produces failed consents. Service accounts are
  # in because farm runs in `client` / `service_account` mode
  # (agent-farms.yaml run_as) spend the portal grant an admin connected for
  # that account on its service-account page; the broker issues it only to a
  # `farm:<run id>` caller.
  - entity: mcp_server/dynapps-odoo
    default: closed
    why: >-
      Dynapps' Odoo control MCP on portal.dynapps.es, used as the staff
      member's own Odoo account through a per-user OAuth grant; Odoo's record
      rules scope what each person sees and changes. Its write, create, unlink
      and execute tools pass governance only for admin or a caller holding
      odoo_writer (services/governance/config.yaml).
    allow:
      role:
        values: [admin, platform_admin, super_admin, odoo_writer]
        why: >-
          odoo_writer is the role an admin grants a person so their
          dynapps-odoo write tools pass governance; holding it implies seeing
          the server it unlocks.
      group: [staff, service-accounts]

  - entity: mcp_server/dynbrain
    default: closed
    why: >-
      DynBrain, the Dynapps RAG knowledge system on portal.dynapps.es, queried
      as the staff member's own Odoo account through a per-user OAuth grant.
    allow:
      role: [admin, platform_admin, super_admin]
      group: [staff, service-accounts]
