# Entities confined to users who have a Salesforce Username on file.
#
# This file is the BOOTSTRAP source of truth. On startup the loader
# (extensions/web/admin/src/repositories/config/linked_yaml_loader.rs) projects
# every grant into `access_control_rules` at rule_type=salesforce with
# rule_value=linked, and forces the entity's default closed — so a user who has
# not linked Salesforce cannot reach it whatever roles.yaml says.
#
# "Linked" is a row in salesforce_user_identities, set administratively via
# POST /api/public/admin/users/{user_id}/salesforce-identity, because ADFS
# replaced the Salesforce SSO login that used to capture it. The dimension
# caches for 60s and is invalidated explicitly on link and unlink.
#
# Why gate at all, when an unlinked user's tool call would fail anyway: because
# it would fail with "connect your account first" on every single call, which
# reads as a broken server rather than an unconfigured one. Hiding it until it
# can work is the honest presentation. The hosted Atlassian connector needs no
# such rule: the marketplace filter already hides `mcp_server: atlassian` until
# the user's connected account is verified, and a link rule here would stop an
# unconnected user from ever being entitled to connect.
#
# Schema:
#   grants:
#     - entity_type: plugin | mcp_server | agent | marketplace | skill | gateway_route
#       entity_id:   string id of the entity

grants:
  - entity_type: mcp_server
    entity_id: salesforce
