# Governance policy chain — ENABLED in this installation (REQ-041, switched on
# 2026-08-25 for the enterprise rollout after the evaluation phase ran it
# disabled). All four stages run synchronously before every tool dispatch,
# first-deny-wins, every decision audited to governance_decisions.
#
# Do not disable governance by deleting this file or emptying `policies`: a
# missing or malformed file falls back to GovernanceConfig::defaults(), which is
# all four stages ENABLED with default tunables. Explicit `enabled: false` per
# stage is the only reliable off.
#
# The gateway safety scanners are a second, independent plane — see
# services/gateway/policies.yaml. They are switched on there too, and in the
# same warn mode.
#
# WARN MODE (2026-09-04). Every stage below runs and audits, and none of them
# refuses. The entropy backstop was denying ordinary developer tool calls, and
# the two ways out of that — retuning a threshold nobody has data for, or
# switching the stage off and losing the signal with the denials — were both
# worse than a third option: record what each stage would have refused, name
# the policy, and let the call through.
#
# So this is a measurement window, not a posture. Read it back with
#   systemprompt infra logs governance report --since 7d --group-by policy
# and once the warnings show which tunables are wrong, fix those and put the
# stages that no longer misfire back to `mode: enforce`, one at a time.
#
# `mode` is inherited: the top-level value below applies to every policy that
# does not name its own, and a policy may override it. An unrecognised value is
# a boot error, not a silent default — reading `warnn` as either `enforce` or
# `warn` would change what is enforced without saying so.
#
# Warn mode is NOT the same as `enabled: false`. A disabled stage does not run
# and writes nothing; a warning stage runs, evaluates, and writes a
# `governance_decisions` row with `decision = 'warn'` carrying the reason it
# would have denied on. That row is the whole product of this window.

governance:
  mode: warn
  policies:
  - id: secret_scan
    enabled: true
    # The 32 vendor patterns (AWS, GitHub, Stripe, sk-ant-, PEM, DB URLs) are
    # fixed. The high-entropy backstop that catches prefixless keys is tunable
    # here. The block is explicit — the values below ARE the live behaviour,
    # never a silent core default (2026-08-26: an SRI hash in forwarded page
    # assets tripped the backstop and denied every gateway prompt).
    # Left ON deliberately. Under warn mode the backstop no longer blocks, so
    # the question it was switched off to avoid — how often does it misfire? —
    # is finally answerable from the report instead of from argument.
    entropy:
      enabled: true      # false keeps the vendor patterns, drops the backstop
      min_len: 32
      threshold: 0.80    # Shannon entropy / the token length's ceiling
      # Regexes; a matching token is never reported. SRI integrity hashes are
      # public metadata — core also length-verifies sha256/384/512- digests,
      # this entry keeps the exemption effective on an unpatched binary.
      allowlist:
      - '^sha(256|384|512)-[A-Za-z0-9+/=_-]+$'
      # Absolute paths. `/` is a legal token character but not a token
      # delimiter, so a whole path is scored as a single token. A macOS
      # $TMPDIR — /var/folders/<2>/<30 random>/T/ — is 49 chars, mixed case
      # (the trailing /T/), carries digits, and scores 0.833 against the 0.80
      # ceiling. Claude Code and OpenCode both put one in the system prompt,
      # so every request from a Mac was denied while tool-less calls passed.
      # core `next` fixes this properly (is_filesystem_path, which re-scores
      # each segment so key material cannot hide in one); these entries keep
      # Macs working on an unpatched binary and should be dropped when the
      # pins reach a core release that carries that fix.
      - '^/(private/)?var/folders/'
      - '^/private/tmp/'
  - id: scope_check
    enabled: true
    admin_only_prefixes:
    - mcp__systemprompt__
  - id: tool_blocklist
    enabled: true
    patterns:
    - delete
    - drop
    - destroy
  - id: rate_limit
    enabled: true
    requests_per_window: 300
    window_secs: 60
