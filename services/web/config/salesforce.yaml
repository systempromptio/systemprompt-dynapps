# Salesforce Connected App, for minting per-user bearers for the Salesforce
# MCP server via the RFC 7523 JWT-bearer grant.
#
# DISABLED. Enable once the Connected App exists and its key pair is set:
#
#   systemprompt admin config secret set salesforce_private_key "$(cat server.key)"
#   systemprompt admin config secret set salesforce_certificate "$(cat server.crt)"
#
# This is not a login — ADFS is the login, and the Salesforce SSO that used to
# live here was retired to the `salesforce` branch. What remains is the app
# identity needed to act as a user downstream.
#
# The Connected App must have the matching certificate uploaded with "Use
# digital signatures" enabled, and each user admin-pre-authorized. Store the
# certificate as well as the key: a Salesforce metadata deploy is declarative,
# so a package omitting <certificate> clears the app's digital signature and
# breaks the very grant that performed the deploy.
#
# A user's Salesforce Username is NOT their login email. Set it per user with:
#
#   POST /api/public/admin/users/{user_id}/salesforce-identity
#   {"sf_username": "ed.aa...@agentforce.com"}

enabled: false
my_domain: "https://astound.my.salesforce.com"
consumer_key: "REPLACE_WITH_SALESFORCE_CONSUMER_KEY"
