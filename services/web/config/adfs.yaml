# ADFS SSO ("Sign in with Astound SSO") — SAML 2.0 relying party.
#
# Trust runs on the IdP's published signing certificate, read from the
# federation metadata file committed beside this one. There is NO client
# secret. Rotating the IdP certificate = re-fetching the metadata file:
#   curl -sS https://login.astoundcommerce.com/FederationMetadata/2007-06/FederationMetadata.xml \
#     -o services/web/config/adfs-federation-metadata.xml
#
# IT registered the relying party "Systemprompt DEV" on 2026-08-28. Verified
# live the same day: the assertion is signed (RSA-SHA256) by the metadata
# signing certificate, not encrypted.
#
# THE TWO SAML URLS ARE NOT IN THIS FILE. They are derived at boot from the
# profile's `api_external_url`:
#
#   entity_id  <external-url>/saml/metadata
#   acs_url    <external-url>/admin/auth/adfs/acs
#
# so one config is correct on every deployment host, and the host a node
# advertises for itself and the host it claims in SAML cannot drift apart.
# Every host that signs in needs its own relying-party trust registered with
# IT against those two URLs; an instance whose identifier has no trust behind
# it is refused with `MSIS7007: The requested relying party trust ... is
# unspecified or unsupported`. Setting `entity_id`/`acs_url` here overrides
# the derivation and pins every deployment to one host — do that only for a
# trust registered against a URL the instance does not serve itself under.
#
# Public authentication reference: services/content/documentation/authentication.md
#
# Setup procedure (AD FS side + every key below):
#   services/content/documentation/adfs-sso-setup.md  (/documentation/adfs-sso-setup)
#
# This file is the default every profile falls back to. A deployment on a
# different AD FS farm adds `adfs.<profile>.yaml` beside it, naming its own
# `idp_metadata_path`; the loader prefers that file and logs which one it read.

enabled: true

# IdP federation metadata, relative to services/web/config/.
idp_metadata_path: adfs-federation-metadata.xml

# Only these email domains may sign in. AD asserts the address, so there is no
# separate "verified" check — the domain list plus the group map is the gate.
# TEMPORARY: `astound.local` is the internal AD namespace, not a routable
# address, and the farm's `emailaddress` rule currently sources it instead of
# the user's `mail` attribute — so a real sign-in asserts
# `e.burton@astound.local`. Listed here to unblock testing; remove it once IT
# emits `mail`, or the domain gate means nothing.
allowed_email_domains:
  - astounddigital.com
  - astoundcommerce.com
  - astound.local

# Claim URIs as the relying-party trust emits them. Verified against a live
# assertion on 2026-08-31: IT applied all three issuance fixes, so the farm now
# sends a NameID (emailAddress format), the standard `emailaddress` claim, and
# the group claim under the announced URI, filtered to `Systemprompt-*`. The
# legacy unfiltered `http://temp/groups` is still emitted alongside it; we read
# the filtered one.
email_attribute: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
name_attribute: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"
groups_attribute: "http://schemas.xmlsoap.org/claims/Group"

# A sign-in whose assertion carries no group AT ALL gets no session. A group
# the map below does not name is not a refusal — the member signs in as a
# plain `user` — because the group map decides roles, not admission. Leave
# true.
deny_without_group: true

# Accept sign-ins started from the AD FS portal ("Systemprompt DEV" on
# /adfs/ls/idpinitiatedsignon) as well as ones we start. Verified identically.
allow_idp_initiated: true

# Tolerance for clock drift between the farm and this server, in seconds.
clock_skew_seconds: 120

# AD group -> systemprompt roles. Re-projected onto the account on EVERY
# sign-in (replace, not union) for the DIRECTORY half of the set; roles an
# admin granted by hand in the dashboard are a separate half and survive.
# Removing someone from a group therefore revokes the role at their next login
# unless it was also granted manually.
#
# A group that maps to no role here still signs its members in — they get
# `[user]`, and the group is placed by services/web/config/groups.yaml, which
# is where membership is decided. This map is only about ROLES.
#
# The two developer groups are named for the CONTENT they work on
# (Systemprompt-Commerce = Commerce Cloud / Storefront Next, the Europe team;
# Systemprompt-Core = Salesforce Core + BA, the India team) — see
# groups.yaml for the placement. Both get `developer`. Systemprompt-Business
# gets `knowledge_worker`, an entitlement role: whatever
# services/access-control/rules.yaml allows to `role: [knowledge_worker]` is
# reached by what someone does, not by which team they sit in.
group_roles:
  Systemprompt-Admins: [platform_admin, admin, user]
  Systemprompt-Commerce: [developer, user]
  Systemprompt-Core: [developer, user]
  Systemprompt-Business: [knowledge_worker, user]

# AD group GLOB -> systemprompt roles, applied on top of `group_roles` (union,
# not instead of). One `*` wildcard is the whole grammar: prefix and suffix
# must both match.
#
# Project managers are regional — `Systemprompt-ProjectManagers-UK`, `-India`,
# `-Europe`, and whatever IT adds next — so enumerating them in `group_roles`
# would go stale on every new region. `project_manager` is the semi-admin
# role: it reaches every read-only page of the admin dashboard and, unlike
# `admin`, may span projects without being in a project group. It is
# deliberately NOT granted the systemprompt MCP server, the astound-admin
# plugin or the admin skills in services/access-control/rules.yaml, and it
# reaches no write route on the
# admin JSON API.
group_role_patterns:
  Systemprompt-ProjectManagers-*: [project_manager, user]

# ENROLMENT IS CLOSED IN THIS INSTALLATION (REQ-002).
#
# With `deny_without_group: true` a first sign-in that carries a mapped group
# is one IT has already authorised, so auto-provisioning is safe to turn on:
# the AD group is the invitation. Off, SSO only signs in *existing* accounts
# and an unknown identity is rejected with `?sso=not_provisioned`.
# Turned on 2026-08-31: with `deny_without_group` and a group claim now filtered
# to `Systemprompt-*`, a first sign-in carrying a mapped group is one IT already
# authorised, so the AD group is the invitation.
auto_provision: true
