# Dynapps SSO (Microsoft Entra ID) — SAML 2.0 service provider.
#
# The file and the /admin/auth/adfs/* routes keep their historical names; the
# identity provider is Microsoft Entra ID, which speaks the same SAML 2.0.
#
# DISABLED until Dynapps IT has created the Enterprise Application and sent its
# Federation Metadata XML. The metadata file is read only when `enabled: true`,
# and the file in this tree is a placeholder for now. To switch SSO on:
#   1. Download "Federation Metadata XML" from the Enterprise Application's
#      Single sign-on page (or
#      https://login.microsoftonline.com/<tenant-id>/federationmetadata/2007-06/federationmetadata.xml?appid=<app-id>)
#      and save it as services/web/config/entra-federation-metadata.xml.
#   2. Replace the placeholder group names below with the real Entra groups.
#   3. Set `enabled: true` and redeploy.
#
# Trust runs on the IdP's published signing certificate inside that metadata.
# There is NO client secret. Rotating the Entra signing certificate means
# re-downloading the metadata file.
#
# Entra ID Enterprise Application (non-gallery, SAML) — values to enter:
#   Identifier (Entity ID)  https://dynapps.systemprompt.io/saml/metadata
#   Reply URL (ACS)         https://dynapps.systemprompt.io/admin/auth/adfs/acs
#   Sign-on URL             https://dynapps.systemprompt.io/admin/auth/adfs/start
#   Signing option          Sign SAML assertion, SHA-256
#   Token encryption        off
#   Group claim             "Groups assigned to the application", emitted
#                           under the default groups claim URI
#   Users and groups        assign the two groups named in `group_roles`
#
# THE TWO SAML URLS ARE NOT IN THIS FILE. They are derived at boot from the
# profile's `api_external_url` (<external-url>/saml/metadata and
# <external-url>/admin/auth/adfs/acs), so one config is correct on every
# deployment host. Setting `entity_id`/`acs_url` here overrides the derivation
# and pins every deployment to one host.
#
# Public authentication reference: services/content/documentation/authentication.md
#
# This file is the default every profile falls back to. A deployment against a
# different tenant adds `adfs.<profile>.yaml` beside it, naming its own
# `idp_metadata_path`; the loader prefers that file and logs which one it read.

enabled: false

# IdP federation metadata, relative to services/web/config/.
idp_metadata_path: entra-federation-metadata.xml

# Only these email domains may sign in. Entra asserts the address, so the
# domain list plus the group map is the gate.
allowed_email_domains:
  - dynapps.es
  - wearedynapps.com

# Attach a first sign-in to the active local account that owns the asserted
# (verified) address, instead of provisioning a duplicate.
link_by_email: true

# Claim URIs as Entra ID emits them by default.
email_attribute: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
name_attribute: "http://schemas.microsoft.com/identity/claims/displayname"
groups_attribute: "http://schemas.microsoft.com/ws/2008/06/identity/claims/groups"

# A sign-in whose assertion carries no group AT ALL gets no session. A group
# the map below does not name is not a refusal — the member signs in as a
# plain `user` — because the group map decides roles, not admission.
deny_without_group: true

# Accept sign-ins started from the Microsoft My Apps portal as well as ones
# we start. Verified identically.
allow_idp_initiated: true

# Tolerance for clock drift between Entra ID and this server, in seconds.
clock_skew_seconds: 120

# Entra group -> systemprompt roles. Re-projected onto the account on EVERY
# sign-in (replace, not union) for the DIRECTORY half of the set; roles an
# admin granted by hand in the dashboard survive. Removing someone from a
# group revokes the role at their next login unless it was also granted
# manually. Group placement is decided in services/web/config/groups.yaml.
#
# PLACEHOLDERS until Dynapps IT confirms the group names. If the application
# emits group object ids instead of names, key these entries by object id.
group_roles:
  Dynapps-Systemprompt-Admins: [platform_admin, admin, user]
  Dynapps-Systemprompt-Users: [user]

# With `deny_without_group: true` a first sign-in that carries an assigned
# group is one Dynapps IT already authorised, so the Entra group is the
# invitation and accounts are provisioned on first sign-in.
auto_provision: true
