# The groups and projects this installation ships with, and the AD groups the
# directory maps into them.
#
# This file declares membership SHAPE, not entitlement and not people. What a
# group or project reaches is declared in services/access-control/rules.yaml
# (the one source of entitlement, keyed by group/project id); who is IN a
# group or project comes from the directory at sign-in and from the console,
# and is never written to code.
#
# GROUPS carry people and marketplace entitlement. PROJECTS carry work
# attribution — the dimension every dashboard, listing and report is split by.
# The two are independent: a person is in exactly one group in the ordinary
# case and on any number of projects.
#
# The database is what is enforced; this file is what it is expected to
# contain. Boot seeds an EMPTY database from it and otherwise only compares
# the two: /admin/sync reports the drift and offers Insert only, Overwrite
# from code, or Export from the console. Overwrite upserts every set here and
# fully reconciles the AD mappings marked `source: yaml` — a mapping dropped
# from this file is dropped from the database, or a group IT retired would
# keep enrolling people. Groups and projects themselves are only ever
# upserted: they own membership, usage history and access rules, and deleting
# one is a deliberate console act, never a side effect of editing a file.
#
# A user who signs in carrying no AD group that maps to a group here is placed
# in the derived `unassigned` group — a real row, membership computed as "has
# no group_members row at all". It is never written and cannot be deleted.

# Groups are labelled by the WORK they do, not by where the people sit. The
# europe-devs group is the Commerce Cloud / Storefront Next estate (Victor's
# team), which the directory calls Systemprompt-Commerce; india-devs is the
# Salesforce Core build plus the business-analysis team, which the directory
# calls Systemprompt-Core. Those AD names describe the content each team
# works on, so the mapping reads "Commerce content -> Europe developers" —
# read it as a content label, not a contradiction.
groups:
  - id: europe-devs
    name: Europe developers
    description: >-
      Commerce Cloud and Storefront Next developers. Their workspace,
      astound-europe-dev, is not in this tree: it ships as a remote services
      bundle that is not pinned in this release, so the group currently reaches
      only the commons workspace.
    ad_groups: [Systemprompt-Commerce]
  - id: india-devs
    name: India developers
    description: >-
      Salesforce Core developers and the business-analysis team. Reaches the
      India development workspace (astound-india-dev, published by the
      sfscore-claude-india-kit bundle).
    ad_groups: [Systemprompt-Core]
  - id: business-users
    name: Business users
    description: >-
      Non-engineering staff: delivery, account and project management. No
      development tooling; the Cowork workspace is reached through the
      knowledge_worker role, not through this group.
    ad_groups: [Systemprompt-Business]

  - id: uk
    name: UK
    description: UK business team using client discovery, reporting and research.
    ad_groups: []

projects:
  - id: commerce
    name: Commerce
    description: Commerce Cloud delivery work.
    ad_groups: [Systemprompt-Commerce]
  - id: core
    name: Core
    description: Core platform work.
    ad_groups: [Systemprompt-Core]
  # No AD mapping: storefront delivery is assigned by hand in the dashboard,
  # because the directory has no group that means "on the storefront build".
  # The Europe development marketplace names it in a `project` rule, which is
  # the narrowest band there is; that marketplace ships as a remote bundle and
  # is not pinned in this release.
  - id: storefront
    name: Storefront
    description: Storefront Next delivery work, assigned per engagement.
    ad_groups: []
  # Business rollout attribution; membership is assigned explicitly.
  - id: business-implementation
    name: Business Implementation
    description: UK business AI implementation, executive insight and sales enablement.
    ad_groups: []
