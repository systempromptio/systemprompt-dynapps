# Navigation Configuration
# Header, footer, and documentation sidebar
#
# External links point to https://astounddigital.com.
# Local routes (/skills, /documentation, /admin/login) target the running
# template instance.

header:
  items:
    - id: documentation
      label: "Documentation"
      href: "/documentation/"
      dropdown: false


footer:
  capabilities:
    - path: "https://astounddigital.com/industries/retail-consumer-products"
      label: "Retail & Consumer Products"
      external: true
    - path: "https://astounddigital.com/industries/travel-hospitality"
      label: "Travel & Hospitality"
      external: true
    - path: "https://astounddigital.com/industries/manufacturing"
      label: "Manufacturing"
      external: true
    - path: "https://astounddigital.com/industries/medtech-life-sciences"
      label: "MedTech & Life Sciences"
      external: true
    - path: "https://astounddigital.com/industries/consumer-business-services"
      label: "Consumer & Business Services"
      external: true
  integrations:
    - path: "https://astounddigital.com/about"
      label: "About"
      external: true
    - path: "https://astounddigital.com/partners"
      label: "Partners"
      external: true
    - path: "https://astounddigital.com/client-success"
      label: "Client Success"
      external: true
    - path: "https://careers.astounddigital.com/"
      label: "Careers"
      external: true
    - path: "https://trust.astounddigital.com/"
      label: "Trust Center"
      external: true
  resources:
    - path: "/skills/"
      label: "Skills"
    - path: "/documentation/"
      label: "Documentation"
    - path: "/documentation/downloads"
      label: "Downloads"
    - path: "https://astounddigital.com/ai-hub"
      label: "AI Hub"
      external: true
    - path: "https://astounddigital.com/reports"
      label: "Reports"
      external: true
    - path: "/sitemap.xml"
      label: "Sitemap"
    - path: "/admin/login"
      label: "Login"
  legal:
    - path: "https://astounddigital.com/legal/privacy-policy"
      label: "Privacy Policy"
      external: true
    - path: "https://astounddigital.com/legal/privacy-policy-us"
      label: "Privacy Policy (US)"
      external: true
    - path: "https://astounddigital.com/legal/terms-of-use"
      label: "Terms of Use"
      external: true
  contact:
    - href: "https://astounddigital.com/contact-us"
      label: "Contact Us"
    - href: "https://www.linkedin.com/company/astound-digital/"
      label: "LinkedIn"

social:
  - href: "https://www.linkedin.com/company/astound-digital/"
    type: "linkedin"
    label: "LinkedIn"

