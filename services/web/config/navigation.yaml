# Navigation Configuration
# Header, footer, and documentation sidebar
#
# External links point to https://www.dynapps.es.
# Local routes (/skills, /documentation, /admin/login) target the running
# template instance.

header:
  items:
    - id: documentation
      label: "Documentation"
      href: "/documentation/"
      dropdown: false


footer:
  capabilities:
    - path: "https://www.dynapps.es/en"
      label: "Odoo Implementation"
      external: true
    - path: "https://www.dynapps.es/en"
      label: "Odoo Integration"
      external: true
    - path: "https://www.dynapps.es/en"
      label: "Hosting & Support"
      external: true
    - path: "https://www.dynapps.es/en"
      label: "AI & Automation"
      external: true
  integrations:
    - path: "https://www.dynapps.es/en"
      label: "About Dynapps"
      external: true
    - path: "https://wearedynapps.com"
      label: "We Are Dynapps"
      external: true
  resources:
    - path: "/skills/"
      label: "Skills"
    - path: "/documentation/"
      label: "Documentation"
    - path: "/documentation/downloads"
      label: "Downloads"
    - path: "/sitemap.xml"
      label: "Sitemap"
    - path: "/admin/login"
      label: "Login"
  legal:
    - path: "https://www.dynapps.es"
      label: "Dynapps"
      external: true
  contact:
    - href: "https://www.dynapps.es/en"
      label: "Contact Us"
    - href: "https://www.linkedin.com/company/dynapps/"
      label: "LinkedIn"

social:
  - href: "https://www.linkedin.com/company/dynapps/"
    type: "linkedin"
    label: "LinkedIn"

