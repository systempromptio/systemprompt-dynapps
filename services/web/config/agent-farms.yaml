# Agent farms this instance syncs and runs.
#
# Each farm is a public GitHub repository in Claude Code marketplace format
# whose `subdir` holds the farm definition (farm.yaml, agents/, evals/,
# fixtures/). The farm crate clones `source.github` at `source.ref`, projects
# the agents, fixtures and eval suites into the agent_farm_* tables, and runs
# agents headlessly with Claude Code under the launching user's identity.
# `marketplace` names the marketplace a user must be entitled to (see
# services/access-control/rules.yaml) to see and run the farm's agents.
# `clients` are who runs are for: each farm names its `client`, and every
# run, eval run and report it produces is attributed to that client. An
# agent may name its own `run_as` under `agents:`, preferred over the farm's.
# Unknown keys are a load error.

clients:
  - slug: dynapps
    name: "Dynapps"
  - slug: acme-logistics
    name: "Acme Logistics"

farms:
  - id: dynapps-agent-farm
    name: "Dynapps Odoo delivery farm"
    description: "Odoo delivery agents: module review, migration planning, release notes and test authoring over a sample Odoo module."
    marketplace: dynapps-agent-farm
    # Runs of this farm belong to the project its agents deliver for, so a
    # project manager's `scope: project` reads them (agent_farms.project_id).
    project: odoo-delivery
    client: dynapps
    # Runs execute as this service account (by email, so one config serves
    # every environment). Its odoo_api_key machine credential is what the odoo
    # MCP server spends; the launching person is still recorded on the run.
    run_as: svc-odoo-farm@dynapps.es
    source:
      github: systempromptio/systemprompt-agent-farm
      ref: main
      subdir: farm
    defaults:
      permission_mode: acceptEdits
      timeout_seconds: 1200
      max_turns: 15
      max_budget_usd: 2.0
      model: claude-sonnet-5-5

runner:
  max_concurrent: 1

# The model that judges a rubric case after its run finishes. Every trigger
# (public API, MCP, console, demo) builds the same judge from this block; the
# call goes through the gateway as the `farm-eval-judge` job actor.
evals:
  judge_provider: anthropic
  judge_model: anthropic-claude-sonnet-5-5
