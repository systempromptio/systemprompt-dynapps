# Agent farms this instance syncs and runs.
#
# Each farm is a public GitHub repository in Claude Code marketplace format
# whose `subdir` holds the farm definition (farm.yaml, agents/, evals/,
# fixtures/). The farm crate clones `source.github` at `source.ref`, projects
# the agents, fixtures and eval suites into the agent_farm_* tables, and runs
# agents headlessly with Claude Code under the launching user's identity.
# `marketplace` names the marketplace a user must be entitled to (see
# services/access-control/rules.yaml) to see and run the farm's agents.
# `clients` are who runs are for: each farm names its `client`, and every
# run, eval run and report it produces is attributed to that client. An
# agent may name its own `run_as` under `agents:`, preferred over the farm's.
# Unknown keys are a load error.
#
# `run_as` picks whose identity a run's credentials (gateway, MCP servers,
# connector grants) are issued to. Three modes:
#
#   run_as:
#     mode: user              # the person who launched the run (for a
#                             # scheduled run, the job's `launcher`); the run
#                             # spends their own dynapps-odoo / dynbrain
#                             # grants, as if they called the tools themselves
#   run_as:
#     mode: client            # the service account of the run's client (the
#                             # launch's client, else the farm's `client:`),
#                             # declared as `service_account:` on that client;
#                             # a launch with no client, or a client without
#                             # one, is refused
#   run_as:
#     mode: service_account   # one named service account (by email or id)
#     service_account: svc-farm@dynapps.es
#
# A service account reaches the portal servers (dynapps-odoo, dynbrain)
# through the OAuth grant an admin connects once on its page under
# /admin/identity/service-accounts. The legacy plain form
# `run_as: svc@example.com` still loads, as mode service_account. Whatever
# the mode, the launching person is recorded on the run.
#
# `tool_policy` narrows what a farm's runs may touch: `mcp_servers` is an
# allowlist (an agent naming any other server is refused at launch) and
# `deny` is appended to every run's --disallowedTools.

clients:
  - slug: dynapps
    name: "Dynapps"

farms:
  # The one flow this instance runs: a nightly, unattended accounting audit
  # of Dynapps' own Odoo (company 1, previous month) by the
  # indaws_accounting_auditor skill. The scheduler queues it at 02:00 UTC
  # (services/scheduler/config.yaml, `farm_scheduled_run`), launched as
  # ed@systemprompt.io; `user` mode means the run spends that person's own
  # OAuth grants for dynapps-odoo and dynbrain, exactly as if they called the
  # tools themselves.
  # It writes its audit report as run artifacts and publishes the summary to
  # DynBrain, where the morning session picks it up.
  - id: dynapps-night-audit
    name: "Dynapps nightly accounting audit"
    description: "Unattended month-end accounting audit of Dynapps' Odoo through the hosted dynapps-odoo server, published to DynBrain for the morning review."
    marketplace: dynapps-agent-farm
    client: dynapps
    run_as:
      mode: user
    # Unattended runs reach only the two hosted portal servers, and every
    # dynapps-odoo write tool is denied outright (Claude Code's
    # --disallowedTools), so the audit can read but never change Odoo. The
    # one approved fix happens later, in an attended session, where
    # governance gates the write on odoo_writer.
    tool_policy:
      mcp_servers: [dynapps-odoo, dynbrain]
      deny:
        - mcp__dynapps-odoo__orm_create
        - mcp__dynapps-odoo__orm_write
        - mcp__dynapps-odoo__orm_unlink
        - mcp__dynapps-odoo__orm_execute_kw
        - mcp__dynapps-odoo__odoo_request_upload
    source:
      github: systempromptio/systemprompt-agent-farm
      ref: main
      subdir: farm
    defaults:
      permission_mode: acceptEdits
      timeout_seconds: 2400
      max_turns: 40
      max_budget_usd: 8.0
      model: claude-opus-5-5

# `mode: local` runs each claimed run as a child of the API process;
# `fly_machine` runs it on its own Fly Machine from a pool of stopped runner
# machines (Machines API token: the `fly_api_token` secret). The services tree
# is shared by every profile, so production switches with the
# FARM_RUNNER_MODE=fly_machine env var rather than here. Every `fly:` key
# defaults from the Fly runtime env; see the farm crate's config/runner_yaml.rs.
runner:
  max_concurrent: 1
  mode: local
  fly:
    pool_size: 2
    cpus: 2
    memory_mb: 2048
    # Outbound allowlist of a runner machine (host names, IPs or CIDRs).
    # Loopback, Fly's private network (fdaa::/16: API, gateway, DNS) and the
    # host of every URL the run names (worker API, gateway, hooks, MCP
    # servers) are always allowed; everything else is rejected. Odoo is
    # reached through this gateway's dynapps-odoo proxy, never from the
    # runner, and the image is pulled by Fly, not the machine, so neither is
    # listed.
    # api.anthropic.com covers Claude Code's own non-inference calls.
    egress_allow:
      - api.anthropic.com

# The model that judges a rubric case after its run finishes. Every trigger
# (public API, MCP, console) builds the same judge from this block; the
# call goes through the gateway as the `farm-eval-judge` job actor.
evals:
  judge_provider: anthropic
  judge_model: anthropic-claude-sonnet-5-5
