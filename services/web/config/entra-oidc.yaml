# Dynapps SSO (Microsoft Entra ID) — OpenID Connect relying party.
#
# The only sign-in on this instance: an App Registration with a client secret.
#
# ENABLED 2026-10-14; admin consent, groups claim and real group ids in place
# 2026-10-15. Original steps:
#   1. Fill in `tenant_id` and `client_id` below (App Registration > Overview).
#   2. Store the client secret VALUE in the secrets store under the key named
#      by `client_secret_secret` (default `entra_oidc_client_secret`). The
#      secret never goes in this file.
#   3. Replace the placeholder group ids below with the real Entra group
#      object ids, set `enabled: true` and redeploy.
#
# Entra ID App Registration — values to enter:
#   Platform                Web
#   Redirect URIs           https://dynapps.systemprompt.io/admin/auth/entra/callback
#                           https://dynapps.systemprompt.io/api/v1/core/sso/entra-oidc/callback
#   Front-channel logout    (leave empty)
#   ID tokens (implicit)    off — the code flow with PKCE is used
#   Token configuration     add the "groups" claim, "Groups assigned to the
#                           application", emitted in the ID token
#   API permissions         Microsoft Graph: openid, profile, email (delegated)
#   Users and groups        on the Enterprise Application, assign the groups
#                           named in `group_roles`
#
# THE REDIRECT URI IS NOT IN THIS FILE. It is derived at boot from the
# profile's `api_external_url` + `redirect_path`, so one config is correct on
# every deployment host.
#
# Public authentication reference: services/content/documentation/entra-id-sso-setup.md

enabled: true

tenant_id: "19b092eb-6d38-4c26-bf69-6a97d5c150d8"
client_id: "f4379821-4c96-49a9-b5bf-7f8b9fd14c6a"
client_secret_secret: entra_oidc_client_secret

redirect_path: /admin/auth/entra/callback
scopes: [openid, profile, email]

# Entra emits group object ids under `groups`. A user in more groups than fit
# in the token gets `_claim_names` instead, and the sign-in is refused as a
# group overage — assign groups to the application to stay under the limit.
groups_claim: groups
clock_skew_seconds: 120

# Only these email domains may sign in.
allowed_email_domains:
  - dynapps.be
  - dynapps.nl
  - dynapps.fr
  - dynapps.es
  - dynapps.ch
  - dynapps.eu
  # Test only (2026-10-14): Ed's user in the Dynapps tenant is ed@systemprompt.io.
  - systemprompt.io

# Attach a first sign-in to the active local account that owns the asserted
# (verified) address, instead of provisioning a duplicate.
link_by_email: true

# Demo only: a guest account (ed@systemprompt.io is a guest in the Dynapps
# tenant) carries no xms_edov, so its email would not count as verified and
# could not link. Set false once IT adds the xms_edov optional claim.
trust_guest_email: true

# A sign-in whose token carries no group at all gets no session.
deny_without_group: true

# Entra group object id -> roles (ids from Dynapps IT, 2026-10-15).
group_roles:
  # Systemprompt - Admin
  "720095b5-6d25-4f5f-9cce-6074b5904b89": [platform_admin, admin, user]
  # Dynapps all - Users
  "b22f2dae-ee55-4ac7-8d5c-99cddfe1f9a5": [user]

auto_provision: true
