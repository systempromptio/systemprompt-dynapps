branding:
  name: Dynapps
  title: "Dynapps AI Gateway - governed Claude Code for Dynapps teams"
  description: Governed AI for Dynapps teams, inside Claude. One
    corporate sign-in connects Claude Code and Cowork to your organization's
    skills and tools, with every action audited.
  copyright: 2026 Dynapps
  themeColor: '#01007C'
  display_sitename: true
  twitter_handle: '@dynapps'
  image: /files/images/logo.png
  logo:
    primary:
      svg: /files/images/logo.svg
      webp: /files/images/logo.webp
      png: /files/images/logo.png
    dark:
      svg: /files/images/logo-white.svg
      png: /files/images/logo.png
    small:
      svg: /files/images/icon.svg
      png: /files/images/logo.png
  favicon: /files/images/favicon.ico
fonts:
  body:
    family: Readex Pro
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica
      Neue', Arial, sans-serif
    files: []
  heading:
    family: Readex Pro
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica
      Neue', Arial, sans-serif
    files: []
  brand:
    family: Readex Pro
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica
      Neue', Arial, sans-serif
    files: []
colors:
  light:
    primary:
      hsl: hsl(239, 86%, 14%)
      rgb:
      - 5
      - 5
      - 67
    secondary:
      hsl: hsl(0, 0%, 25%)
      rgb:
      - 64
      - 64
      - 64
    accent: '#01007C'
    success: '#10b981'
    warning: '#f59e0b'
    error: '#ef4444'
    surface:
      default: '#FFFFFF'
      dark: '#fafafa'
      variant: '#f5f5f5'
      secondaryContainer: '#f4ebff'
      errorContainer: '#FEE2E2'
    text:
      primary: '#050543'
      secondary: '#404040'
      inverted: '#FFFFFF'
      disabled: '#a3a3a3'
    background:
      default: '#FFFFFF'
      dark: '#fafafa'
    border:
      default: '#e5e5e5'
      dark: '#d4d4d4'
      outline: '#d4d4d4'
  dark:
    primary:
      hsl: hsl(48, 26%, 96%)
      rgb:
      - 248
      - 247
      - 243
    secondary:
      hsl: hsl(0, 0%, 71%)
      rgb:
      - 182
      - 182
      - 182
    accent: '#b692f6'
    success: '#34d399'
    warning: '#fbbf24'
    error: '#f87171'
    surface:
      default: '#050543'
      dark: '#03032b'
      variant: '#0a0a5e'
      secondaryContainer: rgba(123, 0, 220, 0.15)
      errorContainer: rgba(248, 113, 113, 0.1)
    text:
      primary: '#f8f7f3'
      secondary: '#b6b6b6'
      inverted: '#171717'
      disabled: '#707070'
    background:
      default: '#03032b'
      dark: '#03032b'
    border:
      default: rgba(255, 255, 255, 0.1)
      dark: '#292929'
      outline: '#707070'
typography:
  sizes:
    xs: 12px
    sm: 14px
    md: 16px
    lg: 18px
    xl: 20px
    xxl: 30px
  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
spacing:
  xs: 4px
  sm: 8px
  md: 16px
  lg: 24px
  xl: 32px
  xxl: 48px
radius:
  xs: 2px
  sm: 4px
  md: 8px
  lg: 12px
  xl: 16px
  xxl: 24px
  round: 9999px
shadows:
  light:
    sm: 0 1px 2px rgba(0, 0, 0, 0.04)
    md: 0 4px 6px rgba(0, 0, 0, 0.07)
    lg: 0 10px 15px rgba(0, 0, 0, 0.1)
    accent: 0 4px 14px rgba(10, 10, 10, 0.15)
  dark:
    sm: 0 2px 4px rgba(0, 0, 0, 0.3)
    md: 0 4px 8px rgba(0, 0, 0, 0.4)
    lg: 0 10px 20px rgba(0, 0, 0, 0.5)
    accent: 0 4px 14px rgba(0, 0, 0, 0.45)
animation:
  fast: 150ms
  normal: 250ms
  slow: 400ms
zIndex:
  base: 1
  content: 10
  navigation: 100
  modal: 1000
  tooltip: 2000
layout:
  headerHeight: 72px
  sidebarLeft:
    width: 20%
    minWidth: 240px
    maxWidth: 320px
  sidebarRight:
    width: 15%
    minWidth: 200px
    maxWidth: 280px
  navHeight: 72px
  contentMaxWidth: 1200px
card:
  radius:
    default: 16px
    cut: 4px
  padding:
    sm: 12px
    md: 16px
    lg: 24px
  gradient:
    start: rgba(23, 23, 23, 0.05)
    mid: rgba(23, 23, 23, 0.025)
    end: rgba(23, 23, 23, 0.01)
mobile:
  spacing:
    xs: 4px
    sm: 8px
    md: 12px
    lg: 16px
    xl: 24px
    xxl: 32px
  typography:
    sizes:
      xs: 11px
      sm: 13px
      md: 15px
      lg: 17px
      xl: 19px
      xxl: 26px
  layout:
    headerHeight: 64px
    navHeight: 64px
  card:
    padding:
      sm: 10px
      md: 12px
      lg: 16px
touchTargets:
  default: 44px
  sm: 40px
  lg: 48px
paths:
  templates: services/web/templates
  assets: services/web/assets
  css_url_prefix: /css
scripts: []
content:
  config_file: services/content/config.yaml
  sources:
  - legal
  - docs
social_action_bar:
  label: 'Follow:'
  platforms:
  - type: linkedin
  enable_share: true
nav:
  app_url: ''
  docs_url: /documentation
  blog_url: ''
  playbooks_url: ''
  github_url: ''
  getting_started_url: /documentation/connect-claude-code
