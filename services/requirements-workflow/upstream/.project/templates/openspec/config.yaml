schema: feature

context: |
  Platform: Storefront Next on Salesforce Managed Runtime (MRT): React Router 7 framework mode, RSC, React 19, TypeScript, Vite.
  Commerce: Salesforce B2C Commerce Cloud (SFCC); SCAPI server-side via createApiClients() (loaders/actions) + useScapiFetcher.
  Custom endpoints: custom SCAPI cartridges for Page Designer / Custom API only; no Rhino storefront scripting.
  CMS: Page Designer (via decorators)
  Styling: Tailwind CSS 4
  Testing: Playwright (E2E), Vitest (unit)
  Requirements: use project-context for Confluence, Jira, meeting notes, ADRs, and archived OpenSpec context; use openspec/specs for current system behavior.

rules:
  discovery:
    - Ground requirements through project-context using the specifications Source Lookup table; open cited inbox files before relying on them.
    - Run `openspec list` and enumerate every affected capability.
    - Never fabricate requirements; ask when source input is missing and record it in the Discovery Source Inventory.
    - Flag scope beyond the signed BRD as a Change Request candidate.
    - Record ambiguities and missing decisions as Open Questions; add Tech notes for technical constraints.
  proposal:
    - Lock scope from discovery.md, slice it into the Delivery Breakdown (user-value stories + acceptance-criteria seeds), and inherit the approach from design.md; include the tracker ref, boundaries, and delivery targets.
    - The Delivery Breakdown is a bijection to the in-scope requirements — exactly one slice per in-scope requirement and exactly one WBS in each slice's Covers (no grouping, no splitting); slice count equals the in-scope requirement count equals the FSD in-scope block count, so the functional-artifacts script projects the FSD + stories.md 1:1 (one slice, one FSD block, one story, one Acceptance Criteria block). Refine the requirement grain upstream instead of grouping.
    - STORY-LOOKUP LAW — a slice Story is NOT authored; it is a verbatim lookup. Join the slice's `Covers (WBS)` to the discovery Requirements Trace row with that WBS and copy its `Requirement` cell byte-for-byte (persona/wording/punctuation intact; only a trailing `[Q#]` may be added). Never re-author, paraphrase, shorten, or re-persona ("As a user" stays "As a user"); the FSD/ISD block's User Story reproduces the same cell exactly too. Identical for functional AND integration scope — an integration slice copies the same cell; the integration framing lives only in the slice name and Acceptance Criteria, never in a rewritten consuming-developer story.
    - INTEGRATION-AC OWNERSHIP — an integration slice's Acceptance Criteria name ONLY what the capability itself provides (expose a stable interface, perform its core operation, make a render surface available, or govern the vendor key/quota/billing/privacy). The discovery `Requirement Details` are a HIGH-LEVEL SRD seed (a Details line may mention shopper UI or a named vendor) — ELABORATE, never copy. BASELINE-DELTA (the elaboration algorithm) — per criterion, decide against the SF Next platform baseline in the sources, then state EITHER a NET-NEW obligation (no platform primitive exists) as the capability's own contract, OR a DELTA that names the platform primitive it builds on and what THIS capability adds; the primitive named is a platform baseline fact, never the owned vendor. PHRASING — open each criterion with a verb naming what the capability provides or guarantees; a seed clause may appear ONLY as that verb's object, never as the criterion's leading verb and never with its mechanism token. COMMIT before drafting — label each intended criterion net-new | delta | seed-echo, then rewrite or drop every seed-echo (a criterion that only re-states a Details line, adding no obligation and no baseline delta). FORBIDDEN in an integration AC — a vendor SDK/API/endpoint/method/field or a magnitude (SLA/latency/rate), and a consumer-UI outcome (a rendered list, selection, highlight, synchronization) even when the verbatim Story mentions it. KEPT as contract surface — a criterion where the capability ACCEPTS a shopper-initiated input (accept a submitted payment token, support a save-card request, not persist the raw card number); only a shopper-VISIBLE rendered result is dropped.
    - Fill External Dependencies & Access; verify branches, paths, tracker/doc refs, services, credentials, and scopes. Mark unverifiable items UNVERIFIED.
    - Before finalizing Open Questions, HUNT — walk the lock, the breakdown slicing, and the dependency verification for genuine new proposal-time ambiguities (UNVERIFIED dependency, multi-reading slice/seed, ownerless access item). `None` is valid only as an evidenced result naming what you checked — never a default from "everything inherited from discovery/design". A brand-new ASK goes back to discovery as a CR candidate, not into proposal Open Questions.
  grooming:
    - Migrate every upstream item exactly once (dedupe by identifier); the agent prepares the still-open items for decision and carries any resolved-upstream item for the record; named humans decide.
    - Prerequisites inherit the factual statuses from the proposal's External Dependencies & Access register; put the offer (lock + breakdown) up for sign-off unchanged.
    - Only raise a NEW architecture question if multiple viable options exist, the choice affects scope/risk/timeline, and deferral would cause rework.
    - Severities inherited verbatim; items start OPEN (or grounded BLOCKED) with every gate box unchecked — except a resolved-upstream item, which carries its upstream decision and named approver.
  specs:
    - Generate only after the Grooming Approval Gate passes; encode approved decisions exactly — never spec an undecided or rejected option.
    - One delta file per affected capability (ADD -> ADDED, MODIFY -> MODIFIED, REMOVE -> REMOVED); MODIFIED/REMOVED headings verbatim from the baseline; REMOVED blocks carry Reason + Migration.
    - Requirement headings use Option-H form — the WBS code, an em-dash, then the behaviour name (the WBS is the FSD join key and part of the merge key); ADDED always carries its WBS, and several requirements MAY share one WBS (aggregated into one FSD block downstream).
    - Put the RQ Trace and the Source in ONE HTML comment right after the heading — never bold Trace/WBS/Source lines (any text between the heading and the first scenario pollutes the archived baseline; a comment stays out of it).
    - Cover every in-scope lock requirement, every Delivery Breakdown slice, and every applicable cross-cutting area; nothing for deferred or out-of-scope items.
    - Behavior only, with RFC 2119 keywords and deterministic Given/When/Then scenarios (exactly 4 hashtags); author the FULL scenario set (the FSD projects all of them) so every near-final proposal AC criterion is covered by at least one scenario; no implementation tokens, no invented magnitudes.
    - "A scenario heading is `#### Scenario: <name>` and the whole text after the colon is the name — no leading bracketed label, grouping tag, or re-usability marker; grouping comes from the requirement a scenario sits under, whose name labels its rows in the downstream FSD/ISD table."
    - Partition each WBS by the subject that owes the criterion — administering business-user criteria form one trailing `Management` requirement, each Applicable cross-cutting guarantee its own requirement, and the shopper-outcome seat splits by context only when every part keeps two or more scenarios; requirement names are unique within a WBS.
  design:
    - Reference existing components/hooks/services in the codebase.
    - Open Questions — carry forward discovery's Q#s for this flow AND raise NEW architecture questions the design itself surfaces — a genuine choice with multiple viable options that affects scope/risk/timeline and would cause rework if deferred (same bar grooming uses). Never reopen a product/scope question discovery already resolved; a consumed integration's internal choice (call placement, key exposure, quota) stays that integration change's question (a consumed-dependency risk here, not a Q#).
    - Before finalizing Open Questions, MANDATORY — diff the target solution against the current code/specs (open the files the change touches) and enumerate (b)-question candidates. `None` is valid only as an evidenced result that names what you inspected — never a default from "discovery resolved everything → no questions".
    - Split Frontend (Storefront Next / RSC) vs Backend (SFCC) concerns.
    - Note SSR vs CSR (RSC) implications; document Page Designer wiring and translations (sfnext-i18n) when relevant.
    - Tag each Base Configuration & Cross-Cutting row's `Applies to` column with the WBS codes it shapes (or `all`); the Rendering/Caching/Security/Performance rows are the deterministic source the functional-artifacts script projects into per-story Implementation notes. Never reference slices (S#) — they are defined later in the proposal.
  technical-design:
    - Generate only after the BA/SA phase completes (specs done, Grooming Approval Gate passed); read stories/FSD/ISD only when they exist.
    - Implementation architecture and phased delivery plan — invent implementation identifiers per platform skill conventions (sfnext-routing flat-routes, b2c-webservices services, b2c-scapi-custom endpoints); every planned area traces to spec RQ/WBS; deferred scope excluded.
    - Never redefine behaviour or re-decide locked design/grooming decisions; decide only what upstream deferred to planning; undecided magnitudes (TTL, quota) become planning questions, never asserted values.
    - Planning-stage grooming — technical unknowns as OPEN questions (CRITICAL / NICE-TO-HAVE, owner, empty Approved by), each carrying the agent's recommendation in its Recommendation / Decision cell; no approved decision recorded on generation; CRITICAL questions block tasks.md and are approved one at a time in chat.
    - Preserve every story key in the Delivery Inventory when stories.md exists; Runtime Flows as mermaid sequence diagrams; Implementation Building Blocks and Verification Strategy carry trace; blocked verification marked with its P# prerequisite.
  tasks:
    - Phase 0 verifies external access; Phase 1 is mandatory Test Setup (Vitest unit + Playwright E2E via playwright-cli, selectors via sfnext-test-ids).
    - Page Designer components must cover registration, decorator wiring, and render verification (see sfnext-page-designer).
    - User-facing text requires a Translation Sync phase (extract/sync/compile per sfnext-i18n).
    - Order tasks by dependency; each task verifiable and small enough for one session.
    - Include a11y check (a11y-audit) for UI changes and manual QA of every spec scenario; track un-runnable tests in a Blocked Tests list.
    - Before writing file paths or CLI commands, verify them against the actual project.
    - Remove cancelled/descoped tasks entirely; tasks.md is the pending-work queue.
  fsd:
    - Generate only after the Grooming Approval Gate passes and only when the delivery scope is functional (an integration change publishes an ISD instead — never both); skip pure refactors, internal work, and infra-only changes.
    - One FSD per Delivery Scope & Targets row (e.g. PDP, PLP, cart); each in-scope requirement is exactly one block keyed by its clean WBS code.
    - SCAFFOLD-FIRST — the per-block User Story, Acceptance Criteria, and Key behaviours sub-sections are filled DETERMINISTICALLY by generate-functional-artifacts.mjs (Story + Acceptance Criteria verbatim from the covering proposal slice, Key behaviours as a table from the covering spec requirement(s), with a bold sub-header row per requirement name when several share the WBS); run the scaffold script FIRST, then enrich only the non-owned sections (General FSD Information, approval roster, Reference Materials, Visualization, framing). Never hand-edit those three sub-sections, sub-header rows included — change the proposal slice or the spec requirement (its name is the label) and re-run the script.
    - The H1 page title ALWAYS ends with " FSD" (e.g. "CHK - Checkout Payments FSD") and the header card H2 is "## General FSD Information" (type-specific, never a generic "Document Card"); the status field is labelled "FSD Status".
    - Approval groups (H3 under the General FSD Information card) — each row is a headerless `role | status | name` (the role leads because column 1 becomes the wiki's Content Properties key the approval matrix aggregates on). The delivering-org group is ALWAYS titled `Astound Approval` (STATIC, never taken from CONTEXT) and its roster carries the default FSD roles SA/FE/BE/QA (one row each) seeded `TBC`, substituting real names from CONTEXT when present; the client group is titled `<Client Org> Approval` from CONTEXT and carries one TBC row. Every row `not started` on a fresh copy.
    - Client-facing hygiene (of the enriched, LLM-owned content) — no internal paths/artifact names, unresolved internal decisions, code tokens, or consumed-dependency vendor names; RQ/WBS codes stay (client trace vocabulary).
    - Open Questions belongs to the client review cycle — emit the template's review sentence and its bare table header with no rows (reviewers add rows on the published page); never author a row.
    - Write working copies to openspec/changes/<name>/fsd/<feature>.md. Publish to Confluence only in the approval flow; EXTEND work starts from the live Confluence page.
    - Visualization is the LLM-owned section required in every requirement block (alongside the script-owned sub-sections); describe the needed screens as text — the meaningful states and desktop/mobile surfaces — and the BA attaches images to the published page later (existing images are never overwritten); never fabricate an image or a state the behaviour does not imply.
    - Out-of-scope splits into Change Requests (any change to signed BRD; status = the grooming decision) and Deferred Requirements (same scope, later).
  isd:
    - Generate only after the Grooming Approval Gate passes and only when the delivery scope is integration (a functional change publishes an FSD instead — never both) — endpoints, contracts, auth scopes, or external systems.
    - SCAFFOLD-FIRST — the "## In Scope Functional Requirements" section is filled DETERMINISTICALLY by generate-integration-artifacts.mjs (User Story + Acceptance Criteria verbatim from the covering proposal slice, Key behaviours as a table from the covering spec requirement(s), with a bold sub-header row per requirement name when several share the WBS; NO Visualization — an ISD is a contract, not a UI doc); it also bootstraps the working copy and writes stories.md. Run the scaffold script FIRST, then author the rest of the ISD (Requirements table, Integration Specification, governance). Never hand-edit those three sub-sections, sub-header rows included — change the proposal slice or the spec requirement (its name is the label) and re-run the script.
    - Agnostic capability law — name and scope the ISD for the service capability, not its first consumer; consumers appear only as context and under Out Of Scope; the Requirements table and Integration Specification carry no user stories or consumer RQ rows. The shopper User Story appears ONLY in the script-owned In Scope Functional Requirements section (a projection of the covering slice, not authored scope).
    - Requirements table decomposes the integration (General row + one row per integration point); the Integration Specification restates design's contract (endpoints, parameters, data mapping, flow order) — invent nothing, defer undecided magnitudes to technical design.
    - Encode approved decisions exactly (call placement, key policy, quota/billing ownership, release prerequisites, privacy bounds); vendor mechanics welcome, internal repo paths and our-code wiring are not.
    - Fresh working copy — the H1 page title ALWAYS ends with " ISD" (e.g. "Acme Payments Integration ISD"); ISD Status `draft`; ISD shares the FSD chrome skeleton (## General ISD Information card, then H3 approval groups, then ## Reference Materials, then the body); each approval row is a headerless `role | status | name` (the role leads because column 1 becomes the wiki's Content Properties key the approval matrix aggregates on); the delivering-org approval group is ALWAYS titled `Astound Approval` (STATIC, never taken from CONTEXT) and its roster carries the default roles FA/FE/BE/QA (FA = this org's name for BA) seeded `TBC`, plus a client group titled `<Client Org> Approval` from CONTEXT, every row `not started`; Open Questions emitted empty — the review sentence plus its bare table header, no rows; never author a Change History section (the chrome appends a Document Change Log footer); write to openspec/changes/<name>/isd/<service-integration>.md and publish only in the approval flow.
