name: feature
version: 1
description: |
  Three-stage feature workflow.
  Proposal stage (/opsx:propose): discovery -> design -> proposal -> grooming -> human approval gate -> specs, with optional publication artifacts.
  Planning stage (/opsx:plan): technical-design -> tasks.
  Implementation stage (/opsx:apply): execute tasks and update progress.
  fsd and isd are conditional: generate only when warranted. Only specs, technical-design and tasks are on the critical path to apply. Stories are NOT a schema artifact: they are generated deterministically from proposal + FSD (+ design) by the openspec-workflow functional-artifacts script (generate-functional-artifacts.mjs, which also projects the FSD) at /opsx:propose, and re-synced at /opsx:propose-approved (which creates Jira).

artifacts:
  - id: discovery
    generates: discovery.md
    description: Requirements discovery — source/evidence inventory, affected capability enumeration, CR candidates, open questions
    template: discovery.md
    instruction: |
      PURPOSE:
      Discovery is the first BA/SA artifact. It reconciles source requirements,
      decisions, affected capabilities, CR candidates, open questions,
      cross-cutting requirements, and publication targets before proposal.md.
      It extracts and classifies; it does not approve scope, invent facts,
      decide implementation, or write proposal/specs.

      AUTHORITY ORDER:
      1. Source inputs and evidence from project-context, existing
         `openspec/specs/`, current implementation, legacy/live storefront
         surfaces, and committed design assets are the factual source of truth.
      2. This `discovery` instruction is the artifact contract: follow it for
         classification, allowed values, gates, and quality bar.
      3. The `discovery.md` template defines section order and table shape.
      4. Project `config.rules.discovery`, workflow rules, and skills provide
         supporting context; they do not override this artifact contract.

      DECISION KERNEL:
      - FIRST clear the DELIVERY SCOPE GATE before any template section. If it
        resolves to `ambiguous` / bundled, output ONLY the decomposition and stop.
        The remaining rules apply only after one delivery scope is resolved.
      - Trace every source requirement once, preserving real RQ/WBS identifiers
        and source wording.
      - SCOPE DISPOSITION is owner-based — this is the ONE law for `in scope` vs
        `out of scope`, and every section below defers to it (no section restates a
        competing test). A signed requirement is `in scope` when THIS change closes
        its acceptance criteria, WHETHER it builds the work itself OR consumes /
        configures the selected service/vendor that already fulfils it. It is
        `out of scope` ONLY when the deliverable is owned by a SEPARATE change / WBS
        / team (another feature FSD, a consumer integration, a platform-wide
        concern) or is consumed by a DIFFERENT surface — that owner is then recorded
        as a Dependency. A VALID out-of-scope owner is a NAMED separate change / WBS
        / team / feature FSD that DELIVERS the row as its own workstream. A vendor
        console, hosted authoring / no-code studio, or an operator / author who
        merely publishes settings is NOT such an owner and NEVER pushes a row out of
        scope: a row THIS change closes by consuming / configuring that vendor stays
        `in scope`, with the console/authoring surface listed as a Dependency.
        Consuming, rendering, or reading a service/vendor does NOT
        by itself push a row out of scope: a vendor-hosted / no-code /
        externally-authored artifact THIS change consumes to satisfy an in-scope
        requirement stays `in scope`, and its authoring surface is listed under
        Dependencies. A shared vendor / supplier / WBS prefix decides nothing on its
        own.
      - DELIVERY MODE is a SECOND, orthogonal axis recorded per in-scope row as a
        current-state FACT, chosen by the ACTOR = the action THIS change performs on
        the row: `build` (THIS change writes the connector / UI / code), `consume`
        (THIS change uses a ready vendor/service capability or an already-published
        artifact AS-IS — including one authored elsewhere by the client, e.g.
        referencing a published style/preset ID), or `configure` (THIS change ITSELF
        sets the vendor-hosted / no-code settings). If the settings are authored /
        published by someone else and THIS change only references or renders the
        result, the mode is `consume`, not `configure`. Out-of-scope and deferred
        rows use `—`. Discovery MAY inspect existing code / specs / the live surface to
        record this fact; it does NOT choose the reuse-vs-SDK-vs-from-scratch
        approach — that deeper choice remains design's Solution Approach.
      - Enumerate every touched capability — existing ones modified or retired, and
        new ones to add.
      - Scope that changes WHAT is in or out versus the signed BRD is a Change
        Request candidate; do not silently absorb it into confirmed scope.
      - Open Questions refine already-known scope; they must not duplicate Change
        Request topics.
      - Discovery CRITICAL means the WHAT/scope/acceptance is unclear enough that
        proposal.md would likely be wrong. HOW/refinement decisions are NICE-TO-HAVE
        and flow to grooming/design.
      - The Discovery Gate is a management interface: the first checkbox must
        literally match whether any CRITICAL Open Question remains Open.
      - Topic partition (one place per topic):
        - Signed source requirement -> Requirements Trace.
        - Signed later-phase/could-have/postponed row -> `deferred` in
          Requirements Trace, not CR.
        - New/changed WHAT on this change's owned surface -> Change Request
          Candidate, not Dependency or Requirements Trace.
        - HOW/refinement of known scope on the owned surface -> Open Question,
          not CR.
        - External service consumed by an in-scope requirement and not owned here
          -> Dependency.
        - Service needed only by an unapproved CR -> stays with CR, not Dependency.
        - HOW owned by another feature/integration -> out-of-scope/dependency note,
          not this change's Open Question.

      DELIVERY SCOPE GATE (blocking — evaluate BEFORE authoring anything):
      This gate decides the one delivery scope. Produce discovery only after it
      resolves to `functional` or `integration`. If it resolves to
      `mixed / unresolved`, output only the decomposition; emit no discovery
      sections, tables, or Discovery Gate.

      Scope classification algorithm:
      1. Identify the delivery surfaces in the sources.
         - `functional surface`: storefront UI/UX, navigation, page/route changes,
           shopper-facing copy, accessibility, SEO/redirects, user journeys, or
           feature behaviour a BA/client would review.
        - `integration surface`: a service capability that needs connector work in
          THIS change: new/changed API or service contract, auth/scopes, data
          mapping, credentials/keys/quotas/billing, security, errors, or an open
          client-vs-server/proxy call decision. This applies to third-party SaaS
          and internal services. A service is NOT "just a dependency" while any
          key/billing/quota/proxy/contract/security decision is open. Existing
          account/key/cloud project does NOT mean already integrated; zero open
          connector decisions does. An unresolved client-vs-server/proxy decision
          alone makes the service an integration surface, not a functional HOW
          refinement or NICE-TO-HAVE question.
      2. Count integration surfaces by service boundary. Each distinct service is
         a separate integration candidate. Do not merge unrelated services into
         one integration because a single feature consumes them.
      3. Read ONLY an explicit, user-stated scope signal: a stated role (BA vs
         SA/architect), an explicitly chosen service capability, or an explicit
         "functional-only" / "integration-only" instruction. The name of the change
         or feature (e.g. `<feature>`, `add-<feature>`) is NOT a scope
         signal — it names the feature, not the delivery owner. Likewise, invoking
         the workflow on a change (e.g. `/opsx:propose <change>`) selects WHICH
         change to work on; it is not a delivery-scope selection and does not signal
         `functional`. Do NOT infer `functional` from the fact that the sources
         describe a storefront feature, that the BRD focuses on shopper experience
         (WHAT), that the user is "proposing the feature", or from the change slug.
         Only when such an explicit signal exists does it resolve the one owned
         surface:
         - `functional`: the user explicitly owns the feature surface. Integrations
           are dependencies; record them in Source Inventory and requirement
           Notes, not as owned capabilities or ISD targets.
         - `integration`: the user explicitly selected one concrete service
           capability. That service is the only owned scope. Consumer UI and all
           other services are out of scope with notes naming the owning change.
      4. Decide the outcome. `functional` and `integration` are BOTH resolved
         outcomes that REQUIRE an explicit signal from step 3 — neither is a
         default:
         - No integration surface exists at all (step 1 found only a functional
           surface): scope is `functional`; proceed to author.
         - An explicit signal exists (step 3): resolve to that owner accordingly.
         - Otherwise — one or more integration surfaces exist AND step 3 found no
           explicit signal — the scope is `mixed / unresolved`. STOP before
           discovery and return a decomposition: the functional FSD change plus one
           agnostic ISD change per distinct integration surface, with the
           capability/service each owns and the target document each would produce.
           Ask the user which single scope to pursue.
         This STOP is mandatory. Do NOT fall back to `functional` because the
         feature is shopper-facing, because the BRD focuses on the shopper journey,
         because the integrations "look like dependencies", or because "no new
         internal contract" is being built. The absence of an explicit signal is
         precisely what forces the STOP — it is never a reason to pick `functional`.

      Rule of thumb: a service with any open key/billing/quota/proxy/contract/
      security or client-vs-server decision is an integration surface, not a
      dependency; an integration change owns exactly one service capability and one
      discovery owns exactly one surface, so mixed surfaces with no explicit user
      choice STOP with the decomposition.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Identify and cite source inputs/evidence (INPUTS AND SOURCE POLICY).
      2. Read sources in intake order; separate signed scope, current behaviour,
         meeting decisions, implementation evidence, and derived summaries.
      3. Clear the DELIVERY SCOPE GATE before trace/capability dispositions.
      4. Extract Requirements Trace for the resolved scope (including consumed
         sibling requirements from the cross-requirement entanglement pass in
         INPUTS AND SOURCE POLICY).
      5. Enumerate affected capabilities.
      6. Record Dependencies (including platform/OOTB-managed capabilities from the
         same entanglement pass).
      7. Surface Change Request candidates.
      8. Write Open Questions.
      9. Evaluate Cross-cutting Requirements.
      10. Record Delivery Scope & Targets.
      11. Build the Document Consumption Guide from the completed sections
          (DOCUMENT CONSUMPTION GUIDE ROWS); derived last but rendered directly
          after the Executive Summary, above the detail sections.
      12. Answer the Executive Summary question from the completed sections
          (CONTENT RULES).
      13. Set Discovery Gate checkboxes from the final Open Questions table and the
          Document Consumption Guide.

      INPUTS AND SOURCE POLICY:
      - Fill Discovery Source Inventory with inputs/evidence actually used — not
        document-only: requirements, meeting notes, tracker records, baseline specs,
        current/legacy code evidence, legacy/live URLs, design assets, API/contracts,
        config, and explicit availability checks as needed.
      - Retrieve project documents through project-context using the canonical Source
        Lookup table in the specifications rule; use `openspec/specs/`, inspected
        current implementation, or legacy/live storefront references for current
        behaviour.
      - A research report committed for this change under
        `openspec/changes/<change>/research/<slug>/report.md` is a valid, citable
        input for an empirical fact no document, baseline spec, or code reading
        settles. Anchor the fact as `<that path> · Q#`, carrying the finding's
        recorded status and basis as they stand — an unconfirmed or
        documentation-only finding is never restated here as settled.
      - If no relevant BRD / requirements source is found, ask the user to point to
        it or confirm "no BRD" for a small change. Record `No BRD - <one-line reason>`
        and keep downstream sections light. Never invent BRD rows.
      - If no relevant workshop / meeting notes are found, ask whether any exist and
        can be added; if still none, record "none provided".
      - Visual source, when UI is affected: rely on committed assets under the change
        `assets/` folder and FSD/ISD source docs. If no design asset exists, record
        that explicitly in the Discovery Source Inventory; do not fabricate
        screenshots or layout details.
      - Prior-art / existing-solution evidence (BOTH flows): while enumerating
        capabilities, inventory what ALREADY EXISTS that could satisfy the need —
        installed or marketplace/partner cartridges, accelerator/platform modules or
        features, vendor-provided SDKs / client libraries / documented APIs — as FACTS
        in the Discovery Source Inventory (and requirement Notes), each with its
        grounding anchor (a returned project-context result, a vendor/marketplace URL
        the sources carry, or a code/config reference). Record "searched, none found"
        when nothing fitting exists (mirror the no-BRD / no-asset rule). FACT-GATHERING
        ONLY: discovery does NOT choose between reuse / SDK / from-scratch — that
        build-vs-reuse call is design's Solution Approach — and NEVER fabricates a
        cartridge, module, SDK, or API the sources do not support.
      - Cross-requirement & platform-capability entanglement pass (BOTH flows):
        run this per-requirement prove-membership pass and commit each result to
        the placement ledger BEFORE drafting the trace (mirror the integration
        obligation pass shape):
        1. ENUMERATE: for EACH owned (in-scope) requirement, list every OTHER item
           in CONTEXT it must consume or is constrained by to function — signed
           sibling requirements (ANY WBS family) AND platform/OOTB-managed
           capability surfaces (Business Manager config/attributes, Page Designer
           authoring, Campaigns / Promotions / Source Codes, Custom Site
           Preferences, Shopper Context). Scan across WBS families; a shared WBS
           prefix neither includes nor excludes a row.
        2. JUSTIFY each enumerated candidate against the owner-based test (DECISION
           KERNEL): does a SEPARATE change / WBS / team own this item's deliverable,
           or does THIS change close it (by building OR consuming/configuring)?
           Commit ONE ledger line with the one-line proof recorded in the emitted
           `Note`:
           - owned-here -> THIS change closes its acceptance criteria (builds it OR
             consumes/configures the selected vendor that fulfils it) -> it stays its
             own in-scope trace row with a delivery mode (`build` / `consume` /
             `configure`) (already placed by the Topic / obligation partition; not
             re-placed here). A vendor-hosted / no-code artifact this change consumes
             stays here (mode `consume` / `configure`); its authoring surface is ALSO
             listed under Dependencies.
           - owned-elsewhere(sibling) -> a SIGNED requirement whose deliverable a
             SEPARATE change / WBS / team owns (a DIFFERENT feature / integration /
             FSD that BUILDS or AUTHORS it as its own workstream, or a row consumed
             by a DIFFERENT surface) -> Requirements Trace `out of scope`, delivery
             mode `—`, affected capability = the owning capability (NEVER this
             change's own owned capability), Note names that owner and that the owned
             requirement consumes it; add the consumption backlink in the owned
             requirement's own Note.
           - platform-dep -> a platform/OOTB-managed capability surface the
             requirement relies on -> a Dependencies row (`platform config`, its
             availability status, the consuming requirement(s)), optionally noted on
             the owned requirement.
           Each committed line carries its grounding anchor; write "searched, none
           found" for a requirement that consumes nothing external.
        FAILED pass (redo steps 1-2 before drafting): an owned-elsewhere sibling
        pointed at this change's own capability or a generic `<feature>-ui` bucket;
        a requirement whose deliverable a SEPARATE change / WBS / team owns marked
        `in scope`; a vendor-hosted / no-code artifact THIS change consumes marked
        `out of scope` merely because it is vendor-authored or shares a WBS prefix
        (owner-based: consuming the selected vendor is `in scope`, mode `consume` /
        `configure`); a platform surface CONTEXT clearly shows the requirement
        relying on left off Dependencies; or a speculative pull-in (a requirement,
        attribute, or capability the sources do NOT show the owned requirement
        actually consuming). Discovery MAY inspect existing code / specs / the live
        surface to record the current-state delivery-mode FACT, but does NOT choose
        the build-vs-reuse approach (design's Gap Analysis / Solution Approach owns
        that), re-scope or resurrect an item the upstream deferred, or fabricate.
        Trace-lock unchanged: only signed requirements enter the Requirements Trace,
        and every signed requirement still appears exactly once.
      - Every `Reference / Anchor` MUST resolve to a source project-context actually
        returned or present in CONTEXT — never a plausible-looking URL, path, or ID
        you did not retrieve. When project-context returns an inbox file for a
        document, cite that inbox path; do not upgrade it to a synthesized wiki/live
        URL. Open cited inbox files/line ranges before relying on them. Subject to
        that grounding rule, the `Reference / Anchor` cell uses the exact anchor by
        source type:
        - project-context references use the returned workspace-relative inbox path
          plus lines, e.g.
          `.cursor/.project/project-context/inbox/meeting_notes/workshop.md:12-28`;
        - if project-context provides only an external identifier (e.g. a Jira key)
          and no file/line anchor, cite the identifier such as
          `project-context jira: PROJ-123` rather than inventing an inbox file;
        - baseline specs use `openspec/specs/<capability>/spec.md:<lines>` when line
          information is available;
        - code, config, and asset references use `file:line-start-line-end` when line
          information is available;
        - BRD/SRD/FSD/ISD/TSD wiki documents use the live Confluence URL or Page ID
          (optionally plus the section or exported file lines) ONLY when
          project-context supplied it; otherwise cite the inbox file/lines
          project-context returned — do not synthesize a Confluence URL;
        - live storefront surfaces use only a URL or route present in the sources; do
          not invent a hostname or a page the sources do not state.
        - For a REMOVE capability with no legacy implementation file anchor from
          project-context, record `— (legacy implementation not found via
          project-context; baseline spec and live URL above serve as current-state
          evidence)`. Do NOT invent a workspace path, filename, or line range.
        Do not cite a whole file when project-context returned a narrower line range.
        Mark missing inputs explicitly.
      - FSD/ISD source lookup results may be Source Inventory evidence, but
        `NEW` / `EXTEND` belongs only in Delivery Scope & Targets.
      - The user's stated delivery intent (role, chosen scope, selected service)
        is a legitimate input. Record it as `user request` or the command argument;
        do not invent a project-context file for a verbal decision.
      - Source intake order:
        1. Signed BRD/SRD: canonical WHAT and official RQ/WBS codes.
        2. Existing OpenSpec baseline specs and current implementation / legacy
           code: current behaviour and capability ownership; use to decide
           ADD/MODIFY/REMOVE.
        3. Legacy or live storefront surfaces / URLs affected by the change:
           current user journey, SEO exposure, redirects, retirement/migration
           evidence, and visual/current-state context.
        4. Meeting notes/workshops: confirmed decisions, CR candidates, open
           questions, implementation constraints. They refine the signed source;
           they do not create new signed requirements unless explicitly stated.
        5. Jira/FSD/ISD/TSD/design assets: supporting scope, acceptance, visual,
           publication, or integration context when present.
        6. API/contracts, configuration, analytics/tracking plans, content/CMS
           inventory, vendor docs, or other domain inputs: include when they affect
           scope classification, open questions, cross-cutting requirements, or
           publication targets.
        7. Derived summaries / known-unknown indexes: convenience only — a checklist
           against the primary sources, not additional facts.

      CONTENT RULES:
      - Executive Summary — answers, from the detailed sections as they stand NOW:
        what has this file settled, what stays open, is the change ready? Record it
        as a READER MAP that orients a human before the detail — never a retelling.
        Its machine-readable counterpart is the Document Consumption Guide.
        - Answer from the body — Requirements Trace, Affected Capabilities,
          Dependencies, Change Request Candidates, Open Questions, Cross-cutting
          Requirements, Delivery Scope & Targets — stating what they say NOW. Every
          statement must already be readable in one of them; this block is never a
          new source of truth, and a statement they no longer support is wrong.
        - Place it immediately after the title, before Discovery Source Inventory.
        - Write it after the detailed sections are final, so it reflects final facts
          and gate state.
        - Open with the problem/change context and why it matters, including one
          source-grounded business-value sentence. Then answer, in order:
          - WHAT THIS FILE SETTLES: the delivery scope, the SHAPE of the requirement
            set (how much in scope, deferred, owned elsewhere), which capabilities
            move, and which section holds each — a route to the detail, not the detail.
          - WHAT STAYS OPEN: the subjects still undecided and their register (Open
            Questions, Change Request Candidates).
          - READINESS, worded consistently with the Discovery Gate. If any CRITICAL
            Open Question remains Open, do not say the change is ready for proposal.
        - Name SUBJECTS, never identifiers: "the redirect for the retired /legacy-path
          URL", not "Q2". Counts/magnitudes are welcome ("three refinements", "nine
          requirements in scope") — they make this block cheaply checkable against
          the Document Consumption Guide.
        - Do not re-list a table's rows. No RQ/WBS ID, capability inventory, CR/Q
          identifier, exhaustive scope list, acceptance criterion, implementation
          detail, or implied approval belongs here — those are the Document
          Consumption Guide's job or the detail sections' own.
      - Delivery Scope (resolved by the DELIVERY SCOPE GATE; this section defines
        the allowed values and their effect):
        - `functional`: delivers a client/user-facing feature surface (normally
          FSD). It may depend on integrations, but does not own or specify their
          contracts. Record integrations in Source Inventory and requirement Notes.
        - `integration`: delivers a service-oriented capability (normally ISD).
          Name it for the service/capability, not the first consumer — e.g.
          `<provider>-integration` (a payments, search, or shipping provider), not
          `<consumer-feature>-<service>`.
          For integration scope, the Executive Summary, Affected Capabilities,
          Delivery Scope & Targets, and working-copy paths must use the
          service-oriented change name. Consumer feature names are context only.
          If the user-selected service differs from the command/change name,
          derive the artifact identity from the selected service, not from the
          consumer feature: `openspec/changes/<service-change>/isd/<service>.md`.
        - Bundled asks combining a substantial functional surface with real
          connector work, or an integration ask that does not name the service, are
          NOT one discovery: stop and return the DELIVERY SCOPE GATE decomposition.
          A feature references agnostic integrations; it does not own them. Trivial
          client usage of an already-governed integration may remain functional
          when no contract/credential/data-mapping work is created.
      - Requirements Trace:
        - CLOSED-SET GATE (run FIRST, before any disposition; BOTH scopes) — a
          mechanical enumeration, not a scope judgement:
          1. SOURCE_RQ_SET = a LITERAL scan of EVERY `RQ-<id>` token appearing
             anywhere in the signed source set (the BRD/SRD and any additional
             requirement sources provided). List them all; do NOT pre-filter by
             scope, WBS family, or owner, and never add an id the sources lack.
             This INCLUDES signed rows another change / WBS / feature FSD authors
             or owns (for example Page-Designer-owned rows surfaced in the
             sources): they stay in SOURCE_RQ_SET and are TRACED `out of scope`,
             NEVER dropped. "Owned elsewhere" selects the disposition (out of
             scope), it never removes the row.
          2. After the placement ledger is built, compute TRACE_RQ_SET (the rows
             you are about to emit) and require TRACE_RQ_SET == SOURCE_RQ_SET
             (zero-diff). Any id in `SOURCE_RQ_SET − TRACE_RQ_SET` is a DROPPED
             signed row and a FAILED pass: place it before drafting — a
             sibling/other-owned row goes `out of scope` (delivery mode `—`, its
             owning capability, owner named in the Note), NEVER deleted — then
             re-run the check until the difference is empty. This is the executable
             form of the trace-lock (source fidelity): no signed row is dropped.
        - Extract every requirement in the source set, including later-phase,
          deferred, out-of-scope, and CR-candidate items.
        - Trace-lock (source fidelity): EVERY signed source row is extracted and
          appears exactly once, even when this change does not build it — never omit
          a signed row. Disposition follows the owner-based SCOPE DISPOSITION law
          (DECISION KERNEL): a row THIS change closes by CONSUMING / CONFIGURING the
          selected vendor is `in scope` (delivery mode `consume` / `configure`), with
          the vendor's authoring surface listed under Dependencies; a row whose
          deliverable a SEPARATE change / WBS / team owns — or that a DIFFERENT
          surface consumes — is traced `out of scope` (delivery mode `—`) against its
          owning capability. A signed row the change neither closes nor consumes (an
          unrelated same-packet or same-WBS-family row) is likewise traced
          `out of scope` for source fidelity. This is DISTINCT from the "no
          speculative whole-family pull-in" rule, which only bars inventing
          consumption links or unsigned items — it never licenses dropping a signed
          row.
        - Preserve the RQ ID and the requirement's clean/leaf WBS code — ONE
          WBS per requirement (e.g. `<CAP>.<REQ>`), the SAME code the FSD block
          heading and the proposal Delivery Breakdown `Covers` reuse downstream
          as the stories-generation join key; NOT a coarse parent-only grouping
          (`<CAP>`). When the source only gives a parent code, extend it to the
          per-requirement leaf. Also preserve title, citation, requirement
          text, requirement details, disposition, delivery mode, affected
          capability, and notes. Requirement and Requirement Details are two separate columns
          that mirror the source: Requirement holds the verbatim requirement
          (e.g. the user story); Requirement Details holds the verbatim detail
          list from the source, preserving its numbering/structure, and is `—`
          when the source has no separate details. Do not paraphrase or merge
          the two. Requirement Details are HIGH-LEVEL SEED detail from the SRD,
          captured verbatim: an SRD carries only high-level intent, so Details may
          contain anything the source happened to note (shopper journey, UI
          behaviour, a named vendor / SDK, a constraint) and are deliberately NOT
          finished acceptance criteria — those do not exist yet at this stage.
          Downstream (proposal, FSD, ISD) ELABORATES this seed into the criteria
          for what THAT artifact owns; it never lifts a Details line as a
          ready-made criterion. The `Requirement` cell is the CANONICAL story text: every
          downstream artifact (the proposal Delivery Breakdown slice, the FSD
          block, stories.md) copies it VERBATIM, joined by WBS — so author it to
          final signed wording here and nowhere else. Story wording is a
          discovery responsibility; no later phase re-authors or re-personas it.
        - Use dispositions: `in scope`, `out of scope`, `deferred`,
          `CR candidate`, per the owner-based SCOPE DISPOSITION law (DECISION
          KERNEL): `in scope` when THIS change closes the AC (build OR
          consume/configure the selected vendor); `out of scope` when a SEPARATE
          change / WBS / team owns the deliverable or a different surface consumes
          it.
        - Every in-scope row records a Delivery mode — `build`, `consume`, or
          `configure` — as a current-state FACT (DELIVERY MODE axis, DECISION
          KERNEL); out-of-scope and deferred rows use `—`. The Delivery mode column
          sits between Disposition and Affected capability. Enumerate-then-justify
          each row: first prove the owner (in vs out), THEN record how an in-scope
          row is satisfied (build/consume/configure); keep the one-line proof in the
          Note. Delivery mode never changes a row's disposition — a `consume` /
          `configure` row is still `in scope`.
        - Notes capture short, grounded material findings: client wishes, workshop
          nuance, ambiguity, constraints, or `Q#`/`CR#` links. Do not restate the
          requirement or invent notes. Use `—` when nothing material was found.
        - Use `deferred` for source requirements explicitly described as later
          phase, could-have, future, or postponed while still belonging to the
          same product scope. Use `out of scope` (per the owner-based SCOPE
          DISPOSITION law) when the deliverable is owned by a SEPARATE change / WBS
          / team or consumed by a different surface, rather than postponed.
        - Every row names an Affected capability, including `deferred` and
          `out of scope` rows: use the capability that owns the requirement (for
          out-of-scope items, the owning feature/integration). Never leave the
          Affected capability cell blank or `—`. This cell is the OWNING
          capability / workstream of the ROW's deliverable — a routing label, and
          for `out of scope` / `deferred` rows a BEST-EFFORT attribution of who
          delivers it. It is NOT a claim that THIS change touches that capability:
          the Affected Capabilities section is a DIFFERENT, narrower set — only the
          capabilities THIS change ADDs, MODIFIEs, or REMOVEs. A row may name an
          owner that never appears in Affected Capabilities, and that is correct.
        - A capability THIS change ADDs, MODIFIEs, or REMOVEs is OWNED BY THIS
          CHANGE, so it is never the "separate owner" that pushes a row out of
          scope: a signed requirement whose deliverable is exactly that
          modification / retirement stays `in scope` (mode `build`) and names that
          capability. Only a capability delivered by a SEPARATE change / WBS / team
          makes a row `out of scope`.
        - If Delivery Scope is `functional`, keep functional requirements in
          scope and record the integrations/services they consume in the
          Dependencies section (a short cross-link in Notes is fine); do not create
          ISD requirements or integration capabilities in this change.
        - Functional trace lock with signed BRD/SRD: Requirements Trace contains
          signed rows only, plus signed-source rows that truly lack IDs. Baseline
          specs, current-state evidence, live URLs, and meeting notes inform other
          sections; they do NOT become `UNTRACKED-<n>` requirements.
        - For functional scope, apply Topic partition exactly.
        - For `integration` scope, run this selected-service obligation pass
          BEFORE filling Requirements Trace:
          1. Name the selected service/capability from the delivery-scope signal
             (for example, the one integration the architect asked to build).
          2. Write the service capability slug you will use consistently in the
             Requirements Trace, Affected Capabilities, and Delivery Scope target.
          3. For each signed requirement, ask: "does the selected service have to
             do real work for this requirement to function?"
          4. Commit each answer as that requirement's placement-ledger line BEFORE
             drafting, recording the delivery mode for in-scope rows:
             `RQ -> in scope -> <build|consume|configure> -> Requirements Trace ->
             <service slug>` (THIS change closes the AC — building the connector, or
             consuming/configuring the selected vendor that fulfils it) or
             `RQ -> out of scope -> — -> Requirements Trace -> <owning capability
             slug>` (a SEPARATE change / WBS / team owns the deliverable, or a
             different surface consumes it). Copy the justification into the emitted
             row's `Note` for BOTH dispositions: an in-scope Note splits the
             service's backend slice from the functional remainder and states how it
             is delivered; an out-of-scope Note names the precise owning capability
             and why THIS change does not close it. `<owning capability slug>` is a
             concrete owning capability, never a generic `<feature>-ui` /
             `consumer-ui` bucket. A ledger or emitted row that points every
             out-of-scope row at one blanket owner, uses a generic UI bucket,
             leaves an owner blank / `—`, or marks no row in scope is a FAILED
             pass — redo steps 3-4 before drafting. Marking a vendor-family row
             THIS change consumes / configures `out of scope` by naming a vendor
             console, hosted authoring / no-code studio, or operator (e.g. a vendor
             studio) as its "owner" is ALSO a FAILED pass: that surface is a
             Dependency, not a separate delivering owner, so the row is `in scope`
             (mode `consume` / `configure`).
        - Integration obligation rationale: an integration change invents no
          requirements; it exists because signed functional requirements need the
          selected service, so the trace stays anchored to the signed SRD.
          Shopper-facing wording can still carry a backend obligation.
          - SOURCE-PARTITION FIRST (the primary test): well-formed sources SEPARATE
            requirements into a functional/consumer family (the feature's UI,
            journey, navigation, copy — what a shopper does) and an
            integration/vendor family (rows written from the selected service's
            side, often under their own integration WBS grouping, each naming the
            vendor obligation AND the consumer requirement that consumes it). When
            the source carries this split, the integration change OWNS its own
            vendor-family rows (`in scope`, all under the ONE selected-service
            capability) and dispositions EVERY functional/consumer-family row
            `out of scope` to its owning consumer feature — a SEPARATE change that
            owns that surface (owner-based SCOPE DISPOSITION law) — EVEN WHEN a
            consumer row and a vendor row share shopper-facing wording. The overlap
            means the consumer row CONSUMES the service, not that this integration
            owns the consumer surface: the dedicated vendor-family row already
            carries the backend work, so the parallel consumer row is NOT a second
            in-scope row here. Marking both in scope double-counts one obligation and
            is a FAILED pass.
          - DELIVERY MODE, NOT SCOPE (apply to EACH in-scope vendor-family row):
            owning a vendor obligation does NOT require building code for it. A
            vendor-family row THIS change closes stays `in scope` regardless of how
            it is delivered. A consumed or configured VENDOR-HOSTED / no-code /
            externally-authored artifact (a hosted console, a published
            style/config/preset ID, a dashboard-managed setting) is `in scope` — NOT
            out of scope — and its authoring/hosting surface is ALSO listed as a
            Dependencies row; it becomes `out of scope` ONLY when a SEPARATE change /
            WBS / team owns that deliverable. A shared vendor / supplier / WBS prefix
            does not decide mode or scope on its own. Record the mode itself with the
            ONE delivery-mode law in the DECISION KERNEL (the actor test) — this pass
            does not restate or vary it; the finer build-vs-configure responsibility
            split is resolved in design's Gap Analysis.
          - `in scope` (yes): the requirement is a vendor-family obligation the
            selected service must fulfil, whether THIS change builds the connector
            for it OR consumes/configures the service that performs it. Affected
            capability is this integration; record its delivery mode (`build` /
            `consume` / `configure`); add a Note splitting the service's backend
            slice from the functional remainder and stating how it is delivered, not
            an over-claim of the whole requirement.
            FALLBACK for an UN-partitioned source: when the source carries NO
            dedicated vendor-family row for an obligation, a lone shopper-facing
            requirement that can ONLY be satisfied by the service's core function
            carries that backend slice in scope even though its wording is
            shopper-facing — e.g. for a payment provider with no separate
            authorization row, authorizing and capturing a charge is the service's
            work. This fallback does NOT apply once a
            dedicated vendor-family row already exists (see SOURCE-PARTITION FIRST).
          - `out of scope` (no): the requirement's deliverable is owned by a SEPARATE
            change / WBS / team, or consumed by a different surface — feature UI,
            navigation, SEO, accessibility, localizable copy, a device hand-off, data
            owned by another service, a different integration, or an obligation a
            dedicated vendor-family row already owns. Affected capability is that
            owning feature/service, not this integration; delivery mode `—`.
          The trace still lists EVERY signed row. An integration trace owning NONE
          of them is a contradiction (nothing to build); if every row is out of
          scope or points to the consumer feature, re-check the selected-service
          obligations.
        - ONE capability (collapse): ALL of the selected service's in-scope
          vendor-family rows belong to ONE agnostic capability under a SINGLE slug
          named for the service (the `<provider>-integration` archetype), used
          verbatim across the Requirements Trace, Affected Capabilities, and the
          Delivery Scope target. A requirement identifier (its WBS / RQ code) is a
          row key in the trace, NEVER an Affected-Capabilities name. Do NOT split
          one service into per-obligation or per-requirement capabilities (e.g. a
          charge-authorization obligation and a payment-form render obligation of the
          SAME provider are ONE capability), and do NOT name the capability after a consumer
          feature. Two owned capabilities are correct ONLY when the sources name
          two DISTINCT services/suppliers/accounts. The collapse folds ALL in-scope
          obligations of the selected service — whether delivered by `build`,
          `consume`, or `configure` — into the ONE capability; only rows whose
          deliverable a SEPARATE change / WBS / team owns stay `out of scope` and are
          never folded in.
        - Integration obligation examples (a payment provider stands in for
          any integration archetype — search, shipping-rate, ratings):
          - The selected service owns its core function and interface governance
            (a render surface it provides, the operation it performs, key/billing/domain
            restrictions, the client-vs-proxy call decision) when the sources assign
            those facts to that service.
          - It does NOT own consumer UI synchronization, the consumer page's own
            content rendering, its filters or navigation links, localizable
            storefront copy, accessibility of the consumer page, or a deep-link to
            the shopper's native provider unless the source explicitly says that
            service performs those parts.
          - A second supplier (e.g. a fraud-screening service alongside a payments
            service) is a separate integration when the sources name a different
            supplier/account/contract. Do not merge distinct suppliers into one
            integration trace.
        - For integration scope, Affected Capabilities contains only capabilities
          this change owns. Do not list consumer capabilities (the consuming
          feature, its navigation, or retired legacy pages) unless this
          integration change actually modifies or retires them.
        - If a signed BRD/SRD exists, do not mint `UNTRACKED-<n>` rows for
          meeting-only scope that deviates from that BRD/SRD. Put that scope only
          in Change Request Candidates.
        - Use `UNTRACKED-<n>` and `WBS-TBD` only when the active requirements
          source truly has no identifier: either there is no BRD/SRD and meeting
          transcripts are the primary requirements source, or the signed source
          contains a requirement with no ID. Do not invent official-looking codes.
      - Affected Capabilities:
        - `ADD`: the capability does not exist yet and must be created.
        - `MODIFY`: an existing capability changes behaviour.
        - `REMOVE`: an existing capability is retired or superseded by this
          change. Do not leave retired legacy capabilities as MODIFY; redirect,
          migration, or handoff work does not make a retired capability MODIFY.
        - Functional retirement pass: list every existing capability/page/surface
          this functional change replaces, retires, removes, or supersedes as
          `REMOVE`, even without a direct signed RQ row.
        - CAPABILITY CLOSED-SET GATE (run before drafting Affected Capabilities):
          do NOT derive the capability set from the Requirements Trace alone — an
          RQ-driven set misses a capability this change touches with NO signed RQ
          row (the retired-directory case). Instead walk a CLOSED set mechanically,
          like the Requirements-Trace token scan: enumerate BASELINE_CAP_SET = every
          `specs/<capability>` baseline block present in CONTEXT (the same baseline
          spec groups you list in the plan), then give EACH one an explicit verdict —
          MODIFY (its behaviour changes), REMOVE (CONTEXT marks it retired /
          superseded / replaced, even with NO signed RQ row — e.g. a directory or
          page this change removes), or untouched (omit from the table) — and add ADD
          rows for new surfaces an in-scope RQ builds. TOUCHED_CAP_SET is the ADD /
          MODIFY / REMOVE verdicts. A baseline block you listed in CONTEXT but left
          without a verdict, or a TOUCHED_CAP_SET member missing from the table, is a
          FAILED pass — resolve it before drafting.
          Flow scope for this walk: a REMOVE / MODIFY verdict is only for a baseline
          capability THIS change itself retires or whose behaviour it changes. For
          integration scope, a consumer baseline capability the integration merely
          enables or that consumes it does NOT change behaviour here — mark it
          `untouched`; an integration change ADDs only its own agnostic service
          capability and never MODIFIEs or REMOVEs a consumer capability owned by a
          separate functional change (per the integration-scope rule above).
        To enumerate affected capabilities, use the project-context skill to
        search the baseline specs, but do not rely on it alone: also inspect
        `openspec/specs/` directly and run `openspec list`. Cross-check the
        Requirements Trace so every affected capability is covered. A single-row
        table on a multi-area functional feature is almost certainly a miss, but
        a focused agnostic integration change may legitimately have one
        capability.
        - Decomposition (how many rows, and which): match the BASELINE
          capabilities that already exist in `specs/` first — do NOT invent a
          finer-grained sub-capability breakdown than the baseline carries. When
          the baseline is a single capability for the surface, this change is
          ADD/MODIFY/REMOVE on THAT capability, not a fabricated split into per-
          feature sub-capabilities. Decide ownership top-down, stopping at the
          first match: (1) group by surface/page first — behaviour on exactly one
          surface stays under that surface's capability; (2) lift ABOVE a surface
          only when it has its OWN external integration / data source (→ own
          capability) or is REUSED across surfaces (→ own shared capability); (3)
          split WITHIN a surface only for large self-contained neighbour areas —
          states (empty / loading / error), nested sub-components, and page-local
          shared rules stay in the surface capability. A requirement's `Affected
          capability` cell MUST be an existing baseline capability (or a genuinely
          new one under an `ADD`), never a re-pointed or invented sub-capability.
      - Dependencies:
        - List a service here only after proving an IN-SCOPE requirement (not a CR
          candidate) relies on it while this change does NOT own it (third-party
          integration, another service integration, or already-integrated data/API
          service). A service needed only by an unapproved CR candidate — including a
          new integration ask surfaced here — stays with that CR (see Topic
          partition), not in Dependencies.
        - Include a row when an in-scope requirement needs a service owned by a
          different change to work; record consuming requirement(s) and integration
          status.
        - Status is a fact, not a guess: state `already integrated` or `separate
          integration change` only when sources support it; else unknown.
        - Do not turn a Dependency into an Affected Capability: this change does not
          own it.
        - Write "None." when this change consumes nothing external, e.g. an agnostic
          integration consumed by others but depending on nothing.
        - For integration scope, the selected service is NOT a Dependency. Do not list
          consumer-feature dependencies unless the selected service itself needs them
          for its in-scope obligation.
        - Browser/platform capabilities (e.g. geolocation permission, native browser
          APIs, device hand-offs) are not Dependencies unless the project owns or
          integrates a separate service for them. Record them as requirement notes,
          privacy/cross-cutting constraints, or Open Questions when they need
          refinement.
        - Do not decide consumer call/proxy/key mechanics here; those belong to the
          owning integration change.
      - Change Request Candidates:
        - Use this table for scope that deviates from the signed BRD AND falls on
          this change's owned surface: new, removed, or altered behaviour from
          transcripts, constraints, or stakeholder input.
        - A CR is about WHAT changes versus the signed BRD. A pure HOW-to-implement
          choice is not a CR; put it in Open Questions if it still needs discussion.
        - Refinements such as redirect target/type, special-data availability,
          call/proxy mechanics, key/billing guardrails, or display details are Open
          Questions unless they change WHAT is built.
        - Do not create Requirements Trace rows, `UNTRACKED-<n>` IDs, or WBS
          placeholders for CR topics that are not signed source requirements.
        - Do not write an Open Question like "Should we include <new non-BRD
          feature>?" for a CR topic — the CR row status/disposition tracks that
          decision.
        - Use "None." if there are no CR candidates.
      - Open Questions:
        - Use this table for ambiguity, missing decisions, or stakeholder input that
          refines already-known scope.
        - Write concrete, answerable questions. For a technical constraint, add a
          Tech note so the client can weigh the trade-off.
        - Severity is decided by WHAT vs HOW, not by how hard the item feels:
          - `CRITICAL`: the WHAT is unclear — scope, requirement, or acceptance
            criteria ambiguous enough that proposal.md would likely be wrong. You
            cannot write a correct requirement set until it is answered.
          - `NICE-TO-HAVE`: a HOW-to-implement or refinement decision on the owned
            functional surface that does not change WHAT is built and can be settled
            in grooming/design, e.g. redirect type (301 vs 302), exact redirect
            target, or a display refinement when the backing data schema is not yet
            known. A consumed integration's call/proxy/key/contract mechanic is NOT a
            functional Open Question (see the functional-surface restriction below).
        - When unsure, default to NICE-TO-HAVE. Zero CRITICAL questions is normal when
          requirements are clear; do not manufacture one.
        - Valid Open Questions: redirect target/type for a retired URL, a display
          refinement when backing data support is unknown. NOT Open Questions: whether
          to accept a non-BRD new feature already listed as a CR, whether to absorb a
          CR into confirmed scope, or a constraint already signed in the BRD/SRD (e.g.
          a stated privacy rule) — a settled requirement is not an open decision.
        - Functional (FSD) Open Questions restriction — prove membership before adding
          a row: it must be about the owned functional surface's WHAT, acceptance, or
          an in-scope refinement. If it is a call/proxy/key/quota/contract mechanic of
          a consumed integration, it FAILS the test and belongs to that integration's
          SA/ISD discovery — record it in the consumed dependency's Notes, not here.
      - Cross-cutting Requirements:
        - Evaluate Accessibility (WCAG), SEO, Consent/privacy, and i18n for this
          change. Mark each Applicable or N/A with a grounded one-line reason.
        - If the change adds, moves, retires, or redirects a URL/page, SEO is
          Applicable.
        - For integration scope, mark Accessibility, SEO, and i18n N/A unless this
          integration itself produces UI, an indexable route/page, or user-facing
          copy; do not carry the consumer feature's UI obligations into an agnostic
          service integration. Mark Consent/privacy applicable when this service
          handles geolocation, PII, browser keys, tracking, or similar
          privacy/security-sensitive data.
        - These are BA/SA-owned product requirements. Technical concerns (rendering,
          caching, security, performance) belong in architecture only when an
          SA-level decision is warranted; otherwise Planning handles them.
      - Delivery Scope & Targets:
        - Declare the delivery scope (`functional` or `integration`) and list only
          the FSD/ISD documents THIS change produces or touches.
        - A functional/user-facing surface normally needs an FSD target. If it
          depends on integrations, record those in Discovery Source Inventory and
          requirement Notes; add no ISD row unless this change owns the integration.
        - An integration surface (endpoints, contracts, auth scopes, external
          systems, Shopper APIs, a payment gateway, etc.) needs an ISD target — service-
          oriented and reusable by multiple consumers, never scoped as a child of a
          single feature.
        - `EXTEND`: a matching Confluence page exists; record URL/Page ID when
          available and the intended working copy path.
        - `NEW`: no matching page exists; record a lowercase kebab working-copy path
          under `openspec/changes/<name>/fsd/<feature>.md` or
          `openspec/changes/<name>/isd/<service-integration>.md`.
          For integration scope, `<name>` is the service-oriented change name derived
          from the selected service (e.g. `add-<service>-integration`) — NEVER the
          change/command name the workflow was invoked with, even when the scaffold
          paths here or the packet's `Change name:` show that consumer-feature name.
          An ISD working copy under the consumer feature's change folder is the exact
          defect this rule forbids.
        - Ask the user when EXTEND vs NEW is ambiguous. No `N/A` rows; absence of a
          document type means this change does not produce it.
        - Do not use `openspec_archive` or `openspec/changes/archive/**` for FSD/ISD
          Page ID lookup, publish target selection, approval status, or delta/conflict
          review. Archive sources are historical rationale only.

      DOCUMENT CONSUMPTION GUIDE ROWS:
      The Document Consumption Guide is this artifact's interface — the map a
      downstream reader (an LLM first, a human second) uses to consume the file
      without re-reading the body. Placed DIRECTLY AFTER the Executive Summary, above
      the detail sections it projects. ONE row per consumed body section; each row
      states WHAT that section settles and WHY it matters downstream (navigation) plus
      the KEY DATA it exports (the identifiers/sets a consumer joins on). It is a
      PROJECTION, never a new source of truth: every value must already be readable in
      the named section, and a value that section no longer supports is wrong however
      well written.
      FIXED INTERFACE: emit one row per consumed section below, in order; an empty set
      is `None`; never drop, merge, rename, or reorder a row. `What it settles & why`
      is a short human-readable phrase (usable by human and LLM alike). `Key data`
      carries identifiers and sets only — WBS codes, capability names with direction,
      `Q#`/`CR#` with status, paths — the exact values downstream joins on, never a
      restated requirement title or prose.
      The rows, and each row's key-data authority — what it IS, where it GOES, and
      what it must NEVER be:
      - Requirements Trace: the signed scope boundary. Key data carries three
        labelled sets. Determine each set by walking EVERY Requirements Trace row and
        reading its WBS-column value — that WBS code is the set member, NEVER the RQ
        id and NEVER the owner/capability name — then routing the row by its
        Disposition cell. In-scope: the closed set of WBS codes dispositioned
        `in scope`, one code per in-scope row — the bijection key for proposal's
        Delivery Breakdown and the join key for spec requirement headings and FSD
        blocks; a code absent is out of scope downstream, and a consumer never
        re-derives the set by re-reading the trace. Deferred: the WBS codes
        dispositioned `deferred` — they populate the FSD's Deferred Requirements and
        never earn a design Gap Analysis row, a proposal slice, or a spec requirement
        (or `None`). Out of scope: every WBS code dispositioned `out of scope`, each
        paired with the owner its capability cell names as `<WBS> → <owner>` (the
        WHOLE set; the WBS is the key and the owner is the value, so a row is never
        keyed by its RQ id and never collapsed to `<owner> → <owner>`) — they bound
        proposal's Out of Scope & Boundaries; ownership elsewhere is never a Change
        Request and never by itself a Dependencies row.
      - Affected Capabilities: which capabilities this change owns and how. Key data
        is the owned capabilities with their ADD / MODIFY / REMOVE direction — it
        fixes the specs file inventory and each file's delta section, and specs
        project this plan and never add a capability it does not carry.
      - Dependencies: what this change consumes but does not own. Key data is the
        capabilities and services consumed here — each becomes a proposal External
        Dependencies & Access row and then a grooming `P#`; a status is inherited
        verbatim and never upgraded to "confirmed" (or `None`).
      - Open Questions: what stays open and gates readiness. Key data is the `Q#`
        set still Open, each with its severity — the ONLY source of `Q#` numbers for
        design's mirror and grooming's migration; a question resolved this pass
        leaves the set entirely rather than staying with a Resolved marker, and an
        "undecided" remark elsewhere mints no `Q#` (or `None`).
      - Change Request Candidates: asks against signed scope. Key data is the `CR#`
        set with its current status — it seeds proposal's Change Request
        Dispositions and grooming's Change Request Decisions; a candidate is an ask
        against signed scope, never agreed scope (or `None`).
      - Cross-cutting Requirements: which cross-cutting areas apply. Key data is the
        areas marked applicable — the required rows of design's Base Configuration &
        Cross-Cutting; an area recorded N/A is omitted here, and the omission is
        inherited rather than revisited.
      - Delivery Scope & Targets: the resolved scope and what is published where. Key
        data is the resolved scope (decided by the DELIVERY SCOPE GATE and only
        recorded here — it selects the FSD or ISD path and the design's
        owned-capability boundary, and downstream never re-decides it) plus the
        produced document type(s) with disposition and working-copy path (they
        select which of FSD / ISD is authored and where; an unknown Confluence
        target stays `TBD` and is never invented).

      DISCOVERY GATE:
      After discovery.md is generated, stop before design.md and proposal.md if any
      CRITICAL Open Question remains Open. Resolve it with the user (often via
      `/opsx:explore <change-name>`), capture the answer back into the Open Questions
      table with Status Resolved plus user/BA/SA sign-off, then continue.
      NICE-TO-HAVE questions do not block design or proposal; carry them into
      grooming.md. A CRITICAL item that genuinely needs client input may be carried
      forward only with explicit user sign-off recorded in discovery.md — a user
      decision, not an agent inference.

      The first Discovery Gate checkbox mirrors the Open Questions table:
      - leave it `- [ ]` while any question is CRITICAL and still Open;
      - check it `- [x]` only when no CRITICAL question remains Open (all are
        NICE-TO-HAVE, Resolved, or explicitly user-approved to carry forward);
      - never check it while a CRITICAL question is Open without recorded user sign-off.

      Keep all four template checkbox lines. With no CRITICAL questions, the remaining
      boxes may be checked with a note such as "No CRITICAL answers required;
      NICE-TO-HAVE questions are carried to grooming" once the Executive Summary and
      detailed sections reflect that carry-forward.

      The fourth checkbox reconciles the projection: check it only after comparing each
      Document Consumption Guide row's key data against the section it names — scope,
      WBS sets, capability directions, dependencies, open items, change requests,
      cross-cutting areas, and publication targets. Fix a disagreement in whichever
      side is wrong before checking; never report it as a remark beside a checked box.

      OUTPUT CONTRACT:
      This section applies ONLY when the DELIVERY SCOPE GATE resolved to
      `functional` or `integration`. If the gate resolved to `ambiguous` / STOP,
      the sole output is the decomposition and no discovery sections appear.
      Otherwise, emit every section in the `discovery.md` template order and table
      shape; do not add, drop, or reorder sections.

      SELF-CHECK BEFORE OUTPUT:
      - No fabricated IDs, URLs, requirements, capabilities, visuals, decisions, or
        user approvals. Every `Reference / Anchor` resolves to a source
        project-context returned or present in CONTEXT — no synthesized wiki/live
        URL, path, or ID.
      - Executive Summary reads as a reader map: grounded, includes business value,
        says what the file settles and what stays open, states readiness consistently
        with the Discovery Gate. Every statement agrees with the sections as they now
        stand. It names subjects not identifiers, re-lists no table rows, and implies
        no approval for an unresolved decision.
      - Discovery Source Inventory cites the inputs and evidence actually used,
        including relevant non-document evidence (baseline specs, legacy/current
        implementation, legacy/live URLs, missing design assets) where applicable.
      - Prior-art / existing-solution evidence is captured when the sources carry it
        (existing cartridge / accelerator module, a vendor SDK / client library /
        documented API) or recorded as searched-and-absent; nothing fabricated;
        discovery records facts only and chooses NO build-vs-reuse approach.
      - FSD/ISD `NEW` / `EXTEND` decisions appear only in Delivery Scope & Targets,
        not as source inventory notes.
      - Every source requirement has an RQ ID and WBS/source grouping; use
        `UNTRACKED-<n>` and `WBS-TBD` only after the source truly lacks them.
      - Every requirement row has a description; no blank requirement cells.
      - Requirements Trace notes are grounded and material, or `—`; no fabricated or
        requirement-restating notes.
      - CLOSED-SET zero-diff holds: TRACE_RQ_SET == SOURCE_RQ_SET — every `RQ-<id>`
        in the signed source set appears in the trace exactly once, none dropped or
        invented. If not, re-run the Requirements Trace CLOSED-SET GATE before emitting.
      - With a signed BRD/SRD, the trace contains only its rows; transcript/workshop-
        only or CR-topic scope goes to Change Request Candidates, never as an invented
        `UNTRACKED-<n>` / `WBS-TBD` trace row (which are used only when the source
        itself lacks an ID).
      - Every trace row has a non-empty Affected capability cell, including deferred
        and out-of-scope rows.
      - Topic partition is obeyed: Trace vs Dependency vs CR vs Open Question; no
        duplicate CR/Open Question topics; functional Open Questions carry no HOW
        mechanics owned by separate integrations.
      - Dependencies list only external capabilities this change consumes but does
        not own, with the requirement(s) that use them, or "None."; consumed
        dependencies are not listed as Affected Capabilities.
      - No `deferred` or `out of scope` trace row is duplicated as a Change Request
        candidate; a signed later-phase item stays `deferred`, not resurrected as a CR.
      - A third-party/external service only an unapproved/pending stakeholder ask
        needs is a Change Request candidate, not a Dependencies row (Dependencies are
        relied on by a SIGNED in-scope requirement).
      - A retired-URL redirect target/type (and similar HOW/refinement details) is an
        Open Question, not a Change Request candidate.
      - Capability dispositions match the baseline: ADD for new, MODIFY for changed
        existing, REMOVE for retired/superseded existing capabilities.
      - Delivery Scope & Targets lists only produced/touched FSD/ISD documents, no
        `N/A` rows.
      - Document Consumption Guide carries one row per consumed section in template
        order (Requirements Trace, Affected Capabilities, Dependencies, Open
        Questions, Change Request Candidates, Cross-cutting Requirements, Delivery
        Scope & Targets), none dropped, merged, renamed, or reordered, every empty
        set `None`, each with a grounded `What it settles & why` phrase.
      - Every Document Consumption Guide key-data value is identifiers/sets present in
        the section its row names: the in-scope and deferred WBS sets equal the trace
        rows with those dispositions, out-of-scope owners equal every out-of-scope
        trace row's WBS with its owner, the capability plan equals Affected
        Capabilities with directions, consumed dependencies equal the Dependencies
        rows, open items equal the questions still Open with severities, change
        requests equal the CR candidates with statuses, cross-cutting applicable omits
        every N/A area, and publication targets equal the Delivery Scope & Targets rows.
      - The first Discovery Gate checkbox matches the final Open Questions table, and
        the fourth is checked only after the Document Consumption Guide was reconciled
        row by row against those sections.
    requires: []

  - id: design
    generates: design.md
    description: Architecture / solution design decisions (standard step after discovery)
    template: design.md
    instruction: |
      PURPOSE:
      Design is the architecture / solution-design step, right after discovery and
      before proposal. It decides the solution SHAPE and the reasoning behind it —
      which pattern, posture, or capability, and WHY (with alternatives and
      trade-offs) — and RAISES anything still needing human sign-off as open
      questions for the single downstream grooming to approve. It produces
      architecture-level decisions for BOTH delivery flows (a functional design and
      an integration design alike). It decides WHAT the solution is and WHY, never
      HOW it is built: file-by-file changes, component/route/loader/action wiring,
      import mechanics, and concrete numbers belong to technical-design.md during
      /opsx:plan.

      AUTHORITY ORDER:
      1. Source inputs and evidence — the reconciled discovery trace, existing
         `openspec/specs/`, and the current implementation / codebase patterns — are
         the factual source of truth.
      2. This `design` instruction is the artifact contract: follow it for when to
         generate, what to cover, the gate, and the quality bar.
      3. The `design.md` template defines section order and shape.
      4. Project `config.rules`, workflow rules, and the referenced build skills
         provide supporting domain context; they do not override this contract.

      DECISION KERNEL:
      - Design is the standard architecture step for every scoped change: produce
        design.md for each change once discovery resolved its scope. The
        architecture-bearing concerns (cross-cutting behaviour, a new pattern, a
        new dependency, a data-model change, integration/security/performance/
        migration complexity, or ambiguity an SA should resolve before Planning)
        set the design's depth, not whether it exists; downstream proposal
        requires it.
      - Record each architecture decision with rationale, alternatives, and
        trade-offs. Decisions that still need human sign-off, or that remain
        ambiguous, are RAISED as open questions / risks for grooming — never asserted
        as approved or final here. Only discovery-signed facts and clearly
        source-grounded constraints are stated as settled.
      - CLASSIFY EACH DISCOVERY ITEM BY ITS DISPOSITION, then place it. The trace
        carries the disposition — read it, do not re-decide it. Every item falls into
        exactly one of three classes, and each class has ONE home:
        - SETTLED and in scope. Disposition tells you the item is in scope; it does NOT
          by itself make the item an architecture decision. Read what KIND of item it is:
          - a behaviour REQUIREMENT (a signed "SHALL" the specs / FSD own): honour it —
            it shapes the Solution Overview and is the REASON a decision exists — but do
            NOT restate it as its own Architecture Decision. Design owns HOW the solution
            is shaped, not a re-listing of WHAT was required.
          - a CONSTRAINT that narrows the solution space, or a CHOICE among viable
            solution shapes that the source settles: OWN it as an Architecture Decision
            (or a Base Configuration & Cross-Cutting row) with rationale, alternatives,
            and trade-offs. Derive it from what the source states; add no specifics the
            source does not state.
          Elevating the settled architecture choices and solution-narrowing constraints
          IS the design's job — a design that defers its own settled architecture is
          under-built. But minting one decision per requirement row is
          requirement-restatement, not architecture — that is the over-built failure.
        - IN SCOPE but UNDECIDED (an item discovery's OWN Open Questions table
          carries — that table is the ONLY set eligible for a proposed direction and
          the ONLY source of Q# numbers; an "undecided" remark in raw sources or
          notes creates neither): PROPOSE a direction but do NOT settle it. Give a
          qualitative lean with its
          main alternative and the trade-off between them, authored as a proposed,
          undecided decision (a `Decision (proposed, raised for grooming — Q#)` block
          carrying a Proposed direction and a `Status: Undecided` line), and mirror the
          Q# in Open Questions. Never present it as a settled Architecture Decision,
          Base Configuration & Cross-Cutting row, or Integration Specification entry,
          and never invent a concrete value to close it (a type, an exact approach, a
          location, a numeric limit) — the lean is a qualitative direction, and an
          unstated specific asserted as chosen is a fabrication. The lean is confined to
        its proposed-decision block: every OTHER section (Risks / Mitigations, Data
        Flow, Dependencies, Cross-Cutting) must still read the item as undecided — do
        not silently harden the lean into a settled mitigation, a committed
        data-flow path, or a fixed posture elsewhere (a Data Flow stays Q-neutral — see
        the DATA FLOW law below). Leaving the item as a bare
        question with no proposed direction is under-built; asserting it as decided —
        in its own block or by hardening it in another section — is over-reach. Do
        neither.
        - UNRESOLVED CHOICE vs UNRESOLVED FACT. A proposed direction answers an open
          architecture CHOICE (which solution shape to build) — that is design's job. It
          does NOT answer an open FACT, STATUS, VALUE, or POLICY: whether an account or
          credential exists, a quota / rate limit, an auth transport, an approval state.
          Those are not the design's to settle — record them as the source leaves them
          (unknown / pending / undecided) and never assert a value or a "confirmed"
          status the source does not state. Proposing a direction changes neither the
          factual record nor the approval state.
        - OUT OF SCOPE by disposition (deferred / later-phase, an unsigned / pending
          Change Request, or an approach the trace hands to another change). Reason
          from what a row MEANS before placing it. Every table here is a register of
          what is being BUILT: a Dependencies row says "the design relies on this,
          live, now", a Risks row says "this threatens what we are building", a
          Decision says "we are doing this". An out-of-scope item makes none of those
          true, so no honest row exists for it — its columns cannot be filled without
          stating something false, which is why a row labelled "out-of-scope" or
          "pending" is self-contradictory, not cautious. The item is still
          acknowledged, in the one honest form design has for it: a single non-goal
          line in the Solution Overview naming it and why it is out of scope (deferred
          / unsigned / owned elsewhere). That line IS the complete, thorough treatment
          — it, not a row, is how a rigorous design shows it saw the item and chose not
          to build it.
          Watch the look-alike: an unsigned CR often names a third-party service, so it
          resembles the integrations the design genuinely consumes. What separates them
          is what PULLS the item in — a consumed integration is required by a SIGNED
          requirement of this change (the current build cannot function without it); an
          unsigned CR is a NEW ask no signed requirement needs. Same "external / separate
          change" shape, opposite disposition — so trace every candidate Dependencies /
          Risks row back to the signed requirement that needs it; a row that traces only
          to a CR candidate has nothing pulling it in and is not earned.
          Discovery has already sorted these: its Dependencies table holds what the
          build consumes, its Change Request Candidates table holds the new asks. Read
          each candidate row's membership from that sorting — not from a raw source's
          "named together" service list — then re-state it at the design's technical /
          operational level per the Dependencies content rule.
        State a constraint as settled only when a source states it or unambiguously
        forces it. SHARED SUBJECT — a source states a base fact while an Open Question
        leaves a narrower refinement of that SAME subject open: settle ONLY the grounded
        base fact and keep the exact sub-choice the Q# owns undecided, mirrored as that
        Q#. Do NOT widen the base fact to swallow the open sub-choice, and do NOT let a
        note that phrases the refinement as a fact ("must be X", "has to be Y") close the
        Q#. Settling the base fact is correct; hardening the open sub-choice — naming its
        value, tier, mechanism, or code — is the violation. The line is per-subject: the
        base posture a source states can be a settled Decision or Base Config row, while
        the value / tier / placement the Q# still owns stays undecided in that same block.
      - MARKER, NOT VERB. When you PROPOSE a direction for an item this flow's discovery
        carries as an Open Question, the proposed value MUST carry an inline undecided
        marker (`(Q#, decision pending)` / `(raised for grooming)`) in EVERY place it
        appears — the Decision block AND any Base Configuration / Cross-Cutting / Security
        row, Risks / Mitigations cell, or Data Flow step that repeats it. The marker
        governs, not the verb: "permanent redirect (Q2, decision pending)" is a labelled
        proposal and passes even with an imperative verb, while the same value stated bare
        in ANY one section — "use a permanent redirect", a fixed Security posture, a chosen
        tier or code — hardens the Q# and is a violation even when its own block is
        labelled. Re-state the same lean identically wherever it recurs; a lean that reads
        settled in even one section fails. Also do not invent a concrete value that closes
        the Q# (a specific guardrail, quota, redirect target) — propose only a qualitative
        direction.
      - DATA FLOW stays Q-NEUTRAL for an open call-approach / physical-tier question.
        Draw the flow at the capability boundary (consumer -> capability -> vendor) as a
        single sequence that names no undecided physical tier; do NOT split it into
        client-side vs server-proxy branches, and do NOT annotate a step with a
        tier-presuming detail (a key-exposure mode, a proxy hop) when that tier is what a
        Q# leaves open. A boundary-level flow settles no tier and is correct; naming the
        tier in the diagram hardens the Q# just as a settled prose decision would.
        The diagram is a BOUNDARY sketch, not the wire contract: its arrows carry no
        vendor endpoint / path / query-param / field and no chosen key-transport — a step
        reads `capability -> vendor: <capability call> (placement per Q#)`, never
        `GET /v1/... ?key=...`. The concrete wire lives ONLY in the Integration
        Specification's contract and ONLY for an API shape; a vendor-SDK or reuse-cartridge
        approach has no vendor endpoint to draw at all. An endpoint / param / key in the
        Data Flow is the same fabrication (or, for an open tier, hardening) as in prose.
      - INFORMATION ARCHITECTURE: the user-facing URL / route PATH of a NEW surface
        this change introduces — and the target of a navigation entry or a retired-URL
        redirect — is design's to DECIDE as an information-architecture decision,
        recorded with rationale, EVEN WHEN no source states a path: this is design's
        product, not fabrication, and is distinct from the internal route module /
        loader / action wiring that belongs to technical-design. State the path once as
        a settled Decision; downstream specs inherit it verbatim. A retired URL's
        redirect TYPE, or any narrower sub-choice a Q# explicitly owns, stays undecided
        and mirrored as that Q# (SHARED SUBJECT).
      - Do NOT re-decide the delivery scope; discovery already resolved it. Read the
        trace for the direction (functional vs integration) and weight the design to
        it — functional owns the storefront solution and consumes integrations as
        dependencies (thinner base design); integration owns the agnostic service
        capability and excludes consumer UI / other services (richer service design).
        A consumed integration's INTERNAL choice — its call placement (client-vs-proxy),
        key exposure, or quota governance — is owned by that integration change, so in a
        functional design it is NOT an Open Question of yours: do not mint a Q# for it,
        give it no proposed-direction block, and do not harden it as settled; at most note
        it as a consumed-dependency risk (the feature relies on the capability either way).
        That risk's Mitigation cell must NOT commit a tier or use a directional verb
        (`default to`, `use`, `enforce`, or naming a specific mechanism / value): the only
        allowed mitigation is to defer the choice to the owning integration change /
        grooming. Naming a chosen tier in the mitigation is the hardening this forbids.
      - SOLUTION APPROACH (build-vs-reuse) — decide HOW the need is met before shaping the
        solution, preferring REUSE over BUILD in priority order: (1) reuse an existing cartridge
        / accelerator or platform module discovery's prior-art surfaced AND that fits the stack;
        (2) integrate a vendor SDK / client library / documented API; (3) build a connector from
        scratch. An explicit USER approach signal in the sources overrides; absent one, apply
        Enumerate-then-Justify — enumerate the closed set {reuse, SDK, from-scratch}, state FITS
        / DOES-NOT-FIT per rung against discovery's prior-art + the platform baseline, then pick
        the highest-priority fitting rung. This applies to INTEGRATION changes ONLY: it is the
        FIRST Architecture Decision of an integration change (for its OWNED service capability)
        and SHAPES the Integration Specification. A FUNCTIONAL change makes NO Solution Approach
        decision — it does not run a build-vs-reuse ladder, and (per the consumed-integration
        firewall above) NEVER decides, proposes, or open-questions a CONSUMED integration's
        build/call approach (SDK vs API vs proxy, key placement, contract). Never invent a
        cartridge/module/SDK/API discovery did not surface.
      - Derive the change IDENTITY from discovery, not the feature name. The change
        name and title are the discovery-resolved owned change (the capability the
        trace owns), never the broader storefront feature the raw sources describe: an
        integration design is scoped as its agnostic service capability, a functional
        design as its feature surface. The feature name is not the change identity.
        The reconciled discovery trace in CONTEXT IS this change's discovery — read the
        change name and owned capability from it. Do NOT adopt the raw packet / fixture
        slug (a consumer feature name) as the change id and then declare "discovery is
        missing" for that slug and collapse to an empty stub: there is no separate
        slug-named change, the trace in CONTEXT is it. When the trace owns an INTEGRATION
        capability, produce the integration design even though the raw packet reads like
        a functional feature — never pivot to a functional `N/A` design. The fixture /
        working-directory name (a directory slug, often the raw feature name) is NOT the
        change id either: when a discovery trace is present in CONTEXT under a DIFFERENT
        name, that trace IS this change's discovery — do NOT halt, refuse, or emit a
        "discovery.md missing for <slug>" stub merely because no discovery file matches
        the directory slug.

      PIPELINE (follow each referenced section; do not improvise content):
      1. LOCK IDENTITY & SCOPE FIRST (DESIGN GATE). Before drafting any section, read discovery's
         Delivery Scope & Targets and Affected Capabilities and take the change title + delivery scope
         (functional vs integration) verbatim from there. The raw requirements / meeting packet
         describes the BROADER storefront feature and its consumers — it is NOT the change
         identity: an integration change is titled and scoped as its agnostic service
         capability (e.g. a payment-integration capability), never as the consumer feature or
         its UI. When the raw packet pulls toward the consumer surface but discovery resolved an
         integration scope, the discovery scope wins. Fix the change name from the trace's owned
         capability at PLAN time; the trace in CONTEXT IS this change's discovery, so never record
         it as "missing" and never fall back to the raw packet slug.
      2. Gather the discovery-resolved scope, dependencies, and open questions, plus
         existing specs / current patterns, and record the inputs actually used in the
         Design Source Inventory (INPUTS AND SOURCE POLICY). The Solution Overview and
         Document Consumption Guide are DERIVED LAST from the finished body (step 8),
         not drafted here.
      3. Establish the solution SHAPE at architecture level, weighted to the inherited
         delivery scope (functional vs integration) — the reasoning that drives the
         decisions below. This is the thinking, not the Solution Overview block: that
         reader map is derived from the finished body at step 8.
      3a. State the Affected Capabilities: one pointed row per owned capability — what
         this change adds / modifies / removes and where, at capability level, grounded
         in that capability's baseline spec.
      3b. GAP ANALYSIS. Before deciding anything, state what EXISTS today for each in-scope
         requirement and how far it is from the target (GAP ANALYSIS RULES). This is the factual
         input the decisions are made FROM; it decides nothing itself.
      4. Record each architecture decision with rationale, alternatives, trade-offs.
      5. Fill Base Configuration & Cross-Cutting only where a concern affects the
         solution choice; these apply to both functional and integration changes. Tag
         each row's `Applies to` column with the clean WBS codes (from discovery's
         Requirements Trace) the concern shapes, or `all` — this is the story-friendly
         source the functional-artifacts script (generate-functional-artifacts.mjs) projects into
         per-story Implementation notes. Never reference slices (S#) here: slices are defined
         downstream in proposal.md and do not exist at design time.
      6. For an INTEGRATION change, decide the Solution Approach (build-vs-reuse ladder — see
         DECISION KERNEL) as the FIRST decision, then fill the Integration Specification SHAPED
         BY it: service overview + integration documentation always, then the contract in the
         approach's shape (from-scratch/API → endpoints + data mapping; vendor SDK → the SDK
         interface; reuse → the cartridge config/extension contract), plus data flow — at
         capability level, not implementation. For a FUNCTIONAL change there is NO Solution
         Approach decision: mark the Integration Specification N/A and point to the integration
         change(s) that own the consumed services.
      7. Record risks and mitigations. Then build Dependencies by the Dependencies rule as a
         classify-then-prove subtask: for each candidate decide its disposition, prove the
         ones this change RELIES ON but does not own, emit a row ONLY for those, and send the
         rest to their real home.
      7a. HUNT (b) DESIGN QUESTIONS as the Open Questions CLOSED-MEMBERSHIP LEDGER —
         MANDATORY, do this BEFORE writing Open Questions and EMIT it in the planning pass
         as the section's `ROWS` / `OUT` ledger. A self-check attestation that the hunt "ran"
         WITHOUT the emitted ledger does not satisfy this step: the ledger is the work, the
         attestation is not. Diff the TARGET solution against the CURRENT implementation and
         the baseline specs — open the concrete files / components / config the change touches
         (read them, do not reason from memory) — and ENUMERATE every divergence the solution
         introduces. Put EACH divergence through the owner gate, naming the one class it is:
         - MINE — a choice whose RESOLUTION changes a surface or decision THIS change builds or
           owns (a storefront route / IA / redirect target, a rendering / caching / prefetch
           posture on our tier, an owned capability's behaviour), with multiple viable options
           and rework if deferred. PROVE membership before it may enter `ROWS`: name the OWNED
           surface the answer changes. "It affects my risk / scope / timeline" is NOT proof —
           a consumed service's mechanic affects those too; the test is whether the answer
           changes something THIS change owns. If the answer instead changes HOW A CONSUMED
           SERVICE is called, built, keyed, or metered (client-vs-proxy, key placement, quota,
           contract), it is NOT MINE — reclassify it as ANOTHER CHANGE'S even though it touches
           this change's risk. Only a proven-MINE choice enters `OPEN QUESTIONS ROWS`, recorded
           with a proposed direction and mirrored as a Q#.
         - ANOTHER CHANGE'S — a divergence living INSIDE a consumed integration (how it is
           called or built, key placement, quota governance) belongs to the change that owns
           that integration. It is BARRED from `ROWS`: record it on `OPEN QUESTIONS OUT` as
           `<divergence> -> consumed-dependency risk` (a Risks row whose Mitigation defers the
           choice to the owning change / grooming — never a tier, mechanism, or directional
           verb), with NO Q#, NO proposed-direction block, and NO decision anywhere.
         - NOT A CHOICE OF MINE TO OPEN — already resolved by discovery, an unsigned / pending
           Change Request, or an open FACT / STATUS / VALUE rather than a CHOICE. Also BARRED
           from `ROWS`: record it on `OPEN QUESTIONS OUT` as `<item> -> <its real home>` (the
           source as-is, a Solution-Overview non-goal line, or its owning change).
         EMIT the ledger as ONE ROW PER ENUMERATED DIVERGENCE, each carrying three cells —
         `<divergence> | <MINE | ANOTHER CHANGE'S | NOT-A-CHOICE> | <PROOF>` — and DERIVE the two
         binding lines FROM it; never assert them. The PROOF cell is what makes the class checkable
         and must be NON-EMPTY: for MINE it NAMES the OWNED surface whose answer changes (a route /
         IA / redirect target, a rendering-caching-prefetch posture on our tier, an owned
         capability's behaviour); for ANOTHER CHANGE'S it NAMES the consumed service the choice
         lives inside; for NOT-A-CHOICE it NAMES the resolving source / home. A divergence phrased
         as a consumed service's call placement, client-vs-proxy, key placement, quota, or contract
         HAS NO owned surface — its MINE proof cell cannot be filled — so it is ANOTHER CHANGE'S by
         construction and can NEVER be recorded as MINE, however much it touches this change's risk,
         scope, or timeline; "we will call it" is not owning it. A blanket `OUT = [] (all MINE)`
         without a filled per-row proof is the rubber-stamp this ledger exists to stop. Then READ
         `OPEN QUESTIONS ROWS = [<the MINE rows: carried (a) discovery Q#s + new (b), or None>]`
         and `OPEN QUESTIONS OUT = [<every ANOTHER / NOT-A-CHOICE row -> its named home>]` OFF the
         ledger and treat them as binding: the Open Questions table emits EXACTLY `ROWS`, and
         nothing on `OUT` may surface anywhere as a Q#, a proposed-direction block (no `D#`), or a
         decision. A Q# whose class is anything but MINE is a defect. Do NOT collapse to "discovery
         resolved everything -> no questions": inheritance covers product / scope, NOT the
         architecture that only exists once the solution is shaped. `OPEN QUESTIONS ROWS = [None]`
         is an allowed PASS ONLY when the ledger NAMES what you inspected (which files / surfaces),
         so `None` is an evidenced result, never a default. Then raise all `ROWS` decisions needing
         sign-off as Open Questions for grooming.
      8. DERIVE THE READER INTERFACE LAST — from the FINISHED body, never from
         intentions. The Solution Overview and Document Consumption Guide are placed
         first in the file but derived here, after every detail section is final, so
         each is a copy of what the body says NOW (a claim the sections no longer
         support is wrong however well written):
         a. Build the Document Consumption Guide (DOCUMENT CONSUMPTION GUIDE ROWS): walk
            the `##` sections the body carries in document order, emit one row per
            section EXCEPT the three that cannot map (Solution Overview — the reader
            map; this guide itself; Design Gate), and read each row's Key data (its
            identifiers/sets, `None` when the set is empty) off the section it names —
            never carried over from an earlier draft.
         b. Answer the Solution Overview reader map (its CONTENT RULE) from those same
            finished sections: what the design settles, why it is shaped that way, what
            constrains downstream, and what is passed forward (grooming / planning) — by
            SUBJECT and COUNT, re-listing no section's rows. Any count it states equals
            the size of that set in the body.
      9. State the Design Gate after the body with each item checked ([x]): it is the
         passed pre-grooming self-check, not an open to-do list. Set each box from the
         final body, the Open Questions table, and the derived reader interface
         (step 8). Leave a box unchecked only if that item genuinely does not hold.

      DESIGN GATE (blocking — evaluate BEFORE authoring anything):
      - Entry: design.md is produced for every change once the Discovery Gate is
        clean; downstream proposal requires it. Depth scales with the change's
        architecture-bearing concerns — a simple change yields a short design,
        never a skipped one.
      - Design runs pre-grooming: do NOT wait for or require an approved grooming.
        Decisions needing sign-off are recorded as proposed and raised for grooming,
        not held back and not asserted as decided.

      INPUTS AND SOURCE POLICY:
      - Read discovery.md as the resolved upstream trace: it has ALREADY passed its own
        review gate, so its dispositions are settled — inherit them, never re-decide.
        Consume it through its two published reader aids rather than re-scanning raw prose:
        its `Executive Summary` orients you (the WHAT, the business context, what discovery
        settled and what it left open), and its `Document Consumption Guide` is the
        authoritative map of every `##` section the file carries and the key identifiers in
        each — use it to find what you need. Both are reading AIDS only; the design derives
        its OWN Solution Overview + Document Consumption Guide last, from THIS file's finished
        body, never by copying discovery's forward.
        That guide is the section map (a case may add, rename, merge, or omit some), so do
        NOT re-enumerate or re-describe discovery's sections here; instead inherit each item's
        disposition and place it by the rules this instruction already states (DECISION KERNEL
        and the per-section CONTENT RULES), in short, per disposition:
        - a SIGNED, in-scope requirement -> HONOUR it in the Solution Overview and in the
          rationale of the decision that realises it, and give it one Gap Analysis row per
          its in-scope WBS (GAP ANALYSIS RULES); elevate to its own Architecture Decision
          ONLY where it carries an architecture choice or a solution-narrowing constraint,
          never one decision per requirement.
        - an owned Affected Capability -> the design's OWN Affected Capabilities section,
          one level deeper (the concrete add / modify / remove and WHERE), never a
          Dependencies row.
        - a consumed-not-owned Dependency -> the Dependencies content rule (normalise the
          Type to the design closed set; `None` never licenses `None`).
        - an Open Question -> the ONLY source of Q# numbers and of proposed-direction
          eligibility; maps to this design's Open Questions / Risks, never a settled Decision.
        - an unsigned Change Request Candidate, or any row the disposition marks deferred /
          later-phase / out-of-scope -> a single non-goal line in the Solution Overview, no
          table row (OUT OF SCOPE by disposition).
        - a Cross-cutting Requirement -> a Base Configuration & Cross-Cutting row where grounded.
        - the resolved Delivery Scope & Targets and change identity -> weight the design to
          it; do not re-derive it.
        - a settled, architecture-bearing choice discovery states in PROSE (its Executive
          Summary, the Source Inventory "purpose" notes, or the technical / meeting notes it
          cites), not only in its tables -> elevate to exactly one Architecture Decision or
          Base Configuration row; do not leave it un-elevated (under-built) nor elevate a bare
          behaviour requirement (over-built); on a SHARED SUBJECT elevate only the base fact
          and keep the Q#'s sub-choice undecided.
        Also read existing `openspec/specs/` and the current implementation for baseline
        patterns. Do NOT read proposal.md or grooming.md — they are downstream of
        design in this pipeline.
      - A research report committed for this change under
        `openspec/changes/<change>/research/<slug>/report.md` is a valid, citable
        input for an empirical fact that no document, baseline spec, or code
        reading settles. Anchor a specific fact as `<that path> · Q#`, and carry
        the finding's recorded status and basis as they stand — an unconfirmed or
        documentation-only finding is never hardened into a settled Decision,
        Gap Analysis Current State, or Integration Specification entry.
      - Reference existing codebase patterns at the level needed to justify a
        decision. Do NOT list files to modify or wire components; that is
        technical-design.md.
      - For an integration change, derive the third-party service contract (endpoints,
        formats, auth, data mapping) from the vendor's OFFICIAL documentation. Gather
        it in this order: search the web first, then local / project-context material,
        then the user; record what you used under Integration Specification ->
        Integration Documentation with realistic anchors (e.g. project-context `web` /
        the vendor doc URL). Never fabricate endpoints, fields, or auth; if the
        contract cannot be grounded, raise it as an Open Question.
      - Consult the build skills for domain constraints when they affect the solution
        choice, risk, or client/BA sign-off:
        - Rendering / routing: `sfnext-routing`.
        - Caching: storefront/edge (HTTP + CDN) — `b2c-ecdn`; commerce-backend (custom SCAPI / cartridge / job) — `b2c-custom-caches`.
        - Security: storefront/shopper auth — `sfnext-authentication` / `b2c-slas-auth-patterns`; outbound third-party service credentials/secrets — `b2c-webservices`.
        - Performance: `sfnext-performance`.
        - i18n / content: `sfnext-i18n`.
        - CMS: `sfnext-page-designer` / `b2c-page-designer`.

      CONTENT RULES (cover where applicable; omit non-applicable concerns):
      - Solution Overview — a READER MAP that orients a reader (an LLM first, a human
        second) before the detail, never a summary or a retelling. Answer, from the
        sections below as they stand NOW, in order: WHAT THIS DESIGN SETTLES (the
        solution at architecture level, the inherited delivery scope, and the
        owned-vs-consumed boundary); WHY IT IS SHAPED THIS WAY (the load-bearing
        approach/decision by SUBJECT and COUNT — the build-vs-reuse rung, "seven
        architecture decisions" — not a retelling of each block); WHAT CONSTRAINS
        DOWNSTREAM technical-design (the conclusions the next phase must honour); and
        WHAT IS PASSED FORWARD (the open questions handed to grooming and, when present,
        the items routed to planning as deferrals). Its machine-readable counterpart is
        the Document Consumption Guide; the two split the same facts along the
        prose/identifier line and never overlap. Name SUBJECTS, never identifiers ("the
        retired /legacy-path redirect", not "Q2"); counts/magnitudes are welcome, but it does
        NOT enumerate what a section below carries (the owned capabilities, the consumed
        services, the `D#` decisions) — naming the boundary is not listing its members.
        Each out-of-scope item (a deferred / unsigned Change Request the build brushes
        against) gets one non-goal line here — its only record. Write it after the body
        is final and re-derive it when the body changes; a statement the sections no
        longer support is wrong however well written.
      - Affected Capabilities: one row per capability THIS change owns, stating at
        architecture / behaviour level WHAT it adds / modifies / removes and WHERE,
        grounded in that capability's baseline spec (an ADD capability has no baseline —
        its spec path is a future target). Discovery already enumerated WHICH capabilities
        are affected and their ADD / MODIFY / REMOVE direction; this section does not
        restate that list — it goes one level deeper and states the SPECIFIC change per
        owned capability (discovery = high-level enumeration; design = the concrete change).
        It is not file / route / component wiring (that is technical-design). Every owned
        surface belongs here, never as a Dependencies row.
      - GAP ANALYSIS RULES — the factual current-vs-desired assessment the decisions are made FROM.
        Run it as Enumerate-then-Justify. The row keys are a set with TWO parts, and you build
        it before writing anything: (i) every in-scope WBS code of discovery's Requirements
        Trace, and (ii) every capability in discovery's Affected Capabilities whose MODIFY /
        REMOVE direction no in-scope WBS row already covers — a surface this change retires or
        re-points often carries no signed requirement of its own, and its current state is
        exactly the evidence the retirement rests on, so it would otherwise be assessed
        nowhere. Then JUSTIFY each row's verdict in the row itself. Coverage is a law
        in BOTH directions — a missing key from either part is a dropped subject, not brevity, and an
        extra row is padding: an item the trace does not carry as an in-scope requirement of THIS
        change, and that is not such an owned capability, earns no row, because this change
        assesses nothing about it. Excluding it here is
        SILENCE, not a re-homing — it does not become a row in any other section either. Granularity
        of part (i) follows the delivery scope: a FUNCTIONAL change gets one row per in-scope
        requirement (this is the section's main value); an INTEGRATION change gets lighter
        capability-level rows for the obligations it owns, sized to feed the Solution Approach
        decision rather than duplicate it. A part-(ii) row is keyed by the capability itself in
        either scope, since it has no signed WBS to key on. The first column stays headed
        exactly `WBS` — never widened to `WBS / Capability` or similar — because the placeholder
        already admits a capability key for these part-(ii) rows; renaming the header breaks the
        structural contract.
        - `Current State` — what exists TODAY and WHERE, with an anchor (a baseline spec path, a
          fact the discovery trace states, or a live URL). The sources are a closed set: the
          platform / OOTB baseline, a third-party-managed surface, a legacy implementation, or
          nothing. Cite that anchor IN the cell, and make a "nothing exists" cell say what the
          shopper or consumer has INSTEAD today (the legacy surface, the OOTB default) rather than
          stopping at the bare negative. SWEEP for the anchor before concluding "nothing" — the
          baseline specs, the technical / meeting notes, and the trace's Cross-cutting Requirements
          table (a concern listed there as applicable states the MECHANISM that already carries it,
          and that row IS the anchor). Concluding "none" for a concern one of those sources shows as
          existing is a fabrication, and the most common one: the requirement is new, the mechanism
          it needs is not. Grounding is symmetric — an "already covered" with no
          anchor is a fabrication exactly as an invented gap is, so a `none` verdict carries the
          same evidence burden as a `rebuild` one. Never assert an OOTB / vendor capability no
          source states.
        - `Desired State` — the target the signed requirement sets. Inherit it; do not re-decide,
          widen, or narrow it here.
        - `Gap` — the DISTANCE from what exists to what the requirement needs, from the closed set
          `none` / `config` / `adapt` / `rebuild` / `remove` (a value outside it is a defect).
          Assess the MECHANISM the requirement needs, NOT this change's own instance of it — ask
          "what would we have to BUILD?". A requirement satisfied by authoring content, keys, or
          settings against a mechanism the platform already provides is `config` even though nothing
          exists for THIS feature yet; that is the usual shape of a cross-cutting requirement
          (localization, an existing accessibility or analytics convention). Reserve `rebuild` for a
          mechanism that genuinely does not exist. The trace's DELIVERY MODE is a different axis and
          never lands in this column: `build` there means THIS change delivers the requirement
          rather than consuming it from another change, and says nothing about the distance — a
          `build` requirement whose mechanism already exists is still a `config` gap. Choose the
          LIGHTEST verdict that honestly closes the requirement, and when it IS `rebuild`, `Notes`
          states in one line why `config` and `adapt` do not close it. The verdict is an ASSESSMENT,
          not a decision or an approval: it settles no Open Question, and no other section may state
          it as a chosen approach.
        - `Notes` — the one-line proof: the evidence for the verdict, and for a `remove` row whether
          the removal is already SIGNED upstream (a discovery Affected Capabilities REMOVE — carried
          as a fact) or NEWLY PROPOSED here. A newly proposed removal is class A when it only cleans
          up an OOTB / baseline default outside the signed scope — design decides it and records it
          as an Affected Capabilities REMOVE row; it is class B when it touches signed scope or
          client-visible behaviour — raise it for grooming, never record it as decided.
        A `remove` verdict IS the removal record; do not add a second removal table.
        `### Legacy Behaviour Overview` — emit this subsection ONLY when a legacy implementation of
        the behaviour exists: a short narrative of how it works today, what it covers, what it does
        not, and what (if anything) is portable. Facts, not decisions. Omit it entirely when there
        is no legacy.
        The whole section states FACTS. It settles no Open Question, proposes no direction, and
        asserts no approval — those stay with Architecture Decisions and Open Questions. A cell that
        names a value an Open Question leaves open (a redirect type, a chosen call placement) hardens
        that Q# exactly as settled prose would; write the target the requirement sets and point at
        the Q#, never the answer.
      - Solution Approach: for an INTEGRATION change, apply the build-vs-reuse ladder per the
        DECISION KERNEL principle as the FIRST Architecture Decision for its OWNED capability; it
        SHAPES the Integration Specification (see that content rule for each approach's contract
        shape). A FUNCTIONAL change makes NO Solution Approach decision.
      - Architecture decisions with rationale (why X over Y), alternatives considered,
        and trade-offs — never a bare assertion. Number the decision blocks
        `D1, D2, …` in document order; the `D#` is the stable joinable id the Document
        Consumption Guide's Architecture Decisions row exports and a downstream artifact
        cites, and a proposed-direction block links its `D#` to the mirrored `Q#`. State
        each at the level of the CHOICE
        and its pattern (e.g. "lazy-load the heavy client widget", "call the
        provider through a server-side proxy"), not
        the mechanism that realises it. Our concrete build HOW belongs to
        technical-design and stays OUT of the Architecture Decisions, Cross-Cutting,
        and prose sections: our file/module paths and route names, component/hook
        wiring, import mechanics (e.g. `dynamic import()`), our function/method
        signatures and headers, and our own config numbers (TTL, debounce, cache size,
        timeouts, platform/library versions). The build skills show that HOW so you can
        name the right decision — record the decision, not the skill's code, paths, or
        numbers. The one exception is the Integration Specification of an integration
        change, which states the third-party CONTRACT concretely — see its rule below.
        REGISTER — each bullet is a dry technical statement, not prose: ONE claim,
        stated directly. Cut everything that does not change the decision — a second
        sentence that re-argues the first, a restatement of what the Solution Overview /
        Gap Analysis / a Cross-Cutting row already carries, benefit framing, hedges, and
        lead-ins. This is a register rule only: it never drops one of the four bullets,
        an RQ# / Q# citation, or an undecided marker — those survive every compression.
      - Base Configuration & Cross-Cutting: rendering, caching, security, performance,
        privacy, i18n/content, and CMS constraints ONLY when they affect the solution
        choice, risk, or client/BA sign-off (see the build skills above). These apply
        to both functional and integration changes. Each row's `Applies to` column
        carries the clean WBS codes (space-separated) the concern shapes, or `all`;
        keep the Constraint cell to one intent line ending with its primary skill in
        backticks. The four technical concerns (Rendering, Caching, Security,
        Performance) are the deterministic source the functional-artifacts script projects into each
        story's Implementation notes by intersecting `Applies to` with the story's
        covered WBS; Privacy / i18n / CMS stay solution constraints (i18n and consent
        surface as acceptance criteria, never Implementation notes).
        A MAGNITUDE in a Constraint cell — a cache TTL / duration, a latency / paint / TTI
        target, a bundle-size or payload budget, a device / network baseline — is stated as a
        settled value ONLY when a source grounds it. Absent a source, state the QUALITATIVE
        posture that shapes the solution (read-only reference data is edge-cacheable, the map is
        off the critical path, the list/shell renders first) and leave the specific number to
        technical-design / performance testing. A number the design picks itself is neither a
        signed FACT nor a CHOICE this design owns — it is downstream tuning — so asserting it
        here as settled (a `5 min` TTL, a `< 1 s` TTI, a `200 KB` budget, `< 2 s on 3G`) is
        fabrication, not a constraint (per KERNEL CHOICE-vs-FACT).
      - Integration Specification (integration changes only): describe the contract the
        consuming changes integrate against, SHAPED BY the chosen Solution Approach (above).
        ALWAYS present: an Overview (a LOCAL READER-MAP for this section — 1-2 sentences that LEAD
        WITH the contract SHAPE the Solution Approach fixed (API / SDK / cartridge, and why the
        subsections below are what they are); when the section carries more than one service or
        contract, or more than one contract shape, NAME each and state how the section splits by
        them — that is the single most important fact for a reader — and note what the section
        defers out (an open call placement, our build → technical-design). It does NOT re-describe
        what the capability settles or why it exists — that is the Solution Overview's job, and
        repeating it is the defect to avoid. It MUST END WITH a `Read in order:` signpost that names
        the subsections actually present, in document order, each with a one-clause purpose: a
        single compact line when the section is small, GROUPED by service/contract cluster when the
        section is large (so the path scales instead of becoming one unreadable run), so a
        downstream reader navigates a large contract without re-reading it. It orients WITHIN this
        section, never restating the Solution Overview or re-listing Document Consumption Guide
        rows, and is a projection of this section's body),
        Integration Documentation (the official vendor / cartridge docs used, per the source
        policy, cited with realistic anchors), and a Data Flow (the sequence; a diagram is
        welcome). The MIDDLE — the concrete contract — takes the shape of the chosen approach:
        - FROM-SCRATCH / API: Endpoints (channels, protocol/method, data format, auth) + Data
          Mapping (what is sent/received, field-level) — stated concretely from the vendor's
          real endpoints/paths, params, data formats, auth, documented status/fault codes, and
          documented quota/rate-limit/cache (TTL) guidance, each grounded in the cited docs.
        - VENDOR SDK: the SDK INTERFACE — initialization / loader config, the methods we call
          (name, inputs/returns, when to call), the events we subscribe to (when they fire +
          payload), and the lifecycle — grounded in the SDK docs. Endpoints appear ONLY for
          real network assets (a loader/CDN URL, an allowlist origin); an in-browser SDK call
          is NOT an endpoint, and inventing a request/response Data-Mapping field table for an
          SDK channel is a defect — its absence is CORRECT.
        - REUSE cartridge/module: the CONFIGURATION / EXTENSION contract — the cartridge's
          integration points, the config/settings we set, and any extension seam we use —
          grounded in the cartridge/module docs. Do NOT invent vendor endpoints/fields the
          cartridge encapsulates.
        Grounding is symmetric across shapes: an invented value (endpoint, field, method,
        event, config key) is fabrication; if the contract cannot be grounded, raise an Open
        Question. For the SDK / reuse shapes the ABSENCE of an endpoints/data-mapping table is
        correct, never a gap. Beyond the third-party contract, OUR build stays OUT of every
        shape (per the Architecture decisions rule): our own (not vendor-documented) tuning
        numbers defer to technical-design, while vendor-documented values (quota/TTL) stay in
        this contract.
        For a FUNCTIONAL change this whole section is exactly one line —
        `N/A — functional change.` plus a pointer to the
        integration change(s) that own the consumed services (see Dependencies). Do NOT
        emit the subsections or any vendor endpoint/field/protocol detail: a functional design
        does not own the service contract, so filling it is out-of-scope fabrication.
      - Dependencies — what this change RELIES ON but does NOT own (a capability, service,
        or prerequisite owned by another change or a vendor). Ownership is the first gate:
        if this change's own work delivers the item, it is an Affected Capabilities row, not
        a dependency — however much the rollout relies on it. A row asserts a live, in-scope
        reliance now, stated at the technical / operational level:
        - functional rows are the consumed capabilities / services discovery already sorted,
          re-stated on the change that owns each — an integration change to be delivered, or
          an already-integrated service — and the feature holds no vendor account / key /
          billing, so those are never rows here. Discovery's list is the CANDIDATE set, not
          the final one: this table is what the build WAITS ON, so a candidate earns a row
          only when it is a DELIVERY (a capability another change must still deliver, or a
          service this build calls). A platform-managed surface that is neither — the back-
          office settings the client's own administrators configure, or content components
          another workstream authors — is nothing to wait for: it is current-state evidence,
          so carry it in the Gap Analysis row it shapes (and, where this change owns the
          surface, in Affected Capabilities), never as a Dependencies row. Dropping it here
          is that filter working, not a lost fact. NORMALIZE the Type to
          the design closed set — discovery may label a consumed integration `external
          integration` / `third-party` / `vendor` / `data service`; those are NOT design Type
          values, so re-type each as `upstream integration change` (owned by a change still to
          be delivered) or `existing service` (already integrated), never copied verbatim. Each
          Note cites the signed requirement (RQ#) that makes this change rely on it; a row that
          cannot name one is not earned.
        - integration rows are the operational prerequisites the service contract you
          specified makes necessary — for an authenticated or metered vendor API the account
          and credentials rows are REQUIRED (billing when metered), and a bare `None` there is
          a defect. Derive them from that contract; discovery's `None` denies owned-service
          reliance, not these prerequisites, so it never licenses a `None`.
        Do NOT add a row to show a category was considered — a prerequisite genuinely not
        needed earns no row (note the exclusion instead). Carry an unconfirmed one with its
        discovery status (never upgraded to "confirmed", never justified by an invented Q#).
        An unsigned / pending Change Request is not a dependency; a candidate whose own note
        admits it is owned / here "for completeness" is a misplaced Affected Capabilities row
        — delete it. ALWAYS a table; if nothing relies-on-not-owned, one explicit
        `| None | — | — | <why> |` row. Type is a closed set — functional:
        `upstream integration change` | `existing service`; integration:
        `account` | `credentials` | `billing` | `sandbox` | `environment`. A Type outside
        this set (e.g. `external integration`, `third-party`, `data service`, `functional
        surface`) is a placement error: remap it to the member above, never emit the synonym.
      - Risks and trade-offs with mitigations, including the undecided items the
        discovery trace still carries.
      - Planning Deferrals — a bounded developer-HOW the design
        deliberately does NOT settle and routes to technical-design planning (an
        implementation strategy, a tuning approach, a build sequencing), recorded as a
        `PD#` row (`PD# | source design section/decision | deferred item | why not
        decided now | target phase (=planning) | owner | status`). Establish the
        deferral set by a prove-membership pass — for each developer-HOW the design
        brushes against, classify it as exactly one of: (a) a CHOICE grooming signs →
        an Open Question `Q#`, not a deferral; (b) a consumed integration's internal
        choice → stays with the owning change, not here; (c) a signed requirement →
        built, not deferred; (d) a bounded HOW this design OWNS but leaves for planning
        → the ONLY class that earns a `PD#` row. `PD#` is the design-owned
        planning-deferral namespace; owner is per-row (`BA` / `SA` / `tech-design`) —
        who owns the deferred item. The section is ALWAYS PRESENT, like Open Questions
        and Dependencies: when the prove-membership pass earns no `PD#` row, write a
        single `None.` line — do NOT omit the section, and its Document Consumption Guide
        row then reads `None`. Downstream technical-design consumes these rows;
        this artifact routes them, it does not decide them.

      DOCUMENT CONSUMPTION GUIDE ROWS:
      The Document Consumption Guide is this artifact's interface — the map a downstream
      reader (an LLM first, a human second) uses to consume the file without re-reading
      the body. Placed DIRECTLY AFTER the Solution Overview, above the detail sections
      it maps. It is a PROJECTION, never a new source of truth: every value must already
      be readable in the section the row names, and a value that section no longer
      supports is wrong however well written.
      DESIGN-SPECIFIC MEMBERSHIP (this is NOT discovery's fixed 7-row interface): the
      guide MAPS THE DOCUMENT'S CURRENT STRUCTURE. Establish the row set by a
      prove-membership walk — enumerate the `##` sections the body carries in document
      order; each earns exactly ONE row EXCEPT the three that cannot map content
      (Solution Overview — the reader map; this guide itself; Design Gate — a
      self-check). The set FOLLOWS the document: a section a real case adds earns a new
      row in place, and a section the body does not carry has no row. Do not carry a
      fixed list; derive the rows from the sections actually present. `What it settles & why` is a short human-readable navigation
      phrase; `Key data` carries identifiers and sets only — never a restated
      requirement title or prose — and an empty set is `None`.
      Each row's key-data authority — what it IS and what it must NEVER be:
      - Affected Capabilities: the owned capabilities with their ADD / MODIFY / REMOVE
        direction — fixes the specs file inventory.
      - Design Source Inventory: the input sources this design reasons from (discovery,
        BRD/SRD, technical/meeting notes, vendor docs, a review session) — the source
        set, never the content of those sources.
      - Gap Analysis: the assessed keys with their gap class (`WBS →
        none/config/adapt/rebuild/remove`) — the distance, never a chosen approach.
      - Architecture Decisions: the `D#` set (a proposed-direction `D#` notes its linked
        `Q#`) — the joinable decision ids, never a restated decision title.
      - Base Configuration & Cross-Cutting: the cross-cutting concerns carried (with
        their `Applies to` WBS) — the rows the functional-artifacts script reads.
      - Integration Specification: for an integration change, the contract keys
        (endpoints + data-mapping fields for an API shape; the SDK interface for an SDK
        shape); for a functional change, `N/A — functional change` with Key data `None`.
      - Risks / Mitigations: the risk set (short labels) this change carries.
      - Dependencies: the consumed-not-owned capabilities/services (owned vs consumed) —
        each becomes a proposal External Dependencies & Access row.
      - Open Questions: the `Q#` set raised for grooming with owner/status — the ONLY
        source of design `Q#` downstream.
      - Planning Deferrals: the `PD#` set routed to planning — the ONLY source of `PD#`;
        the section is always present, so this row is too, reading `None` when the design
        defers nothing.
      - Review & Approval: the approval state (Approved yes/no + approver).
      For any OTHER `##` section a real case adds, map it the same way: its export set as
      identifiers, or `None`.

      OUTPUT CONTRACT:
      Emit the sections in the `design.md` template order and shape (Solution
      Overview, Document Consumption Guide, Affected Capabilities, Design Source
      Inventory, Gap Analysis, Architecture Decisions, Base Configuration &
      Cross-Cutting, Integration Specification, Risks / Mitigations, Dependencies,
      Open Questions, Planning Deferrals, Design Gate); do not add, drop, or reorder
      sections. Keep the Integration Specification section present even for a functional
      change (rendered N/A). Planning Deferrals is ALWAYS present, like Open Questions /
      Dependencies (and always carries a Document Consumption Guide row); write `None.` in
      the section and `None` in its guide row when the design defers nothing.

      SELF-CHECK BEFORE OUTPUT:
      - The design's depth matches the change's architecture-bearing concerns; it
        states why the design matters for this change.
      - Delivery scope matches the discovery trace and is not re-decided; the change
        name and title are the discovery-resolved owned change, not the feature name.
        The trace in CONTEXT IS this change's discovery — it is never recorded as
        "missing" and the raw packet / fixture slug is never adopted as the change id.
      - Solution Overview reads as a READER MAP: it says what the design settles, why it
        is shaped that way, what constrains downstream, and what is passed forward
        (grooming / planning), by subject and count. It names subjects not identifiers,
        re-lists no section's rows, and implies no approval for an unresolved decision.
      - Document Consumption Guide MAPS the current structure: one row per `##` section
        in document order, excluding only Solution Overview, the guide itself, and
        Design Gate; every section the body carries has a row and a section the body does
        not carry has none. Every `Key data` cell is
        identifiers/sets (`None` when empty), each already readable in the named section
        — a carried-over row that the body no longer supports is a defect.
      - For an INTEGRATION change, the Integration Specification opens with an Overview that
        reads as a LOCAL READER-MAP of that section: 1-2 sentences that LEAD WITH the contract
        shape (API / SDK / cartridge), naming each service/contract and how the section splits when
        there is more than one, plus what the section defers out, NOT re-describing what the
        capability settles (that is the Solution Overview's job), and it MUST END WITH a `Read in
        order:` signpost of the subsections present in document order, each with a one-clause
        purpose — a single compact line when small, grouped by service/contract cluster when large,
        so a downstream reader navigates the section without re-reading it. It is a projection of
        THIS section's body — every claim readable in the subsections it maps — and it neither
        restates the Solution Overview nor re-lists Document Consumption Guide rows.
      - Planning Deferrals holds ONLY class-(d) bounded developer-HOW items the design
        owns and routes to planning as `PD#` rows; a grooming CHOICE stays a `Q#`, a
        consumed integration's internal choice stays with its change, a signed
        requirement is built. The section and its guide row are ALWAYS present; both
        read `None` when the design defers nothing.
      - CONSUMED-INTEGRATION FIREWALL (check FIRST): I minted NO Q#, NO proposed-direction
        block, and NO settled/hardened Decision, Risk-mitigation, Cross-Cutting row, or Data
        Flow annotation for a CONSUMED integration's INTERNAL choice (call placement / client-
        vs-proxy, key exposure, quota governance) — those belong to the owning integration
        change, carried here at most as a consumed-dependency risk whose mitigation DEFERS to
        that change (no tier, no directional verb). A new / unsigned Change Request ask (e.g.
        an appointment-booking capability no change owns) appears only as one Solution Overview
        non-goal line — never a Decision, Risk, Dependency, or Open Question.
      - For an INTEGRATION change, the Solution Approach is decided FIRST (build-vs-reuse): an
        explicit user approach signal is honoured, else the ladder reuse > SDK > from-scratch is
        applied via Enumerate-then-Justify with a per-rung fit verdict; nothing is invented
        beyond what discovery's prior-art surfaced. A FUNCTIONAL change makes NO Solution
        Approach decision and never decides a consumed integration's call approach.
      - For an integration change, the Integration Specification is grounded in the vendor's /
        cartridge's official documentation and SHAPED by the chosen approach — from-scratch/API
        → concrete endpoints/params/auth + field-level data mapping; SDK → the SDK interface
        (init/config, methods, events, lifecycle) with NO invented request/response field
        table; reuse → the cartridge's config/extension contract with NO invented vendor
        endpoints/fields. For a functional change it is N/A with a pointer to the owning
        integration change(s). Nothing is fabricated, and the ABSENCE of endpoints/data-mapping
        for the SDK/reuse shapes is correct, not a gap. Only OUR build (per the Architecture
        decisions rule) is deferred to technical-design.
      - Decision inventory is complete AND not padded: walk the discovery trace — its
        tables AND its prose (Executive Summary, Source Inventory notes, cited technical /
        meeting notes) — and confirm every settled architecture choice or
        solution-narrowing constraint (capability shape, vendor choice, key / security
        posture, loading / performance posture, data / privacy rule) is recorded as an
        Architecture Decision (or Cross-Cutting row) with rationale, alternatives, and
        trade-offs. A behaviour requirement is HONOURED in the Solution Overview and in
        the rationale of the decision that realises it — it is NOT restated as its own
        Architecture Decision. The design neither defers its settled architecture nor
        manufactures a decision per requirement row.
      - Approval discipline holds (per KERNEL "classify by disposition" + MARKER-NOT-VERB):
        every sign-off-needing item is a proposed, Undecided-marked direction mirrored in
        Open Questions — none asserted as settled/approved and no value invented to close a
        Q#; only discovery-signed / source-grounded facts are stated as settled. Deferred /
        later-phase / unsigned-CR / owned-elsewhere items appear only as a Solution-Overview
        non-goal line, never as a Decision, Dependency, Cross-Cutting row, Integration
        Specification entry, or Open Question.
      - A discovery Open Question's value — especially a redirect TYPE (`301` / `302`) —
        appears ONLY inside its `Decision (proposed … Q#)` block with `Status: Undecided`.
        EVERYWHERE else in the artifact it is a hardening: not just the obvious tables but
        any narrative subsection too, including a background account of the legacy surface,
        where "the retired URL will use a permanent redirect" settles the Q# exactly as a
        decision row would. Check every section, not a remembered short list. A parenthetical such as `(decision pending / deferred to
        Q#)` does NOT license stating the settled value (the `301`) elsewhere — that still
        hardens the Q# (per KERNEL MARKER-NOT-VERB).
      - Dependencies pass the Dependencies rule: every row is a DELIVERY this build waits on,
        traced to a signed requirement or the specified contract; no owned / modified /
        removed surface (an owned MODIFY / REMOVE capability — a re-pointed navigation entry,
        or a retired legacy page — is an Affected Capabilities row, NEVER a Dependencies row),
        no platform-managed surface there is nothing to wait for (client-administered
        back-office settings, content components another workstream authors — those are Gap
        Analysis evidence),
        no unsigned CR, no operational task merely gated on a Q#; an integration table is not
        a bare `None` when its contract calls an authenticated / metered API. Every Type is a
        member of the closed set (functional: `upstream integration change` / `existing service`;
        integration: `account` / `credentials` / `billing` / `sandbox` / `environment`) — a
        discovery synonym (`external integration`, `data service`, `functional surface`) is
        remapped to a member, never emitted.
      - Open Questions provenance: a design Q# is EITHER (a) a discovery Q# for THIS
        flow, carried forward and refined, OR (b) a NEW architecture question the
        design itself surfaces while shaping the solution — a genuine choice with
        multiple viable options that affects scope / risk / timeline and would cause
        rework if deferred (the same bar grooming uses to raise a new architecture
        question). Design is EXPECTED to raise (b): questions that could not exist at
        discovery time because they only arise once the solution is being shaped are
        yours to open, not something to suppress as "already handled at discovery".
        What a design Q# is NOT: anything the PIPELINE 7a owner gate classes as ANOTHER
        CHANGE'S or as NOT A CHOICE OF MINE TO OPEN.
      - The (b)-question hunt (PIPELINE 7a) actually ran: I diffed the target solution
        against the current implementation / baseline specs, put every divergence through
        the owner gate, and either opened each surviving MINE divergence as a new design Q#
        with a proposed direction, or recorded `None` as an EVIDENCED result that names
        what I inspected. A hunt whose divergences all classed away legitimately records
        `None`, and that `None` is a PASS. A bare `None` justified by "all discovery
        questions resolved" is still a FAIL — that inheritance covers product / scope, not
        design-time architecture.
      - Each in-scope UNDECIDED architecture CHOICE carries a proposed direction
        (qualitative lean + main alternative + trade-off), Undecided-marked and mirrored
        in Open Questions, never bare and never asserted — and the lean stays inside its
        block (no Risks / Data Flow / Dependencies / Cross-Cutting section hardens it into
        a settled mitigation, path, or posture), per KERNEL. "In-scope undecided" is a
        discovery Q# for THIS flow or a new (b) architecture question that passed the owner
        gate as MINE — nothing else earns a proposed direction. An UNDECIDED fact / status
        / value / policy is recorded
        as pending, never given a direction or a "confirmed" status (per KERNEL
        CHOICE-vs-FACT).
      - Gap Analysis keys exactly the two-part set — every in-scope WBS code of the trace PLUS
        every owned capability no in-scope WBS row covers — none dropped, none added (no
        deferred / out-of-scope requirement, no component another change owns) —
        every Current State cell carries its anchor, every `Gap` value comes from the closed
        set, and no cell names a value an Open Question leaves open. The table header is exactly
        `WBS | Current State | Desired State | Gap | Notes` — the first column stays `WBS` even
        where a part-(ii) row keys on a capability. `### Legacy Behaviour Overview` is present exactly when
        a legacy implementation of the behaviour exists.
      - For a functional change, the Integration Specification is only the
        `N/A — functional change.` line plus a pointer (no Overview / Endpoints
        / Data Mapping / Data Flow subsections and no vendor endpoint/field detail).
      - No OUR-build implementation detail leaked in ANY section (per the Architecture
        decisions rule — our paths / wiring, import mechanics (a `dynamic import()`),
        signatures / headers, own tuning numbers (a chosen TTL / debounce / cache-size, a
        req/s or ms budget), and task sequencing stay for technical-design.md). Vendor
        contract detail (the third-party's endpoints/paths, params, documented codes and
        quota/TTL) is NOT a leak: it belongs in the Integration Specification of an
        integration change, grounded in cited docs.
      - Base Configuration & Cross-Cutting cells carry NO chosen number: no `N per page`,
        `N stores`, `NNN ms` debounce, `N min` / `N h` TTL, `< N KB` bundle, or `< N s`
        FCP / TTI target. State the qualitative posture instead (a small result batch, a
        debounced input, a short-lived cache, a bundle-size budget, a fast-first-paint
        target); the concrete number is technical-design's.
      - Data Flow is boundary-neutral: the diagram names NO vendor endpoint / path / param /
        field and NO chosen key-transport, and it is not split into client-vs-proxy branches
        when the call placement is an open Q# or the approach is SDK / reuse (no vendor endpoint
        exists to draw). The concrete wire, if any, lives only in the Integration Specification
        contract for an API shape.
      - Every architecture decision has rationale, alternatives, and trade-offs.
      - Base Configuration & Cross-Cutting rows are grounded and limited to concerns
        that affect the solution choice; non-applicable concerns are omitted.
      - Nothing is fabricated: decisions, constraints, and patterns trace to the
        discovery trace, existing specs, the current implementation, or cited docs.
      - The Design Gate is present after the body with each item marked checked ([x]);
        an unchecked item is left only when it genuinely does not hold.
    requires: [discovery]

  - id: proposal
    generates: proposal.md
    description: Delivery offer — requirements lock, CR dispositions, delivery breakdown (story slices + near-final acceptance criteria), external dependencies & access, approach
    template: proposal.md
    instruction: |
      PURPOSE:
      Proposal is the BA/SA delivery offer produced after discovery and design
      and before grooming. It converts the reconciled discovery trace and the
      design's solution shape into delivery-space: WHY the change is needed,
      the Requirements Lock downstream artifacts consume, proposed Change
      Request dispositions, the Delivery Breakdown — the offer's core: the
      in-scope requirements sliced into per-slice blocks carrying a user story
      and NEAR-FINAL acceptance criteria that grooming approves and
      stories/specs/FSD consume (the proposal is the single source of truth the
      FSD later PROJECTS read-only) — the external dependencies and access the
      build needs, and the delivery approach. It proposes and locks; it does not approve (grooming
      owns human sign-off), does not re-decide dispositions (discovery owns
      them) or architecture (design owns it), and does not write behaviour
      contracts (specs own the exhaustive scenarios) or implementation plans
      (technical-design).

      AUTHORITY ORDER:
      1. The reconciled upstream artifacts — discovery.md and design.md — and
         the source evidence they cite are the factual source of truth.
      2. This `proposal` instruction is the artifact contract: follow it for
         the lock, dispositions, verification, gates, and quality bar.
      3. The `proposal.md` template defines section order and table shape.
      4. Project `config.rules.proposal`, workflow rules, and skills provide
         supporting context; they do not override this artifact contract.

      DECISION KERNEL:
      - Proposal is produced for every change once the ENTRY GATE clears;
        discovery.md and design.md are its required inputs.
      - The Requirements Lock is a freeze, not a re-decision: every discovery
        Requirements Trace row appears exactly once with its disposition
        inherited verbatim. A lock that drops, adds, or re-decides a row is
        wrong.
      - Scope absent from discovery is never introduced here. A new ask found
        at proposal time goes back to discovery as a Change Request candidate
        first.
      - Change Request dispositions are PROPOSED for grooming; none is approved
        here, and no human sign-off is implied.
      - The Delivery Breakdown obeys the coverage law as a BIJECTION: every
        in-scope lock row is delivered by exactly one slice and every slice
        delivers exactly one in-scope lock row (one WBS in `Covers`) — no
        grouping, no splitting — and no slice carries scope the lock does not
        hold as `in scope` (deferred, out-of-scope, and CR scope never enter
        the offer). Slices are the decomposition downstream consumes: grooming
        approves them, stories.md materializes them 1:1, specs formalize their
        seeds.
      - STORY-LOOKUP LAW: slice stories are NOT authored here. Each slice's Story
        is a deterministic VERBATIM lookup — take the slice's `Covers (WBS)`, find
        the discovery Requirements Trace row with that WBS, and copy that row's
        `Requirement` cell byte-for-byte (persona, wording, punctuation intact).
        Discovery owns story wording (it mirrors the signed SRD); the proposal
        only transcribes it, identically for FUNCTIONAL and INTEGRATION scope.
      - PROJECT, DON'T REDISCOVER: like the story, the Acceptance Criteria are
        PROJECTED from resolved upstream — the obligation from discovery
        (`Requirement Details` / `Notes`) and the baseline from design
        (`Gap Analysis` / `Base Configuration & Cross-Cutting` / `Architecture
        Decisions` / `Integration Specification`) — never re-derived from the raw
        SRD: the disposition is discovery's, the solution shape is design's, and the
        raw SRD is cited evidence only. The Delivery Breakdown AC rule is the home.
      - Acceptance Criteria are authored NEAR-FINAL per slice — the near-final bar
        is on what YOU produce (the client-facing contract the FSD projects
        read-only), NOT on the input. DETERMINE each criterion by PROJECTING the
        resolved upstream obligation, never by re-mining the raw SRD: the seed is
        the discovery Requirements Trace `Requirement Details` and `Notes` for this
        slice's `Covers (WBS)` — the atomised obligation and its ownership boundary;
        the raw SRD is cited evidence only, never the AC source. ELABORATE that
        upstream atom into this slice's own criteria — never copy a `Requirement
        Details` line as a finished criterion. Operationally, elaboration is a
        BASELINE-DELTA test: read the baseline from design — `Gap Analysis` (the
        current state and gap class for this WBS), `Base Configuration &
        Cross-Cutting`, the `Architecture Decisions`, and (integration slice) the
        `Integration Specification` — and, for EACH criterion, make it one of two
        things — (a) a NET-NEW obligation (gap class `rebuild`, no platform
        primitive exists) stated as this capability's own observable contract, or
        (b) a DELTA (gap class `config` / `adapt`) that names the platform
        primitive it builds on / adapts and states what THIS capability adds on top
        of it; a `remove` gap yields a migration / boundary criterion naming where
        the behaviour goes. A criterion that merely re-states or re-numbers a
        `Requirement Details` line — adding no net-new obligation and no delta
        against the baseline — is PARROTING; rewrite or drop it. PHRASING
        DISCIPLINE (makes elaboration verifiable, not cosmetic): open each
        criterion with a verb that names what THIS capability provides or
        guarantees as its own observable contract; a clause lifted from the seed
        may appear ONLY as the object of that verb — never as the criterion's own
        leading verb, and never carried with the seed's mechanism token. The
        platform primitive named in (b) is a design-stated baseline fact (from
        `Gap Analysis` / `Base Configuration` / an `Architecture Decision` — e.g. a
        lazy-load convention, server tier, analytics sink, or existing platform
        capability), NOT the owned vendor — vendor mechanism still stays out of the
        AC per the token test below. Shape: numbered SHALL lists under the
        re-usability marker groups the template's Acceptance Criteria comment
        defines; `## Re-usability Legend` prints the whole closed key whichever
        markers those groups use. Still offer-level,
        NOT the exhaustive behaviour canon: no Given/When/Then blocks (specs own
        those). An undecided item stays undecided with its Q# reference.
      - Every External Dependencies & Access row must trace to the upstream
        artifacts or cited sources; an item that cannot be verified is either
        dropped or marked `UNVERIFIED — confirm before proposal merge`.
        Phantom dependencies propagate into grooming and tasks.
      - Weight the proposal to the inherited delivery scope: a functional
        proposal slices the shopper experience in delivery detail; an
        integration proposal stays thin — few slices addressed to the internal
        consumer, pointing at the design's Integration Specification.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Clear the ENTRY GATE, read discovery.md and design.md fully, and take
         the change identity, delivery scope, and targets verbatim from
         discovery (INPUTS AND SOURCE POLICY). Do not re-derive them.
      2. Record the tracker reference from the sources; never invent one.
      3. Fill the Requirements Lock from the discovery Requirements Trace,
         grouped by WBS (LOCK RULES).
      4. Carry each discovery Change Request candidate into Change Request
         Dispositions with a proposed disposition (CR RULES).
      5. Slice the in-scope lock rows into the Delivery Breakdown
         (DELIVERY BREAKDOWN RULES), then emit Re-usability Legend as the
         template's COMPLETE canonical bullet list, in template order and wording
         verbatim — never trimmed to the markers those slices used, nothing
         re-authored.
      6. State Out of Scope & Boundaries (BOUNDARY RULES).
      7. Compile External Dependencies & Access (DEPENDENCY AND ACCESS RULES).
      8. Write the Approach weighted to the delivery scope (APPROACH RULES).
      9. Record NEW proposal-stage Open Questions only (OPEN QUESTION RULES).
      10. DERIVE THE READER INTERFACE LAST — from the FINISHED body, never from
          intentions. The Executive Summary and Document Consumption Guide are
          placed first in the file but derived here, after every detail section is
          final, so each is a copy of what the body says NOW (a claim the sections
          no longer support is wrong however well written):
          a. Build the Document Consumption Guide (DOCUMENT CONSUMPTION GUIDE ROWS):
             walk the `##` sections the body carries in document order, emit one row
             per section EXCEPT the three that cannot map (Executive Summary — the
             reader map; this guide itself; Proposal Gate), and read each row's Key
             data off the section it names — never carried over from an earlier draft.
          b. Answer the Executive Summary reader map (EXECUTIVE SUMMARY) from those
             same finished sections: what this offer settles, what it hands
             downstream, and what stays open — by subject and count, re-listing no
             section's rows.
      11. Set the Proposal Gate checkboxes (PROPOSAL GATE).

      ENTRY GATE (blocking — evaluate BEFORE authoring anything):
      - The Discovery Gate must be clean: no CRITICAL Open Question still Open
        without recorded user sign-off. If it is not clean, STOP; do not author
        proposal.md.
      - design.md must be available as the completed upstream artifact for this
        change. If it is missing, STOP and produce design first; do not author
        proposal.md from discovery alone.

      INPUTS AND SOURCE POLICY:
      - Read discovery.md as the resolved WHAT and treat each of its sections
        as a typed input — inherit its dispositions, do not re-decide them.
        The sections below are the TYPICAL discovery shape, not a closed
        checklist: review the WHOLE file and map every section it actually
        carries (a case may add, rename, merge, or omit some); never limit
        yourself to the names here.
        - Requirements Trace: the row set and dispositions the Requirements
          Lock mirrors; its in-scope rows are the material the Delivery
          Breakdown slices. Preserve RQ/WBS identifiers verbatim. Each row's
          `Requirement` cell is the slice story source: the Delivery Breakdown
          joins by WBS (`Covers (WBS)` -> the trace row's `Requirement`) and
          copies that cell verbatim (STORY-LOOKUP LAW); it is never re-authored.
          The SAME row's `Requirement Details` and `Notes` cells are that slice's
          ACCEPTANCE-CRITERIA seed — the atomised obligation and its ownership
          boundary the AC elaborates (see the Delivery Breakdown AC rule); the raw
          SRD is cited evidence only, never the AC source.
        - Affected Capabilities / Delivery Scope & Targets: the owned change
          identity, delivery scope, FSD/ISD targets, and the capability names
          the breakdown's Capability column uses. Take them verbatim; the raw
          feature name is not the change identity.
        - Dependencies: the consumed capabilities/services that become the
          delivery-prerequisite rows of External Dependencies & Access for a
          functional change and the `Depends on` entries of the slices they
          block.
        - Change Request Candidates: the CR# set carried into Change Request
          Dispositions. Unsigned scope never enters the lock's in-scope rows.
        - Open Questions: already registered for grooming. Reference Q#s in
          Notes/Scope/Approach where they refine an item; do NOT re-raise them
          as proposal Open Questions and do NOT close them.
        - Cross-cutting Requirements: applicable product concerns the in-scope
          summary reflects (accessibility, SEO, privacy, i18n).
      - Read design.md as the resolved solution shape:
        - Solution Overview / Architecture Decisions: the decisions the
          Approach restates at BA/SA level. Inherit them; do not re-open,
          re-decide, or contradict them.
        - Dependencies: operational prerequisites (integration scope: account,
          credentials, billing, sandbox/environment) that become External
          Dependencies & Access rows with their unresolved statuses preserved.
        - Integration Specification: for an integration proposal, the Approach
          points here instead of restating the service contract.
        - Open Questions / Risks: still-undecided items; keep them undecided.
      - Do NOT read grooming.md or downstream artifacts; they do not exist yet
        at this pipeline position.
      - If discovery records "No BRD", keep the proposal proportionate: a light
        lock over the rows discovery actually carries, no invented codes.
      - Cite evidence with the same anchors the upstream artifacts use
        (project-context inbox paths, spec paths, working-copy paths, URLs,
        tracker ids). Never cite a source you did not use, and never invent
        tracker ids, branch names, page ids, or access items.

      EXECUTIVE SUMMARY:
      - Place it immediately after the title; derive it LAST (PIPELINE step 10b),
        from the finished sections, so it reflects final facts.
      - It reads as a READER MAP, not a recap. After a reader-first opening (the
        problem/change context and one source-grounded business-value sentence),
        establish and record three things by SUBJECT and COUNT: (a) what this offer
        SETTLES — the locked scope as a slice count, the proposed CR dispositions,
        the recorded external dependencies; (b) what it HANDS DOWNSTREAM — the
        Delivery Breakdown as the read-only source the FSD/specs project, and who
        owns everything held Out of Scope; (c) what STAYS OPEN plus grooming
        readiness.
      - Name subjects, not identifiers: re-list no detail table (no RQ/WBS/CR/Q/S
        inventories), and any count it states equals the size of that set in the
        body.
      - Imply no approval for a pending decision or CR; readiness wording mirrors
        the Proposal Gate.

      LOCK RULES (Requirements Lock):
      - Enumerate every discovery Requirements Trace row BEFORE drafting and
        commit one ledger line per row: `RQ -> inherited disposition -> WBS
        group`. The emitted table is that ledger verbatim: every trace row
        appears exactly once, no row is added, none is dropped, no disposition
        changes, and the lock row count equals the trace row count.
        Cross-cutting rows (accessibility, i18n, SEO, privacy) are trace rows
        like any other — locked, and sliced when in scope; never dropped as
        "non-functional overhead".
      - Group rows by WBS code; rows sharing a WBS sit together.
      - `Requirement summary` is a short faithful summary of the source
        requirement, not new scope wording. Do not copy the full verbatim
        requirement text; discovery owns it.
      - Dispositions use discovery's exact values: `in scope`, `out of scope`,
        `deferred`, `CR candidate`.
      - Notes carry only grounded material inherited from discovery/design:
        consumed dependencies, Q#/CR# cross-links, the owning capability for
        out-of-scope rows, service-slice splits for integration scope. Use `—`
        when nothing material exists; never restate the requirement or invent
        notes.

      CR RULES (Change Request Dispositions):
      - One row per discovery Change Request candidate, preserving its CR#.
      - Propose a disposition (`confirm with client`, `absorb`, `descope` — or
        carry discovery's proposed one) with Status `pending grooming
        approval`. Proposing is not approving: never mark a CR approved or
        absorbed as fact, and never move CR scope into in-scope lock rows or
        a Delivery Breakdown slice.
      - ALWAYS a table. When discovery carries no CR candidates, emit the
        single explicit row `| None | — | — | — | <why> |`.

      DELIVERY BREAKDOWN RULES:
      - This is the offer's core: slice the locked in-scope rows into per-slice
        BLOCKS a human approves at grooming. Emit ONE block per in-scope lock
        row. The breakdown is a BIJECTION to the in-scope requirements:
        enumerate the lock's `in scope` rows BEFORE drafting and give EACH ONE
        its own block — every in-scope requirement is delivered by EXACTLY ONE
        block, and every block delivers EXACTLY ONE in-scope requirement (one
        WBS in `Covers (WBS)`). NEVER group (fold several requirements into one
        block) and NEVER split (spread one requirement across blocks); deferred
        / out-of-scope / CR scope never enters any block. The block count EQUALS
        the in-scope requirement count EQUALS the FSD in-scope block count — that
        1:1:1 correspondence is what makes stories.md AND the FSD deterministic
        projections (one block : one requirement : one story : one Acceptance
        Criteria block), and the scaffold script (`generate-functional-artifacts.mjs`, which
        projects the FSD + stories) ERRORs if it does not hold. If a user outcome seems to
        span two requirements, that is a signal the lock granularity is wrong —
        refine the requirement grain upstream (one requirement per deliverable
        outcome), do not group.
      - Block shape — each slice is authored NEAR-FINAL (the proposal is the
        single source of truth the FSD later PROJECTS read-only, so Story and
        Acceptance Criteria are written to client-facing quality here, not as
        thin seeds):
        * Heading `### S# — <WBS> — <requirement name>` (H3 under the "## Delivery
          Breakdown" H2), where `<WBS>` is the covered requirement's clean WBS
          code and `<name>` is its short requirement name.
        * A machine-readable metadata list directly under the heading (a
          `- **key:** value` bullet list the downstream scripts parse):
          - `- **Covers (WBS):**` the ONE in-scope requirement's clean WBS code
            this slice delivers (e.g. `CHK.PAY`), verbatim — the SAME leaf code
            the FSD block is keyed by and the lock's WBS column holds, NOT an RQ
            ID, exactly one code (never a list). This is the stories/FSD join key
            (Covers WBS -> FSD block heading), so it MUST match exactly one FSD
            in-scope heading and the lock's WBS column.
          - `- **Capability:**` the owning capability name(s) from discovery's
            Affected Capabilities, verbatim.
          - `- **FSD:**` (FUNCTIONAL change) the target FSD working-copy path from
            discovery's Delivery Scope & Targets (e.g. `fsd/<feature>.md`) — the
            routing pointer the FSD scaffold uses. On an INTEGRATION change use
            `- **ISD:**` with the ISD working-copy path instead (an integration
            change has no FSD).
          - `- **Depends on:**` the External Dependencies & Access row(s) blocking
            this slice, or `—`. Same names as the register; no new items minted.
        * `#### User Story` (H4): the story per the Story rule below.
        * `#### Acceptance Criteria` (H4): the criteria per the Acceptance
          Criteria rule below.
      - Story (STORY-LOOKUP LAW — a copy operation, not authoring): take this
        slice's `Covers (WBS)`, find the discovery Requirements Trace row with
        that WBS, and copy its `Requirement` cell VERBATIM — byte-for-byte,
        persona / wording / punctuation unchanged. The ONLY permitted edit is a
        trailing `[Q#]` marker flagging an open question. NO re-authoring,
        paraphrase, shortening, re-persona, or "normalization"; NO
        functional/integration distinction (both scopes copy the same cell); NO
        invented story. If that `Requirement` cell carries no "As a…" sentence,
        copy the cell as-is. One WBS : one trace row : one story — a slice covers
        a whole requirement, never a fraction, so there is never a sub-story to
        author; fix requirement grain upstream instead.
      - Acceptance Criteria: the NEAR-FINAL, client-facing contract the FSD will
        project verbatim (CRITERION BAR below is the phrasing standard) —
        numbered SHALL lists grounded in the upstream artifacts, grouped under the
        `#####` RE-USABILITY MARKER headings the template's `Re-usability Legend`
        section defines (that legend is the closed marker set). The
        `## Re-usability Legend` section is a FIXED KEY, never a selection: print
        EVERY canonical bullet the template carries, in template order and wording
        VERBATIM — never drop a member because no slice uses its marker, and never
        re-author a gloss into case-specific prose (the gloss defines the marker, it
        never describes what this change does with it). Selection applies to the
        GROUPS instead: take ONLY the markers that apply and never pad an empty group; a
        slice whose criteria share one footing carries ONE group. Marker groups are
        the ONLY heading axis inside `#### Acceptance Criteria`: there is no
        device / surface / configuration axis, so device context sits INSIDE the
        criterion ("on mobile and tablet, …") and the administering actor is the
        criterion's SUBJECT ("Business users SHALL be able to …") instead of a
        heading. Never restate one criterion under two markers (duplication is
        fabrication). The
        AC is the OFFER-level contract, NOT the exhaustive behaviour canon: NO
        Given/When/Then Gherkin blocks (specs own the full scenario sets), no
        code tokens (incl. HTTP status codes — say "permanently redirected", not
        "HTTP 301"), no internal file/route/component wiring. Vendor naming
        branches on scope: a FUNCTIONAL slice's AC names NO consumed-dependency
        vendor at all (the consumed vendors sit in `Depends on` / External
        Dependencies & Access); an INTEGRATION slice may name the OWNED vendor at
        GOVERNANCE level only (key / quota / billing / privacy / domain
        restriction) but NEVER its SDK, API, endpoint,
        method, field, protocol, or call mechanism, and NEVER a vendor magnitude
        (an SLA, latency, or rate / quota number, incl. "rate-limited") — that
        contract stays thin and points at the design's Integration Specification.
        GOVERNANCE-vs-MECHANISM test (token-based): the FORBIDDEN tokens are a
        named vendor product / SDK proper noun ("Acme Payments SDK"), an HTTP verb
        or endpoint path, a method / field signature, a wire protocol, or a
        magnitude — never write those in an AC. The capability's OWN contract
        vocabulary is ENCOURAGED and is NOT a leak: "expose a callable / stable
        interface", "an entrypoint", "a render surface", "an authorization
        result", "a settlement status", "lazy-loadable", and governance
        ("domain-restricted key"). Write "expose a callable interface that
        authorizes a charge and returns an authorization result", NEVER "authorize
        via the Acme Charges API" or "collect card data using the Acme Payments
        SDK". Reflect the applicable cross-cutting
        requirements in the slice that owns them. An undecided item stays
        undecided with its Q# reference, never hardened into a chosen value.
      - CRITERION BAR — the phrasing standard EVERY criterion meets, so a reader
        other than the author can verify it:
        * ONE obligation per criterion. Merge overlapping lines; split a criterion
          that hides a second promise behind an "and".
        * OBSERVABLE, never subjective: no "fast", "easy", "user-friendly",
          "seamless", "early enough". State the observable condition instead
          ("before any marketing or tracking script runs"), and assert nothing a
          reader cannot verify from outside the implementation.
        * A CONCRETE SUBJECT the reader can point at — the capability, the named
          surface, or the business user who administers it — in preference to a
          bare "the system"; keep terminology consistent across the block.
        * Reusable shapes: composition ("SHALL contain <listed elements>"),
          event-response ("When <event>, <subject> SHALL <response>"), condition
          ("If <precondition>, <subject> SHALL <response>"), state ("While
          <state>, <subject> SHALL <behaviour>"). Short conditional phrasing
          INSIDE one criterion is this shape, not a Gherkin block.
        * EDGE CASES belong in a near-final offer. Ask, per slice: empty or
          no-result input, a boundary value, the operation failing or a consumed
          dependency being unavailable, and an actor without permission. Emit the
          ones the sources ground; invent none.
      - AC shape is a PRE-DRAFT commitment, not a drafting-time choice: in the
        planning pass, for EACH in-scope slice commit one ledger line
        `S# -> the marker groups that apply`, and NAME the grounded upstream fact
        putting each group on that footing (what design's `Gap Analysis` /
        `Base Configuration` records exists on that surface today, and whether THIS
        change writes it, administers it, or only references it). A marker group
        with no grounding fact is NOT emitted. In
        the SAME ledger line, enumerate every design `Base Configuration &
        Cross-Cutting` row whose `Applies to` names this slice's WBS and commit the
        criterion each becomes — a merchant/admin-configuration row becomes a
        criterion whose SUBJECT is the administering business user, a
        privacy / security / accessibility / i18n / performance row becomes a
        cross-cutting criterion in this slice. An applicable row with no committed
        criterion is a DROPPED obligation. Emit each slice's AC to match its
        committed shape — never improvise or drop a grounded group while drafting.
      - AC ELABORATION is the companion PRE-DRAFT commitment to shape: in the same
        planning pass, for EACH intended criterion commit one ledger line
        `criterion -> {net-new | delta | seed-echo}`, where `seed-echo` marks a
        criterion that only re-states a `Requirement Details` bullet (no
        capability-owned obligation, no baseline delta). Rewrite or drop every
        `seed-echo` line BEFORE drafting — emit ONLY `net-new` and `delta` criteria.
        This is a binding row-set like the shape ledger: do not defer the
        elaboration decision to emit time, and emit no criterion that reaches draft
        time still labelled `seed-echo`.
      - AC promise ONLY what THIS change owns — prove each criterion against the
        RQ's obligation boundary recorded in the lock Notes before emitting it.
        For a shared in-scope RQ (an integration slice serving a UI-consumed
        requirement, or a functional slice consuming a service), the AC promises
        this change's own obligation and NEVER the other side's behaviour: a
        criterion in an integration slice that describes consumer UI (list/selection
        synchronization, accessibility, localized copy — owned by the functional
        change) or one in a functional slice that describes vendor internals
        fails the test → drop it and leave that behaviour to the owning change
        named in Out of Scope & Boundaries. The lock Note's boundary is binding.
      - INTEGRATION-AC BOUNDARY SOURCE — when you elaborate the high-level seed
        (see the AC rule above) for an INTEGRATION slice, the seed's Details mix
        the consumer's UI with the vendor's mechanism, both written from the
        outside. Two moves turn a seed line into this capability's obligation:
        (a) drop the shopper-visible UI outcome — that is the consumer's, owned by
        the change named in Out of Scope & Boundaries; (b) lift a named vendor
        mechanism UP to the capability surface it provides, leaving the concrete
        SDK / API / endpoint to the design's Integration Specification. Worked
        transforms (seed -> AC):
          * "collect card details in an embedded payment form via the Acme
            Payments SDK" -> "expose payment-field collection as a lazy-loadable
            entrypoint" (the render surface is the obligation; the SDK is the
            design's HOW).
          * "authorize a shopper's charge ... via Acme" -> "expose an interface
            that authorizes a charge and returns an authorization result".
      - INTEGRATION-AC SUBJECT TEST (apply to EVERY integration-slice criterion
        before emitting it): the grammatical subject/actor MUST be the
        capability/service and the promise MUST be its OWN observable contract
        obligation — perform its core operation, expose a stable interface, make a
        render surface available, lazy-load, or govern key/quota/billing/privacy.
        FAIL and DROP a criterion when its subject is the shopper/user ("allow the
        shopper to enter…"), OR when it names a consumer-UI construct or outcome —
        a results list, a selection, highlighting, synchronization / "in
        tandem" / "vice versa", a permission prompt, a page/filter/navigation,
        localized copy, accessibility — EVEN framed as "expose a hook / events for
        the consumer to <highlight / synchronize>". That interaction wiring is the
        consumer's functional UI (owned by the change named in Out of Scope &
        Boundaries) and the design's Integration Specification — never an
        integration AC. This holds EVEN WHEN the verbatim Story or the Details
        mention that shopper behaviour (the Story is copied whole; the AC states
        ONLY what the capability provides). Litmus: the AC names the capability's
        provided surface / interface / governance and stops there; it never names
        what the shopper or the consuming page does with it. INPUT-ACCEPTANCE
        CARVE-OUT: a criterion where the capability ACCEPTS or SUPPORTS a
        shopper-initiated INPUT ("SHALL accept a submitted payment token", "SHALL
        support a shopper-initiated save-card request", "SHALL not persist
        the raw card number") is the CONTRACT SURFACE and is KEPT — the shopper
        is the source of an input the capability accepts, not the subject of a
        rendered UI outcome. Only a shopper-VISIBLE RESULT the consumer renders (a
        displayed list, a highlight, a selection reflected in the UI) is dropped.
      - AC mint NO numbers: never introduce a threshold, amount, time,
        latency, count, or limit that no cited source states (no "under $50",
        "in 2 seconds", "5 results" unless a source says so). Testable means
        observable business behaviour, not an invented metric; quantification is
        Planning's job.
      - Weight by delivery scope: a functional breakdown carries the shopper
        journey in delivery detail; an integration breakdown stays thin (few
        slices — the capability's consumer-facing obligations, flat AC), pointing
        at the design for the contract.
      - Automated tests (unit, E2E) are mandatory across the offer; slice so
        each slice is independently deliverable and testable.

      BOUNDARY RULES (Out of Scope & Boundaries):
      - Carry the deferred lock rows, unsigned CR topics, and the
        capabilities/services this change consumes but does not own — name
        the owning change/capability for each. An integration proposal also
        excludes the consumer UI/data it does not own.
      - The boundary must match the lock and the breakdown: nothing listed
        here appears in a slice, and no in-scope lock row is pushed out here.

      DEPENDENCY AND ACCESS RULES (External Dependencies & Access):
      - This is the build-prerequisite register grooming turns into
        prerequisites: every external delivery, service, account, credential,
        environment, or tool/admin access the implementation needs.
      - CLOSED MEMBERSHIP — prove EXTERNAL per row. For each candidate row,
        prove its Owner/Source is a party OTHER than this change: another
        change to be delivered, an existing service, or a vendor. A row whose
        owner resolves to THIS change FAILS the test and is NOT a dependency —
        a redirect/route/page it implements itself, its own FSD/ISD working
        copies or publication targets, its own artifacts or sections are own
        work whose home is the Delivery Breakdown slice that delivers them (and
        the Approach), never this register. The Owner/Source column IS that
        proof: if it names this change, the row is a placement error — delete
        it and slice the item instead. Commit the register's `ROWS` (the
        proven-external items) and `OUT` (each own-work item -> its breakdown
        slice) in the planning pass before drafting; an `owner = this change`
        line belongs on `OUT`, never as an emitted row.
      - Tie rows to the offer: lead `Needed for` with the S# slice(s) the row
        blocks, then the RQ(s)/build need. The breakdown's `Depends on` and
        this register must name the same items.
      - Derive rows from the upstream artifacts, branching on delivery scope:
        - functional: the consumed capabilities from the discovery/design
          Dependencies (upstream integration changes to be delivered, existing
          services), plus any access the feature build itself needs. The
          feature holds no vendor account/key/billing — do not add credential
          rows the owning integration changes carry.
        - integration: BEFORE committing ROWS, enumerate EVERY row of the
          design's operational-prerequisites / Dependencies table (account,
          credentials, billing, sandbox/environment) and commit one ledger line
          per row — each is external by definition (client/vendor-owned, not
          this change), so it lands on ROWS with its factual status preserved
          (`unconfirmed (Q#)`, `client-owned`). `ROWS = [None]` is valid ONLY if
          the design records no operational prerequisites; for a vendor
          integration it never does.
      - Verification gate: every row must trace to the upstream artifacts or
        cited sources. Where the live workflow can check (branches, paths,
        tracker/doc refs, service endpoints/scopes), verify before listing;
        name the specific thing, not a vague "access needed". An unverifiable
        item is either dropped or marked `UNVERIFIED — confirm before proposal
        merge`. Statuses are facts, never optimistic: inherit the source's
        status wording verbatim (`client-owned`, `unconfirmed (Q#)`,
        `requested`, `not requested`). Ownership is not possession: never
        translate `client-owned` or an unresolved upstream status into
        `have`. Use `have` only when a source states the item already exists
        and is in hand (e.g. an already-integrated service). Do not assert an
        account, key, or approval exists when the sources leave it open.
      - ALWAYS a table. When genuinely nothing external is needed, emit the
        single explicit row `| None | — | — | <why> |`.

      APPROACH RULES:
      - The Approach is a SHORT compression (one-two paragraphs): how the
        offer lands per the design — one grounded sentence of the solution
        shape, an explicit pointer that decisions and rationale live in
        design.md (and, for integration scope, that the service contract
        lives in the design's Integration Specification), the FSD/ISD
        delivery targets, and the testing obligation. The delivery detail
        itself lives in the breakdown's slices, not here.
      - Inherit, never re-decide: add no new architecture, re-open none, and
        contradict nothing the design settled.
      - Name the FSD/ISD working copies and targets exactly as discovery's
        Delivery Scope & Targets records them.
      - No implementation detail: no file/route/component wiring, no our-code
        artifacts, no tuned numbers, and no restated service contract —
        endpoints, payloads, and data mapping live in the design's Integration
        Specification; the Approach points there and never enumerates them.
        Undecided items stay undecided with their Q# references.

      OPEN QUESTION RULES:
      - This table carries ONLY questions raised at proposal time: a genuine
        new ambiguity discovered while locking scope or verifying
        dependencies/access that no upstream Q# already covers. Number new
        questions by continuing the discovery sequence.
      - HUNT before you emit (do this BEFORE writing the table, never default to
        `None`): walk the Requirements Lock, the Delivery Breakdown slicing, and
        the External Dependencies & Access verification and look for genuine
        proposal-time ambiguities — an UNVERIFIED dependency needing
        confirmation, a slice boundary or acceptance criterion with more
        than one viable reading, an acceptance-criterion obligation a slice needs
        that neither discovery nor design carries (surface it here as a new Q#,
        never fill it from the raw SRD), an access item with no owner. Each
        surviving one is a new Q#. A brand-new ASK (not a question) is out of
        bounds here — it goes back to discovery as a CR candidate, not into this
        table.
      - Do not re-list discovery/design Open Questions (they are already
        registered for grooming) and do not close or re-scope them here.
      - ALWAYS a table. `None` is valid ONLY as an evidenced result whose
        `<why>` names what you actually checked (the lock / breakdown /
        dependency verification passes) — never a bare default from "everything
        is inherited from discovery/design". With no new questions, emit the
        single explicit row `| None | <why> | — | — |`.

      DOCUMENT CONSUMPTION GUIDE ROWS:
      The Document Consumption Guide is this artifact's interface — the map a
      downstream reader (an LLM first, a human second) uses to consume the file
      without re-reading the body. Placed DIRECTLY AFTER the Executive Summary, above
      the detail sections it maps. It is a PROJECTION, never a new source of truth:
      every value must already be readable in the section the row names, and a value
      that section no longer supports is wrong however well written.
      MEMBERSHIP (the guide MAPS THE DOCUMENT'S CURRENT STRUCTURE): establish the row
      set by a prove-membership walk — enumerate the `##` sections the body carries in
      document order; each earns exactly ONE row EXCEPT the three that cannot map
      content (Executive Summary — the reader map; this guide itself; Proposal Gate —
      a self-check). The set FOLLOWS the document: a section a real case adds earns a
      new row in place, and a section the body does not carry has no row; do not carry
      a fixed list. `What it settles & why` is a short human-readable navigation
      phrase; `Key data` carries identifiers and sets only — never a restated
      requirement title or prose — and an empty set is `None`.
      Each row's key-data authority — what it IS and what it must NEVER be:
      - Tracker: the tracker reference the offer is booked under (or the context
        ticket the sources provide) — never an invented ticket.
      - Proposal Source Inventory: the upstream artifacts and key sources behind the
        lock — the source set, never the content of those sources.
      - Requirements Lock: the locked scope boundary — the in-scope WBS set (the
        bijection key downstream joins on) plus the deferred / out-of-scope WBS with
        their owners; a member is a WBS code, never an RQ id in its place.
      - Change Request Dispositions: the `CR#` set with proposed disposition and
        status (or `None`) — never a CR asserted approved.
      - Re-usability Legend: the fixed marker key the template prints in full — its
        members, never a per-slice selection.
      - Delivery Breakdown: the `S#` slice set (slice count = in-scope requirement
        count) — the offer core the FSD/specs project read-only.
      - Out of Scope & Boundaries: what no slice delivers, each with its owner — never
        an in-scope WBS.
      - External Dependencies & Access: the consumed deliveries / operational
        prerequisites, each with the slice it blocks and a factual status (or `None`).
      - Approach: the working-copy target (the FSD or ISD path) and the testing
        obligation — never re-decided architecture.
      - Open Questions: the NEW proposal-stage `Q#` set (or `None`) — never an
        upstream Q# re-listed.
      - Review & Approval: the approval state (Approved yes/no with approver).
      For any OTHER `##` section a real case adds, map it the same way: its export set
      as identifiers, or `None`.

      PROPOSAL GATE:
      State it after the body with each item checked ([x]) as the passed
      self-check; leave a box unchecked only when the item genuinely does not
      hold (and then resolve the gap before handing off to grooming):
      - the Requirements Lock mirrors every discovery trace row exactly once
        with inherited dispositions;
      - the Delivery Breakdown is 1:1 with the in-scope requirements — each
        in-scope requirement is delivered by exactly one slice and each slice
        delivers exactly one in-scope requirement (no grouping, no splitting,
        nothing outside the in-scope set); every slice traces to the lock;
      - no scope absent from discovery was introduced;
      - every Change Request disposition is proposed, none approved;
      - every External Dependencies & Access row is verified or explicitly
        marked UNVERIFIED;
      - the slices and Approach inherit the design without re-deciding
        architecture or adding implementation detail.

      OUTPUT CONTRACT:
      Emit every section in the `proposal.md` template order and table shape
      (Executive Summary, Document Consumption Guide, Tracker, Proposal Source
      Inventory, Requirements
      Lock, Change Request Dispositions, Re-usability Legend, Delivery
      Breakdown, Out of Scope & Boundaries, External Dependencies & Access,
      Approach, Open Questions, Proposal Gate); do not add, drop, or reorder
      sections. Keep every
      section present for both delivery scopes — a register with nothing to
      carry holds its explicit `None` row instead of being dropped.

      SELF-CHECK BEFORE OUTPUT:
      - Change identity, delivery scope, and targets are taken verbatim from
        discovery; nothing is re-derived from the raw feature name.
      - Lock row count equals the discovery trace row count; identifiers and
        dispositions match verbatim; rows are grouped by WBS.
      - The breakdown's coverage law holds as a bijection: each in-scope lock
        row appears in exactly ONE slice block and each slice's `Covers (WBS)`
        names exactly ONE in-scope WBS (slice count = in-scope requirement count
        = FSD in-scope block count; no grouping, no splitting, nothing outside
        the in-scope set); each slice names a discovery capability; each slice's
        story is the discovery Requirements Trace `Requirement` cell for the
        slice's `Covers (WBS)`, copied VERBATIM (STORY-LOOKUP LAW — persona and
        phrasing unchanged, no re-authoring/paraphrase/persona swap, no
        fabricated story, no functional/integration distinction).
      - Each slice block carries its metadata list (`Covers (WBS)`,
        `Capability`, `FSD`/`ISD`, `Depends on`), a `#### User Story`, and a
        `#### Acceptance Criteria` under the right heading levels.
      - Acceptance Criteria are near-final numbered SHALL statements grouped
        ONLY by the reusability markers the slice earns (`#####` marker
        headings; a single group when one marker covers the whole slice).
        There is NO device / surface / configuration heading axis: device
        context sits inside the criterion and the administering actor is the
        criterion's subject. The same obligation is never repeated in two
        groups. A surface this change hosts or consumes but does not own opens
        its block with the boundary note plus the owner pointer, and its
        criteria assert the consumption contract, never management of the
        other side's content. No Given/When/Then Gherkin blocks, no vendor
        names, no code tokens; undecided items carry their Q# references.
      - `## Re-usability Legend` carries EVERY canonical bullet the template
        holds, in template order and wording verbatim: none dropped because no
        slice uses its marker, and no gloss re-authored into case-specific prose.
      - No invented RQ/WBS/CR/Q/S identifiers, tracker refs, branches, pages,
        services, access items, owners, or statuses.
      - CR dispositions and unresolved facts (accounts, keys, quotas,
        approvals) are proposed/open, never asserted settled or approved.
      - External Dependencies & Access rows are grounded and scope-correct
        (functional: consumed deliveries/services, no vendor credentials;
        integration: operational prerequisites with factual statuses); no
        phantom, padded, or own-work rows; unverifiable items are marked
        UNVERIFIED; `Depends on` and the register name the same items; no row
        whose source status is `client-owned` / `unconfirmed` / open carries
        Status `have`.
      - No Acceptance Criterion or approach sentence mints a number (amount,
        time, count, limit) absent from the cited sources.
      - Slices, boundaries, and Approach restate upstream decisions without
        contradiction, new architecture, or implementation detail.
      - Open Questions carries only NEW proposal-stage items, surfaced by
        actually walking the lock / breakdown / dependency verification for new
        ambiguities; a `None` row's `<why>` names what was checked and is never
        a bare default from "everything inherited". No upstream Q# is duplicated
        or closed.
      - The Executive Summary reads as a READER MAP: grounded and reader-first with
        business value, it states what the offer settles, what it hands downstream,
        and what stays open, by subject and count — naming subjects not identifiers,
        re-listing no table's rows, implying no approval for a pending item, and
        mirroring the Proposal Gate.
      - Document Consumption Guide MAPS the current structure: one row per `##` section
        in document order, excluding only the Executive Summary, the guide itself, and
        the Proposal Gate; every section the body carries has a row and one it does not
        carry has none. Every `Key data` cell is identifiers/sets (`None` when empty),
        each already readable in the named section — a carried-over row the body no
        longer supports is a defect.
    requires: [discovery, design]

  - id: grooming
    generates: grooming.md
    description: Human decision ledger and approval gate — migrated open questions, CR decisions, prerequisites, offer sign-off
    template: grooming.md
    instruction: |
      PURPOSE:
      Grooming is the human decision ledger and approval GATE produced after
      proposal and before specs. It is the first point discovery, design, and
      proposal CONVERGE: it gathers everything the pre-grooming pipeline left
      open — their Open Questions, the proposal's Change Request dispositions
      and build prerequisites, the design's Planning Deferrals, and the offer
      itself — into one session-ready checklist a named human works through.
      The agent PREPARES the ledger; humans DECIDE in the session. Grooming is
      the scoped source of truth for the DECISION/APPROVAL layer only — which
      option was chosen and by whom. It does not own scope (the proposal's
      lock), architecture (design), or behaviour (specs), it never re-decides
      a fact it inherits, and it routes what another phase owns rather than
      deciding it. There is no functional-vs-integration branching here: one
      contract for every change; only the migrated content differs.

      AUTHORITY ORDER:
      1. The reconciled upstream artifacts — discovery.md, design.md, and
         proposal.md — and the source evidence they cite are the factual
         source of truth. Grooming inherits their facts verbatim.
      2. This `grooming` instruction is the artifact contract: follow it for
         migration, approval discipline, categorization, routing, and the
         quality bar.
      3. The `grooming.md` template defines section order and table shape.
      4. Project `config.rules.grooming`, workflow rules, and skills provide
         supporting context; they do not override this artifact contract.

      DECISION KERNEL (each rule is a task to establish, not a slot to fill):
      - Prepare, do not decide. The generated artifact is a DRAFT: every
        `Decision` and `Approved by` cell is `—`, every Status OPEN (or
        grounded BLOCKED), and every Grooming Approval Gate checkbox
        UNCHECKED. Two exceptions carry an upstream decision into the draft:
        an item the user explicitly answered in the current conversation, and
        a RESOLVED-UPSTREAM item an upstream already closed
        (RESOLVED-UPSTREAM RULES).
      - Establish migration completeness by ENUMERATING THE CLOSED SET: walk
        every upstream register that can raise an item (INPUTS AND SOURCE
        POLICY) and for each candidate decide include-once or exclude, with a
        one-line reason; record each included item as its row, deduplicated by
        identifier. An item no register carries into this ledger never gets
        decided.
      - Establish each item's home by PROVING MEMBERSHIP: test the item
        against the target register's definition; if it fails, it belongs in
        another register (QUESTION RULES, PLANNING ROUTE RULES, CR RULES).
        Route by nature; never park an item in the wrong register.
      - Inherit facts verbatim: severities (CRITICAL / NICE-TO-HAVE), current
        factual statuses, proposed CR dispositions, and design's routed
        deferrals are copied, never rewritten, answered, closed, or
        re-scoped. A recommendation is not a decision.
      - Back-link every item: each migrated or raised row records the upstream
        artifact section or decision that raised it as its Origin. A row with
        no traceable origin is ungrounded.
      - Route, do not decide, what another phase owns: design's Planning
        Deferrals are acknowledged as ROUTED-TO-PLANNING (PLANNING ROUTE
        RULES); the developer-HOW itself is settled at planning, not here.
      - Reference design's settled architecture, do not adopt it as a decision.
        Only an upstream REGISTER raises a migratable item — open Q#s, proposal
        CR rows, External Dependencies & Access rows (P#), and design Planning
        Deferrals (PD#). Design's settled Architecture Decisions (its `D#` set)
        are design-owned HOW, NOT a register: a settled `D#` enters ONLY as the
        Origin of a Q# or PD# it grounds, and is NEVER carried as its own row
        that restates the `D#` with a filled Decision / Approved by / APPROVED.
        A genuine open decision the session must confirm is raised as a Q# with
        Decision `—`, citing the `D#` as Origin; it never asserts the design's
        choice as already approved.
      - "Approved by" must name a real human or human role from the session
        ("BA", "SA lead", "client PO"). "Agent", "LLM", "Cursor", blank, or
        implied approval is invalid. A deferral still requires a named human
        and a concrete constraint or owner.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Clear the ENTRY GATE and read discovery.md, design.md, and
         proposal.md fully; take the change identity verbatim from discovery
         (INPUTS AND SOURCE POLICY).
      2. Fill the Grooming Source Inventory under its FIXED header row —
         reproduce the three column names `Input | Reference | Used for`
         VERBATIM as template scaffold (do NOT relabel `Used for` to
         `Purpose`, `Use`, `Notes`, or any synonym): one row per upstream
         artifact (discovery, design, proposal), the tracker reference from
         the sources, and any client FSD/ISD source pages discovery
         recorded — never invent one. Every template table header is fixed
         scaffold: copy each section's column names exactly, never paraphrase
         a heading.
      3. Enumerate the closed set of upstream registers and migrate each
         still-open item to its home, back-linked to its origin (DECISION
         KERNEL; INPUTS AND SOURCE POLICY):
         - proposal External Dependencies & Access -> Prerequisites & Access
           as P1..Pn (PREREQUISITE RULES);
         - business/requirements Q#s -> BA / Requirements Questions
           (QUESTION RULES);
         - technical/operational Q#s and design-raised undecided decisions ->
           Architecture / Tech Decisions (QUESTION RULES, ARCH FILTER);
         - design Planning Deferrals -> Planning Routes as PD# route
           acknowledgements (PLANNING ROUTE RULES);
         - proposal Change Request rows -> Change Request Decisions (CR RULES,
           RESOLVED-UPSTREAM RULES).
      4. Put the offer up for sign-off as O1/O2 in Scope & Offer Approval
         (OFFER RULES).
      5. Write the Executive Summary from the completed sections
         (EXECUTIVE SUMMARY).
      6. Emit the Grooming Approval Gate with every box unchecked
         (GATE RULES).
      7. In live use, run the grooming session per SESSION RULES; the eval /
         generation step ends at the prepared draft.

      ENTRY GATE (blocking — evaluate BEFORE authoring anything):
      - discovery.md, design.md, and proposal.md must exist as completed
        upstream artifacts for this change, with the Proposal Gate
        self-checked. If any is missing, STOP and produce it first.

      INPUTS AND SOURCE POLICY:
      - Read all three upstream artifacts fully; each carries registers that
        raise items. The sections named below are the CLOSED SET to enumerate
        for migration completeness — walk every one, wherever it sits in the
        file, and decide include/exclude per candidate:
        - discovery.md: Open Questions (Q#s with severities and "why unclear"
          context), Change Request Candidates (the origin of CR rows), source
          anchors for citations.
        - design.md: Open Questions (usually the same Q#s, refined),
          Architecture Decisions marked proposed / raised for grooming
          (undecided directions the session must settle), Risks / Mitigations
          (decision context and alternatives), and Planning Deferrals (the
          PD# developer-HOW items design routed to technical-design planning —
          the only source of Planning Routes).
        - proposal.md: the Requirements Lock and Delivery Breakdown (the offer
          O1/O2 summarizes), Change Request Dispositions (the CR rows with
          proposed dispositions, including any already decided upstream),
          External Dependencies & Access (the P# rows with factual statuses),
          proposal-stage Open Questions.
      - Deduplicate by identifier: a question discovery raised and design
        refined is ONE row carrying the richest grounded context. Preserve
        Q#/CR#/PD#/S#/RQ identifiers verbatim; number prerequisites P1..Pn in
        register order and offer rows O1/O2.
      - Determine each row's Origin — the upstream artifact section or
        decision that raised it (for a session-raised item, the grounded fact
        it rests on) — and record it in the Origin column with the same
        anchors the upstream artifacts use. Never invent tracker ids, page
        ids, owners, or humans.
      - A NEW item may be added only for a genuine grounded gap found while
        preparing (a decision the sources leave open that no upstream register
        covers); continue the upstream numbering and back-link the grounding.
        Never add boilerplate items.
      - Do NOT read or anticipate downstream artifacts (specs, FSD/ISD,
        stories); they do not exist yet at this pipeline position.

      EXECUTIVE SUMMARY:
      - Keep the DRAFT status line under the title, before this section:
        "Status: **DRAFT — human approval required.**" plus one sentence
        that the agent prepared the ledger and no item is decided until a
        named human approves it.
      - Reader-first, written after the detailed sections: what upstream
        settled (one sentence), what this session must settle — the pending
        items by type with blockers named, the planning routes to
        acknowledge, and any resolved-upstream item migrated for the record —
        and the explicit statement that nothing is approved yet and the
        pipeline stays blocked until the gate passes.
      - Do not duplicate the registers (no full Q#/CR#/P#/PD# inventories) and
        do not imply readiness to proceed.

      PREREQUISITE RULES (Prerequisites & Access):
      - Establish, for each proposal External Dependencies & Access row, what
        the build needs before it can start: what is needed, which
        slices/requirements it gates (from the register's "Needed for"), the
        owner/provider, and the CURRENT factual status inherited verbatim
        ("to be delivered", "have (already integrated)", "unconfirmed (Q#)",
        "client-owned"). Record one P# row with its Origin as the proposal
        section that raised it.
      - Determine the grooming Status: OPEN by default; BLOCKED only where a
        source records the item as blocking (an unconfirmed credential the
        build cannot start without). Missing access, credentials, design
        assets, CMS setup, API keys, environments, or contracts stay
        OPEN/BLOCKED unless a named human explicitly approves a deferral —
        never "ready with stubs" by inference.
      - Cross-link, do not duplicate: a prerequisite gated by an open Q#
        references that Q# in its context; the question itself lives once,
        in its own register.

      QUESTION RULES (BA / Requirements Questions and Architecture / Tech
      Decisions):
      - Establish each question's home by PROVING MEMBERSHIP against the
        register definition: a question about what the experience or scope
        should be is business/requirements -> BA / Requirements Questions; a
        decision about how it is built or operated (call approaches, keys,
        redirects, quotas, guardrails, environments) is technical/operational
        -> Architecture / Tech Decisions. If a candidate is a routed
        developer-HOW deferral, it is not a grooming question — it belongs in
        Planning Routes (PLANNING ROUTE RULES). Either register may hold the
        explicit `None` row naming where the items actually live.
      - Each row records: the Q# and severity verbatim; its Origin; the
        question; grounded context (which slice/requirement/prerequisite it
        gates); 2-3 option one-liners with implications drawn from the
        upstream analysis (design alternatives, risk notes); an optional
        recommendation labeled as the agent's, mirroring the design's
        proposed direction when one exists.
      - Presenting the decision space settles nothing: options may name the
        concrete mechanisms the sources name (server proxy, permanent
        redirect); the Decision cell stays `—`.
      - ARCH FILTER for NEW architecture items only (a migrated Q# always
        stays, including one grounded in a design `D#`; a settled design `D#`
        is itself NOT an item — it appears only as a Q#'s Origin, never as a
        row that restates it with a filled Decision): include one only if all
        three hold — (a) multiple viable options exist, (b) the choice
        meaningfully affects scope, risk, or timeline, (c) deferring it to
        implementation would cause rework. No boilerplate ("which base
        branch?", "which testing framework?" — the project owns those
        conventions). An empty register with the explicit `None` row beats
        padded questions.

      PLANNING ROUTE RULES (Planning Routes):
      - Establish, for each design Planning Deferrals (PD#) row, the route to
        acknowledge: the deferred developer-HOW item, its target phase, and
        its owner, all inherited verbatim from design; record one PD# row with
        its Origin as the design section/decision that raised it.
      - Grooming acknowledges the ROUTE, not the developer-HOW: the draft
        leaves Route acknowledgement and Approved by `—` and Status OPEN; the
        session sets Status ROUTED-TO-PLANNING with a named human when it
        confirms the route. Never decide the deferred item here — that is
        technical-design's planning.
      - ALWAYS a table. When design defers nothing (Planning Deferrals: None),
        carry the explicit `None` row; do not invent deferrals.

      CR RULES (Change Request Decisions):
      - Establish, for each proposal Change Request row, the disposition to
        decide: CR#, its Origin (the discovery Change Request Candidate),
        description, impact, and the PROPOSED disposition inherited verbatim.
        An undecided CR ships Decision `—` and Status OPEN; the session
        approves, absorbs, or descopes. A CR the upstream already decided is a
        RESOLVED-UPSTREAM item (RESOLVED-UPSTREAM RULES).
      - ALWAYS a table. When the proposal carries the explicit `None` row,
        carry it with its reason.

      RESOLVED-UPSTREAM RULES (any migrated item an upstream already closed):
      - Determine whether a migrated item arrives already decided: an upstream
        artifact records a disposition AND a named human approver for it (a CR
        declined at the discovery review, a question answered and signed off
        upstream). If both hold, it is RESOLVED-UPSTREAM.
      - Record it for the record, do not re-open it: carry its upstream
        Decision, its named Approved by, and its Origin (the artifact and
        review that closed it) into the row, with a settled Status. This is
        the one migrated case whose Decision/Approved by are filled in the
        DRAFT. Never blank it back to OPEN and never re-decide it.

      OFFER RULES (Scope & Offer Approval):
      - Exactly two rows, each with its Origin (the proposal section it
        projects): O1 — the Requirements Lock boundary summarized as
        proposal.md locks it (in-scope set, deferred rows, nothing else
        introduced); O2 — the Delivery Breakdown slice set (S#s and what
        approving them means: the slicing specs and stories will consume).
      - Summarize, never restate or alter: changing the lock boundary or the
        slice set here is re-deciding scope, which grooming never does.

      GATE RULES (Grooming Approval Gate):
      - Emit the gate after the body with EVERY box unchecked ([ ]) — the
        prepared draft has nothing approved by definition. Boxes are checked
        only during the live session as items resolve.
      - The gate items are the downstream contract: before specs, FSD/ISD,
        or stories are generated, all of the following must be true in
        grooming.md:
        - every prerequisite (P#) is APPROVED, or DEFERRED-APPROVED with a
          named human approver and an explicit constraint;
        - every BA / requirements question (Q#) is APPROVED or
          DEFERRED-APPROVED by a named human;
        - every architecture / tech decision is APPROVED or
          DEFERRED-APPROVED by a named human, or a named human confirms none
          is required;
        - every planning route (PD#) carried from design is acknowledged as
          ROUTED-TO-PLANNING by a named human, or the register is empty;
        - every Change Request (CR#) has a disposition decided by a named
          human;
        - the Requirements Lock and Delivery Breakdown (O1, O2) are approved
          by a named human;
        - every migrated or raised item back-links to the upstream artifact
          section or decision that raised it;
        - approved decisions are written back into proposal.md / design.md
          where they change scope or approach;
        - no approver is "Agent", "LLM", "Cursor", blank, or implied.
      - If any gate item is not satisfied, downstream generation STOPS at
        this artifact.

      SESSION RULES (live workflow, after the draft is generated):
      - Start a chat-based grooming session immediately after generating the
        draft: ask ONE item at a time — brief context, why it matters, the
        options with one-line implications, the labeled recommendation —
        then WAIT for the human answer before the next item. Do not use the
        AskUserQuestion tool for grooming and do not dump the full
        questionnaire at once.
      - Record each answer as it lands: fill Decision, Approved by (real
        name/role), and Status (including ROUTED-TO-PLANNING for an
        acknowledged route); check a gate box only when its item set is fully
        resolved.
      - Write approved decisions back into proposal.md / design.md where
        they change scope or approach, keeping the artifacts consistent.

      OUTPUT CONTRACT:
      - Emit every section in the `grooming.md` template order and table
        shape, with the DRAFT status line under the title; do not add, drop,
        or reorder sections (the template is canon). A register with nothing
        to carry holds its explicit `None` row instead of being dropped.

      SELF-CHECK BEFORE OUTPUT:
      - Change identity taken verbatim from discovery; every
        `openspec/changes/<name>/…` anchor uses it.
      - Migration completeness holds: the closed set of upstream registers was
        enumerated and every still-open Q# (deduped), every proposal CR row,
        every External Dependencies & Access row (as P#), every design
        Planning Deferral (as PD#), and O1/O2 are present exactly once;
        identifiers verbatim.
      - Membership holds: every item proves it belongs in its register (BA vs
        Architecture vs Planning Routes vs Change Requests); no routed
        deferral sits in a question register and no question sits in Planning
        Routes; no Architecture / Tech Decisions row restates a settled design
        `D#` with a filled Decision / Approved by — a settled `D#` appears only
        as a Q#'s Origin.
      - Back-links hold: every migrated or raised row records the origin that
        raised it.
      - Zero self-approval, with the two exceptions only: all Decision /
        Approved by cells are `—`, all statuses OPEN or grounded BLOCKED,
        every gate box unchecked — except an item the user answered in the
        current conversation and a resolved-upstream item, which carry their
        upstream decision and named approver.
      - Planning Routes acknowledge the route (Status OPEN in the draft),
        never decide the developer-HOW; when design defers nothing the
        explicit `None` row is present.
      - Severities, factual statuses, proposed dispositions, and routed
        deferrals match upstream verbatim; no optimistic rewrites.
      - Every in-session item is session-ready: grounded context, options with
        implications, labeled recommendations only.
      - No invented items, owners, humans, statuses, tracker refs, or
        identifiers; no boilerplate architecture questions.
      - The Executive Summary states that nothing is approved and names the
        blockers; it does not imply readiness.
    requires: [discovery, design, proposal]

  - id: specs
    generates: specs/**/*.md
    description: Behaviour canon — delta specs per affected capability (RFC 2119 requirements + BDD scenarios) formalizing the approved offer
    template: spec.md
    instruction: |
      PURPOSE:
      Specs are the behaviour canon of the pipeline: the formal, testable
      contract of WHAT the system does after this change. They are written
      as DELTAS against the baseline capability specs — one file per
      affected capability at `openspec/changes/<name>/specs/<capability>/
      spec.md` — and they are the ONLY artifact that survives into the
      `openspec/specs/` archive when the change completes. Everything
      downstream (FSD/ISD, stories, tasks, tests) derives from them. The
      primary audience is LLM planners and executors; the contract must
      still read cleanly for a human QA. Specs own the exhaustive edge and
      error-case canon that the proposal's seeds only hint at.

      AUTHORITY ORDER:
      1. The APPROVED grooming decisions and the reconciled upstream
         artifacts — discovery.md (verbatim requirements, codes,
         capabilities), design.md (behaviour-shaping constraints),
         proposal.md (Requirements Lock and Delivery Breakdown) — and the
         source evidence they cite are the factual source of truth.
      2. This `specs` instruction is the artifact contract: follow it for
         inventory, coverage, delta discipline, and the quality bar.
      3. The `spec.md` template defines the ADDED / MODIFIED / REMOVED
         block shapes.
      4. Project `config.rules.specs` and the workflow rules provide
         supporting context; they do not override this artifact contract.

      DECISION KERNEL:
      - Formalize, never decide: every requirement and scenario traces to a
        signed requirement, an approved slice seed, or an approved grooming
        decision. If a behaviour cannot be stated precisely from those, STOP
        and return the ambiguity to grooming — never encode a guess.
      - Approved decisions are law: encode each as behaviour in its covering
        requirement, and a rejected option never appears (APPROVED-DECISION
        BINDING).
      - Behaviour only: state observable outcomes in RFC 2119 language; HOW the
        behaviour is built is design's and technical-design's (REQUIREMENT
        RULES).
      - One subject, one requirement: a WBS's criteria divide by the subject that
        owes them, and each requirement's NAME is the group label its scenarios
        carry into the FSD/ISD table — so the partition is a reading structure the
        client sees, not bookkeeping (REQUIREMENT PARTITION).
      - Delta is the unit: write only what this change ADDs, MODIFIes, or
        REMOVEs against the baseline canon (DELTA RULES).
      - Coverage is total: every in-scope lock requirement, every Delivery
        Breakdown slice, and every Applicable cross-cutting area is realized;
        deferred, declined, and out-of-scope items produce nothing.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Clear the ENTRY GATE: verify the Grooming Approval Gate passed
         (INPUTS AND SOURCE POLICY).
      2. Enumerate the capability files from discovery's Affected
         Capabilities table into the closed FILE INVENTORY / FILE OUT plan
         commitment (FILE INVENTORY RULES).
      3. For MODIFY / REMOVE capabilities, load the baseline spec from
         `openspec/specs/<capability>/spec.md` (DELTA RULES).
      4. Formalize the approved offer by COMPOSING two committed layers, never
         the seed alone: (i) TRANSCRIBE each vendor-free acceptance-criteria seed
         as the behaviour skeleton (the named SEED SKELETON commitment) — the
         seed's phrasing is the base requirement and scenario language; (ii) LAYER
         onto that skeleton every approved bound (the named DECISION LEDGER, one
         line per grooming Q#/CR#/P#) as an added observable clause + scenario, and
         every Applicable cross-cutting area (step 5). A requirement that
         stops at the bare seed and omits a covering ledger bound or an Applicable
         cross-cutting is INCOMPLETE, a silent drop. What design and discovery may
         NOT add is a NEW behaviour clause of their own, a vendor / SDK / endpoint
         noun, or the richer consumer-UI wording a signed discovery Requirement
         or its Requirement Details carries; a
         clause traceable to none of the seed, a ledger bound, or a cross-cutting
         area is anchor drift, dropped. Commit each requirement's and scenario's
         seat in the plan via the OBLIGATION-SEAT TEST before drafting, so an
         integration capability specs only its own interface obligation and never
         the consumer's UI behaviour, and commit how each WBS's criteria divide
         into requirements via the REQUIREMENT PARTITION block ledger (SEED
         SKELETON, APPROVED-DECISION BINDING; REQUIREMENT RULES, SCENARIO RULES).
      5. Add behaviour for every cross-cutting area marked Applicable in
         discovery (REQUIREMENT RULES).
      6. Carry the WBS in each ADDED/MODIFIED requirement heading (Option-H)
         and attach the Trace / Source metadata comment (TRACE METADATA RULES).
      7. Run the SELF-CHECK before emitting.

      ENTRY GATE (blocking — evaluate BEFORE authoring anything):
      - discovery.md, design.md, proposal.md, and grooming.md must exist as
        completed upstream artifacts for this change, and grooming's
        Grooming Approval Gate must have PASSED: every P#/Q#/CR#/O# item
        APPROVED or DEFERRED-APPROVED by a named human and every gate box
        checked. If the gate has not passed, STOP — do not generate specs
        from agent-resolved or unapproved decisions.

      INPUTS AND SOURCE POLICY:
      - proposal.md is the behaviour-authoritative parent: the Delivery Breakdown
        acceptance-criteria SEEDS are the vendor-free behaviour skeleton this
        contract FORMALIZES (expand each seed into a full requirement + scenarios),
        the Requirements Lock is the coverage set with obligation-boundary notes,
        and Out of Scope & Boundaries bounds what may NOT appear. The consumed
        vendors/services named in its Depends on / External Dependencies & Access
        are the seat's OUT-set — recorded there, never named in a functional
        capability's behaviour text (OBLIGATION-SEAT TEST).
      - grooming.md: the approved Decision cells are the law this contract
        encodes; prerequisite decisions carry the constraints under which
        behaviour ships.
      - discovery.md: the Requirements Trace supplies verbatim requirement
        text and RQ/WBS codes; Affected Capabilities drives the file
        inventory; Cross-cutting Requirements drives cross-cutting
        behaviour; its source anchors are the citation vocabulary.
      - design.md is consulted for HOW only: cite it for a specific approved
        MECHANISM bound a requirement must carry (a lazy-loaded payment form becomes
        "checkout is usable before the payment form loads"; a privacy constraint becomes a
        SHALL NOT; a redirect type). Its vendor / SDK / endpoint prose is design's
        implementation detail — never imported as behaviour, and the consumed
        vendors it names are part of the OUT-set above.
      - Baseline specs `openspec/specs/<capability>/spec.md`: the current
        behaviour MODIFY and REMOVE deltas are written against.
      - Do NOT read or anticipate downstream artifacts (FSD/ISD, stories,
        tasks); they derive from specs, never the reverse.
      - Cite with the same anchors the upstream artifacts use; an approved
        grooming decision is citable as `grooming Q#`. Never invent codes,
        sources, or capabilities.

      FILE INVENTORY RULES:
      - One spec file per row of discovery's Affected Capabilities table:
        `specs/<capability>/spec.md`. The row's disposition determines the
        file's delta section: ADD -> `## ADDED Requirements`; MODIFY ->
        `## MODIFIED Requirements`; REMOVE -> `## REMOVED Requirements`.
      - A MODIFY file changes only requirements its baseline already
        carries. A requirement with NO baseline counterpart is ADDED
        behaviour and belongs to the capability that owns it going forward:
        behaviour of a new surface — including how it is reached, such as a
        retired URL's redirect landing on it — lands with the NEW
        capability, not as an ADDED section inside a MODIFY file.
      - Never create a file for a capability another change owns; consumed
        dependencies get no spec here.
      - CLOSED FILE SET — commit the file inventory in the PLAN before drafting,
        exactly as a closed-membership set (like the section ROWS/OUT commitment):
        `FILE INVENTORY = [<one specs/<capability>/spec.md per Affected
        Capabilities row>]` and `FILE OUT = [<capability that appears in CONTEXT
        — a baseline spec, a consumed dependency, another change's surface — but
        is NOT an Affected Capabilities row -> its owning change>]`. A baseline
        spec in CONTEXT is supplied ONLY to decide ADD/MODIFY/REMOVE for a
        capability you already own; its presence NEVER licenses a file. The emit
        is a VERBATIM application of FILE INVENTORY: as the last step before
        output, diff the emitted `--- specs/<cap>/spec.md` markers against it — a
        file with no inventory line (or one named on FILE OUT) is a placement
        error; delete it, never author or annotate it "for completeness".

      REQUIREMENT RULES:
      - Heading = Option-H `### Requirement: <WBS> — <behaviour name>` — the WBS
        code lives IN the heading (the single FSD join key; ` — ` is an em-dash
        with surrounding spaces). The archive matches MODIFIED/REMOVED headings
        verbatim, so an ADDED requirement always carries its WBS here and a
        MODIFIED/REMOVED heading reproduces the baseline heading exactly (a
        purely legacy requirement that never had a WBS keeps its
        behaviour-name-only heading). Several requirements MAY share one WBS
        (aggregated into one FSD block downstream) — reuse the same WBS across
        ADDED/MODIFIED requirements that belong to the same block; do NOT force
        one requirement per WBS. The RQ IDs stay in the metadata comment.
      - BEHAVIOUR ONLY: requirement text uses RFC 2119 keywords (SHALL /
        SHALL NOT / MUST / SHOULD / MAY) and states observable behaviour — what
        a shopper, consumer, or test can see. It never names a file path,
        component, route literal, loader, hook, helper, endpoint, payload
        field, SDK, library, product, internal step, sequencing, or agent
        commentary; those are design and technical-design.
      - IMPLEMENTATION SCAN — OpenSpec's own contract excludes from a spec:
        internal class/function names, library or framework choices,
        step-by-step implementation, and execution plans (those live in design
        / technical-design). As the last step before output, scan every
        requirement and scenario line and DROP it, or rewrite it to the
        observable bound, on any hit: (a) a library / SDK / product / framework
        name (e.g. a vendor's SDK / client library, "using the <Vendor> SDK"); (b) an
        endpoint, URL, HTTP verb, status code, or data-format token (`GET …`,
        `200`, `429`, "returns a JSON array"); (c) internal-step narration
        ("forwards the request to <vendor>", "initializes the SDK", "returns a
        payload containing …"). Keep a line that states an observable bound;
        drop one that narrates a mechanism a consumer cannot observe. (The
        own-vendor-at-interface vs consumed-vendor-name boundary and the
        approved-MECHANISM carve-out are defined once in OBLIGATION-SEAT TEST —
        apply that boundary here, do not restate it.)
      - REQUIREMENT PARTITION — the committed SUBJECT (below) is the partition
        axis: one WBS yields one requirement PER DISTINCT SUBJECT its covering
        criteria address, and downstream each requirement's NAME becomes the
        group label of its scenarios in the projected FSD/ISD table. Commit the
        partition in the PLAN before drafting, as a closed-membership set:
        `BLOCK LEDGER = [ <WBS> -> <requirement name> | SUBJECT = <actor> :=
        <the criteria and bounds it carries> ; … one line per requirement … ]`;
        every covering criterion sits on exactly ONE line, and the draft is a
        verbatim application of that ledger.
        (a) A criterion whose SUBJECT is the ADMINISTERING business user
        (authoring, configuring, enabling, curating the feature) never shares a
        requirement with an observer-outcome criterion: it is its own
        requirement, named `Management`, emitted LAST for that WBS and never
        split further (the projection closes the block's table with that group
        whatever the file order, so the reader always meets it last). A shopper-outcome criterion whose scenario merely
        PRESUPPOSES an administered record (an admin GIVEN) is not one of these
        — the axis is the SUBJECT of the requirement's SHALL, never a scenario
        precondition.
        (b) An Applicable cross-cutting guarantee that constrains this WBS
        (privacy, accessibility, localization) MAY stand as its own requirement,
        named for the guarantee it holds; it is then a seat of its own and, like
        Management, is exempt from (c)'s two-scenario bar.
        (c) The remaining observer-seat requirement splits further ONLY when the
        same trigger yields a DIFFERENT observable outcome in a distinct context
        (a viewport class, a channel, an authenticated state) AND each resulting
        requirement carries >=2 scenarios; name each for the outcome it holds,
        never for the context alone. Otherwise the context sits INSIDE a
        scenario and the seat stays ONE requirement — a proliferation of
        one-scenario groups is the defect this bars.
        (d) Requirement names are UNIQUE within a WBS (they are the downstream
        group labels and part of the archive merge key) and each requirement's
        text carries only the clauses its own criteria state.
      - OBLIGATION-SEAT TEST — commit each requirement's seat in the PLAN before
        drafting, not at emit time: extend its placement-ledger line with
        `seat = THIS capability's | SUBJECT = <the grammatical actor of its SHALL>
        | consumed deps = <named upstream, abstracted here>`, inheriting the
        boundary from the lock Notes and Out of Scope & Boundaries. The draft is a
        verbatim application of that commitment; a clause that fails its seat is
        dropped from this spec, not rephrased. Commit by capability type:
        (a) Integration capability: SUBJECT is "the capability" — never the
        vendor-bearing capability NAME as the actor of every SHALL ("The capability
        SHALL authorize…", not "The Acme payments integration SHALL authorize…"). It
        owes only what the consumer receives AT the interface (an authorization
        result, a ready-to-use entrypoint, a clear error). A clause describing what the
        consumer's UI does with that result — presenting, ordering, synchronizing
        surfaces, layout, filtering, paginating, accessibility, empty-state, or
        localized copy — fails its seat; it belongs to the consumer named in Out
        of Scope & Boundaries. The capability's OWN vendor may be named only as the
        service at the interface — WHO supplies the obligation (the owned key, what
        that vendor can resolve); its SDK, library, or product as the execution
        mechanism is design's HOW, not behaviour.
        (b) Functional capability: SUBJECT is the shopper's observable outcome. In
        the plan, copy the consumed vendors/services from the proposal's Depends on
        / External Dependencies & Access into a closed OUT-set, and pair each with
        the observable phrase its covering seed already uses (seed "address
        suggestions appear" -> the requirement and scenarios say that, never the
        supplier's name). The draft uses the seed's PHRASE in both requirement text
        AND every scenario line; a final scan finds no OUT-set name anywhere.
        Attributing the supplier ("via <vendor>", "suggestions from the <vendor>
        service", "provided by the <vendor> capability") is a leak, not a citation —
        the dependency is recorded upstream, not here.
      - GROUNDING: mint no route, path, number, or magnitude. A `/…` path
        appears only when a cited source OR an upstream artifact states that
        exact path — including a user-facing URL an upstream design fixed as an
        information-architecture decision (the new surface's path, a navigation
        or redirect target); inherit such a path VERBATIM. A threshold, amount,
        count, time, or limit appears only when a source or approved decision
        states it. A surface whose path NO source or upstream artifact states is
        named ("the <page name> page"), never slugged — in requirement text,
        footer/nav lines, and the Migration note. Neither a sourced legacy path
        nor an upstream-fixed path licenses minting a DIFFERENT slug the upstream
        does not carry.
      - OPERATIONAL GROUNDING: an operational property — a cache or TTL, a
        retry / back-off / retry-after hint, a quota, rate-limit, or timeout
        number — appears ONLY when an approved decision or a cited source states
        that exact property. A vendor / design doc merely noting a value is
        "cacheable", or documenting a rate limit, is HOW reference, not a
        decision to impose that behaviour; absent an approved decision the
        property is fabrication and is omitted, not invented as a SHALL.
      - SEED SKELETON — commit the behaviour skeleton in the PLAN before
        drafting, exactly like the closed-membership ROWS/OUT commitment, not a
        loose mention: `SEED SKELETON = [ <slice S#> -> <its acceptance-criteria
        seed phrase, verbatim> -> covering requirement(s) ; … one line per
        slice … ]`. The proposal's seeds are the human-approved, vendor-free
        behaviour; the draft TRANSCRIBES each seed phrase into its requirement
        text and scenarios AS THE SKELETON, then COMPLETES it by layering every
        covering DECISION LEDGER bound (APPROVED-DECISION BINDING) and every
        Applicable cross-cutting area as added observable clauses + scenarios —
        the seed alone is an incomplete contract, and a requirement that omits a
        covering ledger bound or cross-cutting behaviour is a silent drop. design
        and discovery add NOTHING BEYOND those committed bounds: no NEW behaviour
        clause of their own, no consumed-vendor / SDK / endpoint noun
        (OBLIGATION-SEAT TEST), and never the richer
        wording a signed discovery Requirement or Requirement Details carries
        (trace wording that describes the consumer's UI — a synchronized list, a
        highlighted selection — is that
        consumer's behaviour, not this capability's, even when the seed's slice
        traces to the same RQ). A clause that traces to none of a SEED SKELETON
        phrase, a DECISION LEDGER bound, or an Applicable cross-cutting area is
        anchor drift; drop it before output. (`Source:` citation provenance is a
        separate concern from this behaviour-import rule — see TRACE METADATA
        RULES.)
      - APPROVED-DECISION BINDING — commit the decision set in the PLAN before
        drafting, not at emit time (this is the pass most often skipped, because
        a base requirement reads complete without its bound). Straight from
        grooming, enumerate EVERY APPROVED or DEFERRED-APPROVED decision (each
        Q#/CR#/P#) and commit an explicit, NAMED plan block — exactly like the
        closed-membership ROWS/OUT commitment, not a loose mention in the
        extracted-items prose: `DECISION LEDGER = [ <Q#/CR#/P#> -> <decided
        bound, verbatim> -> covering requirement <heading or RQ> -> carries: text
        clause + scenario ; … one line per decision … ]`. Grooming's Decision
        cell already names the slice / requirement its bound constrains — read
        the covering requirement from there; do NOT wait for a seed to point at
        it (a decision with no seed marker binds the same way). The draft is a
        VERBATIM application of these ledger lines: each ledgered decision emits
        its bound as an observable clause in the covering requirement's TEXT AND
        a scenario that exercises it, and the seed's open phrasing is REPLACED by
        the decided bound, never formalized as "undecided". A decision left off
        the ledger, or stated without its bound, is a silent drop; a rejected
        option that surfaces is a leak. As the last step before output, diff
        every ledger line against the draft and fix any decision missing its
        clause + scenario. Bind by type:
        (a) CONFIGURATION (administrator- or merchant-tunable): the base
        requirement reads complete without it, so it is the bound most often
        dropped — land it as a trailing SHALL-configurable clause on the
        requirement AND a dedicated scenario where the configured value governs
        the outcome.
        (b) SCOPING (a v1 limit, a declined CR): an explicit
        inclusion/exclusion statement.
        (c) MECHANISM or QUALITY (a permanent redirect, a server proxy, a
        domain-restricted key): a SHALL stating the decided property and its
        observable guarantee.
        A DEFERRED-APPROVED prerequisite does not thin the contract — spec the
        full approved bound against the stable interface. A decided bound
        replaces upstream pre-decision phrasing.
      - Group by behaviour, not slice arithmetic: a slice may yield several
        requirements (per REQUIREMENT PARTITION) and two slices may share one.
        Coverage is judged on the lock and the slices, never on requirement
        arithmetic.

      SCENARIO RULES:
      - Shape `#### Scenario: <name>` (exactly 4 hashtags) with
        bold **GIVEN** / **WHEN** / **THEN** (/ **AND**) lines. Each line is
        testable as written: one observable condition or outcome per line, a
        concrete subject, no subjective wording ("fast", "user-friendly"), and
        nothing a tester cannot verify from outside (see also Deterministic and
        observable below).
      - The whole heading text after `Scenario:` is the NAME, and nothing in it is
        interpreted: no leading bracketed label, no grouping tag, no re-usability
        marker. Downstream, the FSD/ISD renders the scenarios of all requirements
        sharing a WBS as ONE table in which each requirement contributes a NAMED
        group of rows, so grouping is expressed by the requirement a scenario sits
        under (REQUIREMENT PARTITION), never by its name.
      - PROJECT-ALL / specs_from_ac COUPLING: author the COMPLETE grounded
        scenario set — the FSD projects ALL of them (no downstream curation), so
        every near-final proposal acceptance-criteria criterion is covered by
        >=1 scenario here. A criterion with no covering scenario is a silent
        drop; a scenario covering no criterion (and entailed by no seed/source/
        decision) is fabrication.
      - Deterministic and observable: a tester executes each line without
        interpretation. No "works correctly", no invented magnitude, no
        implementation assertion.
      - SCENARIO-SET COMPLETENESS: every ADDED and MODIFIED requirement carries
        its full scenario set, and every scenario is grounded — it exists only
        because a seed, source line, or approved decision names or directly
        entails it. Walk the requirement's seeds and approved bounds and write
        one scenario per case they raise: the main flow; each named edge (an
        empty result, a cleared input, a sourced boundary, a
        configuration-governed value); each named error or denied case (a
        permission or absent dependency the source names). Two defects are
        equally wrong: a lone happy path when the seeds raise more (the common
        under-specification), and a plausible case no seed raises (a generic
        service error, data-unavailable, or fallback is fabrication). If the
        seeds raise no edge or error case, carry only the flows they name.
      - Observer's seat: every scenario INHERITS its requirement's plan-committed
        seat and SUBJECT and passes the IMPLEMENTATION SCAN line-by-line
        (OBLIGATION-SEAT TEST) — GIVEN a request or state, WHEN the capability
        serves it, THEN what the observer receives at the boundary. No
        GIVEN/WHEN/THEN/AND line narrates an internal step (a proxy hop, an SDK
        init/load, an own endpoint, a payload): the WHEN names the observable
        trigger ("WHEN the capability processes the request"), and an
        integration THEN asserts only the resolved value, ready entrypoint, or
        clear error the consumer receives — never a downstream artifact the
        consumer builds (a store list, a rendered or synchronized surface). A
        scenario asserts an approved mechanism's observable guarantee, never the
        mechanic.

      DELTA RULES:
      - MODIFIED: copy the FULL requirement block from the baseline spec —
        heading VERBATIM incl. its WBS (the merge key) — then edit the text and
        scenarios to the new behaviour and attach the Trace/Source comment. A
        diff note or a heading the baseline does not carry breaks the archive
        merge.
      - REMOVED: name the baseline requirement heading verbatim and record
        `**Reason:**` (why it is retired and what supersedes it) and
        `**Migration:**` (where the behaviour or data went — the redirect,
        the re-pointed entry, the replacing capability). No trace metadata
        or scenarios on REMOVED blocks.
      - ADDED: only requirements with no baseline counterpart.
      - RENAMED: when a change only changes a baseline requirement's NAME (the
        same requirement, same WBS, a new name — the WBS is the immutable join
        key and NEVER changes on a rename), record it under
        `## RENAMED Requirements` as a FROM/TO pair — a `- FROM: ` line
        wrapping the baseline heading VERBATIM in backticks
        (`### Requirement: <WBS> — <old name>`) then a `- TO: ` line with the new
        heading (`### Requirement: <WBS> — <new name>`), the same WBS on both
        sides. Never model a rename as a REMOVED + ADDED
        pair: that drops the archive's rename linkage and can trip its
        uniqueness / cross-section checks. A rename pair carries no
        Trace/Source/Scenario. If the behaviour ALSO changes, keep the rename
        pair AND add a MODIFIED block whose heading is the NEW name with the
        full updated block. This section is orthogonal to the capability's
        ADD/MODIFY/REMOVE disposition — it lives in the file of the capability
        that owns the renamed requirement; omit it entirely when nothing is
        renamed.

      BASELINE & DELTA TIMELESSNESS:
      - Baseline (`specs/`) is timeless: it states current behaviour only — no
        change names, no "Phase N", no changelog / migration narrative, no
        forward-reference to `changes/` paths (they break on archive).
      - ADDED / MODIFIED requirement bodies and scenarios merge into the baseline
        VERBATIM on archive, so they inherit that timelessness: describe the END
        STATE ("the meter is placed in the right column…"), never the act of
        change ("Phase 2 adds…", "now moves…"). The `## ADDED` / `## MODIFIED`
        header already encodes the change-nature — do not restate it in prose.
      - "Phase N" is tolerable only in proposal / design / grooming / tasks
        (discarded on archive), never in a requirement body or scenario.
      - Whole-block restatement is required, not redundant: a MODIFIED block
        restates the unchanged scenarios it keeps — but never adds a
        "no regression" / "behaviour unchanged" scenario (that is a tasks.md QA
        gate, not a permanent spec scenario).

      REVERSE-ENGINEERED BASELINE vs AUTHORED DELTA:
      On a brownfield project the storefront is adopted from a vendor baseline
      (e.g. the Storefront Next template), so much of `specs/` is
      reverse-engineered from inherited code, not authored intent. Do NOT
      bulk-rewrite it — grow specs one change at a time.
      - Reverse-engineered baseline: characterises inherited behaviour; the CODE
        is the source of truth; impl symbols (`useX`, `FooModal`, `getBar`) are
        TOLERATED as a traceability anchor into unfamiliar vendor code; mark
        provenance in the capability's baseline `## Purpose`
        (`> Provenance: reverse-engineered from the storefront baseline; code is
        source of truth.`). Never bulk-convert it to declarative purity.
      - Authored change delta: DRIVES new code; the SPEC is the source of truth;
        impl symbols are FORBIDDEN — declarative behaviour only (`THEN the item
        quantity updates`, not `THEN updateItemInBasket is called`). Clean the
        slice you touch to declarative form; leave the rest.

      CAPABILITY DECOMPOSITION — which capability owns a requirement (apply
      top-down, stop at the first match):
      - Level 0 (primary axis: surface/page): group by surface first (PDP, cart,
        mini-cart, checkout, account…); behaviour belonging to exactly one
        surface lives under that surface's capabilities by default.
      - Level 1 (lift ABOVE a single surface) only when it has its OWN external
        integration / data source (→ own capability) or is REUSED across
        surfaces (→ own shared capability; each surface keeps a thin "placement"
        requirement cross-referencing it).
      - Level 2 (split WITHIN a surface) by self-contained neighbour areas; keep
        states (empty / loading / error), nested sub-components, and page-local
        shared rules in the page-shell capability.
      - Decision order (stop at first yes): (1) a state of the surface → page
        shell; (2) own external integration / data source → own capability;
        (3) reused across surfaces → own shared capability; (4) large
        self-contained area on this surface → own capability; (5) otherwise →
        containing area or page shell.
      - Delta consequence: archive matches deltas to the baseline by capability
        folder AND requirement header (verbatim, whole-block). If this change
        needs a different decomposition than the baseline (split a monolith, a
        new capability, rename / re-own an area), RESTRUCTURE THE BASELINE FIRST
        (move requirement blocks verbatim into the target capabilities, `openspec
        validate --strict`, commit that restructure), THEN author deltas that
        line up 1:1. Never author a delta against a capability or header absent
        from `specs/`.

      TRACE METADATA RULES:
      - The WBS code lives in the Option-H heading (REQUIREMENT RULES), NOT in a
        metadata line. Every ADDED and MODIFIED requirement carries, on the line
        immediately after the heading, a single HTML comment holding Trace +
        Source: `<!-- Trace: <RQ IDs> · Source: <citation> -->`. Use a comment,
        never bold `**Trace/WBS/Source**` lines — the CLI folds any text between
        the heading and the first `#### Scenario:` into the archived baseline
        requirement text, so bold metadata pollutes the canon while a comment
        stays invisible in the render and out of the baseline.
      - RQ and WBS codes come VERBATIM from the discovery trace / proposal
        lock — never minted, never blank, never `N/A`. Commit each requirement's
        `WBS` (for its heading) and `Trace` (for its comment) in its plan ledger
        line before drafting: a cross-cutting requirement (privacy, accessibility,
        i18n) copies the RQ/WBS of the traced requirement(s) whose behaviour it
        constrains, or its own cross-cutting RQ row upstream when one exists — a
        ledger line with blank or invented (`PRIV`) codes is the defect, caught
        before emit, not a heading WBS or `Trace:` left empty in the draft.
      - Sources cite the signed grounding a behaviour derives from: the SRD
        requirement (its RQ id and inbox file), technical/meeting notes, a
        grooming decision (`grooming Q1`), a design mechanism, a discovery
        cross-cutting row, or the baseline spec path for MODIFIED blocks —
        never the intermediate proposal as the derivation. A behaviour bounded
        by an approved decision cites that decision alongside its signed source.

      OUTPUT CONTRACT:
      - `openspec/changes/<name>/specs/<capability>/spec.md`, one file per
        affected capability.
      - Each file contains exactly its delta section(s) with requirement
        blocks and scenarios. The file MUST begin with a `## <DELTA>
        Requirements` header — no document title, no Purpose section (the
        capability Purpose lives in the baseline spec), no executive
        summary, no status line, no gate checklist, no commentary, and NO
        title line before the first operation header (a leading title makes
        `openspec validate` reject the delta). Delta files must merge into
        the archive clean.

      SELF-CHECK BEFORE OUTPUT (fix any "no" before emitting):
      - Grooming Approval Gate verified before authoring (ENTRY GATE)?
      - One file per Affected Capabilities row, under the delta section its
        disposition names (FILE INVENTORY RULES)?
      - Coverage total — every in-scope lock RQ traced, every slice formalized,
        every Applicable cross-cutting area captured, and nothing deferred,
        declined, or out of scope specced (DECISION KERNEL)?
      - Every ADDED/MODIFIED requirement carries its full grounded scenario
        set, not a lone happy path, and no ungrounded case (SCENARIO RULES)?
      - Every requirement transcribes its covering proposal seed AS THE SKELETON
        and is COMPLETED with every covering DECISION LEDGER bound and Applicable
        cross-cutting layered on (no requirement left at the bare seed) — with
        design/discovery adding nothing beyond those bounds: no NEW clause,
        vendor/SDK/endpoint noun, or consumer-UI wording pulled from a discovery
        Requirement / Requirement Details (SEED SKELETON), and every Source cites
        the signed grounding (SRD requirement, technical notes, grooming, design,
        or baseline), not the intermediate proposal as the derivation (TRACE
        METADATA RULES)?
      - Every requirement and scenario line passes the OBLIGATION-SEAT TEST and
        the IMPLEMENTATION SCAN — no consumer-UI behaviour in an integration
        spec, no implementation token (SDK/product, endpoint/URL/verb/status/
        payload, internal-step narration), and no consumed-vendor OUT-set name in
        a functional spec (REQUIREMENT RULES, SCENARIO RULES)?
      - Every WBS matches its BLOCK LEDGER line-for-line — administering criteria
        in a single trailing `Management` requirement, each Applicable
        cross-cutting guarantee its own requirement, no observer seat split below
        two scenarios, and names unique within the WBS (REQUIREMENT PARTITION)?
      - No fabricated operational property — no cache/TTL, retry/retry-after,
        quota, rate-limit, or timeout that no approved decision or cited source
        states (OPERATIONAL GROUNDING)?
      - Every approved/deferred-approved decision bound appears as an
        observable clause AND a scenario, with no rejected option
        (APPROVED-DECISION BINDING)?
      - No minted route, path, number, or magnitude; a new surface named, not
        slugged (GROUNDING)?
      - MODIFIED blocks carry verbatim baseline headings with full updated
        blocks; REMOVED blocks carry Reason + Migration (DELTA RULES)?
      - Every cross-cutting behaviour, including a retired URL's redirect,
        exists as a requirement with a scenario — never only a Migration note?
      - Every heading is Option-H `### Requirement: <WBS> — <name>` with the
        WBS in the heading (MODIFIED/REMOVED match the baseline verbatim), Trace
        and Source in a single HTML comment after the heading (no bold metadata
        lines), and every WBS/RQ verbatim and grounded (REQUIREMENT RULES, TRACE
        METADATA RULES)?
      - Every near-final proposal AC criterion covered by >=1 scenario, with no
        fabricated scenario (SCENARIO RULES)?
    requires: [discovery, design, proposal, grooming]

  - id: fsd
    generates: fsd/**/*.md
    description: Client-facing Functional Specification Document(s) — the approval copy for a functional change (CONDITIONAL; an integration change publishes an ISD instead)
    template: fsd.md
    instruction: |
      PURPOSE:
      The FSD is the client-facing projection of the approved offer — the
      document the client reviews and formally approves. It lives as a
      working copy at `openspec/changes/<name>/fsd/<feature>.md`;
      `/opsx:propose-submit` later publishes it to Confluence for client
      sign-off. It is the ONLY document of this change the client reads:
      internal machinery (unresolved internal decisions, artifact paths,
      agent process, consumed-integration mechanics) stays out. The FSD adds
      no behaviour and decides nothing — the behaviour canon stays in specs.
      But once the client signs it, the FSD is the PRIMARY functional source
      of truth for the downstream developer phase (technical-design, tasks,
      build): it is the signed WHAT they read first, ranked above design and
      grooming for functional intent. specs stays the structured executable
      projection of that same WHAT and the only artifact archived into the
      timeless baseline — the two never conflict: the FSD is the signed client
      contract, specs its machine-checkable behaviour canon.

      AUTHORITY ORDER:
      1. The APPROVED grooming decisions and the reconciled upstream
         artifacts — discovery.md (Requirements Trace: verbatim text and
         RQ/WBS codes; Delivery Scope & Targets), proposal.md (Requirements
         Lock and Delivery Breakdown), this change's delta specs (the
         behaviour), design.md (only where it shapes client-visible
         behaviour) — are the factual source of truth. Consume each through
         those NAMED sections — the upstream's machine-readable interface —
         not by mining other prose.
      2. This `fsd` instruction is the artifact contract: follow it for
         coverage, client hygiene, and the quality bar.
      3. The `fsd.md` template defines the section order, tables, heading
         levels, and placeholders.
      4. Publishing and status transitions are owned here: a fresh FSD is
         `draft`; `/opsx:propose-submit` sets `astound review` at submit
         (delivering-org review), then `<client> review` when the doc goes to
         the client, and `approved` is set manually in Confluence after client
         sign-off — tooling never sets `approved`. The active working copy is
         the only source for publish metadata, approval, and status; never
         read `openspec/changes/archive/**` for current lookup. Project
         `config.rules.fsd` provides supporting context. Neither overrides
         this contract. Criterion phrasing is not this artifact's concern: the
         User Story / Acceptance Criteria blocks are projected from the
         proposal verbatim.

      DECISION KERNEL:
      - SCAFFOLD-FIRST (read-only projection): the per-requirement
        `#### User Story`, `#### Acceptance Criteria`, and `#### Key behaviours`
        sub-sections are filled DETERMINISTICALLY by the scaffold script
        (`generate-functional-artifacts.mjs`) — Story + Acceptance Criteria projected VERBATIM
        from the covering proposal slice, Key behaviours projected as a TABLE
        from the covering spec requirement(s)' full scenario set. RUN THE
        SCAFFOLD SCRIPT FIRST; then enrich ONLY the non-owned sections (General
        FSD Information, approval roster, Reference Materials, per-block
        Visualization, framing). EXTEND (a published doc fetched into the working
        copy) runs the SAME script WITH `--extend`: it updates/adds ONLY this
        change's WBS blocks and PRESERVES every prior in-scope block verbatim —
        WITHOUT `--extend` the reconcile treats this change's proposal as the whole
        in-scope set and REMOVES the prior change's blocks, silently stripping
        published scope. stories.md is always a full re-render from THIS change's
        slices (per-change; correct on both NEW and EXTEND). NEVER hand-author or edit the three
        script-owned sub-sections — to change a Story or a criterion edit the
        covering proposal slice, to change a Key behaviour edit the covering
        spec requirement, then re-run the script. That includes the table's bold
        sub-header rows: each one is a covering requirement's NAME, so a label
        changes only by renaming that spec requirement. The script also VALIDATES
        the join first; fix any reported error UPSTREAM (proposal / specs), never
        in the FSD.
      - The FSD projects; it never decides. Scope is the lock, slicing and
        user stories were approved in the Delivery Breakdown, behaviour is
        canon in specs, decisions are grooming law. If a section cannot be
        filled from those without inventing, STOP and push the gap back to
        grooming — never fill it in a client document.
      - Scope law: the FSD exists because the delivery scope resolved
        `functional` (discovery's Delivery Scope & Targets carries the FSD
        row). An `integration` change publishes an ISD instead — one change
        never produces both document types.
      - A client document hides internal machinery: no unresolved internal
        decision, no internal paths or artifact names, no agent commentary,
        no code tokens, and no vendor/service names of consumed dependencies —
        behaviour is stated from the shopper's seat. RQ/WBS/CR codes are
        the exception: they are the client-shared trace vocabulary from
        the BRD and appear throughout.
      - Approved decisions are law: encode each approved bound exactly
        ("regular weekly opening hours … not displayed in v1", "permanently
        redirected"), record each CR under its DECIDED status, and never
        resurrect a declined or rejected option.
      - The working copy is fresh: FSD Status `draft`, every approval
        row `not started`, Open Questions EMPTY (everything pre-build was
        decided at grooming), no Confluence URL or Page ID. Publishing and
        status progression belong to `/opsx:propose-submit`, never here.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Clear the ENTRY GATE (grooming approval + functional scope +
         client-facing surface).
      2. For each FSD row in discovery's Delivery Scope & Targets, start
         the working copy per its disposition (NEW vs EXTEND — see FILE
         RULES).
      3. Run the scaffold script (`generate-functional-artifacts.mjs`) to project the In Scope
         functional blocks — one per in-scope RQ, keyed by its clean WBS code,
         with the read-only User Story / Acceptance Criteria / Key behaviours
         filled (FUNCTIONAL BLOCK RULES). Fix any validation error UPSTREAM
         (proposal / specs) and re-run; never hand-fill those sub-sections.
         HOW TO RUN — (a) ONE-TIME, install the tooling deps: `npm install` in the
         deployed `.cursor/` directory (the script needs `nunjucks`); (b) invoke it
         with the change directory as its argument, e.g.
         `node .cursor/skills/plan/openspec-workflow/scripts/generate-functional-artifacts.mjs <path-to>/openspec/changes/<change> --dry`,
         inspect the `--dry` output, then re-run without `--dry` to write. For an
         EXTEND row (the disposition in discovery's Delivery Scope & Targets), add
         `--extend` so the script preserves the fetched doc's prior in-scope blocks
         and only updates/adds this change's WBS blocks; omit it only for a NEW doc.
         The script auto-locates the OpenSpec project root (the folder containing
         `openspec/`) to resolve the template via the `openspec` CLI, so cwd does
         not matter; pass `--template <path>` only as a dev/offline fallback.
      4. Enrich the non-owned sections: the General FSD Information card,
         approval groups, and Reference Materials (GLOBAL RULES), and each
         block's Visualization (LLM-owned) — leaving the three script-owned
         sub-sections untouched.
      5. Fill Deferred Requirements and Change Requests from the lock and
         the grooming decisions (OUT OF SCOPE RULES).
      6. Run the SELF-CHECK before emitting.

      ENTRY GATE (blocking — evaluate BEFORE authoring anything):
      - discovery.md, design.md, proposal.md, grooming.md, and this
        change's delta specs must exist as completed upstream artifacts,
        and grooming's Grooming Approval Gate must have PASSED (every item
        APPROVED or DEFERRED-APPROVED by a named human, every gate box
        checked). If the gate has not passed, STOP — a client document must
        not be generated from unapproved decisions, open questions, missing
        prerequisites, or implied CR dispositions.
      - Scope check: discovery's Delivery Scope & Targets must carry FSD
        row(s) (functional delivery scope). If the scope is integration,
        STOP — that change publishes an ISD, not an FSD.
      - CONDITIONAL: produce an FSD only when the change has a
        client-facing surface a client or end user would review. For pure
        refactors, internal tech, or infra-only changes, skip the FSD
        entirely — do not create fsd/ files. Nothing downstream requires
        it, so skipping never blocks stories/tasks/apply.

      FILE RULES:
      - One working-copy file per FSD row in Delivery Scope & Targets
        (a cross-cutting change may produce several files, e.g. PDP + PLP +
        cart). Name each with a lowercase kebab feature code:
        `openspec/changes/<name>/fsd/<feature>.md`.
      - Disposition per row: NEW -> create the working copy fresh from this
        change's approved artifacts. EXTEND -> fetch the live Confluence
        page into the working copy FIRST (no suffix), then update/add ONLY
        the section(s) this change touches, preserving every other section
        verbatim; never use archived OpenSpec changes as the baseline. On
        EXTEND, run the scaffold script WITH `--extend` (additive): it
        updates/adds ONLY this change's WBS blocks and PRESERVES every prior
        in-scope block verbatim. Running it WITHOUT `--extend` over a fetched
        published doc REMOVES the prior change's In Scope blocks (the reconcile
        treats this change's proposal as the whole in-scope set).
      - If discovery carries no Delivery Scope & Targets decision, resolve
        it now with project-context `source_type: ["confluence"]` for each
        affected area (see the `project-context` skill): extend a match,
        else start new — ask the user when ambiguous.

      GLOBAL RULES:
      - The header card H2 is "## General FSD Information" (type-specific — NOT
        a generic "Document Card"): the explicit label keeps the reader/reviewer
        anchored in the functional-specification scope. It is a headerless
        2-column card (keep the empty header row; no "Field | Value"):
        WBS-Feature Name, Project Name, Package/Set/Batch, Author/Owner,
        FSD Status, Target Approval Date. FSD Status =
        `draft` on a fresh working copy. Package/Set/Batch is OPTIONAL: fill it
        VERBATIM only when a source states a package / set / batch number for
        this scope; otherwise leave the cell blank — NEVER invent or infer a
        number. Target Approval Date is the client's target sign-off date in
        `dd/mm/yyyy`; leave the `dd/mm/yyyy` placeholder on a fresh working copy
        (the real date is prompted and filled by `/opsx:propose-submit` at
        publish) — NEVER invent a date.
      - Approval groups are H3 sub-sections under the General FSD Information
        card, one per approving org (the delivering org FIRST, then the
        client). The delivering-org group is ALWAYS titled "Astound Approval" —
        this header is STATIC; Astound is always the delivering agency, so never
        take it from CONTEXT and never substitute another agency name (e.g. a
        client's internal team). Title the client group "<Client Org> Approval"
        using the client ORG NAME from CONTEXT — do NOT invent a generic label
        like "Client Approval" when CONTEXT names the client org. Each is a
        headerless 3-column roster: role | status | name — the ROLE leads because
        column 1 becomes the wiki's Content Properties key that the published
        approval matrix aggregates on, so it stays a short stable token and the
        person moves to column 3. The Astound roster carries the DEFAULT FSD
        roles SA, FE, BE, QA (one row each) — seed the four rows with `TBC` names
        and substitute real names from CONTEXT when present (a real name for the
        matching role, `TBC` for the rest); never invent a person's NAME.
      - ORG FIREWALL (commit BEFORE seeding any roster or Author, like the
        closed-membership ROWS/OUT): enumerate every CONTEXT-named person and
        commit one plan line `<name> -> <org = delivering (Astound) | client |
        other> -> <role>`, then seat STRICTLY by org. An Astound roster row is
        filled ONLY by a DELIVERING-ORG (Astound) person whose role matches
        SA/FE/BE/QA; a CLIENT (or any non-Astound) person NEVER fills an Astound
        row EVEN when their title sounds like a delivery role — a client "FE
        lead", "platform dev", or "architect" is the CLIENT's own staff, not
        Astound's engineer, so that Astound row stays `TBC`. Client-org people
        seat ONLY in the client group. Seating a client / non-Astound person in
        the Astound roster is a mis-attribution, not enrichment. The client
        group carries a single `TBC | not started | TBC` row unless CONTEXT
        names a CLIENT-ORG approver/role (e.g. the client PO). Every status is
        `not started` on a fresh copy. Status badges: `not started` |
        `in progress` | `approved`.
      - Title and "WBS-Feature Name": the FEATURE-level WBS code and name
        the sources carry for this Delivery Scope & Targets row (e.g. the
        BRD feature block "CHK - Checkout Payments") — the document covers the
        row's ENTIRE scope, never a single requirement group. The H1 page
        title ALWAYS ends with " FSD" (e.g. "CHK - Checkout Payments FSD") so the
        document type is unmistakable in the Confluence page tree and to any
        reviewer; the "WBS-Feature Name" card value carries the same code+name
        WITHOUT the suffix.
      - Author/Owner: the DELIVERING-ORG author(s) of THIS document — the BA who
        owns the functional side and, when CONTEXT names them as co-owner, the
        SA lead — VERBATIM with their role, and NOTHING else. It is NOT the
        approval roster (never dump the SA/FE/BE/QA rows into this cell) and
        NEVER a spreadsheet-/tracker-provenance name (a CSV `Created By` /
        `Updated By` / `Approved By` value is metadata about a row, not the
        document's author) nor a client-org person. Leave `TBC` (never blank,
        never invented) when CONTEXT names no document author. Never embellish a
        person's name.
      - Project Name is the PROJECT/CLIENT identity the source packet names
        (e.g. "<Client> — <Programme> (<tracker key>)"), written in FULL — NOT
        the change slug (`add-<feature>`), NOT a single feature name, NOT the
        tech stack, and never abbreviated. If the sources name no project, ASK —
        do not assume or invent a project name.
      - Reference Materials: determine which client-facing references THIS
        change cites — the BRD/SRD, existing published FSD/ISD pages, and any
        other client-facing reference the sources carry — and record each by
        its TITLE or client-facing URL. An internal repo path or
        `project-context` inbox/anchor (e.g. `.cursor/…`, `…/inbox/…`) or a
        working-copy link is internal plumbing, never a row — cite the
        client-facing title/URL the source carries instead.
      - CHROME CELL FORMATTING: the card values and the Reference Materials
        Material/Notes cells carry ordinary inline markdown, exactly like the
        body. Write EVERY link as `[label](url)` — in the "Link / reference"
        column a bare URL is also allowed when the row needs no label (it
        publishes as an inline card). NEVER wrap a URL in backticks: that
        makes it dead monospace text instead of a link. Publishing turns this
        markdown into real Confluence links, code and mentions, and the
        reverse pull restores it, so the round-trip is lossless.
      - SOURCE LINK RESOLUTION: before emitting a source document as a bare
        title, resolve it to the canonical client-facing link we already hold.
        Check, in order, the project link registry (the project's Key links),
        project-context (search the matching source_type — it returns the
        indexed file plus its origin), and the project wiki/Drive. Cite the
        resolved link wherever it lives (Confluence page, Google Doc/Sheet,
        wiki, or other canonical location), not a bare title. Leave a bare
        title ONLY when no link is on record, and say so in that row (e.g.
        Notes "no canonical link on record") so a reviewer sees it was checked.
        Never fabricate or guess a URL; if project-context holds only a local
        ingested copy with no origin, surface that rather than inventing a link.
      - No summary/List-of-All-Requirements table and no legacy sections
        (Important Notes, Versions Log, Scope, Open Items Summary) and no
        Known-constraints section: a client FSD hides internal uncertainty —
        resolve it before generating, or record it as a Deferred Requirement
        or a Change Request.
      - Open Questions: the section belongs to the CLIENT REVIEW cycle, not
        to authoring. Emit the template's review sentence and its bare table
        header with NO rows — reviewers add rows on the published page.
        Never write a row, and never carry an unresolved internal item into
        a generated FSD; every pre-build decision was settled at grooming.

      FUNCTIONAL BLOCK RULES (the block SET is SCRIPT-OWNED; you ENRICH each block):
      - The scaffold script creates exactly one "### <WBS> — <name>" block (H3 under
        the "## In Scope Functional Requirements" H2) per in-scope proposal slice, keyed
        by the slice's clean WBS code, and its VALIDATION enforces the coverage law: one
        in-scope RQ = one block, no consolidation / split / omission, no block for
        deferred / declined / out-of-scope work, and no in-scope WBS reused by a Deferred
        / Change Request block (reuse breaks the stories join). Do NOT hand-add, merge,
        split, rename, or re-key blocks, and do NOT hand-write the WBS-code heading — if
        the block set looks wrong, the fix is UPSTREAM (the proposal Delivery Breakdown or
        the spec WBS); re-run the script, which names the exact fix on a validation error.
        FEEDBACK ROUND-TRIP: on a client request to change / add / remove a requirement,
        edit the proposal slice and/or the spec, then re-run — the script RECONCILES the
        existing FSD in place (ADDs a block for a newly-covered WBS, REMOVEs a block whose
        WBS is no longer covered, UPDATEs a changed block's read-only bodies), PRESERVING
        each surviving block's Visualization and the rest of the document verbatim, and
        re-syncs stories.md. Never hand-edit the FSD to add/remove/change a requirement.
      - The section OPENS with the SCRIPT-OWNED "**Re-usability Legend**" block — the
        proposal's `## Re-usability Legend` projected VERBATIM, once, before the first
        block, so the reader can decode the `#####` marker groups below it. It is a bold
        label, NOT a heading (a heading there would parse as a WBS-less block). The legend
        is authored ONLY in the proposal: never write, extend, trim, re-order, or re-word
        it here; to change it, edit the proposal's legend and re-run the script.
      - Sub-sections are H4 (####); Acceptance-criteria groups and scenarios
        are H5 (#####). Lean and human-readable, not a test spec. Block order
        (User Story, Visualization, Acceptance Criteria, Key behaviours):
        * User Story (SCRIPT-OWNED, read-only): the scaffold script projects the
          covering slice's Story VERBATIM — the SAME sentence the approved
          Delivery Breakdown recorded (which is the discovery/SRD user story
          word-for-word). Do NOT hand-author, copy-edit, re-persona, paraphrase,
          or shorten it; to change it, edit the covering proposal slice and
          re-run the script.
        * Visualization (REQUIRED, LLM-owned — enrich this): a State | Desktop |
          Mobile table in EVERY requirement block — a functional block without
          it is incomplete, the same as one missing its Acceptance Criteria.
          Determine the meaningful states (rows) and surfaces (Desktop/Mobile;
          Tablet only when the behaviour differs) from the requirement's
          behaviour — one row per state, at least one row. Each cell is a short
          TEXT description of the screen to capture; the image is attached later,
          directly in the published page. Never invent an image file, a
          design-tool link, or a state the behaviour does not imply. On EXTEND /
          re-generation, preserve verbatim any cell that already carries an
          image — write the text description only into cells with no image, and
          never overwrite a supplied image with a description.
        * Acceptance Criteria (SCRIPT-OWNED, read-only): the scaffold script
          projects the covering proposal slice's Acceptance Criteria VERBATIM,
          including its `#####` re-usability marker group headings and any
          opening boundary note, exactly as authored in the proposal. The AC
          contract, the markers, and their grounding are decided IN THE
          PROPOSAL — never re-shaped, re-grouped, re-marked, added to, or trimmed
          here. To change a criterion, edit the covering proposal slice and
          re-run the script.
        * Key behaviours (SCRIPT-OWNED, read-only): the scaffold script projects
          the FULL scenario set of the covering spec requirement(s) as ONE TABLE
          (`# | Scenario | GIVEN | WHEN | THEN`), not a curated subset — several
          requirements sharing one WBS aggregate into this one block, in spec order
          (a `Management` group always closing the table) and numbered
          continuously. When the block covers 2+ requirements the
          script emits a bold sub-header row per requirement — the row is that
          requirement's NAME from its spec heading (the WBS prefix stripped) — and
          the rows beneath it are that requirement's scenarios; a single-requirement
          block stays flat with no sub-header. Multiple AND outcomes collapse into
          the THEN cell. The LLM never curates, copies, sanitises, prose-ifies, or
          omits it, and never edits or adds a sub-header row; to change a behaviour
          or a group label, edit the covering spec requirement (its heading name is
          the label) and re-run the script.

      OUT OF SCOPE RULES (two bottom sections, never one generic list):
      - "## Deferred Requirements": same signed scope delivered later
        (nothing about the agreed scope changes — only the timing). One
        block per deferred RQ with Status / Reason / Planned delivery /
        Business Requirements.
      - "## Change Requests": any change to the signed BRD — added,
        removed, or altered scope (removing a BRD feature is a CR, not a
        deferral). One block per CR with the code, the DECIDED status from
        grooming (`Agreed` | `Declined` | `Pending client agreement`), why
        it is a CR vs the BRD, tracker ticket (the CR's OWN ticket when a
        source names one, else TBD — never the change's own tracker key),
        and its business requirements. A declined CR is recorded as
        declined — never resurrected as pending or absorbed into
        functional scope.
      - Sources: the proposal's CR dispositions as DECIDED at grooming,
        plus discovery's Change Request Candidates. Use "None." when a
        section is empty.

      OUTPUT CONTRACT:
      - `openspec/changes/<name>/fsd/<feature>.md` working copies only —
        one per Delivery Scope & Targets FSD row, following the template
        section order and heading levels. No Confluence publishing, no
        Page IDs, no status progression, no commentary around the document.

      SELF-CHECK BEFORE OUTPUT (fix any "no" before emitting):
      - Did I verify the Grooming Approval Gate passed, the delivery scope
        is functional (FSD row present), and the change warrants a client
        document?
      - Is every in-scope RQ from the discovery trace covered by exactly one
        functional block — one RQ, one block (no consolidation, no split) —
        with NO block for deferred, declined, or unlocked scope, and no
        summary requirements table?
      - Did I run the scaffold script and leave the projected Re-usability Legend
        and the three script-owned sub-sections (User Story, Acceptance Criteria,
        Key behaviours) EXACTLY as projected — not hand-authored, re-shaped,
        re-grouped, curated, or edited, with every bold sub-header row in a Key
        behaviours table left as the script wrote it (it is a covering
        requirement's name) — each block keyed by the requirement's clean WBS code
        (no `RQ<n>_` prefix, no RQ-ID, no composite)?
      - Did the scaffold script report a clean validation (no critical): every
        in-scope slice joined to a covering spec requirement, every WBS matched,
        no orphan or duplicate — with any reported error fixed UPSTREAM
        (proposal / specs) and the script re-run, never patched in the FSD?
      - Is every approved decision encoded with its bound intact, every CR
        recorded under its decided status, and no declined/rejected option
        resurrected?
      - Hygiene sweep of the ENRICHED (LLM-owned) content — scan every line and
        table cell I authored (General FSD Information, Reference Materials,
        Visualization, framing) for internal repo/artifact paths or names,
        open-question markers, agent commentary, code tokens (incl. HTTP status
        codes), and consumed-dependency vendor/service names; rewrite or remove
        each hit (RQ/WBS/CR codes stay — client vocabulary).
      - Is every cited source document resolved to the canonical client-facing
        link we hold (link registry / project-context origin / wiki/Drive),
        with a bare title left ONLY where no link is on record and flagged as
        such, and no URL fabricated?
      - Does EVERY functional block carry a Visualization (State | Desktop |
        Mobile) alongside its script-owned sub-sections, with no invented image
        file or state the behaviour does not imply?
      - Is the working copy fresh (FSD Status `draft`, Target Approval Date the
        `dd/mm/yyyy` placeholder, every approval
        row `not started`, Open Questions carrying the review sentence and
        its empty table header only, no Confluence URL/Page ID)?
      - Does the H1 page title end with " FSD", and is the header card H2
        "## General FSD Information" (not a generic "Document Card")?
      - General FSD Information: is Project Name the FULL project/client
        identity from the sources (not the change slug or a bare feature
        name), is Package/Set/Batch blank when no source states a number
        (never invented), and is each approval group titled by its org name
        from CONTEXT?
      - ORG FIREWALL: did I seat each roster row by the person's committed org —
        only delivering-org (Astound) people in the Astound SA/FE/BE/QA rows
        (a client "FE lead"/"platform dev"/"architect" stays `TBC`), client-org
        people only in the client group — and is Author/Owner the delivering-org
        document author(s) with role (not the roster, not a CSV provenance name,
        `TBC` when none, never blank/invented)?
    requires: [discovery, design, proposal, grooming, specs]

  - id: isd
    generates: isd/**/*.md
    description: Integration Specification Document(s) — the engineering contract of an integration change (CONDITIONAL; a functional change publishes an FSD instead)
    template: isd.md
    instruction: |
      PURPOSE:
      The ISD is the engineering contract of an integration change — the
      document a developer implements from, QA tests from, and business
      signs off. It lives as a working copy at
      `openspec/changes/<name>/isd/<service-integration>.md`;
      `/opsx:propose-submit` later publishes it to Confluence for
      approval. It describes the agnostic service capability this change
      delivers — the integration points, their contract, and the
      governance rules — NOT any consumer feature's UI. The ISD adds no
      scope and decides nothing: the behaviour canon stays in specs and scope
      stays the approved offer. But once it is signed off, the ISD is the
      PRIMARY integration source of truth for the downstream developer phase
      (technical-design, tasks, build): it is the signed integration WHAT —
      endpoints, contract, governance — they implement from first, ranked
      above design and grooming for integration intent. specs stays the
      structured executable projection of the behaviour bounds and the only
      artifact archived into the timeless baseline — the two never conflict:
      the ISD is the signed engineering contract, specs its machine-checkable
      behaviour canon.

      AUTHORITY ORDER:
      1. The APPROVED grooming decisions and the reconciled upstream
         artifacts — discovery.md (integration obligations and Delivery
         Scope & Targets), design.md (the Integration Specification:
         endpoints, parameters, data mapping, data flow — the contract
         source), proposal.md (Requirements Lock and Delivery Breakdown),
         this change's delta specs (the behaviour bounds) — are the
         factual source of truth. Consume each through those NAMED sections
         — the upstream's machine-readable interface — not by mining other
         prose.
      2. This `isd` instruction is the artifact contract: follow it for
         scope, contract fidelity, and the quality bar.
      3. The `isd.md` template defines the section order, tables, heading
         levels, and placeholders.
      4. Publishing and status transitions are owned here: a fresh ISD is
         `draft`; `/opsx:propose-submit` sets `astound review` at submit
         (delivering-org review), then `<client> review` when the doc goes to
         the client, and `approved` is set manually in Confluence after client
         sign-off — tooling never sets `approved`. The active working copy is
         the only source for publish metadata, approval, and status; never
         read `openspec/changes/archive/**` for current lookup. Project
         `config.rules.isd` provides supporting context. Neither overrides
         this contract.

      DECISION KERNEL:
      - SCAFFOLD-FIRST (read-only projection): the "## In Scope Functional
        Requirements" section is filled DETERMINISTICALLY by the scaffold
        script (`generate-integration-artifacts.mjs`) — one block per in-scope
        integration requirement, keyed by its clean WBS code, with a
        `#### User Story` + `#### Acceptance Criteria` projected VERBATIM from
        the covering proposal slice and a `#### Key behaviours` TABLE from the
        covering spec requirement(s)' full scenario set (NO Visualization — an
        ISD is a contract, not a UI document). RUN THE SCAFFOLD SCRIPT FIRST
        (on a NEW doc it bootstraps the working copy and writes stories.md); then author
        the rest of the ISD around it. EXTEND (a published doc fetched into the working
        copy) runs the SAME script WITH `--extend`: it updates/adds ONLY this change's
        WBS blocks and PRESERVES every prior in-scope block verbatim — WITHOUT `--extend`
        the reconcile treats this change's proposal as the whole in-scope set and REMOVES
        the prior change's blocks, so an EXTEND without the flag silently strips published
        scope. stories.md is always a full re-render from THIS change's slices (per-change;
        correct on both NEW and EXTEND). NEVER hand-author or edit those three
        sub-sections — to change a Story or a criterion edit the covering
        proposal slice, to change a Key behaviour edit the covering spec
        requirement, then re-run the script. That includes the table's bold
        sub-header rows: each one is a covering requirement's NAME, so a label
        changes only by renaming that spec requirement. The script VALIDATES the
        join first; fix any reported error UPSTREAM (proposal / specs), never in
        the ISD.
      - Scope law: the ISD exists because the delivery scope resolved
        `integration` (discovery's Delivery Scope & Targets carries the
        ISD row). A `functional` change publishes an FSD instead — one
        change never produces both document types.
      - Agnostic capability law: name and scope the ISD for the service
        capability itself, not for the first feature that consumes it.
        Consumer features appear only as context ("the first consumer")
        and under Out Of Scope with their owning change — never as owned
        scope or spec sections. Consumer RQ/WBS codes stay in the
        upstream artifacts; the ISD describes the INTEGRATION on its own
        terms. The ONE place a shopper User Story appears is the script-owned
        In Scope Functional Requirements section (a deterministic projection of
        the covering slice, not LLM-authored scope); the Overview and
        the Integration Specification stay agnostic and story-free.
      - The ISD projects; it never decides. The integration points come
        from the approved offer (lock obligations + Delivery Breakdown),
        the contract comes from the design's Integration Specification,
        behaviour bounds come from the delta specs, and governance policy
        (call placement, key policy, quotas/billing, release
        prerequisites, privacy) is the approved grooming law. If a section
        cannot be filled from those without inventing, STOP and push the
        gap back to grooming.
      - A dev document, not a shopper document: vendor endpoints, HTTP
        methods, parameter tables, field names, environment URLs, and
        vendor-SDK mechanics belong here — when the sources carry them.
        The project's INTERNAL machinery does not: no repository paths, no
        artifact names, no agent commentary, and no implementation wiring
        of our own codebase (components/files/hooks — technical-design
        owns that).
      - Diagram-opportunity analysis (ENUMERATE-then-JUSTIFY, hard bar):
        beyond the mandatory Integration Flow Overview sequence, run one
        deliberate pass over the Integration Specification sub-sections and,
        for EACH, name it and justify diagram / no-diagram against the
        drawio-diagrams type definitions and their pick-me-when — a linear
        step, a single request/response exchange, or logic already carried by
        a parameter / data-mapping table needs NO diagram; a real decision
        with distinct outcomes warrants an `activity` flow; a non-linear
        multi-node "who connects to whom" structure warrants a `plain` flow;
        an ordered call/return over time is a `sequence` (already spent on the
        overview). Keep the bar HARD — inherit the skill's "be concise" law and
        default to NO diagram; prose + a table is the norm, a diagram is the
        exception that must earn its place. If the user has NOT asked for a
        diagram, do NOT insert one yourself — carry the analysis into the
        OUTPUT CONTRACT's Diagram Recommendations block instead. If the user
        HAS asked for a diagram in a named section, author it there (still only
        if it clears the bar; if it does not, say so rather than drawing a
        pointless diagram).
      - The working copy is fresh: ISD Status `draft`, every approval row
        `not started`, Open Questions EMPTY (everything pre-build was
        decided at grooming). Never author a Change History section — the
        Document Change Log footer is appended automatically at publish.
        Publishing and status progression belong to
        `/opsx:propose-approved`, never here.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Clear the ENTRY GATE (grooming approval + integration scope +
         integration surface).
      2. For each ISD row in discovery's Delivery Scope & Targets, start
         the working copy per its disposition (NEW vs EXTEND — see FILE
         RULES).
      3. Run the scaffold script (`generate-integration-artifacts.mjs`) to
         bootstrap the working copy (NEW) or reconcile it (EXTEND) and project the
         "## In Scope Functional Requirements" section — one block per in-scope RQ,
         keyed by its clean WBS code, with the read-only User Story / Acceptance
         Criteria / Key behaviours filled (IN-SCOPE FUNCTIONAL REQUIREMENTS RULES).
         Fix any validation error UPSTREAM (proposal / specs) and re-run; never
         hand-fill those sub-sections.
         HOW TO RUN — (a) ONE-TIME, install the tooling deps: `npm install` in the
         deployed `.cursor/` directory (the script needs `nunjucks`); (b) invoke it
         with the change directory as its argument, e.g.
         `node .cursor/skills/plan/openspec-workflow/scripts/generate-integration-artifacts.mjs <path-to>/openspec/changes/<change> --dry`,
         inspect the `--dry` output, then re-run without `--dry` to write. For an
         EXTEND row (the disposition in discovery's Delivery Scope & Targets), add
         `--extend` so the script preserves the fetched doc's prior in-scope blocks
         and only updates/adds this change's WBS blocks; omit it only for a NEW doc.
         The script auto-locates the OpenSpec project root (the folder containing
         `openspec/`) to resolve the template via the `openspec` CLI, so cwd does
         not matter; pass `--template <path>` only as a dev/offline fallback.
      4. Fill the General ISD Information card, approval groups, and
         Reference Materials (GLOBAL RULES).
      5. Determine what the capability delivers and to whom (the vendor as
         what is built, the first consumer as context); record it as the
         Overview narrative (OVERVIEW RULES).
      6. Write the Integration Specification: flow overview plus one
         sub-section per integration point in data-flow order
         (INTEGRATION SPECIFICATION RULES).
      7. Fill Out Of Scope / Limitations, Deferred Requirements, and
         Change Requests from the lock, the boundaries, and the grooming
         decisions (OUT OF SCOPE RULES).
      8. Run the SELF-CHECK before emitting.

      ENTRY GATE (blocking — evaluate BEFORE authoring anything):
      - discovery.md, design.md, proposal.md, grooming.md, and this
        change's delta specs must exist as completed upstream artifacts,
        and grooming's Grooming Approval Gate must have PASSED (every item
        APPROVED or DEFERRED-APPROVED by a named human, every gate box
        checked). If the gate has not passed, STOP — an integration
        contract must not be generated from unapproved decisions, open
        questions, missing prerequisites, or implied CR dispositions.
      - Scope check: discovery's Delivery Scope & Targets must carry ISD
        row(s) (integration delivery scope). If the scope is functional,
        STOP — that change publishes an FSD, not an ISD.
      - CONDITIONAL: produce an ISD only when the change has an
        integration surface: new or changed endpoints, contracts, auth
        scopes, or external systems. If it has none, do not create isd/
        files. Nothing downstream requires it, so skipping never blocks
        stories/tasks/apply.

      FILE RULES:
      - One working-copy file per ISD row in Delivery Scope & Targets.
        Name each with a lowercase kebab service/capability code:
        `openspec/changes/<name>/isd/<service-integration>.md` (e.g.
        `isd/acme-payments-integration.md`).
      - Disposition per row: NEW -> create the working copy fresh from
        this change's approved artifacts. EXTEND -> fetch the live
        Confluence page into the working copy FIRST (no suffix), then
        update/add ONLY the integration point(s) this change touches,
        preserving every other section verbatim; never use archived
        OpenSpec changes as the baseline. On EXTEND, run the scaffold
        script WITH `--extend` (additive): it updates/adds ONLY this
        change's WBS blocks and PRESERVES every prior in-scope block
        verbatim. Running it WITHOUT `--extend` over a fetched published
        doc REMOVES the prior change's In Scope blocks (the reconcile
        treats this change's proposal as the whole in-scope set).
      - If discovery carries no Delivery Scope & Targets decision, resolve
        it now with project-context `source_type: ["confluence"]` for each
        affected integration (see the `project-context` skill): extend a
        match, else start new — ask the user when ambiguous.

      GLOBAL RULES:
      - The ISD shares the FSD chrome skeleton so both document types render
        identically: a "## General ISD Information" card, then H3 approval
        groups, then "## Reference Materials", then the ISD body. Keep that
        section order and heading levels (see the atlassian-doc-templating
        skill) — the card + approval groups + Reference Materials become the
        published page header.
      - General ISD Information is a headerless 2-column card (keep the empty
        placeholder header row; no "Field | Value"): WBS Code, Project Name,
        Jira Reference, Author/Owner, ISD Status, Target Approval Date. ISD
        Status = `draft` on a fresh working copy (lifecycle `draft` ->
        `astound review` -> `<client> review` -> `approved`). Target Approval
        Date is the client's target sign-off date in `dd/mm/yyyy`; leave the
        `dd/mm/yyyy` placeholder on a fresh working copy (the real date is
        prompted and filled by `/opsx:propose-submit` at publish) — NEVER
        invent a date.
      - The H1 page title ALWAYS ends with " ISD" (e.g. "Acme Payments
        Integration ISD") so the document type is unmistakable in the
        Confluence page tree and to any reviewer — never publish a bare
        capability name without the suffix.
      - Approval groups are H3 sub-sections under the card, one per approving
        org (the delivering org FIRST, then the client), each a headerless
        3-column roster: role | status | name — the ROLE leads because column 1
        becomes the wiki's Content Properties key that the published approval
        matrix aggregates on, so it stays a short stable token and the person
        moves to column 3. The delivering-org group is
        ALWAYS titled "Astound Approval" — this header is STATIC (Astound is
        always the delivering agency; never take it from CONTEXT). Title the
        client group "<Client Org> Approval" from the client org name in
        CONTEXT. The Astound roster carries the DEFAULT ISD roles FA, FE, BE, QA
        (FA = Functional Analyst, this org's name for the BA role) — seed the
        four rows with `TBC` names and substitute real names from CONTEXT when
        present; never invent a person's NAME.
      - ORG FIREWALL (commit BEFORE seeding any roster or Author, like the
        closed-membership ROWS/OUT): enumerate every CONTEXT-named person and
        commit one plan line `<name> -> <org = delivering (Astound) | client |
        other> -> <role>`, then seat STRICTLY by org. An Astound row is filled
        ONLY by a DELIVERING-ORG (Astound) person whose role matches FA/FE/BE/QA;
        a CLIENT (or any non-Astound) person NEVER fills an Astound row EVEN when
        their title sounds like a delivery role (a client "FE lead", "platform
        dev", or "architect" is the client's own staff, not Astound's engineer)
        — that Astound row stays `TBC`. The SA lead is the Author/Owner, not an
        FA/FE/BE/QA row. The client group carries ONLY the CLIENT APPROVER(S)
        CONTEXT names (e.g. the client PO) — a single `TBC | not started | TBC`
        row when none is named; client stakeholders who are NOT approvers (a
        client FE lead, a client dev) are NOT rostered here. Seating a client /
        non-Astound person in the Astound roster, or padding the client group
        with non-approver stakeholders, is a mis-attribution beyond the fresh
        state, not enrichment. Every status is
        `not started` on a fresh copy. Status badges: `not started` (grey) |
        `in progress` (yellow) | `pending answers` (red) | `approved` (green).
      - WBS Code: only a code the sources carry for this capability; when
        none exists, leave the cell empty ("—") — NEVER invent one.
      - Jira Reference: from the request or the sources, verbatim as named
        there. A consumer-feature tracker may be referenced with an explicit
        note when the sources record no dedicated ticket.
      - Author/Owner is the DELIVERING-ORG author of THIS document — the SA lead
        who owns the integration/architecture — VERBATIM with their role, and
        NOTHING else. It is NOT the approval roster and NEVER a spreadsheet-/
        tracker-provenance name (a CSV `Created By` / `Updated By` / `Approved
        By` value is metadata, not the document's author) nor a client-org
        person. Leave `TBC` (never blank, never invented) when CONTEXT names no
        document author.
      - Reference Materials (a "## Reference Materials" table with columns
        Material | Link / reference | Notes) has CLOSED membership: its ROWS
        are exactly the external, client-facing sources this integration
        cites — vendor documentation (plain URLs as sourced — no
        project-context wrappers), tracker tickets, and source documents
        (BRD/SRD) by title or client-facing URL. OUT (never a row — each has a
        real home elsewhere): the upstream artifacts (discovery, design,
        proposal, grooming, delta specs) are your SOURCES, not references; and
        ANY internal repo / working-copy anchor (`openspec/…`, `.cursor/…`, a
        project-context inbox path) — cite the canonical client-facing link
        (SOURCE LINK RESOLUTION), never the internal path.         Commit the
        `REFERENCE MATERIALS ROWS`/`OUT` lines in the plan before drafting and
        emit exactly that ROWS set.
      - CHROME CELL FORMATTING: the card values and the Reference Materials
        Material/Notes cells carry ordinary inline markdown, exactly like the
        body. Write EVERY link as `[label](url)` — in the "Link / reference"
        column a bare URL is also allowed when the row needs no label (it
        publishes as an inline card). NEVER wrap a URL in backticks: that
        makes it dead monospace text instead of a link. Publishing turns this
        markdown into real Confluence links, code and mentions, and the
        reverse pull restores it, so the round-trip is lossless.
      - SOURCE LINK RESOLUTION: before emitting a source document as a bare
        title, resolve it to the canonical client-facing link we already hold.
        Check, in order, the project link registry (the project's Key links),
        project-context (search the matching source_type — it returns the
        indexed file plus its origin), and the project wiki/Drive. Cite the
        resolved link wherever it lives (Confluence page, Google Doc/Sheet,
        wiki, or other canonical location), not a bare title. Leave a bare
        title ONLY when no link is on record, and say so in that row (e.g.
        Notes "no canonical link on record") so a reviewer sees it was checked.
        Never fabricate or guess a URL; if project-context holds only a local
        ingested copy with no origin, surface that rather than inventing a link.
      - Open Questions: the section belongs to the Confluence REVIEW cycle,
        not to authoring. Emit the template's review sentence and its bare
        table header with NO rows — reviewers add rows on the published
        page. Never write a row, and never carry an open item into a
        generated ISD; every pre-build decision was settled at grooming.
      - Never author a Change History section: the Document Change Log footer
        is appended automatically when the ISD is published.

      OVERVIEW RULES:
      - Determine what the capability delivers and to whom, the vendor named
        as what is built, and the first consumer as context; record the answer
        as a short executive-summary narrative (~4-8 sentences, one paragraph).
        It orients the reader; it is NOT a contract.
      - Prose only: no table, no SHALL / obligation language, no consumer user
        stories or persona sentences, no consumer RQ/WBS codes, no new scope,
        no provenance / process references (meetings, Key Decisions, SRD / RQ /
        WBS ids), and no "see section X" navigation pointers.
      - Single-home law: every in-scope integration obligation of the
        Requirements Lock lives in exactly one authoritative home — the
        near-final Acceptance Criteria in the script-owned In Scope Functional
        Requirements section, the technical contract in the Integration
        Specification, the key/quota/billing/privacy law in Key Governance &
        Privacy, or a boundary in Out Of Scope. The Overview restates none of
        them, and nothing beyond the lock appears anywhere. A signed, observable
        shopper-facing bound belongs in an Acceptance Criterion, never buried in
        prose.
      - The shopper User Story is NOT banned from the document — it appears
        VERBATIM in the script-owned In Scope Functional Requirements section
        (IN-SCOPE FUNCTIONAL REQUIREMENTS RULES); the Overview and the
        Integration Specification stay agnostic and story-free.

      IN-SCOPE FUNCTIONAL REQUIREMENTS RULES (the block SET is SCRIPT-OWNED; do NOT author it):
      - The scaffold script creates exactly one "### <WBS> — <name>" block (H3
        under the "## In Scope Functional Requirements" H2) per in-scope proposal
        slice, keyed by the slice's clean WBS code, and its VALIDATION enforces the
        coverage law: one in-scope RQ = one block, no consolidation / split /
        omission, no block for deferred / declined / out-of-scope work, and no
        in-scope WBS reused by a Deferred / Change Request block (reuse breaks the
        stories join). Do NOT hand-add, merge, split, rename, or re-key blocks, and
        do NOT hand-write the WBS-code heading — if the block set looks wrong, the
        fix is UPSTREAM (the proposal Delivery Breakdown or the spec WBS); re-run the
        script, which names the exact fix on a validation error. FEEDBACK ROUND-TRIP:
        on a client request to change / add / remove a requirement, edit the proposal
        slice and/or the spec, then re-run — the script RECONCILES the existing ISD
        in place (ADDs / REMOVEs / UPDATEs blocks' read-only bodies), PRESERVING the
        LLM-authored rest of the ISD verbatim, and re-syncs stories.md. Never
        hand-edit the ISD to add/remove/change one of these blocks.
      - The section OPENS with the SCRIPT-OWNED "**Re-usability Legend**" block — the
        proposal's `## Re-usability Legend` projected VERBATIM, once, before the first
        block, so the reader can decode the `#####` marker groups below it. It is a bold
        label, NOT a heading (a heading there would parse as a WBS-less block). The legend
        is authored ONLY in the proposal: never write, extend, trim, re-order, or re-word
        it here; to change it, edit the proposal's legend and re-run the script.
      - Sub-sections are H4 (####); Acceptance-criteria groups and scenarios are H5
        (#####). Unlike the FSD, an ISD block has NO Visualization — it carries ONLY
        the three script-owned sub-sections, in order:
        * User Story (SCRIPT-OWNED, read-only): the scaffold script projects the
          covering slice's Story VERBATIM — the SAME shopper sentence the approved
          Delivery Breakdown recorded (the discovery/SRD user story word-for-word).
          It reads as a shopper story here even though the ISD is agnostic, because
          it states WHY the integration exists; do NOT re-persona it into a
          "consuming developer" story, paraphrase, or shorten it. To change it, edit
          the covering proposal slice and re-run the script.
        * Acceptance Criteria (SCRIPT-OWNED, read-only): the scaffold script projects
          the covering proposal slice's Acceptance Criteria VERBATIM — its `#####`
          re-usability marker group headings and any opening boundary note exactly as
          authored — already the integration capability's own contract. Never
          re-shaped, re-grouped, re-marked, added to, or trimmed here; to change a
          criterion, edit the covering slice and re-run.
        * Key behaviours (SCRIPT-OWNED, read-only): the scaffold script projects the
          FULL scenario set of the covering spec requirement(s) as ONE TABLE
          (`# | Scenario | GIVEN | WHEN | THEN`), not a curated subset — several
          requirements sharing one WBS aggregate into this one block, in spec order
          (a `Management` group always closing the table) and numbered
          continuously. When the block covers 2+ requirements the script
          emits a bold sub-header row per requirement — the row is that requirement's
          NAME from its spec heading (the WBS prefix stripped) — and the rows beneath
          it are that requirement's scenarios; a single-requirement block stays flat
          with no sub-header. Multiple AND outcomes collapse into the THEN cell.
          Never curate, prose-ify, or omit it, and never edit or add a sub-header
          row; to change a behaviour or a group label, edit the covering spec
          requirement (its heading name is the label) and re-run.

      INTEGRATION SPECIFICATION RULES:
      - Open with a one-paragraph intro, then an Integration Flow Overview
        that RENDERS the design's data flow as a SEQUENCE diagram via the
        drawio-diagrams skill (.cursor/skills/plan/drawio-diagrams), then ONE
        H3 sub-section per integration point in data-flow order. This flow is
        an ordered call/return exchange over time (consumer -> capability ->
        vendor, then control returning), so the type is `sequence`, not
        `flow`. Author a ` ```drawio:sequence:integration-flow-overview `
        block (participants = the consuming side, this capability, and the
        vendor placed at the far end; messages = the ordered calls and their
        returns), run the skill's generate script to produce the image, and
        insert `![Integration Flow Overview](./assets/integration-flow-overview.png)`
        on the line after the block — follow the skill's own author ->
        validate -> generate -> insert workflow; do not hand-draw or inline a
        different diagram syntax. Keep it BOUNDARY-NEUTRAL, exactly like the
        design's data flow: each arrow carries the logical call (a capability
        call, "authorize charge server-side"), NEVER a vendor endpoint / path /
        query-param / key — that concrete wire lives only in the per-point
        contract below — and the third-party vendor sits at the periphery of
        the participant row, never woven into the centre.
      - SHAPE LEDGER (ENUMERATE-then-JUSTIFY, a PRE-DRAFT commitment like the
        closed-membership ROWS/OUT — do not defer the shape to drafting time):
        before writing any sub-section, walk the design's Integration
        Specification / chosen Solution Approach and commit one ledger line per
        integration point, in data-flow order:
        `<point> -> <shape = API | SDK | CARTRIDGE> -> <the grounded design fact
        that licenses that shape>`. The committed shape DICTATES the
        sub-section's tables:
        * API (a vendor REST endpoint the design maps field-by-field) -> an
          endpoint/channel line PLUS request/response parameter and data-mapping
          tables faithful to the design;
        * SDK (a vendor JS / native SDK channel) -> interface BULLETS only
          (channel, lazy entrypoint & init/config, methods/events, key supply)
          and NO request/response table;
        * CARTRIDGE / reused module -> configuration / extension-point bullets
          and NO field table.
        A point whose design entry has NO field-level data-mapping is SDK or
        CARTRIDGE by definition: its ABSENCE of an endpoint/data-mapping table is
        the CORRECT shape, and minting a request/response table — or any
        endpoint, field, or header the SDK / cartridge does not expose — for it
        is a contract fabrication, not enrichment. Draft each sub-section to
        EXACTLY its committed shape.
      - Each integration-point sub-section carries, per its committed shape:
        prose (what it does and the approved placement, e.g. served
        server-side), the endpoint or channel as the design states it, the
        shape's tables or bullets faithful to the design's Integration
        Specification (never widen an API table with Type/Required/host columns
        the design omits), error behaviour from the delta specs, and the
        governance notes that apply. Error behaviour comes ONLY from the delta
        specs: never invent fallback messages or failure semantics the specs do
        not state.
      - A sub-section MAY carry a `flow` diagram (activity for a real
        decision with distinct outcomes; plain for a non-linear multi-node
        structure) when the DECISION KERNEL's diagram-opportunity analysis
        clears the hard bar for that section — most sub-sections will NOT and
        stay prose + tables. When one qualifies, author a
        ` ```drawio:flow:<section-slug> ` block via the drawio-diagrams skill
        (type chosen per the skill, follow its author -> validate -> generate
        -> insert workflow) and insert its `![…](./assets/<section-slug>.png)`
        image on the next line. Keep it BOUNDARY-NEUTRAL exactly like the
        overview: arrows carry logical steps and outcomes, NEVER a vendor
        endpoint / path / query-param / key. Never scatter diagrams into
        sub-sections that did not clear the bar.
      - Close with a Key Governance & Privacy sub-section consolidating
        the approved key policy (restrictions, where the key lives per
        path), quota/billing ownership, release prerequisites, and
        privacy bounds.
      - Include vendor snippets, curl examples, or payload examples ONLY
        when the sources carry them; when the sources provide tables, use
        tables with the SAME columns and rows — never widen a table with
        Type/Required/host columns the sources do not state. Fabricating
        example payloads, hosts, CDN URLs, or values is a violation.
        Elide what the sources elide: a partial `…/v1/<path>` stays elided —
        never complete a host from memory.
      - How To Test: by default the document has NO such section. Add one
        ONLY when the sources ground test accounts, sandbox hosts, or
        test data.
      - Never state an undecided magnitude (quota, TTL, limit): when the
        design defers a value downstream, say where it is settled (e.g.
        "settled in the technical design").

      OUT OF SCOPE RULES:
      - "## Out Of Scope / Limitations": the boundary list — consumer
        UI/UX owned by the functional change, sibling services owned by
        separate changes, and hand-offs this capability does not perform.
        Name the owning change/service for each item.
      - "## Deferred Requirements": signed scope delivered later
        (timing only). "## Change Requests": any change to the signed
        BRD, each under its DECIDED grooming status. Use "None." when
        empty.

      OUTPUT CONTRACT:
      - `openspec/changes/<name>/isd/<service-integration>.md` working
        copies only — one per Delivery Scope & Targets ISD row, following
        the template section order and heading levels. No Confluence
        publishing, no Page IDs, no status progression, no commentary
        around the document.
      - ONE carved exception to "no commentary": when the user has NOT asked
        for a diagram, do NOT silently insert flow diagrams — instead, AFTER
        the working copy, emit a short **Diagram Recommendations** block IN
        CHAT (never inside the working copy) that surfaces the
        diagram-opportunity analysis: list each Integration Specification
        sub-section with a recommend / skip verdict and a one-line
        justification (which type and why, or why prose + a table suffices),
        so the user can ask for any that would help. When the user HAS asked
        for a specific diagram, author it in the named section per the rules
        above and SUPPRESS this block (the ask is already answered) — so in a
        single-shot run against an explicit request, emit only the working
        copy.

      SELF-CHECK BEFORE OUTPUT (fix any "no" before emitting):
      - Did I verify the Grooming Approval Gate passed, the delivery scope
        is integration (ISD row present), and the change has an
        integration surface?
      - Is the document named and scoped for the capability (agnostic),
        with the consumer appearing only as context and under Out Of
        Scope — no consumer rows or sections, and no shopper user story
        OUTSIDE the script-owned In Scope Functional Requirements section?
      - Did I run the scaffold script and leave the "## In Scope Functional
        Requirements" section's projected Re-usability Legend and three
        script-owned sub-sections (User Story, Acceptance Criteria, Key
        behaviours) EXACTLY as projected — not hand-authored, re-shaped,
        re-grouped, curated, or edited, with every bold sub-header row in a Key
        behaviours table left as the script wrote it (it is a covering
        requirement's name) — each block
        keyed by the requirement's clean WBS code, with NO Visualization; and
        did the script report a clean validation (join converged, no orphan /
        duplicate), any error fixed UPSTREAM (proposal / specs) and re-run,
        never patched in the ISD?
      - Is the Overview a short, one-paragraph narrative — no table, no SHALL,
        free of provenance / process refs and "see section X" pointers — and is
        every in-scope lock obligation single-homed in exactly one authoritative
        home (an Acceptance Criterion, an Integration Specification section, a
        Key Governance & Privacy bullet, or Out Of Scope), never restated in the
        Overview, with nothing beyond the lock?
      - Does every endpoint, parameter, field, mapping, and environment
        trace to the design's Integration Specification or another cited
        source — nothing contract-shaped invented, no undecided magnitude
        asserted, hosts and paths written EXACTLY as the sources write
        them (elisions preserved, no host or CDN URL completed from
        memory), and table columns limited to what the sources state?
      - Does each integration-point sub-section match its committed SHAPE
        LEDGER line — an SDK or cartridge point kept to interface /
        configuration bullets with NO invented request/response table, and
        endpoints + field-level data-mapping present ONLY for an API point?
      - Is the Integration Flow Overview rendered as a
        ` ```drawio:sequence:integration-flow-overview ` block (a `sequence`,
        not a `flow`, diagram) with its
        `![Integration Flow Overview](./assets/integration-flow-overview.png)`
        image inserted right after it, boundary-neutral (no vendor endpoint /
        path / query-param / key in any arrow)?
      - Did I run the diagram-opportunity analysis over EVERY Integration
        Specification sub-section (enumerate-then-justify against the hard
        bar)? For any section the user explicitly asked to diagram, is a
        ` ```drawio:flow:<slug> ` block + its `![…](./assets/<slug>.png)`
        image present in that section (boundary-neutral, type per the skill)?
        Did I avoid inserting any diagram into a section that did not clear
        the bar, and — only when the user did NOT ask — carry the verdicts
        into the chat Diagram Recommendations block instead of the document?
      - Is every approved decision encoded with its bound intact (call
        placement, key restrictions, quota/billing ownership, release
        prerequisite, privacy transience), with no rejected or undecided
        alternative asserted?
      - Hygiene sweep — scan EVERY line and EVERY table cell for internal
        repo/artifact paths or names, agent commentary, project-context
        wrappers, and our-code implementation tokens; vendor and protocol
        vocabulary stays.
      - Is every cited source document resolved to the canonical client-facing
        link we hold (link registry / project-context origin / wiki/Drive),
        with a bare title left ONLY where no link is on record and flagged as
        such, and no URL fabricated?
      - Is the working copy fresh (ISD Status `draft`, Target Approval Date the
        `dd/mm/yyyy` placeholder; delivering-org roster
        seeded FA/FE/BE/QA and client group present, every approval row
        `not started`; no Confluence URL/Page ID; Open Questions empty; no
        authored Change History section), and are optional sections (How To
        Test) omitted where nothing grounded fills them?
      - ORG FIREWALL: did I seat each roster row by the person's committed org —
        only delivering-org (Astound) people in the Astound FA/FE/BE/QA rows (a
        client "FE lead"/"platform dev"/"architect" stays `TBC`), and the client
        group holding ONLY the client approver(s) (e.g. the PO), not padded with
        non-approver client stakeholders — and is Author/Owner the delivering-org
        SA lead with role (not the roster, not a CSV provenance name, `TBC` when
        none, never blank/invented)?
      - Does the H1 page title end with " ISD", and is the header card H2
        "## General ISD Information"?
    requires: [discovery, design, proposal, grooming, specs]

  - id: technical-design
    generates: technical-design.md
    description: Technical design — implementation architecture and phased delivery plan (developer-level HOW, source of implementation detail for tasks.md)
    template: technical-design.md
    instruction: |
      PURPOSE:
      The technical design is the FIRST Dev Planning artifact, generated by
      /opsx:plan right after the BA/SA phase completes (specs done, Grooming
      Approval Gate passed). It owns the developer-level HOW and is the
      source of implementation detail tasks.md is built from: the pipeline's
      implementation architecture and phased delivery plan. It names the
      internal identifiers only this build codes against (module and route
      names, components, cartridge/script/service names, cache partitions)
      following the platform skills' conventions, and cuts the change into
      vertical delivery phases that each close as something a shopper or a
      consuming feature can observe.
      What upstream left "to planning" splits into two DISTINCT moves, and
      collapsing them into one is this artifact's main failure mode:
        - it DECIDES the deferred developer-level HOW that needs no human
          sign-off — which module owns a seam, how a flow is wired, how the
          lazy vendor bundle loads — writing that choice straight into the
          architecture sections, not raising it as a question;
        - it RAISES — never resolves — every deferred choice a consumer or a
          test builds against and every magnitude no source states (endpoint
          path, response/error shape, TTL, quota, limit) as an OPEN Open
          Question carrying its recommendation. This artifact runs BEFORE the
          human planning review, in a FRESH PLANNING STATE: every question is
          OPEN, carrying the agent's recommendation, with an empty "Approved
          by" — no approved answer is recorded yet. Surfacing these — even the
          CRITICAL ones, which block tasks.md and not this document — IS the
          job; the way this artifact fails is by asserting a routed or deferred
          value as if it were already settled instead of raising it.
      It is an internal engineering document — never published to the client.

      AUTHORITY ORDER:
      Authority is PER-DIMENSION: sources 1-5 are each the source of truth for
      their OWN dimension, not a single ladder where a higher item wins
      everything — FSD/ISD own the signed WHAT, specs the executable behaviour
      and trace, grooming the decisions, design the HOW, proposal/discovery the
      scope and provenance. Items 6-8 are the contract/template/config layering.
      1. Client-signed FSD/ISD working copies, when present for this
         change, are the highest-authority interpretation of signed
         requirements and acceptance intent. Use them to understand WHAT
         the client approved.
      2. This change's delta specs are the structured OpenSpec projection
         of that signed scope: use them for the closed requirement
         inventory, RQ/WBS trace, ADDED/MODIFIED/REMOVED disposition, and
         scenario coverage that tasks/apply must trace to.
      3. The APPROVED grooming ledger is the decision authority for every
         question, prerequisite, and change request it resolves. Approved
         decisions constrain this artifact; deferred-approved prerequisites
         become risks or blocked verification.
      4. design.md is architecture working material: locked decisions,
         solution shape, rationale, risks, PoC notes, integration shape,
         and low-level technical constraints. It can constrain HOW, but it
         is not an independent requirements source.
      5. proposal.md and discovery.md provide scope history, the approved
         delivery offer, boundaries, dependencies, and source trace
         background. stories.md (when present) is delivery/Jira grouping:
         preserve every story key/title, but never treat stories as a
         separate behaviour source.
      6. This `technical-design` instruction is the artifact contract.
      7. The `technical-design.md` template defines the section order,
         tables, and heading levels.
      8. Project `config.rules.technical-design` and the platform skills
         referenced per section are the implementation-pattern
         authorities. None of them overrides this contract.
      Priority is NOT a reading restriction: read every artifact in full and
      draw on any of them — a lower-authority source is the right place for
      HOW, scope, and provenance, and consuming it is expected. The order
      governs only PRECEDENCE ON A CONFLICT and what counts as SIGNED: a lower
      source may never override signed FSD/ISD, specs, or an approved grooming
      decision on WHAT. When sources genuinely disagree on signed meaning,
      apply the Conflict law (STOP and surface the sync defect) — never quietly
      pick one.

      DECISION KERNEL:
      - Two buckets — classify every name/value BEFORE you write it into a
        cell:
        - Bucket A (own it, invent freely): internal identifiers only this
          implementation reads — module/file paths, component names, route
          segments, cartridge/script/service names, cache partition names.
          Inventing these following the platform skills' conventions
          (flat-routes naming per `sfnext-routing`, cartridge/service
          patterns per `b2c-webservices`) is this artifact's JOB.
        - Bucket B (source it or defer it — NEVER invent): anything a
          consumer or a test builds against, and every magnitude — the
          endpoint namespace/path, response field names, status/error
          shape, TTL, quota, limit, timeout, cache dimension. A Bucket-B
          value goes in only two ways: (1) a source states it — cite that
          source inline in the same cell; or (2) no source states it —
          write "per Q#" in the cell and add the matching OPEN Planning
          Open Question. Guessing a Bucket-B value (a plausible path like
          `/api/<vendor>/…`, a round TTL like "5 min") is a fabrication,
          not synthesis, even when it "looks right".
        - The test between them is WHO codes against the name: if only
          this implementation reads it, Bucket A; if a consumer or a test
          builds against it, or it is a number, Bucket B — however obvious
          the value looks and whichever skill documents the pattern.
          Designing the custom API is this artifact's job; naming the path
          consumers call is not.
      - Decision-layer law: every planned area traces back to spec
        requirements; a Bucket-A identifier without a spec trace, or a
        Bucket-B value without a source or a Q#, is a defect.
      - Requirements authority law: signed FSD/ISD define the client-facing
        interpretation of WHAT when present; specs provide the structured
        execution projection and trace. Nothing here may redefine, weaken,
        or extend signed behaviour, and approved grooming bounds stay
        intact. An implementation choice may strengthen a privacy/security
        bound, never relax one. Design notes, stories, Jira issues, and
        proposal slice wording are not independent behaviour sources.
      - Conflict law: if FSD/ISD, specs, proposal/stories, grooming, or
        design disagree on signed behaviour or acceptance meaning, STOP and
        surface an upstream sync defect (or an Open Question only
        when the conflict is a technical HOW choice). Never synthesize a
        compromise requirement from conflicting artifacts.
      - Reference, don't re-decide: design.md architecture decisions are
        locked — reference them. What upstream defers to planning (a design or
        grooming Planning Deferral PD#, an unpublished interface, an open
        magnitude) splits by what its RESOLUTION names, not by whether upstream
        labelled it a "developer-HOW": test each deferral against the SOURCED /
        APPROVED / UNDECIDED test above and route it by bucket.
        - Bucket A — its resolution names ONLY internal wiring no consumer or
          test builds against and it carries no magnitude (how the lazy vendor
          bundle loads or is version-pinned, which module owns a seam, how a
          flow is wired): DECIDE it here and write it straight into the
          architecture, no question needed.
        - Bucket B — its resolution names a value a consumer or a test builds
          against, ANY magnitude, or a choice that needs a human call: a
          CACHING STRATEGY (whether to cache, the TTL, cache dimension, or
          lifetime), a quota/limit/timeout, an endpoint namespace/path, or a
          request / response / error contract. This is Bucket B EVEN WHEN
          upstream routed it as a "developer-HOW" PD#, so it is settled only
          THROUGH the planning question -> human approval cycle: on fresh
          generation it is an OPEN Open Question (carrying your recommendation
          in its Recommendation / Decision cell), and that same cell records the
          approved decision only when a named human approves. A PD# that names a
          cache strategy/TTL/lifetime, a quota, or a consumer-facing contract is
          Bucket B: this document is the planning step, so "routed to planning"
          means raise it as an OPEN Open Question row here (with your
          recommendation), not decide it inline and not leave it as a deferral
          note.
        Never assert a Bucket-B deferred value silently in a section — the agent
        must not approve its own recommendation, and must never INFER approval
        from a source document, meeting note, design prose, or its own
        recommendation: approval exists only when a named human approves in the
        session. If no human is available, STOP and state exactly what is
        unapproved — leave the question OPEN rather than recording a decision.
      - Planning-stage grooming: TECHNICAL unknowns discovered while
        planning the HOW go into "Open Questions", tagged
        CRITICAL (a tasks breakdown built on the wrong answer would need
        rework) or NICE-TO-HAVE, each with an owner. On fresh generation
        every question is OPEN, carrying the agent's recommendation in its
        Recommendation / Decision cell, with an EMPTY "Approved by" cell —
        the approved answer is recorded in that same cell during the chat
        approval session afterwards. The agent may recommend; it must
        never approve its own recommendation.
      - Scope firewall: a question or risk that changes agreed BA scope is
        never answered here — push it back to proposal/grooming as a CR.
      - Undecided Bucket-B values (TTL, quota, limit, endpoint path,
        response fields) are raised as Open Questions, never asserted
        as values.

      PIPELINE (follow each referenced section; do not improvise content):
      1. Clear the ENTRY GATE.
      2. Commit the PRE-DRAFT LEDGERS before writing any section.
      3. Fill the Technical Design Source Inventory (SOURCE INVENTORY RULES)
         and the Delivery Inventory (DELIVERY INVENTORY RULES).
      4. Raise planning-stage grooming as Open Questions (PLANNING GROOMING
         RULES) — author them here, while planning the HOW, though they are
         PLACED near the bottom of the document (document order below).
      5. Cut the change into Delivery Phases (PHASE RULES) — decompose the
         delivery BEFORE the implementation sections so the architecture,
         runtime flows, constraints, and verification below elaborate these
         phases rather than the phases being reverse-engineered from them.
      6. Build the Implementation Architecture: frontend / backend / CMS
         surfaces plus Implementation Building Blocks (ARCHITECTURE RULES).
      7. Draw Runtime Flows (RUNTIME FLOW RULES).
      8. Fill Implementation Constraints (CONSTRAINT RULES).
      9. Build the Verification Strategy (VERIFICATION RULES).
      10. Record the Risks (VERIFICATION RULES).
      11. Write the Technical Design Overview LAST, as a reader-map derived
          from the finished body (OVERVIEW RULES).
      12. Run the SELF-CHECK before emitting.

      ENTRY GATE (blocking — evaluate BEFORE authoring anything):
      - discovery.md, design.md, proposal.md, grooming.md, and this
        change's delta specs must exist as completed artifacts, and
        grooming's Grooming Approval Gate must have PASSED. stories.md,
        fsd/**/*.md, and isd/**/*.md are conditional — read them when
        present, never require them.
      - If a required behaviour in specs lacks RQ/WBS trace metadata, STOP
        and fix the spec trace before planning.
      - If FSD/ISD, specs, proposal/stories, grooming, or design conflict
        on signed behaviour or acceptance meaning, STOP and surface the
        upstream sync defect — do not silently plan either version.

      INPUTS AND SOURCE POLICY (the reading map — review each upstream
      file in full; these are the sections that typically carry what you
      consume, not a closed list):
      - FSD/ISD working copy: when present, read it first as the signed
        client-facing requirements interpretation for this change. Use its
        requirement/acceptance wording, integration presentation,
        terminology, and publication context to interpret WHAT is approved.
        Do not mine new implementation detail from it, and do not use it
        to bypass specs trace.
      - Delta specs: the `### Requirement:` headings with their
        `**Trace:**`/`**WBS:**` metadata are the structured requirement
        inventory (DELIVERY INVENTORY RULES); scenarios are the executable
        coverage your data flow and test design restate. Specs must project
        the signed FSD/ISD scope; if they diverge, stop for an upstream sync
        defect.
      - grooming.md: APPROVED / DEFERRED-APPROVED decisions and
        prerequisites (P#) are constraints — never re-raised; deferrals
        the approved answers left open are planning-question sources.
      - proposal.md: Requirements Lock, Delivery Breakdown, boundaries,
        dependencies, and access rows explain the approved delivery offer
        and slice intent. Use them for scope and sequencing context, not as
        a separate behaviour source when FSD/ISD and specs exist.
      - stories.md: story keys/titles feed the Delivery Inventory
        (DELIVERY INVENTORY RULES); Implementation notes under stories are
        the other primary home of deferred-to-technical-design notes.
        Stories are delivery/Jira grouping, not behaviour authority.
      - design.md: Decisions are locked constraints to reference; the
        Cross-cutting Concerns table rows constrain your cross-cutting
        table AND are a primary home of deferred-to-technical-design
        notes (read every row's note column); Risks and operational
        prerequisites feed the Risks section and blocked tests; an
        Integration Specification (integration scope) is architecture
        working material for the vendor/backend shape. Use design for HOW,
        not for requirements that FSD/ISD/specs do not carry.
      - discovery.md: source inventory, affected capabilities, dependency
        background, and scope history. Use it to understand where facts
        came from, not to override the signed/projected requirement set.

      PRE-DRAFT LEDGERS (all four are ONE planning pass, completed BEFORE
      the first section is written; each is the binding member set its
      section then emits, never re-derived while drafting. Enumerating
      from memory mid-draft is how rows get dropped and values get
      invented — that is the failure these ledgers exist to prevent):
      - REQUIREMENT LEDGER — walk ALL delta spec files and list every
        `### Requirement:` heading with its verbatim ids and its ADDED /
        MODIFIED / REMOVED origin, REMOVED headings included — one line per
        `### Requirement:` heading, so headings that share an RQ/WBS id (a
        functional requirement and its Management or cross-cutting
        privacy/accessibility sibling under the same code) each get their own
        line and their own inventory trace (DELIVERY INVENTORY RULES). Delivery Inventory Spec trace cells must
        cover every line in this ledger or explicitly mark approved deferred scope.
      - STORY LEDGER — list every story key/placeholder with its title
        (DELIVERY INVENTORY RULES). Delivery Inventory Story cells must
        cover every line in this ledger. An empty ledger is a claim that
        this change ships no stories at all: make it only from the inputs in
        front of you, and use "—" Story cells while planning from in-scope
        RQ/WBS units.
      - BUCKET-B LEDGER — WALK the closed deferral set (PLANNING GROOMING
        RULES Deferral sweep, members a–d) plus every magnitude the sections
        would state, member by member; do not recall a few. For EACH member
        emit one line `<origin id> → SOURCED | APPROVED | UNDECIDED — <the
        source line that proves it, or "none found">`: a member resolves
        UNDECIDED unless a source prints its OWN value (SOURCED) or a decision
        fixes that value (APPROVED), so routing, approval-of-approach, or a
        DEFERRED-APPROVED delivery proves UNDECIDED and its cell reads "per
        Q#". Member (c) — EVERY capability this change EXPOSES or CONSUMES —
        is enumerated by name, one line each: the value you owe is the
        OUR-SIDE interface consumers and tests build against (endpoint
        namespace/path, response and error schema), so an ISD/design "stable
        interface" reference, a vendor or upstream mapping, or a
        DEFERRED-APPROVED delivery is a NEIGHBOUR that names the whether/who
        and never prints that text — it proves UNDECIDED and is a CRITICAL
        Open Question, never SOURCED by the interface merely existing. An
        UNDECIDED line commits a recommendation that names the DIRECTION a
        source stated (the candidate approach), never a magnitude no source
        prints. The plan shows every member line by id, and the
        Open Questions table is the verbatim copy of the UNDECIDED ones — each
        its own OPEN question row carrying that origin id; a "None" table is
        earned only when every member line resolved SOURCED or APPROVED. Read
        it back against the sections you are about to write: an endpoint, a
        response field, an error shape, a TTL, or a cache dimension that
        appears in Backend, Implementation Constraints, or Runtime Flows
        without a ledger line was misfiled as Bucket A — reclassify it before
        drafting.
      - DELIVERY UNIT LEDGER — reconcile the Requirement Ledger and Story
        Ledger into Delivery Inventory rows, then run the classification TEST
        (PHASE RULES) on EACH row and record one line per row:
        `<unit> → <PRIMARY | CROSS-CUTTING | SHARED SEAM | PREREQUISITE |
        DEFERRED> — <the source line that proves the class>`. Prove each class
        from a source, never a default: a story key is tracker identity and by
        itself never proves PRIMARY, so a unit resolves CROSS-CUTTING ONLY when
        a `### Requirement:` heading in THIS change's OWN delta specs carries it
        as a privacy / accessibility / security / localization obligation — a
        discovery cross-cutting-requirements row or a design
        cross-cutting-concerns row may CORROBORATE that heading but NEVER admits
        a unit the delta specs do not head. The delta specs are the closed
        in-scope inventory: a requirement id with NO `### Requirement:` heading
        in this change's delta specs — an upstream signed-source id, or another
        delivery flow's functional requirement (an a11y / i18n requirement owned
        by a different flow's spec, marked out-of-scope in discovery) — is OUT
        OF SCOPE and gets no ledger line and no cross-cutting row, however
        "typically cross-cutting" its topic. It is carried inside every phase.
        This reconciliation is REQUIREMENT-complete, not
        story-driven: EVERY Requirement Ledger line must be ACCOUNTED FOR in
        Delivery Inventory — accounted for is NOT the same as one row each. A
        functional, Management, or layout heading JOINS the story row for its
        WBS (DELIVERY INVENTORY RULES), while a cross-cutting privacy /
        accessibility / security / localization sibling gets its OWN row —
        never BOTH a joined row and a duplicate story-less row for the same
        heading. That own row carries the story key when a story owns the
        obligation and a "—" Story cell when none does, so a cross-cutting
        requirement is NOT dropped for lacking a story key; either way it is
        classified CROSS-CUTTING and carried in every phase. This binds BOTH
        ways: the cross-cutting rows are EXACTLY the Requirement Ledger's
        cross-cutting lines, each carrying that line's own RQ/WBS id — a row
        for a concern the Requirement Ledger never named (an invented
        "accessibility", "SEO", or "caching" row with no ledger id) is a
        PHANTOM and is as wrong as a dropped one. A blanket "one row per story
        = PRIMARY, no cross-cutting units needed" that skips both that per-row
        proof and the story-less requirement is the drop this ledger prevents.
        Delivery Phases = the PRIMARY rows plus the carried cross-cutting
        classifications.

      SOURCE INVENTORY RULES (the "Technical Design Source Inventory" table —
      the upstream this plan consumed, each mapped to how planning used it; it
      is the reading map the rest of the document is built from):
      - List every artifact ACTUALLY present for this change. discovery,
        design, proposal, grooming, and the delta specs are ALWAYS rows — the
        ENTRY GATE requires them (`requires: [discovery, design, proposal,
        grooming, specs]`); stories, FSD, and ISD are conditional — add a row
        only for the ones that exist, and never invent a row for a skipped
        optional artifact.
      - Map each row's "Planning use" to its AUTHORITY ORDER role (see INPUTS
        AND SOURCE POLICY), not a generic "input": signed FSD/ISD = the approved
        WHAT; specs = behaviour contract and RQ/WBS trace; grooming = APPROVED
        decisions and prerequisites this plan honours and never re-decides;
        design = HOW/architecture working material (locked decisions, not a
        requirements source); proposal = the approved delivery offer, scope
        boundaries, and dependencies; discovery = source/provenance history;
        stories = Jira delivery grouping, not a behaviour source. The table must
        surface what the artifact actually CONSUMES — every required upstream —
        not a subset of the loudest few.

      DELIVERY INVENTORY RULES:
      - Delivery Inventory is the single rendered source map for planning
        and tasks.md. It replaces separate requirement/story trace tables:
        one row is a delivery unit, not necessarily one spec heading.
      - Story-first reconciliation. If Story Ledger is non-empty, FIRST
        write one Delivery Inventory row per story key/title: Unit carries
        the story key/title, and Story carries that same key, then classify
        each by the per-row TEST below — a story-backed row is not PRIMARY by
        default, its subject decides. Do NOT replace a story-backed change
        with RQ-only rows whose Story cells are "—".
        Add extra non-story rows only for spec work with no story identity:
        REMOVED requirements, approved DEFERRED scope, PREREQUISITE rows, or
        a true CROSS-CUTTING requirement not represented by a story. If Story
        Ledger is empty, units come from in-scope RQ/WBS.
      - Closed coverage still applies. Every `### Requirement:` heading
        across ALL delta spec files — ADDED, MODIFIED, REMOVED, and
        cross-cutting requirements such as privacy/accessibility — must
        appear in a Delivery Inventory Spec trace cell, or in a DEFERRED row
        when the approved lock excludes it. Carry the `**Trace:**` /
        `**WBS:**` ids written under THAT heading; REMOVED headings without
        RQ metadata are named as REMOVED in Spec trace.
      - Joining spec headings to rows — a WBS/RQ code shared by two headings
        forks by what the SECOND heading IS, never by the shared code alone.
        A delivery-context variant of the same functional capability (desktop
        / mobile layout, pagination, Management, Business Manager
        configuration, service option administration) JOINS the story row for
        that WBS instead of becoming a standalone phase. A cross-cutting
        sibling under that same code — a privacy, accessibility, security, or
        localization heading — does NOT join: it gets its OWN CROSS-CUTTING
        row carrying that shared WBS, because it constrains every phase rather
        than extending the one capability. This own-row sibling is exactly the
        heading that goes missing when a second heading is deduplicated
        against a code already placed on a story row — a repeated code is a
        signal to add a row, not to skip one. A REMOVED requirement may join
        the primary switch-over row that replaces it (for example a redirect +
        content retirement) or be its own row when it has independent work; a
        REMOVED heading with no RQ metadata is still named as REMOVED in a
        Spec trace cell, never dropped for lacking a code.
      - When stories.md exists, every story key/placeholder and title is
        represented exactly once in the Story cell of a Delivery Inventory
        row. Stories are tracker/delivery identity only, never an
        independent behaviour source. When stories.md does not exist,
        Story cells are "—" and the units come from in-scope RQ/WBS.
      - Classification is a per-row TEST — run it on every row, including
        story-backed ones; the story key is tracker identity and never by
        itself makes a row PRIMARY. Decide by what the row's subject IS: a
        shopper-observable or callable capability this change delivers is
        PRIMARY; an obligation that constrains every phase — accessibility,
        localization, privacy, security — is CROSS-CUTTING even when it owns
        a story key/title; scaffolding another row consumes is SHARED SEAM; a
        capability/service/key another change delivers is PREREQUISITE;
        approved locked-out scope is DEFERRED. So a story titled
        "Accessibility" or "Localization" is CROSS-CUTTING — the key proves
        tracker identity, not a phase — unless the source explicitly defines
        a standalone consumable deliverable; it is carried inside every phase
        for the surface it adds, not scheduled as a phase of its own.
      - REMOVED requirements are work, not deletions to skip: retiring
        authored content is planned CMS work, and retiring a page with a
        redirect is planned Frontend work. Represent them on the relevant
        primary switch-over row or as their own row; they must also have a
        matching surface/block or verification target below.
      - Area consistency: every area named in Delivery Inventory must have
        matching planned content in its section below. Never point a row at
        a sub-section whose table is a "None" row. AREA IS DECIDED BY WHERE
        THE CODE LIVES, not by the feature's theme.
      - If a story cannot be mapped to spec trace, or a required behaviour
        in specs lacks trace metadata, STOP and surface the upstream sync
        defect before tasks.md. The Technical Design Source Inventory lists
        only artifacts that exist — never invent FSD/ISD/stories rows for
        skipped conditional artifacts (SOURCE INVENTORY RULES).

      PLANNING GROOMING RULES:
      - Bucket-B ledger (the PRE-DRAFT LEDGERS commitment — build it in the
        same planning pass as the other three ledgers, before the first
        section). A Bucket-B value is anything a consumer or a test must
        build against: the shape of a contract (endpoint namespace/path,
        request/response fields, error/status shape) or a runtime magnitude
        (TTL, cache dimension, quota, limit, timeout).
        For every Bucket-B value your sections would state, PROVE where its
        text comes from before you write it — establish this per value, do not
        classify from memory:
          - SOURCED — you can quote the CONTEXT line that prints THIS value's
            OWN text: our-side, for this change (the literal endpoint/namespace
            string, the named field, the concrete number). A line that only
            names an UPSTREAM / vendor contract (when the value you owe is the
            our-side one consumers hit), a DIRECTION or candidate ("edge / HTTP
            cache", "server proxy", "bounded lifetime"), or a "stable interface"
            to code against is a NEIGHBOUR, not this value's text — it proves
            UNDECIDED, never SOURCED. Write the value; cite that line.
          - APPROVED — you can quote a grooming Q#/design decision that FIXES
            this value's OWN text (e.g. "TTL 5m", a published our-side path).
            Approving an APPROACH or direction, or a capability's delivery, is
            not fixing the text. Carry a fixed value as a cited constraint.
          -           UNDECIDED — no line prints it and no decision fixes it. A value you
            write here would be invented, and it blocks the developer/test that
            builds against it; so the cell reads "per Q#" and you raise one OPEN
            Open Question whose "Why unclear" quotes what the sources
            DID say (the routing, approval, or deferral that stopped short of
            the value).
        The trap this proof exists to catch: a row that APPROVES an approach,
        acknowledges a PD# as ROUTED-TO-PLANNING, or DEFERRAL-APPROVES a
        capability's delivery settles the whether / where / who and never
        prints the value's text — it passes neither SOURCED nor APPROVED, so it
        is the PROOF the value is UNDECIDED, not a licence to assert one.
        Walk the whole closed set so none is skipped: every choice grooming
        Planning Routes / PD# or a deferral sentence hands to this artifact;
        every our-side interface of a capability this change EXPOSES or CONSUMES
        (including a DEFERRED-APPROVED one); every magnitude a caching / backend
        / data-flow row needs. The Open Questions table = exactly the
        values that came out UNDECIDED (a contract consumers/tests build against
        is CRITICAL). An empty "None" table is EARNED only by the completed
        Deferral-sweep enumeration below — every closed-set member quoted and
        none leaving an undecided value; a blanket "resolved in grooming" or
        "all values sourced" that skips that per-source quotation is the copied
        answer this proof exists to catch, so the table is not yet earned —
        re-walk the closed set.
      - Deferral sweep (feeds the ledger — catches choices with no value
        yet). Walk a CLOSED SET of deferral sources and, for EACH member,
        quote the sentence that hands a choice to this artifact or record
        "none found"; the sweep is not complete until every member is
        accounted for:
          (a) grooming's Planning Routes (the PD# rows routed to planning);
          (b) EVERY design Base Configuration & Cross-Cutting row and
              Architecture Decision;
          (c) EVERY capability this change EXPOSES or CONSUMES whose delivery
              is DEFERRED-APPROVED or still to be delivered — its our-side
              interface is unpublished, so that contract is handed here;
          (d) any design.md / proposal / delta-spec / FSD/ISD sentence saying
              "technical design" / "technical-design", "deferred", "settled",
              "exact … TBD", or "approach depends on".
        A structured register that reads None (Planning Deferrals: None,
        Planning Routes: None) is ONE member returning empty, never the gate
        that ends the sweep: a deferral stated in a Base Configuration row, or
        an unpublished DEFERRED-APPROVED interface, is a live deferral even
        when the PD# register is None. Each sentence that leaves a real choice
        is an UNDECIDED ledger line whose "Why unclear" cell QUOTES it verbatim
        as proof. The sweep and the Bucket-B walk corroborate each other: each
        UNDECIDED slot the walk found is handed over by one of these sentences,
        so quoting that sentence is what makes its cell read "per Q#".
      - Questions are concrete, answerable, TECHNICAL unknowns about the
        HOW; severity reflects rework risk for tasks.md — a contract
        shape that consumers and tests build against is CRITICAL; each
        question has an owner (dev lead / SA). Cite the relevant skill
        in "Why unclear" when the answer depends on a platform pattern.
        Each question also carries the agent's RECOMMENDATION in its
        "Recommendation / Decision" cell — the recommended answer, phrased as a
        recommendation, never an approval — which is work this contract already
        requires ("carrying your recommendation"); that same cell later records
        the approved decision, so Open Questions is the single home for both the
        question and its resolution (there is no separate decisions table).
        A question grooming already DECIDED is a constraint now — carry its
        answer and raise instead the choices that decision left open.
        This table is a FRESH TD-LOCAL namespace: number your questions
        sequentially from Q1 in THIS document by what THIS planning pass found,
        and never reuse an upstream id as a row's identity. An upstream
        `Q#` / `PD#` / `P#` belongs in "Why unclear" as the quoted PROOF that a
        value is undecided, never in the `Q#` column. So an upstream Q1 that
        grooming APPROVED neither occupies nor closes this table's Q1: that
        approval fixed an APPROACH, and the contract or magnitude the approach
        still leaves unprinted is a DIFFERENT, TD-local question that earns its
        own fresh row. Reading "upstream Q1 and Q2 are APPROVED" as "this table
        has no questions" is the identity collision this namespace rule exists
        to prevent.
        A design or grooming Planning Deferral routed to planning (a design
        Planning Deferrals PD# / a grooming Planning Routes PD#) hands the
        decision to THIS document — this artifact IS that planning step — so you
        resolve it here by bucket, never by re-noting it as "deferred to
        planning" or "decided in a later step". A Bucket-A wiring PD# is decided
        inline in the architecture; a Bucket-B PD# (a caching strategy / TTL /
        cache lifetime, a quota/limit, an endpoint namespace/path, or a
        request / response / error contract) is carried as an OPEN Open Question
        ROW in this table, with your recommendation. For a Bucket-B PD#,
        "routed to planning" and "raised as an Open Question row here" name the
        SAME action: this artifact holds no separate Planning Deferrals section,
        so its Open Questions table is the single home for a routed planning
        deferral as much as for a planning-stage question. Where a
        question defers a value, the affected cells carry a deferral note
        ("contract per Q1", "TTL per Q2") that points to that open question.
      - Fresh state: this artifact is generated before any human review, so
        every question starts Status OPEN, its "Recommendation / Decision" cell
        carrying the agent's recommendation, with an empty "Approved by" — an
        approver, session, and date appear only once a real human answers in
        chat. An undecided magnitude or consumer-facing contract therefore stays
        a question here; the mechanism above settles it into a value only when a
        source or a decision supplies one.
      - PLANNING GATE: the document may be generated with open questions,
        but tasks.md is blocked while any CRITICAL question is OPEN or
        lacks a named human approver. Facilitation happens in chat, one
        question at a time (never the AskUserQuestion tool): explain the
        unknown, why it matters before tasks, the options and their
        implications, the agent recommendation — then wait for the human
        answer, record it in that same question's "Recommendation / Decision"
        cell with the named approver in "Approved by", flip the question to
        APPROVED / DEFERRED-APPROVED, and move to the next.

      PHASE RULES (the "Delivery Phases" section — the delivery SEQUENCING
      layer tasks.md groups its work under):
      - Planning pass — build the DELIVERY UNIT LEDGER, then write:
        1. Enumerate the Delivery Inventory rows and read each row's
           classification.
        2. Account for each row exactly once — PRIMARY (it becomes or joins
           a phase row), CROSS-CUTTING (an obligation every phase carries),
           SHARED SEAM (scaffolding folded into the first phase that consumes
           it), PREREQUISITE (blocked on a grooming P# or an undelivered
           capability), or DEFERRED (excluded by the approved lock).
        3. Prove the vertical shape before the table in the five labelled
           lines. `Primary phase units` gives each PRIMARY row its OWN phase
           by default: write `unit -> P# -> the one shopper-observable or
           callable outcome that closes it`, a DISTINCT P# and a DISTINCT
           close outcome per row. Two rows may share one P# only when they
           close through the SAME single outcome (name it once) — so if you
           wrote different close outcomes for them, they are different phases,
           not one. A `Decomposition criterion` or close condition pitched at
           the whole surface ("the locator works", "a coherent launch", "the
           set of primary units is functional") describes the finished
           feature, not what closes ONE increment — that is the horizontal
           launch bucket this proof exists to catch. `Cross-cutting
           obligations` records every CROSS-CUTTING row as carried by each
           phase, not as a phase. `Shared seams` records the first phase that
           consumes each seam.
        4. Write the phase table only after the labelled lines contain that
           proof. The lines are case-specific reasoning, never generic method
           prose.
      - Coverage law: every enumerated unit appears in exactly one phase
        row or under an explicit non-primary classification. A unit with no
        home is a defect; a phase delivering a story/RQ no source states is
        a fabrication.
      - Join law: merging PRIMARY rows into one phase is allowed only when
        the rows close as one observable switch-over or one callable
        capability. "All stories are needed for a coherent launch" is NOT a
        valid join proof; it collapses delivery sequencing into a horizontal
        launch bucket. A joined phase must name the single observable outcome
        that proves the joined rows together.
      - Story-key law: a story key is delivery identity, not phase proof.
        One story -> one phase is valid only when that story itself closes as
        one observable/callable increment. A cross-cutting story or
        requirement never becomes a cleanup phase because it has a story key;
        it is carried by every phase it constrains.
      - Vertical law: a phase closes as something a shopper or a consuming
        feature can observe or call. Layer/task buckets ("data layer", "add
        the service definition", "wire the components", "write the tests"),
        a standalone foundation/scaffolding phase, and a trailing
        accessibility / localization / privacy / hardening phase are
        defects: fold scaffolding into the first phase that consumes it,
        and carry cross-cutting obligations inside every phase for the
        surface it adds.
      - Proof law: every phase row carries its acceptance coverage (the
        behaviour branches it proves — including the permission, error,
        privacy, and negative branches its requirements carry, never a
        restatement of the phase name), the implementation areas it touches
        (the routes/components/modules/cartridges/endpoints/caches/metadata
        this phase introduces — elaborated in the Implementation
        Architecture below — specific enough for tasks.md to reference), its
        dependencies ("—" when none), and the DEVELOPER-owned verification
        (unit/integration tests, dev checks) that will prove it done (detailed
        in the Verification Strategy below; functional / QA proof is out of
        scope). A phase table whose labelled-line proof does not already name
        that phase's close condition is not ready to emit.
      - Sizing is judgement, not a target: phase count, names, and ordering
        follow the change's own dependency and story order. Two phases on a
        small capability are correct — never invent artificial splits to
        look thorough, never merge unrelated units to look lean.
      - A phase whose real verification is blocked on a prerequisite stays
        a phase: note the P# and plan it mock-first, rather than postponing
        the increment or scheduling the prerequisite as a phase of its own.

      ARCHITECTURE RULES:
      - The Implementation Architecture section is the implementation
        structure, not a file-level task list. It ELABORATES the surfaces
        and identifiers the Delivery Phases above introduced (never a new,
        conflicting decomposition). Fill the frontend, backend, and CMS
        surface tables first, then the Implementation Building Blocks table.
      - Frontend / Storefront Surface covers routes, loaders/actions,
        RSC/server responsibilities, client islands/state/forms, app
        config, extension target points, and Storefront-rendered Page
        Designer (`sfnext-routing`, `sfnext-data-fetching`,
        `sfnext-components`, `sfnext-state-management`,
        `sfnext-configuration`, `sfnext-extensions`,
        `sfnext-mrt-data-store`, `sfnext-page-designer`).
      - Backend / SFCC Surface covers cartridges/script APIs, custom
        SCAPI, hooks, jobs, services, credentials, metadata, custom
        objects, server-side caches, and logging (`b2c-webservices`,
        `b2c-scapi-custom`, `b2c-custom-api-development`,
        `b2c-scapi-schemas`, `b2c-hooks`, `b2c-custom-objects`,
        `b2c-metadata`, `b2c-querying-data`, `b2c-custom-job-steps`,
        `b2c-job`, `b2c-custom-caches`, `b2c-logging`).
      - CMS / Content Surface covers Business Manager authoring,
        retirement, and setup (`b2c-page-designer`). Retiring or
        migrating existing authored content IS CMS work: when a REMOVED
        spec retires content, the CMS surface plans that retirement and
        its verification.
      - Implementation Building Blocks are the canonical architecture
        inventory tasks.md projects from. One row covers an important
        block, seam, interface, or owned configuration area with
        responsibility, interfaces/contracts, owned identifiers, and
        trace. Prefer relevance over exhaustive file lists: name the
        structure tasks need to implement, not every file that might
        change. A block may include representative route/module/component
        /cartridge/cache/config identifiers, but it is not a full file map.
      - Every template heading and table always appears with exact
        columns. A sub-section with no work keeps exactly ONE grounded
        "None — <reason>" row. A None sub-section must never conflict
        with Delivery Inventory, Building Blocks, or phase areas.

      RUNTIME FLOW RULES:
      - Render implementation-level runtime scenarios as mermaid sequence
        diagram(s): participants are the planned building blocks and
        surfaces, alt branches cover permission/error/cache paths, and
        Notes carry cross-cutting bounds (privacy, key exposure). Prefer
        several small diagrams (one per path) over one giant one; add
        prose only for what a diagram cannot express.
      - The diagram obeys the design's boundaries: where the design
        routes third-party access through a consumed capability or a
        server-side proxy, the diagram's messages go through that seam —
        never a direct browser-to-vendor call the design forbids.

      CONSTRAINT RULES (the template's "Implementation Constraints"
      section — cross-cutting concerns live in THAT table under THAT
      exact heading; never emit a separate "Cross-cutting" section):
      - Fill only rows that apply; every row must conform to design.md
        where it constrains the concern. Caching (`b2c-custom-caches`,
        `b2c-ecdn`), auth/security (`sfnext-authentication`,
        `b2c-slas-auth-patterns`), performance (`sfnext-performance`),
        i18n (`sfnext-i18n`), CMS (`sfnext-page-designer`,
        `b2c-page-designer`), app config (`sfnext-configuration`).

      VERIFICATION RULES:
      - Verification Strategy is the DEVELOPER-owned evidence plan for the
        architecture and phases, not a task queue and not a QA test plan. It
        covers ONLY developer-owned automated verification — unit and
        integration tests plus developer checks (bundle/perf guard, `tsc`,
        lint) — and blocked developer verification where applicable
        (`sfnext-test-ids`, `systematic-debugging`).
      - Functional / end-to-end / manual-QA / accessibility-audit / UAT
        verification is owned by QA and is OUT OF SCOPE for this artifact:
        never author E2E, Playwright, manual-QA, a11y-audit, or UAT rows —
        here or in any phase / constraint Verification cell. Cross-cutting
        obligations (accessibility, localization, privacy, security) are
        still BUILT and traced — they appear in Delivery Inventory,
        Implementation Building Blocks, and each phase's acceptance coverage —
        but their functional proof is QA's, not a Verification Strategy row.
        A requirement whose only proof is functional/QA carries no row here;
        that omission is correct scoping, not a gap.
      - Each developer-owned row names a target (building block or phase),
        the developer evidence that proves it, the RQ/WBS or scenario
        coverage, and any blocker/prerequisite. A blocked test names the
        grooming P# or external owner in the Blockers column; incidental
        fixtures/data/env context goes in Notes.
      - Risks record implementation risks or blockers that do NOT change BA
        scope, each with impact, owner, and resolution (a blocker is a risk with
        its resolution — no separate risk-vs-blocker classification); a
        scope-changing risk goes back to proposal/grooming as a CR instead.

      OVERVIEW RULES (the "Technical Design Overview" reader-map, at the top of
      the document but WRITTEN LAST — a Nested-Task, not a slot to fill):
      - Question it answers: having finished the body, what does this design
        SETTLE at implementation level, WHY is it shaped this way, what
        CONSTRAINS downstream tasks.md, and what is PASSED FORWARD as OPEN
        questions? Answer by SUBJECT and COUNT, in that order.
      - Method: walk the finished sections as they stand — Delivery Inventory,
        Delivery Phases, Implementation Architecture, Verification Strategy,
        Risks, Open Questions — and distil the load-bearing shape: what the
        build delivers and the scope it inherits; the HOW shape that carries the
        solution (the surfaces, seams, and phase count); the standing bounds and
        execution order that constrain tasks; the questions handed to the
        approval session. Re-derive it whenever the body changes.
      - Record: as the Overview reader-map. Name SUBJECTS, not identifiers or
        section members — "the lazy map island", "the server-side geocode seam",
        "two open questions, one CRITICAL" — never "Q1/Q2" and never a re-listing
        of the Delivery Inventory rows, phase names, or building blocks. Counts
        and magnitudes orient the reader; a restatement of a table, a re-listing
        of its members, or a dump of implementation detail is the reader-map's
        failure mode. Fresh-state safe: it may say questions remain open for the
        approval session, but it claims NO approval and names NO approver.

      OUTPUT CONTRACT:
      - A single `openspec/changes/<name>/technical-design.md` working
        copy following the template section order. No tasks.md content
        (no `- [ ]` checkbox queues), no publishing, no onboarding
        summaries or commentary around the document.

      SELF-CHECK BEFORE OUTPUT (fix any "no" before emitting):
      - Did I verify the upstream artifacts and the passed grooming gate,
        and read stories/FSD/ISD only where they exist?
      - Does Delivery Inventory cover every `### Requirement:` heading
        across ALL delta spec files (ADDED, MODIFIED, REMOVED, cross-cutting
        requirements included) in Spec trace, with verbatim RQ/WBS where
        present, approved deferred scope marked DEFERRED — and does every
        area named in a row have matching planned content (not a "None" row)?
        Where one RQ/WBS code carries two headings, did the cross-cutting
        sibling (privacy / accessibility / security / localization) get its
        OWN CROSS-CUTTING row rather than being folded into the functional
        row that already used that code, and is each REMOVED heading named in
        a Spec trace cell even when it has no RQ metadata?
      - Bucket-B ledger reconciliation: did I build the pre-draft Bucket-B
        ledger, and does every consumer-facing contract element and
        magnitude in the document (endpoint namespace/path, response
        fields, TTL, quota, limit, timeout, cache dimension) trace to a
        SOURCED (cite), APPROVED (cite grooming Q#/design), or UNDECIDED
        (per Q# + matching OPEN question) ledger line? Does every value in a
        cell carry that provenance, and does each grooming/design-approved
        value appear as an asserted, cited constraint rather than a re-raised
        question? Is the Open Questions table exactly the UNDECIDED
        lines — an empty "None" table only after the Deferral sweep quoted
        every closed-set member (Planning Routes PD#, each design Base
        Configuration & Cross-Cutting row and Architecture Decision, each
        DEFERRED-APPROVED or to-be-delivered capability's unpublished
        interface) and none left an undecided value, never on a bare "resolved
        in grooming" — each row carrying its proof (the quoted deferring
        sentence or named unsourced value) in "Why unclear"?
      - When stories exist: is every story key/title represented exactly
        once in Delivery Inventory with spec trace and areas?
      - Is every behavioural statement (tables, diagrams, notes) faithful
        to specs and approved grooming bounds — nothing redefined,
        weakened, or extended?
      - Are locked design decisions referenced rather than re-decided,
        deferred-to-planning choices decided or raised as questions, and
        no rejected alternative asserted?
      - Are Open Questions technical, severity-tagged, owned, OPEN with empty
        approvers, and each carrying the agent's recommendation in its
        "Recommendation / Decision" cell (fresh state: recommendation present,
        Status OPEN, "Approved by" empty, no decision recorded as approved);
        no BA-scope item absorbed; no undecided magnitude asserted as a value?
      - Do implementation identifiers follow the platform skills'
        conventions? Does every template heading and table appear with
        the template's exact columns, inapplicable sub-sections carrying
        the single grounded "None — <reason>" row?
      - Are Runtime Flows grounded mermaid sequence diagrams; do
        Implementation Building Blocks and Verification Strategy carry
        trace for the in-scope requirements they cover (Verification Strategy
        is developer-owned only — a requirement proven solely by functional /
        QA verification carries no row and that is correct, not a gap); are
        blocked checks marked with their prerequisite?
      - Phase coverage: is every Delivery Inventory row in exactly one phase
        row or explicitly classified in the labelled lines as cross-cutting,
        folded seam, prerequisite, or deferred — with no phase delivering a
        story/RQ no source states?
      - Phase shape: does every phase close as something a shopper or a
        consuming feature can observe or call — no layer/task buckets, no
        standalone foundation phase, no trailing accessibility /
        localization / privacy / hardening phase?
      - Phase proof: does every row name the behaviour branches it proves
        (not the phase title restated), implementation-specific areas
        tasks.md can reference, its dependencies, and verification that
        could prove it done — and do the labelled lines record THIS
        change's criterion, seams, obligations, and rejected splits rather
        than generic method prose?
      - Source Inventory: does the Technical Design Source Inventory list every
        upstream this plan actually consumes (discovery, design, proposal,
        grooming, specs always; stories/FSD/ISD when they exist), each mapped to
        its authority-role planning use — with no invented row for a skipped
        optional artifact?
      - Overview: is the Technical Design Overview a reader-map derived from the
        finished body (what it settles / why shaped so / what constrains tasks /
        what is passed forward, by subject and count) rather than a restatement
        or re-listing of the tables — and is it fresh-state safe (no approval
        claimed, no approver named)?
    requires: [discovery, design, proposal, grooming, specs]

  - id: tasks
    generates: tasks.md
    description: Implementation checklist — the execution layer; authors the low-level implementation contract (files, interfaces, steps, done-when) as a phase-oriented, role-tagged, machine-tracked work queue over the technical-design decomposition
    template: tasks.md
    instruction: |
      PURPOSE:
      tasks is the EXECUTION LAYER and the LAST feature artifact: /opsx:plan
      generates it from an APPROVED technical-design as the phase-oriented,
      role-tagged, machine-tracked work queue that /opsx:apply runs task-by-task.
      It AUTHORS the low-level implementation contract: for each unit of work it
      records the files, the public interface / signatures (with a one-line
      description of each), the concrete steps, and a done-when — the signature-
      level HOW that lets /opsx:apply implement with no open questions. It is the
      only artifact with mutable, machine-tracked state (apply flips `- [ ]` ->
      `- [x]`; the OpenSpec CLI counts progress).
      Boundary: it adds NO shopper-facing behaviour beyond the specs and NO scope
      or phase beyond the technical design — technical-design.md owns
      decomposition + high-level architecture and tasks realises it in code-level
      detail. It does not design product behaviour, decide open questions, or
      re-open anything.
      Each `### P#` is delivered as an INDEPENDENT, human-approved increment:
      /opsx:apply implements it, self-verifies it with evidence, then stops for
      human approval before the next — the per-phase contract for that loop is the
      `Process` / `Verify` / `Status` slots authored here, governed by the fixed
      `## Phase Processing Rules` block. A leading `## Solution Overview` gives the
      one-paragraph orientation, projected from the upstream summaries.

      AUTHORITY ORDER:
      1. technical-design.md is the primary source for STRUCTURE: its Delivery
         Phases (the phases this queue mirrors 1:1), Implementation Building
         Block NAMES + responsibilities, runtime flows, Delivery Inventory
         (RQ/WBS + story coverage), and the APPROVED answers recorded in its
         Open Questions (each question's Recommendation / Decision cell) are
         honoured verbatim. The delta specs are the BEHAVIOUR / RQ-WBS canon and
         the outer bound on what any task may do; stories are the delivery
         grouping.
      2. This `tasks` instruction is the artifact contract.
      3. The platform build skills the change's surfaces use (the `sfnext-*`
         storefront family and the `b2c-*` backend family) are the CONVENTION
         the low-level interfaces / signatures / steps are authored against.
      4. The `tasks.md` template defines the fixed, unnumbered section frame, the
         phase-block shape, the task-block slots, and the VERBATIM
         `## Phase Processing Rules` block (house-standard, not re-authored).
      5. `verification-standards.mdc` is the authority for the per-phase Verify
         (browser verification mandatory; code review is not verification; `[x]`
         only when acceptance is fully met) — the `Verify` slot plans against it.
      6. Project `config.rules.tasks` and workflow rules are supporting context;
         they never override this contract.

      DECISION KERNEL:
      - Authorship boundary (resolve every candidate to one of three, then act):
        a NAME the technical design carries (a phase, a Building Block, a route /
        component / endpoint / cartridge / cache / state file it names), or a
        VALUE an approved decision settled (an endpoint path, a request /
        response or error shape, a TTL, the location a key or credential is read
        from), resolves SOURCED — honour it verbatim as the task's subject and
        carry the decided value unchanged into the task that states it. A
        file-internal
        symbol the implementation and its unit test bind to (an exported
        function / type / prop / constant / helper the technical design does not
        spell out) resolves AUTHORED-HERE — create it, its signature grounded in
        the platform convention for that surface and within the specs behaviour
        bound. A shopper-facing behaviour or a scope / phase that neither specs
        nor the technical design carries resolves OUT — STOP and report the gap,
        do not add it. Authoring a signature is expected; authoring behaviour or
        scope is the defect.
      - Per-phase lifecycle (the execution contract): each `### P#` is an
        independent, human-approved increment. The `## Phase Processing Rules`
        block is INVARIANT house-standard boilerplate — reproduce it VERBATIM
        from the template, never re-author or vary it. Each phase carries a
        `Process` slot (backlink + tier), a `Verify` PLAN (frozen acceptance +
        manual-style scenario + evidence + verdict) and a `Status`; the loop
        (implement-to-green -> independent verify -> stop -> human approve ->
        commit -> advance) runs at APPLY time per `verification-standards.mdc`.
        Authoring the Verify PLAN is in scope here; running it is an apply-time
        action, and so is the per-phase commit — a freshly generated queue leaves
        every `Status` at `pending`, never `approved (<sha>)`.
      - PHASE TIER — establish the BOUND before the LABEL, in the emitted slot.
        Every phase's `Process` slot carries `bounds:` immediately BEFORE `tier:`.
        Walk the closed set against what the phase's OWN tasks DO: the evidence is
        in their Steps, Files, and Interface, since a task title rarely announces a
        bound. `vendor-credential` — a task defines, stores, loads, or sends a
        vendor key, secret, or service credential. `shopper-coordinates` — a task
        requests, receives, forwards, or stores a device-derived position.
        `payment-instrument`. `personal-record` — a person's own record, as opposed
        to a business entity's published details. `none` — the verdict the walk
        reaches when every task in the phase came back clean, so it is available
        last, once the set has actually been walked.
        Each named bound carries the task id(s) that touch it and what those tasks
        do with it: `bounds: <bound> (<task ids> — <what those tasks do with it>)`.
        The bound then
        FIXES the label — any named bound resolves `tier: sensitive`, `none`
        resolves `tier: standard` — and the label binds the `Verify` `Security
        pass` (the named bound it confirms) and the `Verify` `Verdict`
        (`SHIP_WITH_HUMAN_REVIEW` when sensitive, `SHIP` when standard).
      - Planning Gate is the entry lock: build ONLY from an approved technical
        design. Every `per Q#` deferral in the technical design must already be
        RESOLVED to the answer recorded in that question's Recommendation /
        Decision cell (Status APPROVED / DEFERRED-APPROVED) — carry the decided
        value, never a `per Q#` placeholder, and never an Open Questions section
        (that belongs to technical-design.md, not here).
      - Parser law: a tracked task is a line starting at column 0 with `- [ ]`
        (regex `^[-*]\s+\[[\sx]\]`) — never indent a checkbox, never put a stray
        checkbox in a trace/handoff table or a `_None —_` line. The per-task
        Files / Interface / Steps / Done-when / Trace detail AND the per-phase
        `Process` / `Verify` / `Status` slots are `-` sub-content (never `- [ ]`),
        indented so the progress parser and the `##` structure gate do not see
        them. Every parseable task carries exactly ONE role tag
        (@FE / @BE / @SHARED); a `@QA` checkbox is forbidden.
      - Fixed section frame, like every sibling artifact: the `##` sections are
        semantic, UNNUMBERED, and in the template's order, the SAME for every
        delivery flow. Delivery work lives in `### P#` phase blocks under the one
        `## Delivery Phases` section — there are no Frontend / Backend `##`
        sections (role is on the task tag). A leading `## Solution Overview` opens
        the document and there is NO `## QA Handoff` section (formal QA is out of
        pipeline). Sequencing is carried ONLY by each phase's `Depends on:` line
        (consumer phase -> producer phase); there is no Dependency Map and no
        inline `[depends:]`.
      - Scope firewall: a story or phase never adds behaviour beyond specs; if a
        story or a technical-design phase cannot map to a spec behaviour and a
        task, STOP and surface the gap.

      PIPELINE (follow each referenced rule; do not improvise content):
      1. Clear the ENTRY / PLANNING GATE.
      2. Write the Solution Overview (SOLUTION OVERVIEW RULES).
      3. Fill Planning Source; fill Story Trace when stories exist (STORY TRACE
         RULES).
      4. Build the coverage inventory (COVERAGE & TRACE RULES): every
         Implementation Building Block, Verification Strategy row, technical-
         design Delivery Phase, story, and in-scope RQ/WBS.
      5. Write Prerequisites and the TDD Test Setup (TEST & VERIFICATION RULES).
      6. Reproduce the `## Phase Processing Rules` block VERBATIM (PHASE
         PROCESSING RULES).
      7. Author the `### P#` phase blocks under `## Delivery Phases`, one per
         technical-design Delivery Phase — each with its slots (incl. `Process` +
         tier), its low-level task blocks, and its `Verify` + `Status` (PHASE &
         ROLE RULES, TASK-BLOCK RULES, VERIFY & STATUS RULES).
      8. Write Verification (TEST & VERIFICATION RULES).
      9. Run the SELF-CHECK before emitting.

      ENTRY / PLANNING GATE (blocking — evaluate BEFORE authoring anything):
      - technical-design.md and this change's delta specs must exist; stories,
        design, and FSD/ISD are read when present, never required.
      - The Planning Gate must have PASSED: every CRITICAL Open Question
        in technical-design.md is APPROVED / DEFERRED-APPROVED by a named human
        with its answer recorded in that question's Recommendation / Decision
        cell. If any CRITICAL question is still OPEN/BLOCKED or lacks a named
        approver, STOP — do not generate tasks.
      - If a required behaviour in specs lacks RQ/WBS trace, or a story's
        acceptance conflicts with specs, STOP and surface it — never silently
        plan either version.

      INPUTS / SOURCE POLICY (the reading map — review each upstream file in
      full; these are the sections that typically carry what you consume, not a
      closed list):
      - technical-design.md — the primary STRUCTURE input:
        - Delivery Phases: the phase set this queue mirrors 1:1 — each becomes
          one `### P#` phase block with the same intent and ordering.
        - Implementation Building Blocks: the canonical component / module /
          endpoint / cache / state NAMES + responsibilities; a block becomes one
          or more low-level task blocks under the phase that delivers it, and its
          name is honoured verbatim (the task authors the block's file-internal
          signatures, not a new block name).
        - Verification Strategy: developer-owned unit/integration rows only —
          they become @FE/@BE Test Setup tasks and developer checks become
          Verification rows; a row blocked on a prerequisite becomes a Blocked
          Test. Functional / E2E / manual-QA / a11y / UAT verification is owned
          by QA and is OUT OF this pipeline.
        - Delivery Inventory: the RQ/WBS and story inventories every task set
          must cover.
        - APPROVED Open Questions (their recorded Recommendation / Decision):
          the resolved values (contract shapes, TTLs, stubbing strategy) tasks
          build against.
        - Runtime Flows / Building Block "calls / consumes" relationships: the
          producer -> consumer order that a phase's `Depends on:` mirrors.
        - Implementation Constraints / Risks: developer-owned verification
          (e.g. a bundle/perf check) and blocked-test blockers.
      - specs/**/*.md — behaviour canon and RQ/WBS ids, and the OUTER BOUND on
        what any task may do (never add behaviour beyond them).
      - The platform build skills for the change's surfaces — the storefront
        `sfnext-*` family (routing, data-fetching, components, state-management,
        i18n, test-ids, …) and the backend `b2c-*` family (web-services,
        custom-api-development, custom-caches, metadata, …): the CONVENTION each
        authored signature / step follows for its tier. Cite the convention, not
        a new mechanism.
      - stories.md — story keys/titles already reconciled into Delivery
        Inventory; use it to fill this artifact's Story Trace (STORY TRACE
        RULES).
      - grooming.md — the prerequisite ledger (P#) behind Prerequisites and the
        per-phase `Status: blocked` notes; the tracker / Reference Documents link
        surfaced in Planning Source. FSD/ISD working copy — client / publication
        reference; when it exists, link it and verify anchors, else keep the
        tracker / project-context citation.
      - The upstream OVERVIEWS (discovery Executive Summary, proposal Executive
        Summary, technical-design Overview) — the source the `## Solution
        Overview` paragraph is projected from (SOLUTION OVERVIEW RULES).
      - verification-standards.mdc — the verification authority the per-phase
        `Verify` PLAN is written against (browser verification mandatory; code
        review is not verification; `[x]` only when acceptance is fully met).

      COVERAGE & TRACE RULES:
      - DELIVERY COVERAGE LEDGER (build before drafting, one line per source
        row): enumerate EVERY Implementation Building Block row, EVERY
        Verification Strategy row, EVERY Delivery Phase, EVERY in-scope RQ/WBS,
        and EVERY story key the technical design carries, and determine where
        each is delivered. Record each as `<source row> -> <destination>`: an
        implementation block lands on a task block inside the phase that delivers
        it, a developer verification row on Test Setup or Verification, a Delivery
        Phase on its own `### P#` block, and a row whose evidence a capability
        blocks on the owning phase's `Status: blocked` note. Every enumerated row
        carries a destination and every emitted task traces back to one.
      - Honour names, author signatures: a task's SUBJECT is the technical-design
        Building Block / phase / surface it delivers (named verbatim) plus its
        RQ/WBS trace; its DETAIL is the file-internal contract it authors. Do not
        re-describe the design's rationale or runtime flow as prose — turn it
        into the Files / Interface / Steps the apply-LLM executes.
      - Deferred scope stays out: a requirement the approved lock deferred earns
        no task.

      STORY TRACE RULES (only when stories.md exists):
      - Story Trace lists every story key/title from the technical design's
        Delivery Inventory Story cells, mapped to the phase(s) that deliver it;
        shared seams/tests/verification are a "Cross-cutting" row. Each phase
        block names its story in the `Story` slot. Dropping or inventing a story
        key is a violation.

      SOLUTION OVERVIEW RULES:
      - Determine what this change delivers and its shape by reading the upstream
        OVERVIEWS (discovery / proposal Executive Summary, technical-design
        Overview); record the answer as ONE concise prose paragraph in
        `## Solution Overview`: what is delivered, what is consumed-not-built, and
        that it ships as N independent, human-approved phases. Orientation only —
        NOT a bullet in/out-of-scope list, NOT a re-listing of the phases, NOT a
        restatement of each phase's `Delivers`. Scope boundaries stay upstream.

      PHASE PROCESSING RULES:
      - The `## Phase Processing Rules` block is INVARIANT house-standard content
        fixed by the template. Reproduce it VERBATIM; do NOT re-author, trim,
        vary, or make it change-specific. It states the per-phase loop
        (implement-to-green -> independent verify -> stop -> human approve ->
        commit -> advance), the verdicts, and the sensitive-tier CONSEQUENCE
        ONCE; every phase's `Process` slot links to it. Which tier a phase gets is
        decided by its own `bounds:` value in that slot, not by this block. It does NOT
        replace `## Review & Approval` (which approves the whole plan before
        apply starts).

      PHASE & ROLE RULES:
      - Emit the template's FIXED, UNNUMBERED `##` section frame in order, the
        SAME for every flow: Solution Overview; Planning Source; Story Trace (when
        stories exist); Prerequisites; Test Setup; Phase Processing Rules;
        Delivery Phases; Verification; Review & Approval. Do NOT number, reorder,
        add, or drop `##` sections; there is no QA Handoff section.
      - Delivery work is `### P#` phase blocks under `## Delivery Phases`, one per
        technical-design Delivery Phase in the same order. A phase links to
        exactly ONE story (or, when the design groups several stories that close
        through one mechanism, those stories) and carries the slots: `Story`,
        `Delivers` (the observable / callable increment + RQ/WBS), `Areas`
        (@FE/@BE rollup of its task tags), `Depends on` (producer phase, or `—`),
        `Process` (`per [Phase Processing Rules](#phase-processing-rules)` +
        `bounds: <closed-set bound(s) + task ids | none>` + `tier: standard |
        sensitive`, in that order), `Jira` (`—`; the CLI stamps the sub-task key). A phase closes as
        something a shopper or a consuming feature can observe or call — never a
        layer/task bucket and never a trailing a11y / i18n / hardening phase.
      - A cross-cutting obligation the technical design marks CROSS-CUTTING (e.g.
        accessibility, localization) is WOVEN into the phases whose surfaces it
        touches, not a phase of its own: accessibility through each surface's
        semantic markup / test-ids, localization as a `#### Translation Sync`
        sub-area (extract / sync / compile) plus per-surface keying. Its Building
        Block, story, and Verification-Strategy row are still delivered by those
        woven tasks and counted in the coverage inventory — never dropped, never
        deferred to a trailing phase.
      - Role is on the task tag, decided by WHERE THE CODE LIVES, matching the
        technical design's area for that block: storefront routes / components /
        state / CMS-rendering and nav/redirect work are @FE; SFCC cartridge /
        custom-SCAPI / hooks / jobs / services / caches / metadata / Business-
        Manager work is @BE; a prerequisite, shared developer verification, or
        work that genuinely spans both is @SHARED. Never emit a `@QA` checkbox.
        `#### CMS / Page Designer` and `#### Translation Sync` are `####`
        sub-areas inside the phase that carries them.
      - Task IDs are phase-scoped `P#.n` (the cross-cutting sections keep `0.x`
        Prerequisites, `1.x` Test Setup, `4.x` Verification). The ID scheme is
        your synthesis for readability; it carries no dependency wiring.
      - Sequencing is phase-level and single-homed: each phase's `Depends on:`
        names the producer phase(s) it consumes an in-change artifact from
        (a module / seam / route / endpoint / cache / state a prior phase
        produces), direction consumer -> producer, following the technical
        design's Runtime Flows. Tasks inside a phase run top-to-bottom; there is
        no Dependency Map and no inline `[depends:]`. A phase that consumes
        nothing another phase produces has `Depends on: —`. Consuming an EXTERNAL
        vendor capability / SDK is a Prerequisite or a per-phase
        `Status: blocked` note, not a phase dependency.

      TASK-BLOCK RULES (the low-level contract — this is what tasks AUTHORS):
      - Every implementation task is a column-0 `- [ ]` checkbox with one role
        tag and a one-line title (the WHAT), then INDENTED slots that answer,
        for that unit of work:
        - Files: which files it creates or edits — paths under the Building
          Block the technical design named, marked `(new)` / `(edit)`.
        - Interface: determine the PUBLIC contract the unit exposes — the
          exported symbols the consuming code and the unit test bind to (a
          function signature, a component prop type, a module export, an endpoint
          request/response shape, a service contract), each with a one-line
          description; ground every signature in the platform convention for that
          surface (the `sfnext-*` shape for a storefront symbol, the `b2c-*`
          shape for a backend symbol) and within the specs behaviour bound.
          Record it as a fenced code block. Omit Interface ONLY for a pure
          wiring / content / ops / config task that exposes no callable symbol
          (say so in Steps).
        - Steps: the concrete, ordered implementation steps, each grounded in the
          convention for the surface — not the design's rationale restated.
        - Done when: the objective, checkable completion criterion for the unit
          (a developer-observable state), never a functional / E2E / QA
          assertion.
        - Trace: the RQ/WBS (and story where scoped) the unit serves.
      - The Interface / Steps are AUTHORED-HERE synthesis grounded in the named
        surface + the platform convention + the specs bound; they are not copied
        from the technical design and not invented behaviour. If a task cannot be
        given a Files + Interface (or a justified omission) + Steps + Done-when
        from the available context, the technical design is under-specified —
        STOP and surface the gap rather than guessing behaviour.

      DESCRIPTION DEPTH (two audiences, one source):
      - The phase block serves two readers from one authoring pass. The Jira
        sub-task carries the HIGH-LEVEL view — the `Delivers` line plus the child
        task TITLES — so a human sees scope without implementation noise. The
        low-level Files / Interface / Steps / Done-when stays in tasks.md for
        /opsx:apply and is NOT pushed to Jira. Author the phase so both views are
        true of the same phase.

      VERIFY & STATUS RULES (per phase; authored here as a PLAN, executed at apply):
      - Determine, for each phase, HOW it will be proven and record it in the
        `Verify` slot (a `-` sub-block, never `- [ ]`):
        - Acceptance (frozen): the phase's checkable acceptance items, derived
          from its `Delivers` + the covering specs bound — the frozen bar the
          verifier grades against.
        - Unit: which Test-Setup `1.x` tests prove the phase.
        - Scenario (live, manual-style): the ordered flow the agent walks on the
          running app — an @FE phase via `playwright-cli` (navigate / act /
          screenshot the key states); an @BE / integration phase via a call
          capturing request/response. NOT an authored automated e2e suite, NOT
          human QA.
        - Evidence: what to capture — @FE: screenshots of the key states + a
          clean console; @BE: request/response + log lines + cache behaviour.
        - Security pass: for a `tier: sensitive` phase ONLY, the privacy/security
          bound to confirm (key/credential not leaked; coordinates transient;
          etc.). Omit for a standard phase.
        - Verdict: `SHIP` for standard; forced `SHIP_WITH_HUMAN_REVIEW` for
          sensitive.
      - `Status` starts `pending`; apply advances it (implemented -> verified ->
        approved). A capability/account/data/CMS blocker known now is recorded as
        `Status: blocked — <reason> (ref Prerequisite 0.x / grooming P#)` naming
        the blocked task — the ONLY home for a blocked-verification note (there is
        no Blocked Tests section).
      - The Verify PLAN is grounded in the phase behaviour + the platform
        convention, and every line reads as an instruction the verifier EXECUTES
        at apply time: name the action to perform and the observation that
        decides it (`Capture …`, `Assert …`, `Confirm …`). The walk happens at
        apply time, so each line states what WILL be done and `Status` stays
        `pending` on a freshly authored queue.

      TEST & VERIFICATION RULES:
      - Test Setup is the TDD RED phase: developer-owned UNIT tests (Vitest,
        co-located `*.test.ts`; `sfnext-test-ids`) written before implementation,
        each targeting an interface a Delivery Phase authors and naming the phase
        it proves; skip a line only for pure wiring/glue with no logic; close
        with a @SHARED "tests fail first" task. Each phase's `Implement to green`
        step drives its Test-Setup tests to pass and its `Verify` re-runs them.
      - Translation Sync (only when the feature has user-facing text) is a
        `#### Translation Sync` sub-area in the phase that introduces the text:
        extract -> sync/upload -> compile -> verify strings (`sfnext-i18n`).
      - Verification carries developer-owned automated checks only (unit suites,
        ESLint, `tsc --noEmit`, and grounded dev checks such as a bundle/perf
        guard the technical design names); they run across the whole change.
      - QA boundary: two DISTINCT things. (a) The per-phase `Verify` is AGENT
        self-verification IN this pipeline — a manual-style scenario the agent
        walks live (`playwright-cli` browser walk + screenshots for @FE;
        request/response + logs for @BE) per `verification-standards.mdc`; it is
        NOT authored automated e2e and NOT human QA. (b) Formal functional
        testing — authored automated E2E suites, manual QA, accessibility audit,
        and UAT — is owned by QA (their own tooling) and is OUT OF this pipeline;
        tasks does not queue it and there is NO `## QA Handoff` section. A
        capability/account/data/CMS blocker is a per-phase `Status: blocked` note,
        not a section.

      OUTPUT CONTRACT:
      - A single `openspec/changes/<name>/tasks.md` working copy following the
        template frame and section order: a leading `## Solution Overview`, the
        `## Phase Processing Rules` block reproduced VERBATIM, and per-phase
        `Process` / `Verify` / `Status` slots. No Open Questions section, no
        `per Q#` placeholders, no Dependency Map, no `## QA Handoff` / Blocked
        Tests section, no technical-design rationale prose, no publishing, no
        onboarding/commentary around the document.

      SELF-CHECK BEFORE OUTPUT (fix any "no" before emitting):
      - Did I confirm the Planning Gate PASSED (every CRITICAL Open Question
        approved by a named human) and build only from resolved decisions — no
        `per Q#` placeholder, no Open Questions section?
      - Is there a leading `## Solution Overview` (one concise paragraph projected
        from the upstream overviews — not invented scope, not a phase re-listing),
        and is the `## Phase Processing Rules` block the VERBATIM house-standard
        text (not re-authored or made change-specific)?
      - Coverage sweep: is every Implementation Building Block and Verification
        Strategy row delivered by a task or verification/blocked row, every
        technical-design Delivery Phase realised as a `### P#` block, and every
        in-scope RQ/WBS and story covered — with no task lacking a technical-
        design basis?
      - Authorship sweep: does every task's SUBJECT trace to a technical-design
        name (SOURCED, verbatim); is every authored Interface / signature a
        file-internal symbol grounded in the platform convention and within a
        specs bound (AUTHORED-HERE); and is there NO shopper-facing behaviour or
        scope/phase beyond specs + technical design (nothing OUT smuggled in)?
      - Actionability sweep: does every implementation task carry Files + a usable
        Interface (or a justified omission) + Steps + Done-when, so /opsx:apply
        has no open question?
      - Does every parseable task start at column 0 with `- [ ]`, carry exactly
        one @FE/@BE/@SHARED tag, with no `@QA` checkbox and no stray checkbox in a
        table, and is the low-level detail indented beneath it?
      - Phase-sequencing sweep: does every `### P#` carry its slots (Story /
        Delivers / Areas / Depends on / Process (+ tier) / Jira), and does each
        `Depends on:` name a real producer phase in consumer -> producer direction
        (or `—`), with no dependency onto a Prerequisite, a unit test, a
        Verification check, or an external vendor seam?
      - Verify & status sweep: does every phase carry a `Verify` PLAN (frozen
        acceptance + a manual-style scenario + evidence-by-flow + verdict) and a
        `Status`; is every `tier: sensitive` phase forced to
        SHIP_WITH_HUMAN_REVIEW with a security pass; and is every known blocker a
        `Status: blocked — … (ref 0.x / P#)` note (no Blocked Tests / QA Handoff
        section)?
      - Does the document use the fixed, unnumbered `##` section frame in the
        template's order (Solution Overview first; Phase Processing Rules present;
        no QA Handoff section)?
      - When stories exist: is every story key in Story Trace and in its phase's
        `Story` slot?
      - Is nothing added beyond specs behaviour, and nothing re-decided from the
        approved technical design?
    requires: [technical-design]

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    PURPOSE
    Turn an APPROVED plan into working, independently verified, human-approved
    code. Apply is an execution stage, not an authoring stage: everything it
    builds was already decided upstream. A gap discovered here is raised as a
    planning question and sent back — never resolved by inventing code, scope,
    behaviour, or a public interface the plan does not carry.

    AUTHORITY ORDER
    When documents disagree, the later entry wins: specs (behaviour canon) <
    approved grooming decisions < technical-design (architecture + decomposition)
    < tasks.md (the implementation contract). tasks.md is the execution law and
    the ONLY artifact apply mutates. Its `## Phase Processing Rules` block is the
    per-phase procedure — read it from the file and follow it literally; it is
    reproduced there precisely so apply needs no second copy of the loop.

    INPUTS
    tasks.md is the queue. technical-design.md is the primary developer HOW;
    specs/**/*.md bound the behaviour; the approved grooming ledger records the
    decisions the plan rests on. design.md, stories.md, fsd/**/*.md and
    isd/**/*.md are conditional context and are often absent. Read the phase you
    are about to build plus the artifacts it cites — not the whole change at once.

    ENTRY GATE
    Do not start while the plan is unapproved: `## Review & Approval` in tasks.md
    must read approved for implementation with a NAMED human (never Agent / LLM /
    Cursor / blank), and every CRITICAL technical-design Open Question must be
    APPROVED or DEFERRED-APPROVED by a named human. If either fails, report
    exactly what is open and stop.

    EXECUTION CONTRACT
    The unit of work is the PHASE (`### P#`), not the task. Complete the
    Prerequisites (`0.x`) and Test Setup phases first, then take the `### P#`
    blocks ONE AT A TIME in `Depends on:` order (consumer after producer). Never
    start a phase while a phase it depends on is unapproved, and never interleave
    two phases. Inside a phase, tasks run top-to-bottom; each task is built to
    its own `Files` / `Interface` / `Steps` / `Done-when` and its checkbox flips
    to `- [x]` only when its Done-when is actually met.

    Every phase then runs the full `## Phase Processing Rules` cycle, including
    the independent verify pass against the phase's frozen `Verify` block, the
    STOP for human approval, and the phase commit. A `tier: sensitive` phase
    additionally carries a security pass on its recorded bound and can never be
    auto-shipped. Record the outcome in that phase's `Status` slot as the loop
    prescribes.

    STOP AND ASK
    Stop — do not improvise — when a task is ambiguous, when implementation
    contradicts the technical design or a spec bound, when a phase's dependency
    is incomplete, when a capability, credential or account the phase needs has
    not been delivered (record it as that phase's `Status: blocked`), or when the
    verify pass fails three iterate rounds.

    OUT OF SCOPE
    Apply never self-approves a phase, never marks a verification task complete
    without real execution evidence, and never authors formal QA work: automated
    E2E suites, manual QA, accessibility audits and UAT are QA-owned and outside
    this pipeline.
