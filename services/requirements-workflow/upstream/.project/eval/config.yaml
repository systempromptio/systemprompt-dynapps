# OpenSpec artifact eval configuration (standalone module).
#
# This is the module SOURCE (lives here in the repo). On project initialization
# it is copied to .cursor/.project/eval, alongside the shared .cursor/.project/
# tooling. It is self-contained (its own package.json / node_modules / Bedrock
# client) and shares only the credentials file at .project/.env via the shared
# ../lib/load-env.mjs loader (which resolves the same way in both locations).
#
# Bedrock is the inference provider for both generation and judging. Eval model
# placement is intentionally owned here (not .env) so the tested generator/judge
# pair stays versioned with the eval itself. .env only carries shared credentials.
# Two subcommands run over one judge core:
#   eval  — generate N candidates in memory, judge each, aggregate variability
#   judge — judge one already-produced file (thin CLI over the same core)

model:
  # The chosen judge is only available as on-demand in US regions. Eval fixtures
  # do not contain client data, so this module can use us-east-1 independently
  # from project-context (which may stay in eu-central-1 for retrieval/rerank).
  # Shared output cap for generation AND judging. Raised 8192 -> 16384 because the
  # longest artifact (technical-design) truncated mid-table: the pre-artifact <plan>
  # block occasionally balloons to 60%+ of the output, and plan+artifact overran the
  # old cap even though the artifact itself is well-sized. Truncation only ever hurts
  # a legitimate output, so a higher cap cannot inflate any passing run; artifacts
  # that already fit under 8192 are unaffected (their outputs never reached the cap).
  region: us-east-1
  max_tokens: 16384

  generate:
    id: openai.gpt-oss-120b-1:0
    note: >
      Fixed generator for every run mode (see the opsx-eval skill, Model & Source
      Policy). The tested pair is openai.gpt-oss-120b-1:0 (generator) +
      mistral.mistral-large-3-675b-instruct (judge), and it is the ONLY pair the
      eval uses. Never swap the generator to move a number — the only levers are
      prompt-side and data-side (schema instruction/template, rules, command, judge
      rubric, fixtures/goldens).

  judge:
    id: mistral.mistral-large-3-675b-instruct
    note: >
      Selected after judge bake-off: passed the golden ceiling, matched ground
      truth on all five known-defective Nova candidates, and surfaced a gpt-oss
      self-judge blind spot (duplicate reserve-in-store scope as both CR and
      CRITICAL open question). Mistral Large 3 is available in us-east-1/us-west-2
      only. gpt-oss-120b trialed as an independent judge:
      100% pass, stddev 0.014 (~8x tighter) and ~$0.29/batch cheaper, but score is
      compressed to 0.94-1.0 (weaker graded discrimination); kept Mistral for now.

  tested:
    good:
      - id: mistral.mistral-large-3-675b-instruct
        role: judge
        result: best independent judge; no checkbox hallucinations observed
      - id: openai.gpt-oss-120b-1:0
        role: generate
        result: best generator; also reliable judge but not independent of itself
    rejected:
      - id: us.meta.llama4-maverick-17b-instruct-v1:0
        reason: hallucinated/inverted Discovery Gate checkbox state
      - id: us.meta.llama3-3-70b-instruct-v1:0
        reason: round-number scoring bias and score/pass inconsistencies
      - id: nvidia.nemotron-super-3-120b
        reason: parse-fragile JSON and checkbox hallucination
      - id: google.gemma-3-27b-it
        reason: too soft as judge and weak as generator
      - id: mistral.devstral-2-123b
        reason: inverted Discovery Gate logic
    blocked:
      - id: eu.anthropic.claude-haiku-4-5-20251001-v1:0
        reason: account use-case form required
      - id: ai21.jamba-1-5-large-v1:0
        reason: legacy/dormancy access gate

temperatures:
  # Generation uses temperature > 0 so the N eval runs actually differ and we can
  # observe variability. The judge stays at 0 for stable, repeatable scoring.
  #
  # Discovery is a faithful extraction + fixed-template task, so we sample low
  # (best practice ~0.2 for this kind of structured, no-fabrication generation).
  # A little spread still surfaces the fabrication/format tail across N runs, but
  # lower temperature cuts the catastrophic outliers (dropped/re-pointed traces,
  # invented anchors). Keep this fixed when comparing before/after of a prompt
  # change — moving temperature shifts the measurement, not just the result.
  generate: 0.2
  judge: 0

# Cost-aware run modes. Pick one with `--mode <name>` (default: default_mode).
# A mode overrides the generator, judge, run count, and judge self-consistency
# samples in one switch. Explicit --runs / --judge-samples still win over a mode.
# See the opsx-eval skill, "Run modes (cost control)".
default_mode: dev
modes:
  # Fast iteration while developing prompts/rubrics. Same models as `release`
  # (gpt-oss generator + Mistral Large 3 judge) so dev signal matches the release
  # gate, but lighter: fewer runs and a single judge sample (no self-consistency)
  # to keep the dozens-of-runs-a-day loop cheap. Weak-model (Gemma) dev was
  # retired: with few runs + one judge decision its variance drowned the signal,
  # so iterating on a capable generator is the better use of time.
  dev:
    generate: openai.gpt-oss-120b-1:0
    judge: mistral.mistral-large-3-675b-instruct
    runs: 5
    judge_samples: 1
    # NOTE: single-sample judging with the strict Mistral judge is intentionally a
    # pessimistic lower bound — individual harsh verdicts are NOT cancelled by a
    # majority vote (release uses judge_samples: 3 for that). Read dev criticals as
    # candidates to triage (generator defect vs judge over-strictness), not as a
    # release-grade score.
  # Pre-release gate: gpt-oss generator + Mistral Large 3 judge (strict, spreads
  # scores), 10 runs per positive flow with 3 judge samples (median +
  # majority-vote criticals to cancel judge noise). Use before trusting a
  # prompt/rubric change.
  release:
    generate: openai.gpt-oss-120b-1:0
    judge: mistral.mistral-large-3-675b-instruct
    runs: 10
    judge_samples: 3

# Delivery-scope flows. A case that ships per-flow overlays + goldens is judged
# once per positive flow so the eval verifies the schema's functional/integration
# branching, not just one universal shape. When a case has no per-flow files the
# runner falls back to a single (flowless) run — full back-compat.
#   ba        = functional flow (FSD, BA-owned); base + "<ctx>.ba.md" role overlay
#   sa        = integration flow (ISD, SA/architect-owned); base + "<ctx>.sa.md" overlay
#   ambiguous = negative split-gate case: the bare base packet with NO role overlay,
#               so delivery scope is undecided and the user's intent is unknown. The
#               discovery schema's DELIVERY SCOPE GATE must STOP before authoring
#               discovery and return a decomposition (split
#               gate) instead. Its golden `discovery/final.ambiguous.md` is that expected
#               stop-and-ask, so the case runs in the auto eval and the discovery
#               judge scores it via its split-gate mode branch (see judge/discovery.md).
# Naming convention (composed by the resolver, per case dir):
#   context overlay : "<context-id>.<flow>.md"  appended to the base "<context-id>.md"
#                     (absent for `ambiguous` — it is the bare base on purpose)
#   golden          : "<artifact>.<flow>.md"     (falls back to "<artifact>.md")
# `runs` in each mode is the count PER FLOW (dev: 3/flow, release: 10/flow).
flows:
  order: [ba, sa, ambiguous]
  context_overlay: "{context}.{flow}.md"
  golden: "{artifact}.{flow}.md"

# Fixture states. An artifact may be stored as a DIRECTORY of states instead of a
# single file, because one file cannot hold both the draft as first emitted and
# the artifact as it settles after the review gate:
#   discovery/initial.ba.md   the draft, before the review gate
#   discovery/final.ba.md     the settled artifact, after it
# Resolution rules (see the pipeline refactor tracker, "Fixture State Model"):
#   - a GOLDEN resolves to the draft state — that is what generation must produce;
#   - a CONTEXT resolves to the settled state — that is what a downstream artifact
#     receives in reality, so a bare id like `discovery` means "settled discovery"
#     and downstream judges need no rewiring when an upstream is restructured;
#   - the draft falls back to the settled state, so a flow that carries no review
#     session ships one file rather than two identical ones.
# An artifact directory with none of these names (a specs bundle) is untouched.
states:
  draft: initial
  settled: final
  # The review session that moved a flow from its draft to its settled state. Its
  # presence is the only mechanical signal that the two states genuinely differ —
  # review edits land inside table cells and prose, so a draft cannot be recovered
  # from a settled artifact by cutting. A flow that ships a session but no draft is
  # therefore refused: without it, generation would be judged against decisions
  # only a human could have made, and every run would fail for the wrong reason.
  review_session: ".context/review-session.{artifact}.{flow}.md"

eval:
  # Default number of generate->judge runs per `eval` invocation. Override with
  # --runs N. This is what turns a single sample into a variability signal.
  runs: 10
  # How many generate->judge runs execute in parallel. Override with
  # --concurrency N. Bedrock throttling is handled by exponential backoff, so the
  # default pool is 20 — always run 20 lanes so a full batch finishes fast without
  # tripping rate limits (the release scripts already pass --concurrency 20).
  concurrency: 20
  # Warn when an assembled prompt exceeds this estimated token count. It is a
  # design smell, not a hard limit: the model window is far larger, but a prompt
  # this big means the eval is loading too much (trim skills/command/sources).
  # See the opsx-eval skill, "Context budget".
  context_warn_tokens: 100000
  # Judge self-consistency: how many times each candidate is judged. The verdict
  # is the median overall score with a majority vote on critical_findings, which
  # cancels the judge's temp-0 nondeterminism (observed 44-94% swings on one
  # fixed candidate). 1 disables it; odd values (3) make the majority vote clean.
  judge_samples: 3

scoring:
  # Default pass threshold on the judge's overall score (0..1). A judge rubric's
  # own frontmatter `scoring.pass_threshold` overrides this per artifact (keep
  # them equal to this global unless an artifact needs a stricter bar).
  # 0.7 is the honest bar for the fixed OSS generator: at 0.8 many otherwise-correct
  # candidates failed only on soft, high-variance dimensions (open-question severity
  # calibration, working-copy path agnosticism). See the opsx-eval skill,
  # "Pass Threshold & Reading Pass-Rate As Noise".
  pass_threshold: 0.7

paths:
  # Root that contains <schema>/{judge,generator,fixtures,mappings.yaml}.
  suite: evalsuite
  # Where results are written when --save is passed (gitignored).
  results: .results
  # Project openspec tree root: schemas/ (templates + instructions) and the live
  # specs/ + changes/. Sourced from the OPENSPEC_ROOT env var (see .project/.env)
  # when set; this default is the shipped scaffold under templates, used for
  # validation before init. The initializer rewrites OPENSPEC_ROOT to the real
  # project openspec/ (sibling of .cursor/) after init. See the opsx-eval skill.
  openspec_root: ../templates/openspec
  # Root that contains the project skills (skills/**/SKILL.md). A generator
  # manifest's `skills:` entries are resolved by name against this root.
  skills_root: ../../skills
