# Live-reference mapping registry (see the opsx-eval skill, "Architecture").
#
# Real commands/skills/schema instructions reference infrastructure Bedrock
# cannot reach (project-context MCP, Jira, the openspec CLI, interactive
# tools). When those texts are inlined into the generation prompt, each matched
# reference gets a clearly-delimited SUBSTITUTION note appended to its block
# (the prose is never rewritten), so the model treats the live dependency as an
# eval-safe fixture/stub. Matched substitutions are shown under --prompt-only.
#
# Each entry:
#   id                 stable name (shown in the substitution report)
#   match              list of case-sensitive substrings; any hit triggers the note
#   redirect_context   (optional) a context id the ref is served from (.context/initial-context)
#   stub / note        the substitution text appended after the matched block
#
# Actualization: when a command/skill starts depending on a NEW live service or
# tool, add an entry here so it is neutralized instead of leaking an unmet
# reference into the prompt.

references:
  - id: project-context
    match:
      - project-context
      - "search(query"
      - list_sources
      - index_stats
      - "/project-sync"
      - "/project-context:sync"
    redirect_context: .context/initial-context
    note: >-
      project-context MCP is NOT available in eval. Any instruction to search or
      sync project-context (Confluence, Jira, meeting_notes, specs, ADRs) is
      served entirely by the CONTEXT block below — the initial-context packet
      emulates the project's memory. Use the eval source_type map in that packet
      to match each requested project-context source_type to the corresponding
      CONTEXT section. Cite those emulated results using realistic project-context
      anchors
      (`.cursor/.project/project-context/inbox/<source_type>/<file>.md:<lines>` or
      `openspec/specs/<capability>/spec.md:<lines>` for specs), not the eval-only
      context packet path. If CONTEXT provides only an external id such as a Jira
      key, cite the id (for example `project-context jira: SFX-4102`) instead of
      inventing a file. Do not call MCP tools and do not claim to; ground every
      requirement, citation, and decision strictly in the CONTEXT.

  - id: jira
    match:
      - Jira
      - JIRA
      - Confluence
    stub: >-
      Jira/Confluence are NOT available in eval. Treat any tracker or wiki
      reference as optional: reuse an id already present in the CONTEXT verbatim,
      and never fabricate ticket numbers, page IDs, URLs, or statuses.

  - id: openspec-cli
    match:
      - "openspec new"
      - "openspec status"
      - "openspec instructions"
      - "openspec list"
      - "ls openspec/specs"
    stub: >-
      The openspec CLI is NOT available in eval. Assume the change scaffold and
      the per-artifact instructions are already provided in this prompt (see the
      OPENSPEC INSTRUCTIONS block). The existing baseline capability inventory that
      `openspec list` / `ls openspec/specs/` would return is provided in the
      CONTEXT as the baseline capability specs — use those to decide ADD vs
      MODIFY vs REMOVE. Do not run CLI commands or depend on their output.

  - id: compile-time-dependency-stamp
    match:
      - "This artifact has unmet dependencies. Complete them first"
      - 'status="missing">'
    stub: >-
      The instructions above were compiled against an EMPTY change scaffold: eval
      creates the change with the openspec CLI in a throwaway root, so none of the
      sibling artifact FILES exist on disk at compile time. Every
      `<dependency … status="missing">` stamp and every "unmet dependencies /
      Missing: …" warning therefore describes that empty scaffold, never this run.
      Resolve each declared dependency from the CONTEXT below instead: a dependency
      is SUPPLIED when a CONTEXT block carries its artifact (the block header
      repeats the dependency id), and a SUPPLIED dependency satisfies any "required
      artifacts must exist" entry gate — the on-disk path is irrelevant here. Only a
      dependency with NO CONTEXT block, or one whose block is marked "NOT FOUND", is
      genuinely absent and can meet a stop condition. This substitution neutralizes
      the compile-time stamp ONLY; it waives no other gate — planning-state,
      approval, conflict, and content gates are still evaluated from the CONTEXT.

  - id: drawio-diagrams
    match:
      - drawio-diagrams/scripts/generate.mjs
      - drawio-diagrams/scripts/validate.mjs
      - drawio-diagrams/scripts/render.mjs
      - "node scripts/generate.mjs"
      - "node scripts/validate.mjs"
    stub: >-
      The drawio-diagrams scripts (validate.mjs / generate.mjs / render.mjs)
      are NOT runnable in eval — this is single-shot generation with no shell.
      Do NOT claim to run them or to have rendered anything. Instead author the
      diagram source INLINE and add its image reference yourself, exactly as the
      skill's insert step would: emit the fenced ` ```drawio:sequence:<id> `
      block in the section, then on the next line add
      `![<title>](./assets/<id>.png)`. The `.png` is produced by the build step
      at commit time and its path is DETERMINISTIC from the block id
      (`<id>.png` in the sibling `assets/` folder), so you can write the image
      line without running the generator. Produce both the block and the image
      line; produce no other diagram tooling output.

  - id: interactive-tools
    match:
      - AskUserQuestion
      - TodoWrite
    stub: >-
      Interactive tools (AskUserQuestion, TodoWrite) are NOT available in eval. Do
      not call them or track todos. Their unavailability does NOT waive any schema
      or command gate: evaluate gates from the CONTEXT and follow whatever the
      sources direct. If the sources direct a stop-and-ask before the artifact,
      render that message as the text the agent would show the user (a produced
      result, not an interactive pause) instead of calling a tool. Otherwise
      proceed with the provided CONTEXT.
