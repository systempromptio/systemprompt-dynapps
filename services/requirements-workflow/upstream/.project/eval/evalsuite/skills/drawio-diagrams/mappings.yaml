# Live-reference mapping registry for the `skills` suite (see the opsx-eval skill,
# "Architecture" / "Live-Reference Mapping"). When the inlined SKILL / references
# mention tooling or services the eval cannot reach, a SUBSTITUTION note is
# appended to that block so the model treats the dependency as unavailable instead
# of pretending to run it.

references:
  - id: diagram-tooling
    match:
      - "scripts/validate.mjs"
      - "scripts/generate.mjs"
      - "scripts/render.mjs"
      - "reverse.mjs"
      - "Cmd+Shift+V"
      - "Ctrl+Shift+V"
    stub: >-
      The diagram generator, validator, renderer, and the Cursor markdown preview
      are NOT available in eval. Do not run them, do not claim to have run them,
      and do not fabricate rendered output. Your job is only to AUTHOR the
      ` ```drawio ` block as text, correct and renderable by
      construction, following the SKILL and the type reference. A human runs the
      generator on your block afterwards.

  - id: confluence-publish
    match:
      - "Confluence"
      - "confluence.mjs"
      - "atlassian"
    stub: >-
      The Confluence publish / pull-diagrams pipeline is NOT available in eval and
      is out of scope for this task. Do not describe or invoke it; produce only the
      diagram document.
