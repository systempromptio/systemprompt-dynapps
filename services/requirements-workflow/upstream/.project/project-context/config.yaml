# Project Context configuration (deploy).
#
# This file lives at .cursor/.project/project-context/config.yaml. Paths that
# start with ../ are relative to this directory; the project root is three levels
# up (project-context -> .project -> .cursor -> <project root>).
#
# Bedrock is the model provider (inference only). All storage stays local.
# Rebuild the index after changing embed_model (the vector dimension changes).

inbox_path: inbox
index_path: .index

# Shared credentials file for the tooling library (.cursor/.project/.env),
# generated by /project:init from .project/templates/env.example.tmpl.
env_path: ../.env

bedrock:
  # Auth: Bedrock API key (bearer token) via AWS_BEARER_TOKEN_BEDROCK in .env.
  # Region is owned by project-context env: PROJECT_CONTEXT_BEDROCK_REGION.
  embed_model: amazon.titan-embed-text-v2:0        # 1024-dim
  embed_dim: 1024
  chunk_model: openai.gpt-oss-120b-1:0             # chunking + enrichment (index-time only)
  rerank_model: cohere.rerank-v3-5:0               # via bedrock-runtime InvokeModel
  embed_concurrency: 16
  max_concurrency: 8

indexing:
  doc_concurrency: 6

chunking:
  target_chars: 1600
  max_chars: 3000
  min_chars: 300
  split_tolerance: 100
  enrich: true           # LLM contextual enrichment for structured (script-strategy) docs

retrieval:
  top_k: 5
  candidate_multiplier: 4
  rerank_enabled: true

# Fixed chunking strategy per source type. See scripts/cli/chunker.mjs.
#   llm    - LLM line-number chunking (semantic boundaries; transcripts)
#   script - deterministic heading-aware splitter (structured markdown)
#   none   - no splitting, with domain-specific body/comment handling (jira)
#
# `path` overrides where originals are read from (default inbox/<type>). When it
# points outside inbox, that directory is never written to - matching files are
# materialized into inbox/<type> so the index and our sidecars stay self-contained.
# `include`/`exclude` (globs) select which files are taken from the origin.
sources:
  meeting_notes:
    strategy: llm
    description: Hand-authored workshop / discovery / tech-call transcripts and notes (curated, git-shared; provisional, not signed)
  confluence:
    strategy: script
    description: Full mirror of the configured Confluence space(s) - all current pages + footer comments (reconciled project docs, FSD/ISD)
  jira:
    strategy: none
    description: Jira issues for the configured project(s)/JQL (subset, not all of Jira), with comments; body and comments split into their own chunks
  adrs:
    strategy: script
    description: Architecture Decision Records (hand-authored, git-shared; the durable record of why)
  specs:
    strategy: script
    description: Current OpenSpec canonical capability specs (current behaviour)
    path: ../../../sf-next/openspec/specs
    include:
      - '**/spec.md'
  openspec_archive:
    strategy: script
    description: Archived (completed) OpenSpec changes - historical proposal, design, and technical-design rationale; not active publish metadata (delta spec.md excluded; current specs come from the specs source)
    path: ../../../sf-next/openspec/changes/archive
    include:
      - '**/proposal.md'
      - '**/design.md'
      - '**/technical-design.md'

# Atlassian integration settings live in .env (toolkit names are accepted):
#   ATLASSIAN_BASE_URL / ATLASSIAN_SITE, ATLASSIAN_EMAIL, ATLASSIAN_API_TOKEN,
#   CONFLUENCE_SPACE_KEY / CONFLUENCE_SPACES, JIRA_PROJECT_KEY / JIRA_PROJECTS,
#   JIRA_JQL, ATLASSIAN_INCLUDE_COMMENTS
