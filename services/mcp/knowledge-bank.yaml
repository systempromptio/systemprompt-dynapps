# Knowledge-bank MCP server (REQ-046/047/048/052) — the project-context RAG
# engine, Phase 0 of the AI Kit migration.
#
# ENABLED. Every development and Cowork plugin in services/plugins/ carries it,
# and its role grant sits in services/access-control/roles.yaml.
#
# A REMOTE server. Users connect from Claude Code / Cowork to
# https://astound.systemprompt.io/api/v1/mcp/knowledge-bank; nobody runs
# systemprompt locally for it. Hybrid retrieval over pgvector over ONE shared
# index owned by the instance; embedding and reranking run on the provider
# named by `model.provider` in services/knowledge-bank/config.yaml.
#
# Only the caller's credentials travel with a request. `sync_knowledge` reads
# Confluence and Jira as the caller, using the `x-atlassian-email` and
# `x-atlassian-api-token` headers the client keeps in its .mcp.json, and grants
# every document it fetches to that caller (`user:<id>`). A page several
# people can read is embedded once and granted to each of them; search joins
# the caller's grants inside the candidate queries (REQ-052), so a document
# the caller may not read is never returned and never even scanned.
#
# Hard boot requirement — the binary exits non-zero and core FAILS THE WHOLE
# PLATFORM BOOT without it: pgvector on the index database (the
# `knowledge_database_url` secret, or the instance database when it is
# absent). The `bedrock_api_key` secret is required only when
# `model.provider: bedrock`; the `local` provider needs no secret. There is no
# inert mode. Provisioning: docs/install/knowledge-db.md.
#
# Server access: roles `user`, `admin` and `project_manager` in
# services/access-control/roles.yaml — every signed-in user may search and
# sync; `knowledge_index_stats` and `prune_knowledge` additionally check the
# admin role themselves.
#
# Tunables and the source catalogue: services/knowledge-bank/config.yaml.

mcp_servers:
  knowledge-bank:
    type: internal
    binary: systemprompt-mcp-knowledge-bank
    package: knowledge-bank
    port: 5030
    enabled: true
    display_in_web: false
    removable: true
    description: Project knowledge bank - Confluence and Jira you can read, shared index, searchable with citations
    oauth:
      required: true
      scopes:
      - user
      audience: mcp
      client_id: null
