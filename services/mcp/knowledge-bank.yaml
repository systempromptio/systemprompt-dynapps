# Knowledge-bank MCP server (REQ-046/047/048/052) — the project-context RAG
# engine, Phase 0 of the AI Kit migration.
#
# Hybrid retrieval over pgvector, embedded and reranked on AWS Bedrock in
# eu-central-1, with ingestion of Confluence, Jira and file-tree sources run
# inside this same process. Retrieval is access-controlled per document
# (REQ-052): the caller's identity, roles, and attribute bands are joined
# against knowledge_document_grants inside the candidate queries, so a
# document the caller may not read is never returned and never even scanned.
#
# Enabled everywhere. The binary degrades by itself: on a database without
# pgvector (the Fly staging deploy on the managed Postgres) it applies no
# schema and every tool answers BACKEND_NOT_CONFIGURED naming pgvector; with
# no `bedrock_api_key` in the profile secret store it does the same naming the
# key. Container deployments run pgvector/pgvector:pg18 and get the index.
#
# Server access: role `user` in services/access-control/roles.yaml — every
# signed-in user may search, and per-document grants decide what each sees.
# `sync_knowledge` additionally checks the admin role itself.
#
# Tunables and the source catalogue: services/knowledge-bank/config.yaml.

mcp_servers:
  knowledge-bank:
    type: internal
    binary: systemprompt-mcp-knowledge-bank
    package: knowledge-bank
    port: 5030
    enabled: true
    display_in_web: false
    removable: true
    description: Project knowledge bank - Confluence, Jira, meeting notes, ADRs and specs, searchable with citations
    oauth:
      required: true
      scopes:
      - user
      audience: mcp
      client_id: null
