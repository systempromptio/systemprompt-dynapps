# Atlassian Jira — external MCP server, running as the signed-in user.
#
# DISABLED, for two independent reasons, both of which must clear first:
#
#  1. No Atlassian OAuth app exists yet. See services/web/config/atlassian.yaml
#     for what to register and which secret to set.
#
#  2. UNVERIFIED: whether a 3LO access token minted at auth.atlassian.com for
#     audience api.atlassian.com is accepted by mcp.atlassian.com. Atlassian's
#     Remote MCP server is an OAuth 2.1 resource server with its own flow, and
#     its docs decline to name an authorization server or audience. Settle this
#     with a curl spike against a real token BEFORE enabling. If it is rejected,
#     the fallback is the direct REST path
#     (api.atlassian.com/ex/jira/{cloud_id}/...) behind an internal server —
#     which is why the accessor already banks and returns cloud_id.
#
# The endpoint is /v1/mcp, not the /v1/sse form found in older examples: that
# one is deprecated after 30 June 2026, and core's MCP client speaks only
# StreamableHttp — it has no HTTP+SSE transport at all.
#
# `external_auth` is what switches core off "forward the systemprompt JWT" and
# onto "GET token_endpoint with the caller's JWT, then inject the returned
# bearer". Our own credential is withheld from Atlassian entirely. The same
# accessor serves this server and confluence.yaml — it is keyed on the calling
# user, and core passes it no server identity.
#
# Visibility is gated to users who have actually linked an account, via the
# `atlassian` subject dimension in services/access-control/atlassian.yaml.
# Without that gate an unlinked user would see a server whose every tool call
# could only answer "connect your account first".

mcp_servers:
  jira:
    type: external
    binary: ""
    package: null
    # Why: nominal only. Port validation filters on enabled && internal, so an
    # external server never claims one — but the field is required.
    port: 5040
    endpoint: "https://mcp.atlassian.com/v1/mcp"
    enabled: false
    display_in_web: false
    removable: true
    description: Atlassian Jira — issue tracking, epics, and sprints, as the signed-in user
    external_auth:
      token_endpoint: "/api/public/atlassian/token"
      header: "Authorization"
      scheme: "Bearer"
    oauth:
      # Why: false because external_auth governs authentication here. Setting
      # both would gate the call twice against different credentials.
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
