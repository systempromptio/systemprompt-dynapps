# Tools on this server are allowed by default in Claude Code and Claude
# Desktop (no per-call prompt); add `tool_policy: prompt|deny` under the
# deployment to change that. See docs/CONFIGURED-CONNECTORS.md.
mcp_servers:
  atlassian:
    type: external
    binary: ''
    package: null
    port: 5043
    endpoint: https://mcp.atlassian.com/v2/mcp?tools=all
    enabled: true
    display_in_web: false
    removable: true
    description: Atlassian hosted MCP, authenticated as the signed-in user
    external_auth:
      token_endpoint: /api/public/connectors/atlassian/token
      header: Authorization
      scheme: ""
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
