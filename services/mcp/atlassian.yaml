# `tool_policy` is required on every managed server: `allow` (no per-call
# prompt in Claude Code / Claude Desktop), `prompt` or `deny`. A server without
# it is withheld from the bridge manifest and fails boot validation.
# See docs/CONFIGURED-CONNECTORS.md.
mcp_servers:
  atlassian:
    type: external
    binary: ''
    package: null
    port: 5043
    endpoint: https://mcp.atlassian.com/v2/mcp?tools=all
    enabled: true
    tool_policy: allow
    display_in_web: false
    removable: true
    description: Atlassian hosted MCP, authenticated as the signed-in user
    external_auth:
      token_endpoint: /api/public/connectors/atlassian/token
      header: Authorization
      scheme: ""
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
