# Shared document store tools. Shipped disabled until the
# systemprompt-mcp-documents binary lands; a disabled internal server is
# never resolved to a binary, so boot does not need it yet.
mcp_servers:
  documents:
    server_type: internal
    binary: systemprompt-mcp-documents
    package: documents
    port: 5012
    enabled: false
    tool_policy: allow
    display_in_web: true
    removable: false
    description: Shared documents and folders — read, edit and create Word, Excel, PowerPoint, HTML and Markdown documents from templates
    oauth:
      required: true
      scopes:
      - user
      audience: mcp
      client_id: null
