# Salesforce Headless 360 for Astound UK. OAuth is brokered per user through
# the same packaged External Client App as the existing sobject-all server.
mcp_servers:
  salesforce-headless-uk:
    type: external
    endpoint: "https://api.salesforce.com/platform/mcp/v1/platform/headless-360"
    enabled: true
    tool_policy: allow
    display_in_web: false
    removable: true
    description: Salesforce Headless 360 (Astound UK) — governed reads, approved writes and dynamic widgets as the signed-in user
    external_auth:
      token_endpoint: "/api/public/connectors/salesforce-headless-uk/token"
      header: "Authorization"
      scheme: ""
    oauth:
      required: false
      scopes: [user]
      audience: mcp
      client_id: null
