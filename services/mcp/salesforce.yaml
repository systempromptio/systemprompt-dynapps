# Salesforce hosted MCP. India access is gated by group; missing per-user
# authorization fails at the token accessor rather than hiding the connector.
mcp_servers:
  salesforce:
    type: external
    binary: ""
    package: null
    # Why: nominal only — see the note in jira.yaml.
    port: 5042
    endpoint: "https://api.salesforce.com/platform/mcp/v1/platform/sobject-all"
    enabled: true
    display_in_web: false
    removable: true
    description: Salesforce Hosted MCP — SObject CRUD/SOQL, as the signed-in user
    external_auth:
      token_endpoint: "/api/public/connectors/salesforce/token"
      header: "Authorization"
      scheme: ""
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
