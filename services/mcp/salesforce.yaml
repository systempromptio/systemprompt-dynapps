# Salesforce hosted MCP for the default production org. The org itself —
# My Domain, app credentials, entitled groups — is declared under the same id
# in services/salesforce/orgs.yaml; add another org as salesforce-<slug>.yaml
# here plus its registry entry. Sandboxes use the /sandbox/ endpoint.
mcp_servers:
  salesforce:
    type: external
    binary: ""
    package: null
    # Why: nominal only. Port validation filters on enabled && internal, so an
    # external server never claims one — but the field is required.
    port: 5042
    endpoint: "https://api.salesforce.com/platform/mcp/v1/platform/sobject-all"
    enabled: true
    tool_policy: allow
    display_in_web: false
    removable: true
    description: Salesforce Hosted MCP — SObject CRUD/SOQL, as the signed-in user
    external_auth:
      token_endpoint: "/api/public/connectors/salesforce/token"
      header: "Authorization"
      scheme: ""
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
