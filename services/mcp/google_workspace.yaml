# Google Agent Search's hosted MCP server (Discovery Engine, ex-Vertex AI
# Search) over federated Google Drive, Gmail and Calendar data stores: nothing
# is copied, all are searched live and every result is filtered to what the
# signed-in user can already open — their Drive permissions, their own mailbox
# and calendar. The engine lives in the Enterprise AI project
# (enterprise-ai-505512, number 611435061062) at location `global`, which is why
# the endpoint is the global host. Each user connects their own Google account on
# the Connectors page; core synthesises the token accessor from the `connector:`
# block, so no `external_auth:` is declared here.
#
# No licence is involved: the data store and Enterprise-tier engine live in the
# GCP project with only discoveryengine.googleapis.com enabled and are billed
# per query (10k/month free). Gemini Enterprise is the licensed end-user app on
# the same engine and is not needed for this connector. The engine's
# servingConfig is infrastructure, not intent, so it is fixed here under
# `tools.<name>.arguments` and the gateway writes it into every call — a model
# asked to supply it invents `projects/*`. `access_type=offline` is what makes
# Google issue a refresh token; without it every connection dies after an hour.
# Setup on the Google side: docs/CONFIGURED-CONNECTORS.md.
mcp_servers:
  google_workspace:
    type: external
    endpoint: https://discoveryengine.googleapis.com/mcp
    enabled: true
    tool_policy: allow
    display_in_web: false
    removable: true
    description: Google Workspace search — Drive documents, the user's own Gmail and Calendar — through Agent Search, live and filtered to what the signed-in user can already open
    connector:
      adapter: generic
      display_name: Google Workspace
      scopes:
      - openid
      - email
      - https://www.googleapis.com/auth/discoveryengine.readwrite
      authorization_origins:
      - https://accounts.google.com
      - https://oauth2.googleapis.com
      - https://openidconnect.googleapis.com
      authorization_params:
        access_type: offline
        prompt: consent
      identity: userinfo
      client_id_secret: google_drive_mcp_client_id
      client_secret: google_drive_mcp_client_secret
    # Why: the one thing a caller cannot know. Replace this resource name on
    # handover to another GCP project; nothing else carries it.
    tools:
      search:
        arguments:
          servingConfig: projects/611435061062/locations/global/collections/default_collection/engines/workspace-search/servingConfigs/default_search
      conversational_search:
        arguments:
          servingConfig: projects/611435061062/locations/global/collections/default_collection/engines/workspace-search/servingConfigs/default_search
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
