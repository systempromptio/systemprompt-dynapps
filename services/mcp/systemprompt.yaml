# Tools on this server are allowed by default in Claude Code and Claude
# Desktop (no per-call prompt); add `tool_policy: prompt|deny` under the
# deployment to change that. See docs/CONFIGURED-CONNECTORS.md.
mcp_servers:
  systemprompt:
    type: internal
    binary: systemprompt-mcp-agent
    package: systemprompt
    port: 5010
    enabled: true
    display_in_web: true
    removable: false
    description: Astound Digital MCP Server - Execute CLI commands (admin only)
    oauth:
      required: true
      scopes:
      - admin
      audience: mcp
      client_id: null
