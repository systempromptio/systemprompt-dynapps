mcp_servers:
  github:
    type: external
    binary: ''
    package: null
    port: 5044
    endpoint: https://api.githubcopilot.com/mcp/
    enabled: true
    display_in_web: false
    removable: true
    description: Github hosted MCP, authenticated as the signed-in user
    external_auth:
      token_endpoint: /api/public/connectors/github/token
      header: Authorization
      scheme: ""
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
