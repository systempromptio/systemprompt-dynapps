# GitHub's hosted MCP server. No plugin enables it: it exists for workflow
# write-backs, which act as a per-definition service account.
#
# The bearer comes from the credential broker. A service account presents the
# GitHub App installation an administrator attached at
# /admin/identity/service-accounts; the broker signs the App JWT, exchanges it
# for an installation token, and issues it only to a `workflow:<id>:write` or
# `farm:<id>` caller. A person would connect through the generic OAuth path
# once a `connector:` block is declared here; none is today.
#
# `tool_policy` is required on every managed server. See
# docs/CONFIGURED-CONNECTORS.md.
mcp_servers:
  github:
    type: external
    endpoint: https://api.githubcopilot.com/mcp/
    enabled: true
    tool_policy: prompt
    display_in_web: false
    removable: true
    description: GitHub hosted MCP; service accounts present a GitHub App installation token
    external_auth:
      token_endpoint: /api/public/connectors/github/token
      header: Authorization
      scheme: ""
    oauth:
      required: false
      scopes:
      - user
      audience: mcp
      client_id: null
