# The UK sales dashboard. It is a Cowork library artifact: the bridge stages it
# into the Astound workspace and `install_sales_artifacts` puts it in the
# library; nothing is rendered server-side. Every read runs from the page
# through window.cowork.callMcpTool against the user's OWN connected servers,
# so the list below must name every tool the page can call as
# mcp__<server>__<tool>; core validates each entry against a known server id,
# and the page itself also tries the plugin-prefixed spelling a plugin-installed
# server presents in Cowork (docs/tech-debt.md §2).
# The Salesforce names are the hosted sobject-all tool set as it presented
# itself through the gateway on 2026-09-18 (soqlQuery, getObjectSchema).
id: uk-client-report
name: UK Client Report
description: "Astound — UK Client Report. Client 360, account status, suggestions\
  \ and the pipeline and renewals review, read live from your own Salesforce,\
  \ Google Workspace and Atlassian connections. Nothing is stored; every figure\
  \ carries its currency and date."
version: 1.0.0
enabled: true
starred: true
category: business
tags:
- sales
- reporting
- crm
mcp_tools:
- mcp__salesforce-uk__soqlQuery
- mcp__salesforce-uk__getObjectSchema
- mcp__salesforce-us__soqlQuery
- mcp__salesforce-us__getObjectSchema
- mcp__salesforce-dev__soqlQuery
- mcp__salesforce-dev__getObjectSchema
- mcp__google_workspace__search
- mcp__atlassian__getAccessibleAtlassianResources
- mcp__atlassian__searchJiraIssuesUsingJql
file: view.html
