# Knowledge-bank configuration (REQ-046/047/048/052 — project-context Phase 0).
#
# Read directly by the knowledge-bank MCP binary, NOT through
# services/config/config.yaml — that aggregator's `includes:` list carries only
# resources the core ServicesConfig knows how to type, and this is a
# crate-owned file. Override the path with KNOWLEDGE_BANK_CONFIG. Every key is
# validated at load; an invalid file fails the binary's boot with the reason.
#
# No credential lives here, and there is no Atlassian service account at all.
# Confluence and Jira are read AS THE CALLER through their CONNECTED Atlassian
# account: `sync_knowledge` opens the hosted Atlassian MCP
# (services/mcp/atlassian.yaml) via this instance's own gateway route with the
# caller's bearer, core swaps in the token the caller banked on
# /admin/profile#connected-accounts, and every document that sync writes is
# granted to that user alone. Nothing goes in any .mcp.json. A caller whose
# account is not connected, or whose Atlassian is unreachable, still syncs the
# files categories and is told why the rest was skipped. Files categories
# (hand-authored meeting notes, ADRs, spec trees) are read from
# `files.root/<category>` on the server, need no credential, and are granted
# to the readers the category configures — everyone signed in by default.
# `add_knowledge_document` drops a file into a category's `uploads/` directory
# and indexes it at once.
#
# Model provider. `local` (shipped) is free, deterministic and in-process:
# feature-hashed n-gram embeddings, BM25 rerank, no chat model, no credential,
# so the server boots everywhere with real tools over real pgvector. `bedrock`
# is the production-grade swap-in. Swapping is configuration only:
#   1. set `model.provider: bedrock` below (the `bedrock:` block is complete);
#   2. `systemprompt admin config secret set bedrock_api_key <key>`;
#   3. restart, then have every user run `sync_knowledge {rebuild: true}` —
#      the embedding cache is keyed by model id, so nothing is reused across
#      the swap and the index must be re-embedded.
# Both providers produce 1024-wide vectors, which the schema's vector(1024)
# column requires; any other width is refused at load.
#
# From the profile secret store:
#   bedrock_api_key         — Bedrock long-term API key (bearer, not sig-v4).
#                             Read only when model.provider is bedrock; ignored
#                             by local.
#   knowledge_database_url  — the dedicated pgvector Postgres holding the index.
#                             Optional: when absent the instance database is used,
#                             and it must have pgvector. Boot fails without it.
#
# Values mirror the Node "project-context" config this crate is a migration of,
# so a ported corpus behaves identically.

model:
  provider: local
  local:
    embed_model: local.hashed-ngram-v1
    embed_dim: 1024
    # Adjacent word pairs are hashed beside single words; 1 is bag-of-words.
    ngram: 2
  bedrock:
    # eu-central-1 is not a preference. It is the only EU region that carries a
    # rerank model at all (eu-west-1 has none), and these calls bypass the AI
    # gateway, so the REQ-037 residency mechanism never sees them. A non-EU
    # region is refused at load when this provider is active.
    region: eu-central-1
    embed_model: amazon.titan-embed-text-v2:0
    embed_dim: 1024
    chunk_model: openai.gpt-oss-120b-1:0
    rerank_model: cohere.rerank-v3-5:0
    embed_concurrency: 16
    max_concurrency: 8

chunking:
  target_chars: 1600
  max_chars: 3000
  min_chars: 300
  split_tolerance: 100
  # Contextual enrichment (script strategy only): one or two factual sentences
  # prepended to each chunk. Line pointers stay on the original text.
  enrich: true

retrieval:
  top_k: 5
  candidate_multiplier: 4
  rerank_enabled: true

dates:
  # frontmatter -> LLM (first 2000 chars) -> mtime. The LLM result is frozen
  # per content hash, so an unchanged document never re-asks.
  extract_via_llm: true

# Ingestion runs INSIDE the knowledge-bank process, only when a user calls
# `sync_knowledge` or `add_knowledge_document`. There is no schedule and no
# CLI: each user's sync is their own, and the index is the union of what its
# users could read plus the shared files categories.
ingestion:
  doc_concurrency: 6

# Where files categories live unless a category sets its own `path`. In the
# container this is the `app_knowledge` volume mounted at /app/storage/knowledge.
files:
  root: storage/knowledge

# Which profile secret names the index database. Absent secret = the instance
# database pool (local development, compose, CI — all pgvector images).
knowledge_database:
  secret: knowledge_database_url

atlassian:
  # The site every citation points at. Reads go through each caller's
  # connected account; when that account reaches more than one Atlassian
  # site, `cloud_id` names the one to index (the site's cloud id, shown by
  # getAccessibleAtlassianResources). With one reachable site it is inferred.
  base_url: https://astounddigital.atlassian.net
  include_comments: true

# Source categories. `kind` says where documents come from (files | confluence
# | jira), `strategy` how they are chunked (llm | script | none). An Atlassian
# document is granted to every user who synced it — exactly the users whose
# Atlassian account can read it. A files document is granted to the category's
# `grants:` (kind + value from the subject vocabulary: user, role, adfs_group),
# `role: user` — everyone signed in — when omitted. `include`/`exclude` are
# globs relative to the category directory. `archived: true` makes a category
# opt-in: it is searched only when the caller names it.
# The three project_* / client_* categories point at fixtures shipped in the
# image (services/knowledge-bank/fixtures/): a fictional Astound Digital
# engagement — FSDs, runbooks, schema, conventions, two sprints of tickets and
# five client briefs — so a fresh install has something to search before any
# Atlassian sync. Replace or delete them for a customer deployment.
sources:
  project_docs:
    kind: files
    strategy: script
    description: Project documentation - functional specs, runbooks, Salesforce schema, storefront conventions and BA writing standards
    path: services/knowledge-bank/fixtures/project_docs
    include: ["**/*.md"]
  project_tickets:
    kind: files
    strategy: script
    description: Project tickets - stories, bugs and epics across the current and previous sprint, with status and comments
    path: services/knowledge-bank/fixtures/project_tickets
    include: ["**/*.md"]
  client_accounts:
    kind: files
    strategy: script
    description: Client account briefs - industry, platforms, contacts, engagement scope, open opportunities and risks
    path: services/knowledge-bank/fixtures/client_accounts
    include: ["**/*.md"]
  meeting_notes:
    kind: files
    strategy: llm
    description: Hand-authored workshop, discovery and tech-call transcripts and notes (md, txt, pdf, docx) - provisional, not signed off
    include: ["**/*.md", "**/*.txt", "**/*.pdf", "**/*.docx"]
  adrs:
    kind: files
    strategy: script
    description: Architecture Decision Records - the durable record of why
    include: ["**/*.md"]
  specs:
    kind: files
    strategy: script
    description: Current OpenSpec capability specs (current behaviour)
    include: ["**/spec.md"]
  openspec_archive:
    kind: files
    strategy: script
    archived: true
    description: Archived (completed) OpenSpec changes - historical proposal and design rationale, never current scope or status
    include: ["**/proposal.md", "**/design.md", "**/technical-design.md"]
    grants: [{kind: role, value: user}]
  confluence:
    kind: confluence
    strategy: script
    description: Confluence pages you can read in the configured spaces - current pages and footer comments
    spaces: [EAICOMM]
  jira:
    kind: jira
    strategy: none
    description: Jira issues you can read in the configured projects, with status and comments
    projects: [EAICOMM]
    jql: ""
