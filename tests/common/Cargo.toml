[package]
name = "dynapps-test-common"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Why: the throwaway database is built by the same `install_extension_schemas`
# path the server runs at boot, and that path only sees migrations from crates
# actually linked into the test binary. Linking them here is what makes one
# harness usable by every suite.
systemprompt = { workspace = true, features = ["full"] }
systemprompt-web-extension = { workspace = true }

sqlx = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# SSO and 1Password fakes (src/sso, src/onepassword_fake*).
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
rand_core = { workspace = true }
rsa = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
