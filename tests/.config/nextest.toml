# Nextest configuration for the tests/ workspace.
#
# The DB-backed suites (mcp-integration-tests, admin-contract-tests) create
# and drop throwaway databases on the shared maintenance server; running them
# interleaved risks connection-pool exhaustion and cross-suite interference,
# so each is serialised into its own single-threaded group. Pure-logic unit
# crates keep full parallelism.

[test-groups.db-integration]
max-threads = 1

[test-groups.db-contract]
max-threads = 1

[[profile.default.overrides]]
filter = "package(mcp-integration-tests)"
test-group = "db-integration"

[[profile.default.overrides]]
filter = "package(web-integration-tests)"
test-group = "db-integration"

[[profile.default.overrides]]
filter = "package(admin-contract-tests)"
test-group = "db-contract"

# Each schema-upgrade rung restores a whole release schema in one transaction,
# holding a lock per relation. Beside another DB suite's transactions that
# exhausts Postgres's shared lock table ("out of shared memory"; the default
# max_locks_per_transaction is 64, and CI's service container cannot take -c
# flags), so the rungs share the db-integration lane and run alone.
[[profile.default.overrides]]
filter = "package(schema-upgrade-tests)"
test-group = "db-integration"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
failure-output = "immediate-final"

# `scripts/coverage.sh` runs the suite instrumented, which is several times
# slower; the contract suite's route sweep outlives the default 120s budget
# there. The test-group overrides are per profile, so they are repeated.
[profile.coverage]
slow-timeout = { period = "180s", terminate-after = 3 }
failure-output = "immediate-final"

[[profile.coverage.overrides]]
filter = "package(mcp-integration-tests)"
test-group = "db-integration"

[[profile.coverage.overrides]]
filter = "package(web-integration-tests)"
test-group = "db-integration"

[[profile.coverage.overrides]]
filter = "package(admin-contract-tests)"
test-group = "db-contract"

[[profile.coverage.overrides]]
filter = "package(schema-upgrade-tests)"
test-group = "db-schema-upgrade"
