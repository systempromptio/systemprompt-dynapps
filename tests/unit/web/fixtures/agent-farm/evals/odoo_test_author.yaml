schema: 1
agent: odoo_test_author
cases:
  - id: workflow_tests
    timeout_secs: 900
    assertions:
      - type: file_exists
        path: TEST_PLAN.md
      - type: regex
        path: TEST_PLAN.md
        pattern: "action_schedule"
      - type: regex
        path: TEST_PLAN.md
        pattern: "(?i)scheduled"
      - type: output_contains
        path: tests/__init__.py
        text: "from . import test_fleet_maintenance"
      - type: regex
        path: TEST_PLAN.md
        pattern: "tests/test_\\w+\\.py"
      - type: no_tool_outside_allowlist
      - type: max_turns
        value: 40
      - type: max_cost_usd
        value: 2.0
    judge_rubric: |
      Score 0-100 the test plan and the tests written. The existing suite only
      tests creation. Uncovered behaviours (ground truth): draft -> scheduled
      transition in action_schedule (models/fleet_maintenance.py:53); the
      UserError when scheduling a non-draft order; the UserError when the
      vehicle already has a scheduled order (search at line 57); action_done
      moving scheduled -> done and setting done_date; action_reset_draft;
      is_overdue compute; maintenance_cost_total on fleet.vehicle. 10 points
      per behaviour covered by a real TransactionCase test with meaningful
      assertions (max 70); 15 points for a coverage table citing file:line;
      15 points for correct Odoo test idioms (tagged post_install,
      assertRaises(UserError), setUpClass data). Subtract 20 if non-test code
      was modified.
    judge_threshold: 70
  - id: skill_used
    timeout_secs: 900
    assertions:
      - type: skill_invoked
        skill: odoo_test_plan
      - type: file_exists
        path: TEST_PLAN.md
      - type: no_tool_outside_allowlist
