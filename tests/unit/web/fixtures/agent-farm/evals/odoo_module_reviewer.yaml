schema: 1
agent: odoo_module_reviewer
cases:
  - id: full_review
    timeout_secs: 900
    assertions:
      - type: file_exists
        path: REVIEW.md
      - type: output_contains
        path: REVIEW.md
        text: "sudo("
      - type: output_contains
        path: REVIEW.md
        text: "@api.depends"
      - type: output_contains
        path: REVIEW.md
        text: "ir.model.access"
      - type: regex
        path: REVIEW.md
        pattern: "(?i)(N\\+1|inside (the|a) loop|search\\(\\) in a loop|per[- ]record)"
      - type: regex
        path: REVIEW.md
        pattern: "(?i)(sql injection|cr\\.execute|parameteri[sz]ed)"
      - type: regex
        path: REVIEW.md
        pattern: "(?i)license"
      - type: regex
        path: REVIEW.md
        pattern: "fleet_maintenance\\.py:\\d+"
      - type: no_tool_outside_allowlist
      - type: max_turns
        value: 40
      - type: max_cost_usd
        value: 2.0
    judge_rubric: |
      Score 0-100 how completely and accurately REVIEW.md reports the defects
      planted in the module. Ground truth (10 points each):
      1. __manifest__.py has no 'license' key.
      2. models/fleet_maintenance.py:49 sudo() inside the _onchange_vehicle_id onchange.
      3. models/fleet_maintenance.py:57 search() inside the loop in action_schedule (N+1).
      4. models/fleet_maintenance.py:32 _compute_line_count has no @api.depends.
      5. models/fleet_maintenance.py:83-85 cost_report builds SQL with % formatting and passes it to cr.execute (SQL injection).
      6. models/fleet_vehicle.py:15 stored compute depends only on maintenance_ids but reads state and cost.
      7. security/ir.model.access.csv:2 base.group_user has unlink (and write/create) permission.
      8. views XML uses attrs= / states= which break in Odoo 17.
      9. tests do not cover the draft -> scheduled -> done workflow.
      10. message_post_with_template at fleet_maintenance.py:69 is removed in Odoo 17.
      Award a point's full value only if the finding cites the right file (line
      within +/-3) and proposes a correct fix. Subtract 5 per fabricated finding
      that is not in the code. Line numbers that are off by more than 3 earn half.
    judge_threshold: 70
  - id: security_focus
    prompt: "The customer's security officer asked for this review: rank security findings first and give each a CVSS-style severity."
    timeout_secs: 900
    assertions:
      - type: file_exists
        path: REVIEW.md
      - type: output_contains
        path: REVIEW.md
        text: "sudo("
      - type: output_contains
        path: REVIEW.md
        text: "ir.model.access"
      - type: regex
        path: REVIEW.md
        pattern: "(?i)sql injection"
      - type: regex
        path: REVIEW.md
        pattern: "(?i)(critical|high)"
      - type: no_tool_outside_allowlist
      - type: max_turns
        value: 40
      - type: max_cost_usd
        value: 2.0
    judge_rubric: |
      Score 0-100. The review must put security findings first. The three
      planted security defects are: SQL injection via % formatting into
      self.env.cr.execute in cost_report (models/fleet_maintenance.py:83-85,
      expected Critical/High), sudo() inside an onchange
      (models/fleet_maintenance.py:49, Medium/High), and base.group_user with
      unlink/write/create on dynapps.fleet.maintenance
      (security/ir.model.access.csv:2, Medium/High). 25 points each for being
      found with a correct file:line and a concrete fix; 25 points for ordering
      (security first, SQL injection ranked highest) and sensible severities.
      Subtract 10 for any fabricated security issue.
    judge_threshold: 70
  - id: skill_used
    timeout_secs: 900
    assertions:
      - type: skill_invoked
        skill: odoo_module_review
      - type: file_exists
        path: REVIEW.md
      - type: no_tool_outside_allowlist
