gateway:
  enabled: false
  # Two routes so the per-user catalog and the after-the-fact ACL detector
  # have something to iterate: with an empty list both loops run zero times
  # and every case against them passes vacuously. `claude-*` is the wildcard
  # the detector matches recorded requests against; the second route proves
  # a rule on one does not silently apply to the other.
  routes:
  - id: contract-claude
    models:
    - claude-*
    deployments:
    - anthropic/api
  - id: contract-gpt
    models:
    - gpt-*
    deployments:
    - anthropic/api
  auth_scheme: bearer
  inference_path_prefix: /v1
