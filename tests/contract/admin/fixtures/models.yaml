# `gpt-contract-model` gives the `contract-gpt` route a model to match.
# The checked-in services/evaluation criteria name the two 5-5 models; the
# loader refuses a criterion whose model the catalog does not list, so the
# evaluation page and its triggers 500 without them.
models:
  claude-contract-model:
    upstream_model: claude-contract-model
    pricing:
      input_per_million: 1.0
      output_per_million: 1.0
      cache_read_per_million: 0.1
      cache_write_per_million: 1.0
      per_image_cents: null
    clients:
    - claude
  claude-sonnet-5-5:
    upstream_model: claude-sonnet-5-5
    capabilities:
      structured_output: true
    pricing:
      input_per_million: 1.0
      output_per_million: 1.0
      cache_read_per_million: 0.1
      cache_write_per_million: 1.0
      per_image_cents: null
    clients:
    - claude
  claude-opus-5-5:
    upstream_model: claude-opus-5-5
    capabilities:
      structured_output: true
    pricing:
      input_per_million: 1.0
      output_per_million: 1.0
      cache_read_per_million: 0.1
      cache_write_per_million: 1.0
      per_image_cents: null
    clients:
    - claude
  gpt-contract-model:
    upstream_model: gpt-contract-model
    pricing:
      input_per_million: 1.0
      output_per_million: 1.0
      cache_read_per_million: 0.1
      cache_write_per_million: 1.0
      per_image_cents: null
    clients:
    - claude
