# Test workspace for the Enterprise Demo template.
#
# Kept as a SEPARATE workspace (the root [workspace] lists it under `exclude`)
# so these test crates never compile when the extension crates are consumed as
# dependencies, mirroring systemprompt-core's crates/tests layout.
#
# Run:  cargo test --manifest-path tests/Cargo.toml
# Needs a live Postgres for the integration crate — set DATABASE_URL (the
# root justfile's local profile URL works).
[workspace]
members = [
    "common",
    "unit/mcp",
    "unit/web",
    "unit/bridge",
    "integration/admin-config",
    "integration/mcp",
    "integration/web",
    "integration/admin-core",
    "integration/gateway",
    "integration/schema-upgrade",
    "contract/admin",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

# Test code asserts by panicking and constructs fixtures liberally; relax the
# strict production lints the root workspace enforces. This is an intentional
# partial mirror of the root Cargo.toml [workspace.lints.clippy] block: only
# the relaxations below differ.
[workspace.lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
# The shared test harness: one throwaway-database implementation, one skip
# policy. Every DB-backed crate below depends on it.
astound-test-common = { path = "common" }

# Local extension crates under test (paths relative to tests/).
systemprompt-mcp-shared = { path = "../extensions/mcp/shared" }
systemprompt-mcp-agent = { path = "../extensions/mcp/systemprompt" }
systemprompt-web-shared = { path = "../extensions/web/shared" }
systemprompt-web-admin = { path = "../extensions/web/admin", features = ["governance-ssr"] }
systemprompt-web-content = { path = "../extensions/web/content" }
systemprompt-web-jobs = { path = "../extensions/web/jobs" }
systemprompt-web-extension = { path = "../extensions/web" }
systemprompt-web-site = { path = "../extensions/web/site" }

# Core facade — DbPool / Database / identifiers for the integration crate.
# The contract crate additionally enables `full`, which links the core
# extension crates whose `register_extension!` registrations carry the
# migrations the admin schema needs.
systemprompt = { version = "0.57.0", default-features = false, features = ["core", "database"] }
systemprompt-security = { version = "0.57.0" }
systemprompt-api = { version = "0.57.0" }

# HTTP contract harness — drives the real admin router in-process.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

# Template-rendering and error plumbing the migrated admin/front-end gates use.
handlebars = "6"
anyhow = "1.0"
http-body-util = "0.1"

# `test-util` gives `#[tokio::test(start_paused = true)]`, so a client that
# backs off between retries is exercised without paying its backoff in wall
# clock.
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "test-util"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
url = "2.5"
# Alias serde_yaml_ng exactly as the root workspace does: core's APIs expose
# serde_yaml_ng::Value, and a plain serde_yaml dep would be a distinct type
# that never unifies with it.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# Builds the DOCX fixture the knowledge-bank parser tests feed in.
zip = { version = "8", default-features = false, features = ["deflate"] }
# HTTP fixtures for the outbound clients (Atlassian, Bedrock), mirroring the
# `MockServer` + `with_endpoint` pattern core uses for its provider drivers.
wiremock = "0.6"
# Pinned to the exact version the root workspace pins, so the `ServerHandler`
# trait the tests bring into scope is the one the MCP crates implement.
rmcp = { version = "=3.3.0", features = ["server"] }
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.22"
# Pinned to what `extensions/web/admin` uses for the share-token HMAC, so the
# contract suite's expired-token forgery signs with the same primitive.
sha2 = "0.10"
# Pinned to the version core signs with, so the tokens this suite mints for the
# hook audiences validate against core's own decoder.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# Optimise everything that is not a test crate.
#
# The suite is crypto-bound, not compile-bound: every contract test mints
# RS256 admin JWTs (tests/contract/admin/src/principal.rs) and validates one
# per request, and at `opt-level = 0` an RSA-2048 operation is ~10x its
# optimised cost — that, not the request count, was the contract tier's
# ~590 s. `"*"` covers the `systemprompt-*` crates too — they are path or
# registry dependencies, not members — so production code under test is
# optimised while the test bodies themselves stay unoptimised and quick to
# rebuild. Mirrors systemprompt-core's crates/tests/Cargo.toml.
[profile.dev.package."*"]
opt-level = 2
