[graph]
targets = []

[advisories]
# Transitive unmaintained crates (GTK3 bindings, ttf-parser under the bridge
# GUI stack) are upstream's to replace; only direct dependencies error.
unmaintained = "workspace"
ignore = [
    # rsa crate Marvin Attack - no patch available yet, used transitively by oauth2/webauthn-rs
    # Tracked at: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5.5 timing variation, reached only through jsonwebtoken's
    # rust_crypto backend (p256/p384 0.13); the fix needs elliptic-curve 0.14
    # and jsonwebtoken pins the 0.13 line. Only ES256/ES384 keys run that
    # arithmetic, and neither core nor this install builds one: keys are RSA
    # or HMAC and every verifier pins RS256/HS256. Same reasoning as core's
    # deny.toml. Drop when jsonwebtoken moves to elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]

[licenses]
# Workspace members are unpublished (publish = false) client code, not
# licensed artifacts; only third-party licenses are checked.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BUSL-1.1",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # Data-only license on Unicode character tables (finl_unicode, transitive)
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
