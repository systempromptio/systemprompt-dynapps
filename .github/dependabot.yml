# Action pins are full commit SHAs with a version comment; Dependabot moves
# both together. Grouped so a week's bumps land as one PR onto next, where the
# gates prove them like any other push. Shared byte-for-byte with the sibling
# downstream repo (scripts/ci-sync-check.sh).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/core-checkout
      - /.github/actions/apple-signing
    target-branch: next
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
