name: Import Apple signing credentials
description: Fail closed, import Developer ID into an ephemeral keychain, and validate notary credentials.
inputs:
  certificate:
    required: true
    description: Base64 PKCS12 certificate and private key
  certificate_password:
    required: true
    description: PKCS12 password
  identity:
    required: true
    description: Developer ID Application identity
  notary_key:
    required: true
    description: Base64 App Store Connect private key
  notary_key_id:
    required: true
    description: App Store Connect key ID
  notary_issuer:
    required: true
    description: App Store Connect issuer UUID
  keychain_password:
    required: true
    description: Ephemeral keychain password
runs:
  using: composite
  steps:
    - name: Import and validate Apple credentials
      shell: bash
      env:
        APPLE_CERT_P12_BASE64: ${{ inputs.certificate }}
        APPLE_CERT_PASSWORD: ${{ inputs.certificate_password }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.identity }}
        APPLE_API_KEY_P8_BASE64: ${{ inputs.notary_key }}
        APPLE_API_KEY_ID: ${{ inputs.notary_key_id }}
        APPLE_API_ISSUER_ID: ${{ inputs.notary_issuer }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain_password }}
      run: |
        set +x
        set -euo pipefail
        umask 077
        for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_SIGNING_IDENTITY \
                    APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID KEYCHAIN_PASSWORD; do
          [ -n "${!name}" ] || { echo "::error::Missing $name; refusing an unsigned macOS release."; exit 1; }
        done
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        printf %s "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
          -f pkcs12 -T /usr/bin/codesign
        rm -f "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN"
        security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY"
        printf %s "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
        xcrun notarytool history --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" \
          --issuer "$APPLE_API_ISSUER_ID" --output-format json >/dev/null
        {
          echo "CODESIGN_IDENTITY=$APPLE_SIGNING_IDENTITY"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
          echo "NOTARY_ISSUER=$APPLE_API_ISSUER_ID"
        } >> "$GITHUB_ENV"
