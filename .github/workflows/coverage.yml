name: Coverage

# The coverage floor and ratchet (scripts/coverage-check.sh against the tracked
# coverage/baseline.json). A measurement, not a gate: it runs on the released
# line, nightly on `next`, and on demand; a trip is a signal to raise tests on
# `next`, not a block.
#
# Shared byte-for-byte with the sibling downstream repo; brand values come
# from .github/ci-params.env and scripts/ci-sync-check.sh proves the rest.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to measure. Defaults to the triggering ref."
        type: string
        required: false
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

concurrency:
  # Scheduled workflows are created from the default branch. Explicitly make
  # that run measure `next`, as promised above, instead of silently measuring
  # `main` again after the release has already landed.
  group: coverage-${{ inputs.ref || (github.event_name == 'schedule' && 'next') || github.ref }}
  # Why: the main and nightly runs are the published number and the erosion
  # signal; a later trigger queues behind them instead of cancelling a
  # two-hour build. Only an on-demand run supersedes its predecessor.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  SQLX_OFFLINE: "true"
  CC: clang
  CXX: clang++
  BUILD_NO_COORD: "1"
  JUST_VERSION: "1.42.4"
  NEXTEST_VERSION: "0.9.148"
  # Why /mnt: the instrumented trees outgrow the root disk; the runner's
  # second disk is where core's coverage job builds for the same reason.
  # scripts/coverage.sh appends -root, -tests and -bridge.
  COVERAGE_TARGET_DIR: /mnt/coverage-target

permissions:
  contents: read

jobs:
  build:
    # One leg per scripts/coverage.sh build phase, each on its own runner. The
    # three workspaces compile the shared dependency graph under different
    # feature sets and share no build output, so running them side by side
    # costs nothing and bounds the run by the slowest leg. The root leg builds
    # instrumented lib-test binaries that run no tests but whose objects carry
    # the root crates' coverage maps into the report.
    name: Coverage build (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: root
            phases: root
          - part: tests
            phases: tests
          - part: bridge
            phases: bridge
    # Nothing instrumented is cached (see the rust-cache step), so every run
    # is a cold build.
    timeout-minutes: 80
    env:
      CARGO_INCREMENTAL: "0"
      # Why: instrumenting every crate inflates each object, and linking them
      # can exhaust the runner's memory (a bare exit 143). Coverage does
      # not need DWARF: the line mapping comes from the instrumentation's own
      # coverage section.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Four instrumented binaries linking at once exceed the runner's memory
      # even without debug info.
      COVERAGE_BUILD_JOBS: "2"
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'next') || github.sha }}
      - uses: ./.github/actions/free-disk
        with:
          swap-gb: "16"
          mnt-dirs: /mnt/coverage-target-root /mnt/coverage-target-tests /mnt/coverage-target-bridge /mnt/coverage-target-pack
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      # libdbus: the bridge workspace pulls keyring -> dbus-secret-service.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3 libdbus-1-dev zstd
      - run: rustup show
      # scripts/coverage.sh calls llvm-profdata and llvm-cov out of the
      # toolchain's own sysroot rather than installing cargo-llvm-cov, which
      # re-injects the mold linker flags and produces zero profraws.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # Registry and git checkouts only. The instrumented trees would take
      # several GB of the repository's 10 GB cache and evict the Gates caches.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage-${{ matrix.part }}
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'workflow_dispatch' }}
      # Why `timeout` inside the step: a step that runs out of time and one
      # whose tests failed both read "failure"; the wrapper's exit 124 is
      # annotated as a timeout, so it is never mistaken for a floor trip (that
      # one is titled by scripts/coverage-check.sh). The step timeout is the
      # backstop, and the job's leaves room for the pack and upload below.
      - name: Instrumented build and tests
        timeout-minutes: 65
        env:
          COVERAGE_PHASES: ${{ matrix.phases }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=60 60m just coverage
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error title=Coverage build timed out::the ${{ matrix.part }} leg did not finish in 60 min; this is a runner-time problem, not a coverage drop"
          fi
          exit "$status"
      # The instrumented executables and the raw profiles are the report's
      # whole input. tar keeps the exec bit, which the report's object scan
      # selects on and upload-artifact would drop.
      # Why the condition: a leg with a red test still built every object,
      # and the report job wants them for its partial number. The root leg
      # runs no tests, so it packs objects and no profiles; /mnt itself is
      # root-owned, so the pack goes in the directory the disk step handed to
      # the runner user.
      - name: Pack objects and profiles
        if: always() && !cancelled()
        timeout-minutes: 10
        env:
          PACK: /mnt/coverage-target-pack
        run: |
          set -euo pipefail
          {
            for t in "$COVERAGE_TARGET_DIR-root" "$COVERAGE_TARGET_DIR-tests" "$COVERAGE_TARGET_DIR-bridge"; do
              [ -d "$t/debug/deps" ] || continue
              find "$t/debug/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.d' ! -name '*.so' ! -name '*.rlib' ! -name '*.rmeta'
            done
            if [ -d "$GITHUB_WORKSPACE/coverage-report/profraw" ]; then
              find "$GITHUB_WORKSPACE/coverage-report/profraw" -name '*.profraw'
            fi
          } > "$PACK/list"
          echo "objects: $(grep -vc '\.profraw$' "$PACK/list" || true)  profiles: $(grep -c '\.profraw$' "$PACK/list" || true)"
          [ -s "$PACK/list" ] || { echo "::error::nothing to pack"; exit 1; }
          tar -cPf - -T "$PACK/list" | zstd -T0 -3 -o "$PACK/coverage-${{ matrix.part }}.tar.zst"
          ls -lh "$PACK/coverage-${{ matrix.part }}.tar.zst"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && !cancelled()
        with:
          name: coverage-${{ matrix.part }}
          path: /mnt/coverage-target-pack/coverage-${{ matrix.part }}.tar.zst
          retention-days: 1
          compression-level: 0
      # Memory and disk at the end, so a run that dies says which one it ran
      # out of.
      - if: always()
        run: free -h; swapon --show; df -h / /mnt

  coverage:
    name: Coverage (floor + ratchet)
    needs: build
    # Why always(): a build leg that failed (a red test, or a workspace that
    # did not compile) still uploads what it built, and a partial number is
    # still wanted; the last step keeps the job red in that case.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'next') || github.sha }}
      - uses: ./.github/actions/free-disk
        with:
          mnt-dirs: /mnt/coverage-in /mnt/coverage-target-root /mnt/coverage-target-tests /mnt/coverage-target-bridge
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd jq python3
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          path: /mnt/coverage-in
          merge-multiple: true
      # Absolute paths in the archives: the objects land where they were
      # built, and their coverage maps name sources at this same checkout path.
      - name: Unpack objects and profiles
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p coverage-report/profraw
          # A leg that failed before packing uploads nothing; report over
          # what arrived, and the last step keeps the job red.
          missing=""
          for part in root tests bridge; do
            if [ -f "/mnt/coverage-in/coverage-$part.tar.zst" ]; then
              zstd -dc "/mnt/coverage-in/coverage-$part.tar.zst" | tar -xPf -
            else
              echo "::error title=Coverage leg missing::no coverage-$part archive arrived"
              missing="$missing $part"
            fi
          done
          echo "COVERAGE_MISSING_LEGS=${missing# }" >> "$GITHUB_ENV"
          find coverage-report/profraw -name '*.profraw' | wc -l
      # `tee` so the totals survive into the summary below; `pipefail` keeps
      # the job red when the ratchet trips.
      #
      # Why the mkdir: the shell opens tee's output file before `just` runs,
      # and on a fresh checkout coverage-report/ does not exist yet; GNU tee
      # then copies to stdout and exits 1 at the end, failing a passing check.
      - timeout-minutes: 15
        env:
          COVERAGE_PHASES: report
        run: |
          set -o pipefail
          mkdir -p coverage-report
          just coverage-check | tee coverage-report/check.txt
      # Why: coverage/baseline.json is re-recorded from a CI measurement, so
      # the summary must outlive the runner even when the ratchet trips.
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-summary
          path: coverage-report/summary.json
          if-no-files-found: ignore
      # Why `always()`: the number is most wanted on the run that failed the
      # ratchet, which is exactly when a success-gated step would be skipped.
      - if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            cat coverage-report/check.txt 2>/dev/null || echo "no coverage produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a partial build
        if: always() && (needs.build.result != 'success' || env.COVERAGE_MISSING_LEGS != '')
        run: |
          echo "::error title=Coverage build incomplete::build result ${{ needs.build.result }}, missing legs: ${COVERAGE_MISSING_LEGS:-none}; the number above is partial"
          exit 1
