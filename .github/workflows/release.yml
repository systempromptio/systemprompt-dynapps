name: Release

# Every push to `main` publishes what a release of this repo ships. `main`
# only ever moves when `next` lands on it after a core release, so a push here
# IS the release — there is no separate tag step; this workflow creates the
# tag. See docs/RELEASING.md and docs/BRANCHING.md.
#
# Shared byte-for-byte with the sibling downstream repo; every brand value
# (image, asset prefix, product name) comes from .github/ci-params.env through
# the `params` job, and scripts/ci-sync-check.sh proves the rest. Below,
# <bridge> is CI_BRIDGE_PREFIX and <repo> is CI_REPO_NAME.
#
#   * the gateway image  CI_IMAGE
#       :X.Y.Z (create-once)  :latest  :sha-<short>   — amd64 + arm64, cosign-signed
#   * a GitHub Release vX.Y.Z (create-once) carrying
#       <bridge>-linux-{x86_64,aarch64}.tar.gz, <bridge>-macos.dmg,
#       <bridge>-macos.zip, <bridge>-windows.exe, their .sha256
#       sidecars, install.sh,
#       <repo>-server-<version>-linux-{amd64,arm64}.tar.gz,
#       SHA256SUMS, and a cosign keyless .sig/.pem per asset
#
# The server binaries are compiled natively per arch (the `server` job, with
# a warm cargo cache) and COPYed into a thin image; nothing compiles inside
# Docker. The bridge is built BEFORE the image on purpose: the image serves
# those binaries at /files/downloads (storage/files/downloads/ is gitignored
# and COPYed in), so the download artifacts are staged into the build context
# first. Asset names are version-less and load-bearing — they are referenced
# by the admin connect/bridge-setup pages, scripts/fetch-remote-downloads.sh,
# and the `assets:` map of the gateway's `bridge_releases` config
# (services/ai/gateway.yaml — the in-app self-updater).
# macOS publishes two artifacts from one stapled bundle: the .dmg humans
# download, and the .zip the updater installs. Only the .dmg is baked into the
# image; the updater's zip is a release asset the gateway feed proxies.
#
# Immutability: the vX.Y.Z tag, the Release and its assets, and the :X.Y.Z
# image tag are created once and never overwritten. A second push to main at
# the same version (the workspace version is pinned to core's, so this is the
# common case) rebuilds and moves only :latest and :sha-<short>.
#
# Signing: cosign keyless (Sigstore, GitHub OIDC) for every asset and the
# image. OS-native signing switches on by adding secrets and nothing else:
# Apple credentials are required: the app and DMG must both be notarized.
# Windows (WINDOWS_CERT_PFX_BASE64 …) Authenticode-signs the exe when present.
#
# Retries: registry logins, pushes, manifest edits and the core checkout run
# under scripts/ci-retry.sh or a second attempt that only runs when the first
# failed. The last attempt's failure fails the job; nothing is retried to hide
# a deterministic error.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing (no image push, no tag, no release)"
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: read
  pull-requests: read
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
  JUST_VERSION: "1.42.4"
  NEXTEST_VERSION: "0.9.148"

jobs:
  # The brand values every later job reads, from the one per-repo CI file.
  params:
    name: CI parameters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.p.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
      - run: bash scripts/ci-sync-check.sh
      - id: p
        run: |
          json=$(grep -v '^#' .github/ci-params.env | grep '=' \
            | jq -Rnc '[inputs | capture("^(?<key>[A-Z_]+)=(?<value>.*)$")] | from_entries')
          echo "json=$json" >> "$GITHUB_OUTPUT"
          jq . <<<"$json"

  hotfix-validation:
    name: Emergency hotfix validation before publication
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true' }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SQLX_OFFLINE: "true"
      BUILD_NO_COORD: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect isolated hotfix
        id: candidate
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == hotfix/* ]]; then
            echo "hotfix=true" >> "$GITHUB_OUTPUT"
          else
            ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA and .base.ref == "main")][0].head.ref // ""')
            if [[ "$ref" == hotfix/* ]]; then echo "hotfix=true" >> "$GITHUB_OUTPUT"; fi
          fi
      # Why: a hotfix PR whose exact Gates run passed is already proven; only one
      # merged before its gates ran (the Actions billing-outage path) is rebuilt here.
      - name: Use the hotfix PR's Gates proof when it exists
        id: proof
        if: steps.candidate.outputs.hotfix == 'true' && github.event_name == 'push'
        run: |
          set -euo pipefail
          read -r base head _ <<<"$(git show -s --format=%P "$GITHUB_SHA")"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == env.GITHUB_SHA and .base.ref == "main")][0].head.ref // ""')
          if [ -n "${head:-}" ] && bash scripts/check-hotfix-green.sh "$head" "$ref" "$base"; then
            echo "proven=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no green Gates proof for $ref; validating the merged tree here"
          fi
      - uses: ./.github/actions/core-checkout
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Install build and validation dependencies
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev python3 python3-yaml ripgrep jq gcc-mingw-w64-x86-64
      - run: rustup show
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
        with:
          workspaces: |
            .
            tests
          cache-on-failure: true
      - name: Validate the exact released hotfix tree
        if: steps.candidate.outputs.hotfix == 'true' && steps.proof.outputs.proven != 'true'
        # Why: a merge into main cannot restore next's caches, so clippy ×3 and test-hotfix run cold.
        timeout-minutes: 150
        run: |
          set -euo pipefail
          # Why not a bare `! grep`: a negated command never trips errexit, so
          # an active patch block passed this step.
          if grep -q '^\[patch.crates-io\]' Cargo.toml tests/Cargo.toml; then
            echo "::error::[patch.crates-io] is active on a hotfix release"; exit 1
          fi
          bash scripts/check-core-ref.sh
          bash tests/scripts/release-merge.sh
          just preflight-static
          just clippy
          just test-hotfix

  version:
    needs: [params, hotfix-validation]
    name: Resolve version & release state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      core_version: ${{ steps.v.outputs.core_version }}
      tag: ${{ steps.v.outputs.tag }}
      short: ${{ steps.v.outputs.short }}
      publish_release: ${{ steps.v.outputs.publish_release }}
      publish_version_tag: ${{ steps.v.outputs.publish_version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify merged promotion and exact release proofs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_VALIDATE_IN_RELEASE: ${{ needs.hotfix-validation.outputs.validated == 'true' && '1' || '0' }}
        run: bash scripts/check-release-merge.sh "$GITHUB_SHA"
      - name: Assert main builds against the published core
        run: |
          if grep -q '^\[patch\.crates-io\]' Cargo.toml || grep -q '^\[patch\.crates-io\]' tests/Cargo.toml; then
            echo "::error::[patch.crates-io] is active — main must build against the published core crates (docs/BRANCHING.md)."
            exit 1
          fi
          if grep -A2 '^name = "systemprompt"$' Cargo.lock | grep -q '^source = "registry'; then
            echo "Cargo.lock resolves systemprompt from crates.io"
          else
            echo "::error::Cargo.lock does not resolve systemprompt from crates.io — a path dependency leaked onto main."
            exit 1
          fi
          bash scripts/check-core-ref.sh
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - name: Read version and check every pin agrees
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)
          scripts/sync-release-version.sh "$version" --check
          scripts/sync-core-version.sh --check
          tag="v$version"
          short=$(git rev-parse --short=7 HEAD)

          publish_release=true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists — assets are immutable; only :latest and :sha-$short move."
            publish_release=false
          else
            tag_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag exists at $tag_sha but no release was cut from it, and main is now $GITHUB_SHA."
              echo "::error::Nothing consumed that tag: delete it (git push origin :refs/tags/$tag) and re-run, or bump the version."
              exit 1
            fi
          fi

          publish_version_tag=true
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "::notice::image $IMAGE:$version already exists — left untouched."
            publish_version_tag=false
          fi

          {
            echo "version=$version"
            echo "core_version=$(sed -n 's/^systemprompt = { version = "\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)"
            echo "tag=$tag"
            echo "short=$short"
            echo "publish_release=$publish_release"
            echo "publish_version_tag=$publish_version_tag"
          } >> "$GITHUB_OUTPUT"

  # The gates are not re-run here. `just release` refuses to fast-forward
  # `next` onto `main` without a green `Gates passed` on that exact SHA
  # (scripts/check-gates-green.sh), so the commit that lands is the tree the
  # gates proved.
  bridge:
    name: Bridge ${{ matrix.os_asset }}
    needs: [params, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ASSET: ${{ fromJSON(needs.params.outputs.json).CI_BRIDGE_PREFIX }}-${{ matrix.os_asset }}
      UPDATER_ASSET: ${{ matrix.updater_os_asset && format('{0}-{1}', fromJSON(needs.params.outputs.json).CI_BRIDGE_PREFIX, matrix.updater_os_asset) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: oldest runner glibc, so the tarball runs on the most
          # distributions. The packaging script derives the arch from uname.
          - runner: ubuntu-22.04
            os_asset: linux-x86_64.tar.gz
            script: scripts/package-bridge-linux.sh
          - runner: ubuntu-22.04-arm
            os_asset: linux-aarch64.tar.gz
            script: scripts/package-bridge-linux.sh
          # Windows is cross-built from Linux with cargo-xwin — the same path
          # `just bridge-package-windows` takes locally, so there is exactly one
          # Windows build definition and its two refuse-to-ship gates.
          - runner: ubuntu-22.04
            os_asset: windows.exe
            script: scripts/package-bridge-windows.sh
          - runner: macos-15
            os_asset: macos.dmg
            # What the in-app updater downloads; the dmg stays the human one.
            updater_os_asset: macos.zip
            script: scripts/package-bridge-macos.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/core-checkout

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm pkg-config libdbus-1-dev jq
      - run: rustup show
      - name: Add cross targets
        shell: bash
        run: |
          case "${{ matrix.os_asset }}" in
            windows*) rustup target add x86_64-pc-windows-msvc ;;
            macos*)   rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
          esac
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: startsWith(matrix.os_asset, 'windows')
        with:
          tool: cargo-xwin@0.23.1
      # The Windows SDK/CRT cargo-xwin fetches is ~300 MB; keep it between runs.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: startsWith(matrix.os_asset, 'windows')
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}

      # Cache dependencies, not workspace outputs. Every packaging script
      # still invokes Cargo. No core-ref hash in the key: rust-cache already
      # suffixes it with the bridge lockfile hash, which moves with every core
      # pin, and restores the newest entry under the stable prefix when that
      # suffix misses. A hashed key made each release's first build cold.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bridge
          key: bridge-${{ matrix.os_asset }}
          cache-workspace-crates: false
          cache-on-failure: true

      - name: Import Apple signing credentials
        if: runner.os == 'macOS' && needs.version.outputs.publish_release == 'true'
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          certificate_password: ${{ secrets.APPLE_CERT_PASSWORD }}
          identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          notary_key: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          notary_key_id: ${{ secrets.APPLE_API_KEY_ID }}
          notary_issuer: ${{ secrets.APPLE_API_ISSUER_ID }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Package
        if: needs.version.outputs.publish_release == 'true'
        shell: bash
        timeout-minutes: 75
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: bash ${{ matrix.script }}

      # Notarization produces different bytes on every build. At an existing
      # version, serve the immutable release download, not a fresh rebuild.
      - name: Reuse published downloads at an existing version
        if: needs.version.outputs.publish_release != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p storage/files/downloads
          # Releases before the updater zip existed do not carry it; its
          # pattern matches nothing there and only the dmg is re-served.
          patterns=(--pattern "$ASSET" --pattern "$ASSET.sha256" --pattern install.sh)
          [ -z "$UPDATER_ASSET" ] || patterns+=(--pattern "$UPDATER_ASSET" --pattern "$UPDATER_ASSET.sha256")
          bash scripts/ci-retry.sh 3 gh release download "$RELEASE_TAG" --clobber --dir storage/files/downloads "${patterns[@]}"
          cd storage/files/downloads
          for sums in *.sha256; do
            if command -v sha256sum >/dev/null; then
              sha256sum -c "$sums"
            else
              shasum -a 256 -c "$sums"
            fi
          done

      - name: Verify the staged macOS download
        if: runner.os == 'macOS'
        run: |
          dmg="storage/files/downloads/$ASSET"
          bash tests/release/macos-smoke.sh "$dmg" "$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          zip="storage/files/downloads/$UPDATER_ASSET"
          [ ! -f "$zip" ] || bash tests/release/macos-updater-zip.sh "$zip"

      - name: Tear down signing keychain
        if: always() && runner.os == 'macOS' && needs.version.outputs.publish_release == 'true'
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # ── Windows Authenticode: on only when the secrets exist ───────────────
      - name: Detect Windows signing credentials
        id: win
        if: startsWith(matrix.os_asset, 'windows') && needs.version.outputs.publish_release == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$WINDOWS_CERT_PFX_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing secrets are absent — publishing an UNSIGNED exe (SmartScreen will warn)."
          fi
      - name: Authenticode-sign the exe
        if: steps.win.outputs.enabled == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGN_NAME: ${{ fromJSON(needs.params.outputs.json).CI_BRIDGE_DISPLAY_NAME }}
          SIGN_URL: ${{ fromJSON(needs.params.outputs.json).CI_HOMEPAGE }}
        run: |
          sudo apt-get install -y --no-install-recommends osslsigncode
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          exe="storage/files/downloads/$ASSET"
          osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$WINDOWS_CERT_PASSWORD" \
            -n "$SIGN_NAME" -i "$SIGN_URL" \
            -t http://timestamp.digicert.com -h sha256 -in "$exe" -out "$exe.signed"
          rm -f "$RUNNER_TEMP/cert.pfx"
          mv "$exe.signed" "$exe"
          (cd storage/files/downloads && sha256sum "$ASSET" > "$ASSET.sha256")
          osslsigncode verify "$exe"

      - name: Record signing status
        shell: bash
        run: |
          status=signed-cosign-only
          case "${{ matrix.os_asset }}" in
            macos*)   status=notarized ;;
            windows*) [ "${{ steps.win.outputs.enabled }}" = "true" ] && status=authenticode ;;
          esac
          echo "$status" > "storage/files/downloads/$ASSET.signing"
          ls -la storage/files/downloads

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: downloads-${{ matrix.os_asset }}
          path: |
            storage/files/downloads/${{ env.ASSET }}
            storage/files/downloads/${{ env.ASSET }}.sha256
            storage/files/downloads/${{ env.ASSET }}.signing
            storage/files/downloads/*-macos.zip*
            storage/files/downloads/install.sh
          if-no-files-found: error
          retention-days: 7

  # The server binaries, compiled natively per arch with a warm cargo cache
  # rather than inside the image build, whose cache mount the gha cache
  # backend does not export. ubuntu-22.04
  # on purpose: glibc 2.35 is older than the bookworm runtime's 2.36, so the
  # binaries run there.
  server:
    name: Server (${{ matrix.arch }})
    needs: [params, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: "true"
      CC: clang
      CXX: clang++
      SERVER_BINS: ${{ fromJSON(needs.params.outputs.json).CI_SERVER_BINS }}
      SERVER_NAME: ${{ fromJSON(needs.params.outputs.json).CI_REPO_NAME }}-server-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libpq-dev libssl-dev pkg-config
      - run: rustup show
      # One entry per arch, written by main pushes (the only release trigger),
      # so the next release restores every dependency of this one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: server-${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every binary the runtime's manifests (extensions/mcp/*/manifest.yaml
      # and services/mcp/*.yaml) name must land in the image's /app/bin — the
      # MCP validator resolves binary -> manifest at boot and a missing one is
      # a startup failure.
      - name: Build
        timeout-minutes: 75
        run: |
          cargo build --release --workspace
          mkdir -p ".release-bin/${{ matrix.arch }}"
          for b in $SERVER_BINS; do
            cp "target/release/$b" ".release-bin/${{ matrix.arch }}/"
          done
          ls -la ".release-bin/${{ matrix.arch }}"
      # The image's input. tar keeps the exec bit, which upload-artifact drops.
      - name: Pack binaries for the image
        run: tar -cf "bin-${{ matrix.arch }}.tar" ".release-bin/${{ matrix.arch }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bin-${{ matrix.arch }}
          path: bin-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
      # The same binaries as a tarball for anyone running outside Docker.
      - name: Stage server tarball
        run: |
          name="$SERVER_NAME"
          mkdir -p "stage/$name/extensions/mcp"
          cp -r ".release-bin/${{ matrix.arch }}" "stage/$name/bin"
          cp -r services "stage/$name/services"
          for m in extensions/mcp/*/manifest.yaml; do
            d="stage/$name/$(dirname "$m")"; mkdir -p "$d"; cp "$m" "$d/"
          done
          cp docker/entrypoint.sh LICENSE* README.md "stage/$name/" 2>/dev/null || true
          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -czf "dist/$name.tar.gz" -C stage "$name"
          ls -la dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: server-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image (${{ matrix.arch }})
    needs: [params, version, bridge, server]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
      BRIDGE_PREFIX: ${{ fromJSON(needs.params.outputs.json).CI_BRIDGE_PREFIX }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bridge assets the image serves at /files/downloads. Every platform
      # must be present — a missing one 404s a link the admin page already
      # renders (the DOWNLOADS_STRICT=1 rule from scripts/fetch-remote-downloads.sh).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: downloads-*
          merge-multiple: true
          path: storage/files/downloads
      - name: Assert every download asset is staged
        run: |
          cd storage/files/downloads
          for f in "$BRIDGE_PREFIX-linux-x86_64.tar.gz" "$BRIDGE_PREFIX-linux-aarch64.tar.gz" \
                   "$BRIDGE_PREFIX-macos.dmg" "$BRIDGE_PREFIX-windows.exe" install.sh; do
            [ -s "$f" ] || { echo "::error::missing download asset $f"; exit 1; }
          done
          for f in *.sha256; do sha256sum -c "$f"; done
          rm -f ./*.signing "$BRIDGE_PREFIX-macos.zip" "$BRIDGE_PREFIX-macos.zip.sha256"
          ls -la
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bin-${{ matrix.arch }}
      - name: Stage the prebuilt server binaries
        run: |
          tar -xf "bin-${{ matrix.arch }}.tar"
          rm "bin-${{ matrix.arch }}.tar"
          ls -la ".release-bin/${{ matrix.arch }}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      # Why two attempts: a registry blip on the push failed whole releases.
      # The layers are in the gha cache by then, so the second attempt is a
      # push, not a rebuild; it runs only when the first failed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build1
        continue-on-error: true
        timeout-minutes: 30
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SYSTEMPROMPT_VERSION=${{ needs.version.outputs.version }}
            BIN_STAGE=prebuilt
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          # Why mode=min: max also exported every intermediate layer, about
          # 3.4 GB of the repository's 10 GB cache, which evicted the Gates
          # caches.
          cache-to: type=gha,mode=min,scope=release-${{ matrix.arch }}
          outputs: ${{ env.DRY_RUN == 'true' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build2
        if: steps.build1.outcome == 'failure'
        timeout-minutes: 30
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SYSTEMPROMPT_VERSION=${{ needs.version.outputs.version }}
            BIN_STAGE=prebuilt
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=release-${{ matrix.arch }}
          outputs: ${{ env.DRY_RUN == 'true' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}

      - name: Export digest
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.build1.outputs.digest || steps.build2.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::no image digest from either build attempt"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: env.DRY_RUN != 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The base services bundle: this repository's services/ tree packed and
  # signed the way a kit is, so a kit's CI can `services validate --base` it
  # and so the `base` row on /admin/sync shows the same content_hash. Runs
  # the just-built amd64 server binary from the staged tarball; nothing here
  # deploys anything.
  base-bundle:
    name: Base services bundle
    # Why: GHCR tags are create-once and this account cannot delete an org
    # package version, so the versioned base bundle waits for the image proofs.
    needs: [params, version, server, smoke, upgrade-boot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REPO_NAME: ${{ fromJSON(needs.params.outputs.json).CI_REPO_NAME }}
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
      GHCR_AUTH: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
      BUNDLE_SIGNING: ${{ fromJSON(needs.params.outputs.json).CI_BUNDLE_SIGNING }}
      # Each repo keeps its own secret name; params names it, so no secret moves.
      # A repo with signing disabled never reads the secret.
      BUNDLE_SIGNING_SEED: ${{ fromJSON(needs.params.outputs.json).CI_BUNDLE_SIGNING == 'required' && secrets[fromJSON(needs.params.outputs.json).CI_BUNDLE_SIGNING_SECRET_NAME] || '' }}
      SEED_SECRET_NAME: ${{ fromJSON(needs.params.outputs.json).CI_BUNDLE_SIGNING_SECRET_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: server-amd64
          path: server
      - name: Unpack the server binary
        run: |
          tar -xzf "server/$REPO_NAME-server-$VERSION-linux-amd64.tar.gz" -C server
          echo "$PWD/server/$REPO_NAME-server-$VERSION-linux-amd64/bin" >> "$GITHUB_PATH"
      - name: Pack and sign
        run: |
          mkdir -p dist
          sign=()
          # CI_BUNDLE_SIGNING=disabled packs unsigned by design. Under
          # `required` it fails closed: only a dispatched dry run (which
          # publishes nothing) may pack an unsigned bundle.
          if [ "$BUNDLE_SIGNING" = "disabled" ]; then
            echo "::notice::base-bundle signing is disabled for $REPO_NAME (CI_BUNDLE_SIGNING=disabled) — packing an unsigned bundle."
          elif [ "$BUNDLE_SIGNING" != "required" ]; then
            echo "::error::CI_BUNDLE_SIGNING must be required or disabled, got '$BUNDLE_SIGNING'."
            exit 1
          elif [ -n "$BUNDLE_SIGNING_SEED" ]; then
            sign=(--sign-key env:BUNDLE_SIGNING_SEED)
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run without $SEED_SECRET_NAME — packing an unsigned bundle that is never published."
          else
            echo "::error::secret $SEED_SECRET_NAME is empty or missing; refusing to publish an unsigned base bundle."
            exit 1
          fi
          systemprompt core services bundle \
            --root services --out "dist/$REPO_NAME-base-$VERSION.tar.gz" \
            --version "$VERSION" "${sign[@]}" \
            --source-repo "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
      - name: Publish to GHCR
        if: env.DRY_RUN != 'true'
        run: |
          bash scripts/ci-retry.sh 3 systemprompt core services publish \
            --bundle "dist/$REPO_NAME-base-$VERSION.tar.gz" \
            --to "oci://$IMAGE-base:$VERSION" \
            --auth env:GHCR_AUTH
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: base-bundle
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image-merge:
    name: Merge manifest, tag, sign
    needs: [params, version, image]
    if: needs.version.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - name: Create and push manifest list
        env:
          SHORT: ${{ needs.version.outputs.short }}
        run: |
          refs=()
          for d in "$RUNNER_TEMP"/digests/*; do refs+=("$IMAGE@sha256:$(basename "$d")"); done
          bash scripts/ci-retry.sh 3 docker buildx imagetools create -t "$IMAGE:sha-$SHORT" "${refs[@]}"
      - name: Resolve manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${{ needs.version.outputs.short }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Cosign sign (keyless)
        run: bash scripts/ci-retry.sh 3 cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"

  # Why: GHCR `:X.Y.Z` is create-once and this account cannot delete an org
  # package version, so the versioned tag (and `:latest`) may only point at a
  # digest that already passed smoke and upgrade-boot. A failed run leaves
  # nothing but its own `:sha-*`.
  promote-tags:
    name: Tag the proven image
    needs: [params, version, image-merge, smoke, upgrade-boot]
    if: needs.image-merge.result == 'success' && needs.smoke.result == 'success' && needs.upgrade-boot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - name: Point :latest and :X.Y.Z at the proven digest
        env:
          DIGEST: ${{ needs.image-merge.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_VERSION_TAG: ${{ needs.version.outputs.publish_version_tag }}
        run: |
          published=(latest)
          if [ "$PUBLISH_VERSION_TAG" = "true" ]; then
            published+=("$VERSION")
          fi
          args=()
          for t in "${published[@]}"; do args+=(-t "$IMAGE:$t"); done
          bash scripts/ci-retry.sh 3 docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for t in "${published[@]}"; do
            got=$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ "$got" = "$DIGEST" ] || { echo "::error::$IMAGE:$t is $got, expected $DIGEST"; exit 1; }
          done

  # The headless step runner image (`:X.Y.Z-runner`, `:latest-runner`): the
  # proven gateway image plus Node 22 and a pinned Claude Code, for the Helm
  # `runner` Deployment (`server.role: runner`). Built from the Dockerfile's
  # `runner` stage over the promoted digest, so it adds layers and never
  # recompiles. Only where CI_RUNNER_IMAGE is true (the Dockerfile has that
  # stage).
  runner-image:
    name: Runner image
    needs: [params, version, image-merge, promote-tags]
    if: needs.promote-tags.result == 'success' && fromJSON(needs.params.outputs.json).CI_RUNNER_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - name: Runner tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_VERSION_TAG: ${{ needs.version.outputs.publish_version_tag }}
        run: |
          tags="$IMAGE:latest-runner"
          if [ "$PUBLISH_VERSION_TAG" = "true" ]; then tags="$tags,$IMAGE:$VERSION-runner"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push1
        continue-on-error: true
        timeout-minutes: 20
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUNNER_BASE=${{ env.IMAGE }}@${{ needs.image-merge.outputs.digest }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.push1.outcome == 'failure'
        timeout-minutes: 20
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUNNER_BASE=${{ env.IMAGE }}@${{ needs.image-merge.outputs.digest }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
      - name: Assert the agent host is on the image
        run: docker run --rm --entrypoint claude "$IMAGE:latest-runner" --version

  release:
    name: Publish GitHub Release
    needs: [params, version, bridge, server, image, image-merge, smoke, upgrade-boot, base-bundle, promote-tags]
    if: needs.version.outputs.publish_release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
      B: ${{ fromJSON(needs.params.outputs.json).CI_BRIDGE_PREFIX }}
      REPO_NAME: ${{ fromJSON(needs.params.outputs.json).CI_REPO_NAME }}
      PRODUCT_NAME: ${{ fromJSON(needs.params.outputs.json).CI_PRODUCT_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: downloads-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: server-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: base-bundle
          path: dist

      # The gateway-served install.sh (baked into the image) keeps its default
      # base; the release copy points at this release so the piped one-liner
      # from the release page fetches exactly these assets.
      - name: Render release installer
        run: |
          sed "s|@DOWNLOAD_BASE@|https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}|" \
            scripts/install-bridge.sh > dist/install.sh
          chmod 0755 dist/install.sh
          grep -q "releases/download/${TAG}" dist/install.sh

      - name: Checksums
        working-directory: dist
        run: |
          # The per-asset .sha256 sidecars stay: install.sh fetches <base>/<asset>.sha256.
          # The gateway's update feed reads the updater zip's digest from here.
          sha256sum "$B-linux-x86_64.tar.gz" "$B-linux-aarch64.tar.gz" \
            "$B-macos.dmg" "$B-macos.zip" "$B-windows.exe" \
            "$REPO_NAME"-server-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign every asset (cosign keyless)
        working-directory: dist
        run: |
          for f in "$B-linux-x86_64.tar.gz" "$B-linux-aarch64.tar.gz" \
                   "$B-macos.dmg" "$B-macos.zip" "$B-windows.exe" \
                   "$REPO_NAME"-server-*.tar.gz install.sh SHA256SUMS; do
            bash ../scripts/ci-retry.sh 3 cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: Write release notes
        run: |
          bridge_version=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' bridge/Cargo.toml | head -1)
          # The bridge shows this number in its footer and reports it to the
          # gateway; a release whose bridge disagrees with its tag is a defect.
          if [ "$bridge_version" != "$VERSION" ]; then
            echo "::error::bridge/Cargo.toml is $bridge_version but the release is $VERSION (run scripts/sync-release-version.sh $VERSION)"
            exit 1
          fi
          mac=$(cat "dist/$B-macos.dmg.signing")
          win=$(cat "dist/$B-windows.exe.signing")
          rm -f dist/*.signing
          {
            echo "## $PRODUCT_NAME $TAG"
            echo
            core=$(sed -n 's/^systemprompt = { version = "\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
            echo "Built against published \`systemprompt\` core **$core** (crates.io); the bridge carries the release version."
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "# manifest digest: ${{ needs.image-merge.outputs.digest }}"
            echo '```'
            echo
            echo "Multi-arch (amd64 + arm64), cosign-signed. Install: docs/install/docker.md."
            echo
            echo "### Bridge"
            echo
            echo "| asset | platform | OS signing |"
            echo "|---|---|---|"
            echo "| $B-linux-x86_64.tar.gz | Linux x86_64 (glibc ≥ 2.35) | n/a |"
            echo "| $B-linux-aarch64.tar.gz | Linux aarch64 | n/a |"
            echo "| $B-macos.dmg | macOS universal (Apple Silicon + Intel) | $mac |"
            echo "| $B-macos.zip | macOS in-app updater (same bundle as the dmg) | $mac |"
            echo "| $B-windows.exe | Windows x86_64 | $win |"
            echo
            if [ "$mac" != "notarized" ]; then
              echo "**macOS is not notarized**: Gatekeeper will block the first open. Right-click → Open, or \`xattr -d com.apple.quarantine\` the app."
            fi
            if [ "$win" != "authenticode" ]; then
              echo "**Windows is not Authenticode-signed**: choose *More info → Run anyway* at the SmartScreen prompt."
            fi
            echo
            echo "Linux one-liner from this release (needs a GitHub token on a private repo; from a running gateway use \`<gateway>/files/downloads/install.sh\`):"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh -s -- --code <code>"
            echo '```'
            echo
            echo "### Verify (cosign keyless)"
            echo
            echo '```'
            echo "cosign verify-blob \\"
            echo "  --certificate-identity-regexp='https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\"
            echo "  --signature SHA256SUMS.sig --certificate SHA256SUMS.pem SHA256SUMS"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > notes.md
          cat notes.md

      # Create-once. The tag is created here from the merge commit; assets are
      # never re-uploaded over an existing release.
      - name: Create release
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
            dist/"$B"-* dist/"$REPO_NAME"-server-* dist/"$REPO_NAME"-base-* \
            dist/install.sh dist/install.sh.sig dist/install.sh.pem \
            dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem

  upgrade-boot:
    name: Boot the image over every seeded release
    needs: [params, version, image-merge]
    if: needs.image-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
      RELEASE_GATE_EMAIL: ${{ fromJSON(needs.params.outputs.json).CI_RELEASE_GATE_EMAIL }}
    # Upgrade faults (stale triggers, a retirement split across extensions,
    # trigger toggles, retries, a root-owned /app/storage/data) only surface
    # together on this path: the published image, its entrypoint, an older
    # release's database with rows in it, and a fresh named volume.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - name: Upgrade and boot from every rung
        timeout-minutes: 40
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-${{ needs.version.outputs.short }}"
          bash scripts/ci-retry.sh 3 docker pull "$ref"
          for fixture in tests/fixtures/schema/release-baseline-*.sql; do
            rung=$(basename "$fixture" .sql); rung=${rung#release-baseline-}
            db="upgrade_${rung//./_}"
            echo "::group::$rung"
            psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            grep -v '^\\' "$fixture" | grep -v "set_config('search_path'" \
              | psql -q -h localhost -U test -d "$db" -v ON_ERROR_STOP=1 > /dev/null
            psql -q -h localhost -U test -d "$db" -v ON_ERROR_STOP=1 \
              -f tests/integration/schema-upgrade/src/seed_hot_tables.sql
            vol="storage_data_${db}"
            docker volume create "$vol" > /dev/null
            docker run -d --name "boot_$db" --network host \
              -e ANTHROPIC_API_KEY=sk-ant-release-gate \
              -e ENTRA_OIDC_CLIENT_SECRET=release-gate-entra-not-a-real-secret \
              -e SYSTEMPROMPT_ADMIN_EMAIL="$RELEASE_GATE_EMAIL" \
              -e DATABASE_URL="postgres://test:test@localhost:5432/$db" \
              -v "$vol:/app/storage/data" "$ref" > /dev/null
            healthy=""
            for _ in $(seq 1 60); do
              # The early-bind listener answers /health 200 {"status":"starting"}
              # during bootstrap, so a bare 200 proves nothing: require the
              # finished-boot body, or /readyz (503 until boot completes).
              if curl -fsS http://localhost:8080/health 2>/dev/null | jq -e '.status == "healthy"' > /dev/null 2>&1 \
                || curl -fsS http://localhost:8080/readyz > /dev/null 2>&1; then healthy=1; break; fi
              if [ "$(docker inspect -f '{{.State.Running}}' "boot_$db")" != "true" ]; then break; fi
              sleep 5
            done
            last=$(curl -sS --max-time 5 http://localhost:8080/health 2>&1 || true)
            docker logs "boot_$db" 2>&1 | tail -40
            docker rm -f "boot_$db" > /dev/null
            if [ -z "$healthy" ]; then
              echo "last /health body: $last"
              echo "::error::image did not finish booting over release $rung (see container log above)"
              exit 1
            fi
            rows=$(psql -At -h localhost -U test -d "$db" -c "SELECT count(*) FROM ai_requests")
            [ "$rows" = "2000" ] || { echo "::error::release $rung lost ai_requests rows ($rows)"; exit 1; }
            echo "::endgroup::"
          done

  smoke:
    name: Smoke (pull, run, verify)
    needs: [params, version, image-merge]
    if: needs.image-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ${{ fromJSON(needs.params.outputs.json).CI_IMAGE }}
      B: ${{ fromJSON(needs.params.outputs.json).CI_BRIDGE_PREFIX }}
      SERVER_BINS: ${{ fromJSON(needs.params.outputs.json).CI_SERVER_BINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - name: Registry login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-retry.sh 4 bash -c 'docker login ghcr.io -u "$REGISTRY_USER" --password-stdin <<<"$REGISTRY_TOKEN"'
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Pull, version, downloads, arches, signature
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-${{ needs.version.outputs.short }}"
          bash scripts/ci-retry.sh 3 docker pull "$ref"
          out=$(docker run --rm --entrypoint /app/bin/systemprompt "$ref" --version)
          echo "$out"
          # --version reports the core crate version, not this repo's.
          core="${{ needs.version.outputs.core_version }}"
          [ -n "$core" ] && echo "$out" | grep -q "$core" || { echo "::error::--version does not report core $core"; exit 1; }
          docker run --rm --entrypoint ls "$ref" -la /app/storage/files/downloads
          docker run --rm -e B="$B" --entrypoint sh "$ref" -c 'for f in "$B-linux-x86_64.tar.gz" "$B-linux-aarch64.tar.gz" "$B-macos.dmg" "$B-windows.exe" install.sh; do test -s "/app/storage/files/downloads/$f" || exit 1; done'
          # Every binary ci-params.env lists must ship executable in /app/bin.
          docker run --rm -e BINS="$SERVER_BINS" --entrypoint sh "$ref" -c 'for b in $BINS; do test -x "/app/bin/$b" || { echo "missing or not executable: /app/bin/$b"; exit 1; }; done'
          docker buildx imagetools inspect "$ref" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$IMAGE@${{ needs.image-merge.outputs.digest }}" > /dev/null
          echo "signature verified"
