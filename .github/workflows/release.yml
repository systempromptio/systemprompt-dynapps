name: Release

# Every push to `main` publishes what a release of this repo ships. `main`
# only ever moves when `next` lands on it after a core release, so a push here
# IS the release — there is no separate tag step; this workflow creates the
# tag. See docs/RELEASING.md and docs/BRANCHING.md.
#
#   * the gateway image  ghcr.io/astound-digital/systemprompt-astound
#       :X.Y.Z (create-once)  :latest  :sha-<short>   — amd64 + arm64, cosign-signed
#   * a GitHub Release vX.Y.Z (create-once) carrying
#       astound-bridge-linux-{x86_64,aarch64}.tar.gz, astound-bridge-macos.dmg,
#       astound-bridge-macos.zip, astound-bridge-windows.exe, their .sha256
#       sidecars, install.sh,
#       systemprompt-astound-server-<version>-linux-{amd64,arm64}.tar.gz,
#       SHA256SUMS, and a cosign keyless .sig/.pem per asset
#
# The bridge is built BEFORE the image on purpose: the image serves those
# binaries at /files/downloads (storage/files/downloads/ is gitignored and
# COPYed in), so the download artifacts are staged into the build context
# first. Asset names are version-less and load-bearing — they are referenced by
# extensions/web/admin/src/handlers/ssr/ssr_bridge_setup.rs,
# storage/files/admin/templates/bridge-setup.hbs and
# scripts/fetch-remote-downloads.sh, and by the `assets:` map of the gateway's
# `bridge_releases` config (services/ai/gateway.yaml — the in-app self-updater).
# macOS publishes two artifacts from one stapled bundle: the .dmg humans
# download, and the .zip the updater installs. Only the .dmg is baked into the
# image; the updater's zip is a release asset the gateway feed proxies.
#
# Immutability: the vX.Y.Z tag, the Release and its assets, and the :X.Y.Z
# image tag are created once and never overwritten. A second push to main at
# the same version (the workspace version is pinned to core's, so this is the
# common case) rebuilds and moves only :latest and :sha-<short>.
#
# Signing: cosign keyless (Sigstore, GitHub OIDC) for every asset and the
# image. OS-native signing switches on by adding secrets and nothing else:
# Apple credentials are required: the app and DMG must both be notarized.
# Windows (WINDOWS_CERT_PFX_BASE64 …) Authenticode-signs the exe when present.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing (no image push, no tag, no release)"
        type: boolean
        default: true
      repair_macos:
        description: "Build and notarize a v0.47.0 macOS repair entirely in CI"
        type: boolean
        default: false
      repair_candidate_run:
        description: "Successful candidate run ID to publish without rebuilding the tested artifact"
        type: string
        default: ""
      repair_base_digest:
        description: "Original 0.47.0 multi-arch image digest (sha256:...)"
        type: string
        default: ""
      repair_publish:
        description: "Replace v0.47.0 assets and image tags after testing the candidate"
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: read
  pull-requests: read
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/astound-digital/systemprompt-astound
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' && inputs.repair_macos
    uses: ./.github/workflows/repair-release.yml
    with:
      candidate_run: ${{ inputs.repair_candidate_run }}
      base_digest: ${{ inputs.repair_base_digest }}
      publish: ${{ inputs.repair_publish }}
    secrets: inherit

  version:
    if: inputs.repair_macos != true
    name: Resolve version & release state
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      short: ${{ steps.v.outputs.short }}
      publish_release: ${{ steps.v.outputs.publish_release }}
      publish_version_tag: ${{ steps.v.outputs.publish_version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify merged promotion and exact release proofs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-merge.sh "$GITHUB_SHA"
      - name: Assert main builds against the published core
        run: |
          if grep -q '^\[patch\.crates-io\]' Cargo.toml || grep -q '^\[patch\.crates-io\]' tests/Cargo.toml; then
            echo "::error::[patch.crates-io] is active — main must build against the published core crates (docs/BRANCHING.md)."
            exit 1
          fi
          if grep -A2 '^name = "systemprompt"$' Cargo.lock | grep -q '^source = "registry'; then
            echo "Cargo.lock resolves systemprompt from crates.io"
          else
            echo "::error::Cargo.lock does not resolve systemprompt from crates.io — a path dependency leaked onto main."
            exit 1
          fi
          bash scripts/check-core-ref.sh
      - name: Read version and check every pin agrees
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)
          scripts/sync-release-version.sh "$version" --check
          tag="v$version"
          short=$(git rev-parse --short=7 HEAD)

          publish_release=true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists — assets are immutable; only :latest and :sha-$short move."
            publish_release=false
          else
            tag_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag exists at $tag_sha but no release was cut from it, and main is now $GITHUB_SHA."
              echo "::error::Nothing consumed that tag: delete it (git push origin :refs/tags/$tag) and re-run, or bump the version."
              exit 1
            fi
          fi

          publish_version_tag=true
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "::notice::image $IMAGE:$version already exists — left untouched."
            publish_version_tag=false
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "short=$short"
            echo "publish_release=$publish_release"
            echo "publish_version_tag=$publish_version_tag"
          } >> "$GITHUB_OUTPUT"

  # The gates are not re-run here. `just release` refuses to fast-forward
  # `next` onto `main` without a green `Gates passed` on that exact SHA
  # (scripts/check-gates-green.sh), so the commit that lands is the tree the
  # gates proved; re-running gates.yml here added ~55 min of coverage to every
  # release for no new information.
  bridge:
    name: Bridge ${{ matrix.asset }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: oldest runner glibc, so the tarball runs on the most
          # distributions. The packaging script derives the arch from uname.
          - runner: ubuntu-22.04
            asset: astound-bridge-linux-x86_64.tar.gz
            script: scripts/package-bridge-linux.sh
          - runner: ubuntu-22.04-arm
            asset: astound-bridge-linux-aarch64.tar.gz
            script: scripts/package-bridge-linux.sh
          # Windows is cross-built from Linux with cargo-xwin — the same path
          # `just bridge-package-windows` takes locally, so there is exactly one
          # Windows build definition and its two refuse-to-ship gates.
          - runner: ubuntu-22.04
            asset: astound-bridge-windows.exe
            script: scripts/package-bridge-windows.sh
          - runner: macos-14
            asset: astound-bridge-macos.dmg
            # What the in-app updater downloads; the dmg stays the human one.
            updater_asset: astound-bridge-macos.zip
            script: scripts/package-bridge-macos.sh
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/core-checkout

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm pkg-config libdbus-1-dev jq
      - run: rustup show
      - name: Add cross targets
        shell: bash
        run: |
          case "${{ matrix.asset }}" in
            *windows*) rustup target add x86_64-pc-windows-msvc ;;
            *macos*)   rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
          esac
      - uses: taiki-e/install-action@v2
        if: contains(matrix.asset, 'windows')
        with:
          tool: cargo-xwin
      # The Windows SDK/CRT cargo-xwin fetches is ~300 MB; keep it between runs.
      - uses: actions/cache@v4
        if: contains(matrix.asset, 'windows')
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}

      # Cache dependencies, not workspace outputs. Every packaging script
      # still invokes Cargo; the pinned core ref separates bridge dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          key: bridge-${{ matrix.asset }}-${{ hashFiles('bridge/CORE_REF') }}
          cache-workspace-crates: false

      - name: Import Apple signing credentials
        if: runner.os == 'macOS' && needs.version.outputs.publish_release == 'true'
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          certificate_password: ${{ secrets.APPLE_CERT_PASSWORD }}
          identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          notary_key: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          notary_key_id: ${{ secrets.APPLE_API_KEY_ID }}
          notary_issuer: ${{ secrets.APPLE_API_ISSUER_ID }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Package
        if: needs.version.outputs.publish_release == 'true'
        shell: bash
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: bash ${{ matrix.script }}

      # Notarization produces different bytes on every build. At an existing
      # version, serve the immutable release download, not a fresh rebuild.
      - name: Reuse published downloads at an existing version
        if: needs.version.outputs.publish_release != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          ASSET: ${{ matrix.asset }}
          UPDATER_ASSET: ${{ matrix.updater_asset }}
        run: |
          mkdir -p storage/files/downloads
          # Releases before the updater zip existed do not carry it; its
          # pattern matches nothing there and only the dmg is re-served.
          patterns=(--pattern "$ASSET" --pattern "$ASSET.sha256" --pattern install.sh)
          [ -z "$UPDATER_ASSET" ] || patterns+=(--pattern "$UPDATER_ASSET" --pattern "$UPDATER_ASSET.sha256")
          gh release download "$RELEASE_TAG" --dir storage/files/downloads "${patterns[@]}"
          cd storage/files/downloads
          for sums in *.sha256; do
            if command -v sha256sum >/dev/null; then
              sha256sum -c "$sums"
            else
              shasum -a 256 -c "$sums"
            fi
          done

      - name: Verify the staged macOS download
        if: runner.os == 'macOS'
        run: |
          dmg=storage/files/downloads/astound-bridge-macos.dmg
          bash tests/release/macos-smoke.sh "$dmg" "$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          zip=storage/files/downloads/astound-bridge-macos.zip
          [ ! -f "$zip" ] || bash tests/release/macos-updater-zip.sh "$zip"

      - name: Tear down signing keychain
        if: always() && runner.os == 'macOS' && needs.version.outputs.publish_release == 'true'
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # ── Windows Authenticode: on only when the secrets exist ───────────────
      - name: Detect Windows signing credentials
        id: win
        if: contains(matrix.asset, 'windows') && needs.version.outputs.publish_release == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$WINDOWS_CERT_PFX_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing secrets are absent — publishing an UNSIGNED exe (SmartScreen will warn)."
          fi
      - name: Authenticode-sign the exe
        if: steps.win.outputs.enabled == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          sudo apt-get install -y --no-install-recommends osslsigncode
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          exe=storage/files/downloads/astound-bridge-windows.exe
          osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$WINDOWS_CERT_PASSWORD" \
            -n "Astound Bridge" -i https://astounddigital.com \
            -t http://timestamp.digicert.com -h sha256 -in "$exe" -out "$exe.signed"
          rm -f "$RUNNER_TEMP/cert.pfx"
          mv "$exe.signed" "$exe"
          (cd storage/files/downloads && sha256sum astound-bridge-windows.exe > astound-bridge-windows.exe.sha256)
          osslsigncode verify "$exe"

      - name: Record signing status
        shell: bash
        run: |
          status=signed-cosign-only
          case "${{ matrix.asset }}" in
            *macos*)   status=notarized ;;
            *windows*) [ "${{ steps.win.outputs.enabled }}" = "true" ] && status=authenticode ;;
          esac
          echo "$status" > "storage/files/downloads/${{ matrix.asset }}.signing"
          ls -la storage/files/downloads

      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.asset }}
          path: |
            storage/files/downloads/${{ matrix.asset }}
            storage/files/downloads/${{ matrix.asset }}.sha256
            storage/files/downloads/${{ matrix.asset }}.signing
            storage/files/downloads/astound-bridge-macos.zip*
            storage/files/downloads/install.sh
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image (${{ matrix.arch }})
    needs: [version, bridge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # The bridge assets the image serves at /files/downloads. Every platform
      # must be present — a missing one 404s a link the admin page already
      # renders (the DOWNLOADS_STRICT=1 rule from scripts/fetch-remote-downloads.sh).
      - uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          merge-multiple: true
          path: storage/files/downloads
      - name: Assert every download asset is staged
        run: |
          cd storage/files/downloads
          for f in astound-bridge-linux-x86_64.tar.gz astound-bridge-linux-aarch64.tar.gz \
                   astound-bridge-macos.dmg astound-bridge-windows.exe install.sh; do
            [ -s "$f" ] || { echo "::error::missing download asset $f"; exit 1; }
          done
          for f in *.sha256; do sha256sum -c "$f"; done
          rm -f *.signing astound-bridge-macos.zip astound-bridge-macos.zip.sha256
          ls -la

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SYSTEMPROMPT_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          outputs: ${{ env.DRY_RUN == 'true' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}

      # Same build, exported as a tarball of the server binaries for anyone
      # running outside Docker. Hits the builder cache, so no second compile.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: artifacts
          build-args: |
            SYSTEMPROMPT_VERSION=${{ needs.version.outputs.version }}
          outputs: type=local,dest=server-out
      - name: Stage server tarball
        run: |
          v=${{ needs.version.outputs.version }}
          name=systemprompt-astound-server-$v-linux-${{ matrix.arch }}
          mkdir -p "stage/$name/extensions/mcp"
          cp -r server-out/bin "stage/$name/bin"
          cp -r services "stage/$name/services"
          for m in extensions/mcp/*/manifest.yaml; do
            d="stage/$name/$(dirname "$m")"; mkdir -p "$d"; cp "$m" "$d/"
          done
          cp docker/entrypoint.sh LICENSE* README.md "stage/$name/" 2>/dev/null || true
          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -czf "dist/$name.tar.gz" -C stage "$name"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Export digest
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.DRY_RUN != 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The base services bundle: this repository's services/ tree packed and
  # signed the way a kit is, so a kit's CI can `services validate --base` it
  # and so the `base` row on /admin/sync shows the same content_hash. Runs
  # the just-built amd64 server binary from the staged tarball; nothing here
  # deploys anything.
  base-bundle:
    name: Base services bundle
    needs: [version, image]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GHCR_AUTH: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
      ASTOUND_BUNDLE_SIGNING_SEED: ${{ secrets.ASTOUND_BUNDLE_SIGNING_SEED }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: server-amd64
          path: server
      - name: Unpack the server binary
        run: |
          tar -xzf server/systemprompt-astound-server-$VERSION-linux-amd64.tar.gz -C server
          echo "$PWD/server/systemprompt-astound-server-$VERSION-linux-amd64/bin" >> "$GITHUB_PATH"
      - name: Pack and sign
        run: |
          mkdir -p dist
          sign=()
          if [ -n "$ASTOUND_BUNDLE_SIGNING_SEED" ]; then sign=(--sign-key env:ASTOUND_BUNDLE_SIGNING_SEED); fi
          systemprompt core services bundle \
            --root services --out "dist/systemprompt-astound-base-$VERSION.tar.gz" \
            --version "$VERSION" "${sign[@]}" \
            --source-repo "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
      - name: Publish to GHCR
        if: env.DRY_RUN != 'true'
        run: |
          systemprompt core services publish \
            --bundle "dist/systemprompt-astound-base-$VERSION.tar.gz" \
            --to "oci://ghcr.io/astound-digital/systemprompt-astound-base:$VERSION" \
            --auth env:GHCR_AUTH
      - uses: actions/upload-artifact@v4
        with:
          name: base-bundle
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  image-merge:
    name: Merge manifest, tag, sign
    needs: [version, image]
    if: needs.version.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ needs.version.outputs.short }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Resolve manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${{ needs.version.outputs.short }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"

  # Why: GHCR `:X.Y.Z` is create-once and this account cannot delete an org
  # package version, so the versioned tag (and `:latest`) may only point at a
  # digest that already passed smoke and upgrade-boot. A failed run leaves
  # nothing but its own `:sha-*`.
  promote-tags:
    name: Tag the proven image
    needs: [version, image-merge, smoke, upgrade-boot]
    if: needs.image-merge.result == 'success' && needs.smoke.result == 'success' && needs.upgrade-boot.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest and :X.Y.Z at the proven digest
        env:
          DIGEST: ${{ needs.image-merge.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_VERSION_TAG: ${{ needs.version.outputs.publish_version_tag }}
        run: |
          published=(latest)
          if [ "$PUBLISH_VERSION_TAG" = "true" ]; then
            published+=("$VERSION")
          fi
          args=()
          for t in "${published[@]}"; do args+=(-t "$IMAGE:$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for t in "${published[@]}"; do
            got=$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ "$got" = "$DIGEST" ] || { echo "::error::$IMAGE:$t is $got, expected $DIGEST"; exit 1; }
          done

  release:
    name: Publish GitHub Release
    needs: [version, bridge, image, image-merge, smoke, upgrade-boot, base-bundle, promote-tags]
    if: needs.version.outputs.publish_release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: base-bundle
          path: dist

      # The gateway-served install.sh (baked into the image) keeps its default
      # base; the release copy points at this release so the piped one-liner
      # from the release page fetches exactly these assets.
      - name: Render release installer
        run: |
          sed "s|@DOWNLOAD_BASE@|https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}|" \
            scripts/install-bridge.sh > dist/install.sh
          chmod 0755 dist/install.sh
          grep -q "releases/download/${TAG}" dist/install.sh

      - name: Checksums
        working-directory: dist
        run: |
          # The per-asset .sha256 sidecars stay: install.sh fetches <base>/<asset>.sha256.
          # The gateway's update feed reads the updater zip's digest from here.
          sha256sum astound-bridge-linux-x86_64.tar.gz astound-bridge-linux-aarch64.tar.gz \
            astound-bridge-macos.dmg astound-bridge-macos.zip astound-bridge-windows.exe \
            systemprompt-astound-server-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign every asset (cosign keyless)
        working-directory: dist
        run: |
          for f in astound-bridge-linux-x86_64.tar.gz astound-bridge-linux-aarch64.tar.gz \
                   astound-bridge-macos.dmg astound-bridge-macos.zip astound-bridge-windows.exe \
                   systemprompt-astound-server-*.tar.gz install.sh SHA256SUMS; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: Write release notes
        run: |
          bridge_version=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' bridge/Cargo.toml | head -1)
          # The bridge shows this number in its footer and reports it to the
          # gateway; a release whose bridge disagrees with core is a defect.
          if [ "$bridge_version" != "$VERSION" ]; then
            echo "::error::bridge/Cargo.toml is $bridge_version but the release is $VERSION (run scripts/sync-release-version.sh $VERSION)"
            exit 1
          fi
          mac=$(cat dist/astound-bridge-macos.dmg.signing)
          win=$(cat dist/astound-bridge-windows.exe.signing)
          rm -f dist/*.signing
          {
            echo "## Astound Digital gateway $TAG"
            echo
            echo "Built against published \`systemprompt\` core **$VERSION** (crates.io); the bridge carries the same version."
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "# manifest digest: ${{ needs.image-merge.outputs.digest }}"
            echo '```'
            echo
            echo "Multi-arch (amd64 + arm64), cosign-signed. Install: docs/install/docker.md."
            echo
            echo "### Bridge"
            echo
            echo "| asset | platform | OS signing |"
            echo "|---|---|---|"
            echo "| astound-bridge-linux-x86_64.tar.gz | Linux x86_64 (glibc ≥ 2.35) | n/a |"
            echo "| astound-bridge-linux-aarch64.tar.gz | Linux aarch64 | n/a |"
            echo "| astound-bridge-macos.dmg | macOS universal (Apple Silicon + Intel) | $mac |"
            echo "| astound-bridge-macos.zip | macOS in-app updater (same bundle as the dmg) | $mac |"
            echo "| astound-bridge-windows.exe | Windows x86_64 | $win |"
            echo
            if [ "$mac" != "notarized" ]; then
              echo "**macOS is not notarized**: Gatekeeper will block the first open. Right-click → Open, or \`xattr -d com.apple.quarantine\` the app."
            fi
            if [ "$win" != "authenticode" ]; then
              echo "**Windows is not Authenticode-signed**: choose *More info → Run anyway* at the SmartScreen prompt."
            fi
            echo
            echo "Linux one-liner from this release (needs a GitHub token on a private repo; from a running gateway use \`<gateway>/files/downloads/install.sh\`):"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh -s -- --code <code>"
            echo '```'
            echo
            echo "### Verify (cosign keyless)"
            echo
            echo '```'
            echo "cosign verify-blob \\"
            echo "  --certificate-identity-regexp='https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\"
            echo "  --signature SHA256SUMS.sig --certificate SHA256SUMS.pem SHA256SUMS"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > notes.md
          cat notes.md

      # Create-once. The tag is created here from the merge commit; assets are
      # never re-uploaded over an existing release.
      - name: Create release
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
            dist/astound-bridge-* dist/systemprompt-astound-server-* dist/systemprompt-astound-base-* \
            dist/install.sh dist/install.sh.sig dist/install.sh.pem \
            dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem

  upgrade-boot:
    name: Boot the image over every seeded release
    needs: [version, image-merge]
    if: needs.image-merge.result == 'success'
    runs-on: ubuntu-latest
    # Why: a 0.58 -> 0.60 client upgrade failed five ways the gates never saw
    # (stale triggers, a retirement split across extensions, a named trigger
    # toggle, a blind retry, a root-owned /app/storage/data). Only this path —
    # the published image, its entrypoint, an old release's database with
    # rows in it, a fresh named volume — exercises all of them together.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upgrade and boot from every rung
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-${{ needs.version.outputs.short }}"
          docker pull "$ref"
          for fixture in tests/fixtures/schema/release-baseline-*.sql; do
            rung=$(basename "$fixture" .sql); rung=${rung#release-baseline-}
            db="upgrade_${rung//./_}"
            echo "::group::$rung"
            psql -h localhost -U test -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            grep -v '^\\' "$fixture" | grep -v "set_config('search_path'" \
              | psql -q -h localhost -U test -d "$db" -v ON_ERROR_STOP=1 > /dev/null
            psql -q -h localhost -U test -d "$db" -v ON_ERROR_STOP=1 \
              -f tests/integration/schema-upgrade/src/seed_hot_tables.sql
            vol="storage_data_${db}"
            docker volume create "$vol" > /dev/null
            docker run -d --name "boot_$db" --network host \
              -e ANTHROPIC_API_KEY=sk-ant-release-gate \
              -e SYSTEMPROMPT_ADMIN_EMAIL=release-gate@astounddigital.com \
              -e DATABASE_URL="postgres://test:test@localhost:5432/$db" \
              -v "$vol:/app/storage/data" "$ref" > /dev/null
            healthy=""
            for _ in $(seq 1 60); do
              if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then healthy=1; break; fi
              if [ "$(docker inspect -f '{{.State.Running}}' "boot_$db")" != "true" ]; then break; fi
              sleep 5
            done
            docker logs "boot_$db" 2>&1 | tail -40
            docker rm -f "boot_$db" > /dev/null
            [ -n "$healthy" ] || { echo "::error::image did not become healthy over release $rung"; exit 1; }
            rows=$(psql -At -h localhost -U test -d "$db" -c "SELECT count(*) FROM ai_requests")
            [ "$rows" = "2000" ] || { echo "::error::release $rung lost ai_requests rows ($rows)"; exit 1; }
            echo "::endgroup::"
          done

  smoke:
    name: Smoke (pull, run, verify)
    needs: [version, image-merge]
    if: needs.image-merge.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Pull, version, downloads, arches, signature
        run: |
          ref="$IMAGE:sha-${{ needs.version.outputs.short }}"
          docker pull "$ref"
          out=$(docker run --rm --entrypoint /app/bin/systemprompt "$ref" --version)
          echo "$out"
          echo "$out" | grep -q "${{ needs.version.outputs.version }}" || { echo "::error::--version does not report ${{ needs.version.outputs.version }}"; exit 1; }
          docker run --rm --entrypoint ls "$ref" -la /app/storage/files/downloads
          docker run --rm --entrypoint sh "$ref" -c 'for f in astound-bridge-linux-x86_64.tar.gz astound-bridge-linux-aarch64.tar.gz astound-bridge-macos.dmg astound-bridge-windows.exe install.sh; do test -s /app/storage/files/downloads/$f || exit 1; done'
          docker run --rm --entrypoint ls "$ref" /app/bin/systemprompt-mcp-agent
          docker buildx imagetools inspect "$ref" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$IMAGE@${{ needs.image-merge.outputs.digest }}" > /dev/null
          echo "signature verified"
