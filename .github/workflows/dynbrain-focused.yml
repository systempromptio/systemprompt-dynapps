name: dynbrain focused

# Temporary, for the `dynbrain` branch only: each push runs the Brain plan's
# own test packages (.github/dynbrain-focused.filter), clippy on the plan's
# crates and a live check of their sqlx offline cache, on Postgres with
# pgvector. The full Gates run once, on the pull request into next, which
# deletes this file and the filter first.

on:
  push:
    branches: [dynbrain]

concurrency:
  group: dynbrain-focused-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  SQLX_OFFLINE: "true"
  CC: clang
  CXX: clang++
  BUILD_NO_COORD: "1"
  NEXTEST_VERSION: "0.9.148"

permissions:
  contents: read

jobs:
  test:
    name: Test (plan packages)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Plain text, so the plan's verify can count the PASS lines in the log.
      CARGO_TERM_COLOR: never
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev python3 python3-yaml
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dynbrain-focused-test
          workspaces: |
            .
            tests
          cache-on-failure: true
      - run: cargo nextest run --color never --no-fail-fast --manifest-path tests/Cargo.toml --workspace -E "$(cat .github/dynbrain-focused.filter)"
        timeout-minutes: 90

  clippy:
    name: Clippy (plan crates)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dynbrain-focused-clippy
          workspaces: |
            .
            tests
          cache-on-failure: true
      - name: Clippy, plan crates of the root workspace
        run: cargo clippy -p dynbrain -p systemprompt-mcp-brain --all-targets -- -D warnings
        timeout-minutes: 60
      - name: Clippy, plan test crates
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path tests/Cargo.toml -p dynbrain-unit-tests -p dynbrain-integration-tests -p mcp-brain-unit-tests -p mcp-brain-integration-tests --all-targets -- -D warnings
        timeout-minutes: 60

  # The source gates that need no compile, run on the plan's code with the
  # core the checkout pins, so their findings show on every push instead of
  # at the pull request.
  source-gates:
    name: Source gates (plan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/core-checkout
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep python3 python3-yaml clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev
      - run: rustup show
      - name: Run the gates
        run: |
          set -uo pipefail
          status=0
          for gate in check-discarded-results check-fail-open check-swallowed-errors check-tracing-messages lint-layers lint-repo-construction lint-serde-aliases check-json-value lint-inline-comments check-file-size check-dockerfile-paths; do
            echo "::group::$gate"
            bash "scripts/$gate.sh" || status=1
            echo "::endgroup::"
          done
          exit $status

  # The committed `.sqlx/` entries of the plan's crates, against what the
  # sqlx macros describe from a live schema. A crate-local `.env` gives the
  # plan's crate alone a DATABASE_URL; with SQLX_OFFLINE=false it compiles
  # online and rewrites its query files in the root `.sqlx/` (the cache
  # directory .cargo/config.toml names), while every other crate, with no
  # DATABASE_URL, keeps reading the cache. Any change to `.sqlx/` fails.
  sqlx-cache:
    name: sqlx cache (plan crates, live)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev postgresql-client jq
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dynbrain-focused-sqlx
          cache-on-failure: true
      - name: Schema the plan's queries read
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          users_sql=$(find .vendor/systemprompt-core -path '*users/schema/users.sql' | head -n 1)
          test -n "$users_sql"
          psql -h localhost -U test -d test -v ON_ERROR_STOP=1 -q \
            -f "$users_sql" \
            -f extensions/web/schema/23_groups_projects.sql \
            -f extensions/dynbrain/schema/01_dynbrain.sql \
            -f extensions/dynbrain/schema/02_dynbrain_assets.sql \
            -f extensions/dynbrain/schema/03_dynbrain_admin.sql
      - name: Describe the queries live
        run: |
          set -euo pipefail
          printf 'DATABASE_URL=postgres://test:test@localhost:5432/test\n' > extensions/dynbrain/.env
          touch extensions/dynbrain/src/lib.rs
          SQLX_OFFLINE=false cargo check -p dynbrain
          rm extensions/dynbrain/.env
        timeout-minutes: 60
      - name: Compare with the committed cache
        run: |
          set -euo pipefail
          git add -N .sqlx
          git diff --stat --exit-code -- .sqlx
          echo "the live descriptions equal the committed .sqlx/"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() }}
        with:
          name: sqlx-live
          path: .sqlx
          include-hidden-files: true
