name: Gates

# Full matrix on next pushes and ordinary PRs. Frozen promotion PRs reuse
# the exact next-push proof and validate the base, head and merge tree.
#
# Shared byte-for-byte with the sibling downstream repo; brand values come
# from .github/ci-params.env and scripts/ci-sync-check.sh proves the rest.
#
# Every job has a timeout, and every long step a shorter one: a job-level
# timeout cancels the job, and a cancelled job skips rust-cache's post step,
# so the dependencies a cold run spent the hour compiling are thrown away and
# the next run starts cold again. A step timeout fails the step instead,
# which the cache-on-failure post step still saves.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
      full_regression:
        description: "Also run the full hotfix regression tier"
        type: boolean
        default: false
  pull_request:
    branches: [main, next]
  push:
    branches: [next]

concurrency:
  group: gates-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  SQLX_OFFLINE: "true"
  # aws-lc-sys refuses to build with GCC <10 and the release profile's LTO
  # trips it; mirror the justfile's CC/CXX toggle.
  CC: clang
  CXX: clang++
  # scripts/build-coordinator.sh serialises builds across agents sharing one
  # clone; a runner is single-tenant, so bypass it.
  BUILD_NO_COORD: "1"
  JUST_VERSION: "1.42.4"
  NEXTEST_VERSION: "0.9.148"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: Verify frozen promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'promote/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            let pr;
            for (let attempt = 0; attempt < 6; attempt++) {
              pr = (await github.rest.pulls.get({owner, repo, pull_number: context.payload.pull_request.number})).data;
              if (pr.mergeable !== null) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const match = /^promote\/(\d+\.\d+\.\d+)\/([0-9a-f]{40})\/([0-9a-f]{40})$/.exec(pr.head.ref);
            if (!match || pr.head.repo.full_name !== context.payload.repository.full_name || pr.base.ref !== 'main' || pr.base.sha !== match[2] || pr.head.sha !== match[3]) {
              throw new Error('Promotion identity differs from frozen head/base');
            }
            const currentMain = (await github.rest.git.getRef({owner, repo, ref: 'heads/main'})).data.object.sha;
            const currentNext = (await github.rest.git.getRef({owner, repo, ref: 'heads/next'})).data.object.sha;
            if (currentMain !== pr.base.sha || currentNext !== pr.head.sha) throw new Error('main or next moved');
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${pr.base.sha}...${pr.head.sha}`})).data;
            if (comparison.status !== 'ahead' || comparison.behind_by !== 0) throw new Error('main is not an ancestor of candidate');
            const runs = (await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'gates.yml', event: 'push', branch: 'next', head_sha: pr.head.sha, per_page: 1})).data.workflow_runs;
            const run = runs[0];
            if (!run || run.head_sha !== pr.head.sha || run.head_branch !== 'next' || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Latest exact next-push Gates run did not succeed');
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100});
            const proof = jobs.filter(job => job.name === 'Gates passed');
            if (proof.length !== 1 || proof[0].status !== 'completed' || proof[0].conclusion !== 'success') throw new Error('Gates passed aggregate did not succeed');
            const head = (await github.rest.git.getCommit({owner, repo, commit_sha: pr.head.sha})).data;
            if (pr.mergeable !== true || !pr.merge_commit_sha) throw new Error('GitHub merge result is not ready or conflicts');
            const merge = (await github.rest.git.getCommit({owner, repo, commit_sha: pr.merge_commit_sha})).data;
            if (merge.tree.sha !== head.tree.sha || merge.parents.length !== 2 || merge.parents[0].sha !== pr.base.sha || merge.parents[1].sha !== pr.head.sha) throw new Error('Merge result differs from proven candidate');
            const latest = (await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'gates.yml', event: 'push', branch: 'next', head_sha: pr.head.sha, per_page: 1})).data.workflow_runs[0];
            if (!latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt || latest.status !== 'completed' || latest.conclusion !== 'success') throw new Error('Push proof changed during verification');
            core.info(`Verified next-push run ${run.id} attempt ${run.run_attempt}, candidate ${pr.head.sha}, base ${pr.base.sha}`);

  hotfix:
    name: Verify frozen hotfix
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify main base, candidate and published core
        env:
          PR_JSON: ${{ toJSON(github.event.pull_request) }}
        run: |
          set -euo pipefail
          ref=$(jq -r .head.ref <<<"$PR_JSON")
          head=$(jq -r .head.sha <<<"$PR_JSON")
          base=$(jq -r .base.sha <<<"$PR_JSON")
          [[ "$ref" =~ ^hotfix/([0-9]+\.[0-9]+\.[0-9]+)/([0-9a-f]{40})$ ]]
          version="${BASH_REMATCH[1]}"
          [ "${BASH_REMATCH[2]}" = "$base" ]
          [ "$(jq -r .head.repo.full_name <<<"$PR_JSON")" = "$GITHUB_REPOSITORY" ]
          git merge-base --is-ancestor "$base" "$head"
          [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$head^{tree}")" ]
          scripts/sync-release-version.sh "$version" --check
          scripts/sync-core-version.sh --check
          bash scripts/check-core-ref.sh
          ! grep -q '^\[patch.crates-io\]' Cargo.toml tests/Cargo.toml

  static:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Static (fmt, sqlx cache, source gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep jq python3
      - run: rustup show
      # The shared CI layout must match the manifest both downstream repos
      # carry; a fix landed in one repo only is a red build here.
      - run: bash scripts/ci-sync-check.sh
        if: ${{ !cancelled() }}
      - run: bash scripts/check-core-crate-versions.sh
        if: ${{ !cancelled() }}
      - run: bash tests/scripts/release-proof.sh && bash tests/scripts/release-merge.sh && bash tests/scripts/release-helper.sh && bash tests/scripts/deploy-observation.sh
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: just preflight-static
        if: ${{ !cancelled() }}
        timeout-minutes: 12

  # lint and test do not wait on static, so a red static job never hides
  # their findings. All run and report together; `Gates passed` still needs
  # every one.
  lint:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Lint (clippy ×3, rustdoc, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      # Why: three clippy workspaces plus the Windows cross-lint's second
      # dependency tree overflow the runner's ~14 GB root disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      # libdbus: keyring → dbus-secret-service in the bridge crate.
      # gcc-mingw-w64: `just clippy` cross-lints the bridge GUI for
      # x86_64-pc-windows-gnu, and ring's build script needs a C compiler
      # with Windows headers (clang alone has no assert.h for that target).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep jq python3 clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev gcc-mingw-w64-x86-64
      - run: rustup show
      - run: rustup toolchain install 1.96.0 --profile minimal
      # One cache entry per job and pinned core ref, written only by pushes
      # to next: PR runs restore it and never evict it with a branch-scoped
      # copy the next push cannot read.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-core-${{ hashFiles('bridge/CORE_REF') }}
          workspaces: |
            .
            tests
            bridge
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - run: just preflight-lint
        timeout-minutes: 65

  test:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Test (unit, integration, admin contract)
    runs-on: ubuntu-latest
    # Integration is dominated by CREATE/DROP DATABASE round-trips, and a cold
    # cache (every core re-pin) adds the full compile on top; the timeout
    # leaves room for both.
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The harness accepts a maintenance DB named test, postgres, or *_test.
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        # Plain postgres 18: no schema needs an extension beyond uuid-ossp and
        # pgcrypto, which the stock image ships.
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      # The unit tier includes bridge/keyring code and the Python BA importer.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev python3 python3-yaml
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-core-${{ hashFiles('bridge/CORE_REF') }}
          workspaces: |
            .
            tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/next' }}
      - name: Focused emergency hotfix gate
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/')
        run: just test-hotfix
        timeout-minutes: 60
      - run: just test
        if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'hotfix/')
        timeout-minutes: 90

  # The upgrade ladder's two newest rungs on a Postgres of their own: the
  # downstream mirror of core's schema-ladder.yml, and its own red context
  # when a migration only breaks an established database.
  schema-ladder:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Schema ladder (two newest releases)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # Same build flags as `test`, so the tests/ workspace dependencies it
      # compiles are the ones that job's cache already holds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-core-${{ hashFiles('bridge/CORE_REF') }}
          workspaces: tests
          save-if: false
      - run: just schema-ladder
        timeout-minutes: 65

  # The shared document store end to end (`just docs-smoke`) on the same
  # Postgres service the test tier uses, as its own red context.
  docs-smoke:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Docs smoke (document store end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-core-${{ hashFiles('bridge/CORE_REF') }}
          workspaces: tests
          save-if: false
      - run: just docs-smoke
        timeout-minutes: 65

  # cargo-deny and cargo-audit over every workspace (root, tests/, bridge/).
  # Advisory databases are fetched under a retry, then checked offline, so a
  # flaky fetch is retried and a real finding fails once.
  supply-chain:
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || !startsWith(github.head_ref, 'promote/') || github.event.pull_request.head.repo.full_name != github.repository
    name: Supply chain (deny, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: just supply-chain
        timeout-minutes: 15

  full-hotfix-regression:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/')) || (github.event_name == 'workflow_dispatch' && inputs.full_regression)
    name: Full hotfix regression (nonblocking)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev python3 python3-yaml
      - run: rustup show
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-core-${{ hashFiles('bridge/CORE_REF') }}
          workspaces: |
            .
            tests
          save-if: false
      - run: just test
        timeout-minutes: 90

  # One stable context for the `main` ruleset: it fails unless every gate
  # above succeeded, so a skipped or cancelled job can never pass as "not
  # failed". Branch protection names this job, never the tiers.
  gates-passed:
    name: Gates passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [promotion, hotfix, static, lint, test, schema-ladder, docs-smoke, supply-chain]
    if: always()
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_HOTFIX: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/') }}
          IS_PROMOTION: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'promote/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          tiers='.static.result == "%s" and .lint.result == "%s" and .test.result == "%s" and .["schema-ladder"].result == "%s" and .["docs-smoke"].result == "%s" and .["supply-chain"].result == "%s"'
          if [ "$IS_PROMOTION" = true ]; then
            # shellcheck disable=SC2059
            jq -e ".promotion.result == \"success\" and $(printf "$tiers" skipped skipped skipped skipped skipped skipped)" <<<"$NEEDS_JSON" >/dev/null
          elif [ "$IS_HOTFIX" = true ]; then
            # shellcheck disable=SC2059
            jq -e ".hotfix.result == \"success\" and .promotion.result == \"skipped\" and $(printf "$tiers" success success success success success success)" <<<"$NEEDS_JSON" >/dev/null
          else
            # shellcheck disable=SC2059
            jq -e ".hotfix.result == \"skipped\" and .promotion.result == \"skipped\" and $(printf "$tiers" success success success success success success)" <<<"$NEEDS_JSON" >/dev/null
          fi
