name: Gates

# The quality gate, identical on both branches: what `just verify` runs
# locally (preflight-static → preflight-lint → test), plus the coverage floor
# and ratchet. It publishes nothing.
#
#   next  — every push and PR. `next` builds against the vendored core `next`
#           through an active [patch.crates-io]; CI materialises that tree at
#           bridge/CORE_REF (a SHA on core next) and symlinks it into .vendor/.
#   main  — PRs, and as a called workflow from release.yml on every push, so a
#           release is proven on the exact commit it ships from.
#
# One core checkout serves both consumers: the [patch] paths point at
# .vendor/systemprompt-core, and bridge/ depends on systemprompt-bridge by the
# sibling path ../systemprompt-core — so the checkout lands in .vendor/ and a
# symlink stands in for the sibling. See docs/BRANCHING.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to gate. Defaults to the triggering ref."
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  pull_request:
    branches: [main, next]
  push:
    branches: [next]

concurrency:
  group: gates-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # aws-lc-sys refuses to build with GCC <10 and the release profile's LTO
  # trips it; mirror the justfile's CC/CXX toggle.
  CC: clang
  CXX: clang++
  # scripts/build-coordinator.sh serialises builds across agents sharing one
  # clone; a runner is single-tenant, so bypass it.
  BUILD_NO_COORD: "1"

jobs:
  static:
    name: Static (fmt, sqlx cache, source gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep jq python3
      - run: rustup show
      - run: just preflight-static

  lint:
    name: Lint (clippy ×3, rustdoc, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@v2
      # libdbus: keyring → dbus-secret-service in the bridge crate.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep jq python3 clang mold libpq-dev libssl-dev pkg-config libdbus-1-dev
      - run: rustup show
      - run: rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
            bridge
      - run: just preflight-lint

  test:
    name: Test (unit, integration, admin contract)
    runs-on: ubuntu-latest
    # Integration is dominated by CREATE/DROP DATABASE round-trips; leave
    # headroom so a growing suite never turns into a meaningless red X.
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The harness accepts a maintenance DB named test, postgres, or *_test.
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        # postgres 18 + the `vector` extension the knowledge-bank index needs —
        # the same image docker-compose.yml and setup-local use.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # Why: the runner ships ~13 GB free, and the cargo target trees exhaust
      # it — `just test` began failing with "No space left on device" while
      # linking the contract crate, which reads as a compile error rather than
      # as a full disk, and the coverage job builds three instrumented trees on
      # top of that. Everything removed here is a preinstalled SDK or language
      # runtime nothing in this repo uses. Ordered roughly by size; `|| true`
      # throughout because the image's contents drift between runner releases
      # and a path that has moved must not fail the build.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk \
            /opt/microsoft /opt/az /usr/share/az_* \
            /usr/local/graalvm /usr/share/kotlinc \
            /usr/local/share/boost /usr/local/julia* \
            /opt/pipx /usr/local/aws-cli /usr/local/lib/heroku \
            "${AGENT_TOOLSDIRECTORY:-}" 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "after:"; df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
      - run: just test

  coverage:
    name: Coverage (floor + ratchet)
    runs-on: ubuntu-latest
    # An instrumented build of all three workspaces, then the full suite again
    # under it: slower than `test`, and the reason this is its own job rather
    # than a step appended to it.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      # Why: instrumenting every crate already inflates each object, and the
      # first `just coverage` run here was SIGTERMed nine minutes into linking
      # the root workspace — the runner running out of memory, which surfaces
      # as a bare exit 143 with no diagnostic. Dropping debug info is what the
      # `test` job above already does, and coverage does not need it: the line
      # mapping comes from the instrumentation's own coverage section, not
      # from DWARF.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Same failure, second cause: four instrumented binaries linking at once
      # exceeds the runner's memory even without debug info.
      COVERAGE_BUILD_JOBS: "2"
      SYSTEMPROMPT_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # Why: the runner ships ~13 GB free, and the cargo target trees exhaust
      # it — `just test` began failing with "No space left on device" while
      # linking the contract crate, which reads as a compile error rather than
      # as a full disk, and the coverage job builds three instrumented trees on
      # top of that. Everything removed here is a preinstalled SDK or language
      # runtime nothing in this repo uses. Ordered roughly by size; `|| true`
      # throughout because the image's contents drift between runner releases
      # and a path that has moved must not fail the build.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk \
            /opt/microsoft /opt/az /usr/share/az_* \
            /usr/local/graalvm /usr/share/kotlinc \
            /usr/local/share/boost /usr/local/julia* \
            /opt/pipx /usr/local/aws-cli /usr/local/lib/heroku \
            "${AGENT_TOOLSDIRECTORY:-}" 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "after:"; df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@v2
      # libdbus: scripts/coverage.sh instruments the bridge workspace too, and
      # bridge pulls keyring -> dbus-secret-service. Without it that phase
      # fails to build; coverage.sh logs "continuing to coverage report" and
      # carries on, so the run still produces a number while the third
      # workspace contributed nothing.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3 libdbus-1-dev
      - run: rustup show
      # scripts/coverage.sh calls llvm-profdata and llvm-cov out of the
      # toolchain's own sysroot rather than installing cargo-llvm-cov, which
      # re-injects the mold linker flags and silently produces zero profraws.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
            bridge
          # The instrumented build is a different rustflags set from `test`,
          # so it must not share that job's cache entry.
          key: coverage
      # `tee` so the totals survive into the summary below; `pipefail` (set by
      # the shell default here) keeps the job red when the ratchet trips.
      #
      # The mkdir is load-bearing: the shell opens tee's output file before
      # `just` runs, and on a fresh checkout coverage-report/ does not exist
      # yet. GNU tee then keeps copying to stdout and exits 1 at the very end,
      # which turned four correct 83.86% runs into red jobs whose logs said
      # "coverage-check passed" immediately above the failure.
      - run: |
          mkdir -p coverage-report
          just coverage-check | tee coverage-report/check.txt
      # Why `always()`: the number is most wanted on the run that failed the
      # ratchet, which is exactly when a success-gated step would be skipped.
      - if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            cat coverage-report/check.txt 2>/dev/null || echo "no coverage produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright, admin console)
    needs: test
    runs-on: ubuntu-latest
    # A debug build of the server, a seeded database and a browser walk of every
    # admin page. Slower than `test`, and it needs the stack alive, so it is its
    # own job rather than a step appended to one.
    #
    # Why: temporarily non-blocking (Ed, 2026-09-06) — the admin-redesign UI
    # specs (density/element checks) are failing on pre-existing product
    # issues unrelated to the 0.47.0 core bump, and the release must not stay
    # stuck on them. The job still runs and its own conclusion still reports
    # red; only the calling `gates` workflow-call's overall result is
    # unblocked. Revert this once the redesign's specs are fixed.
    continue-on-error: true
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      GATEWAY_URL: http://localhost:8080
    steps:
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/lib/google-cloud-sdk \
            /opt/microsoft /opt/az /usr/share/az_* \
            /usr/local/graalvm /usr/share/kotlinc \
            /usr/local/share/boost /usr/local/julia* \
            /opt/pipx /usr/local/aws-cli /usr/local/lib/heroku \
            "${AGENT_TOOLSDIRECTORY:-}" 2>/dev/null || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/core-checkout
      - uses: extractions/setup-just@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold libpq-dev libssl-dev pkg-config python3 postgresql-client
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: just build
      # setup-local brings up its own Docker Postgres, so this job takes no
      # `services:` block: the seed then reads the same profile secrets a
      # developer's machine does, and CI and local disagree about nothing.
      #
      # The key is a placeholder and is never used. Inference in this suite is
      # answered by the in-process mock the `e2e-mock` provider points at
      # (services/ai/providers.yaml), which is what keeps the run offline and
      # deterministic; setup-local simply refuses to generate a profile with no
      # provider key at all off a TTY.
      - name: Provision the local profile
        run: just setup-local "sk-ant-e2e-placeholder" "" "" 8080 5432
      # `infra services start` holds the terminal for the life of the server, so
      # it must be detached here or the job spends its whole timeout on this
      # step and never reaches the health wait.
      - name: Start the stack (detached)
        run: nohup just start > e2e-server.log 2>&1 &
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/health && exit 0
            sleep 2
          done
          echo "server never became healthy"; exit 1
      - run: just e2e-install
      - run: just e2e --project chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: e2e-server.log
          retention-days: 7
