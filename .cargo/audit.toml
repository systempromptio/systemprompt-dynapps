# cargo-audit configuration. Mirrors what `rustsec/audit-check@v2.0.0` reads in CI.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa Marvin Attack timing sidechannel (medium, 5.9). No upstream fix.
    #
    # Why this is in the dep tree:
    # `rsa 0.9.x` is linked via `jsonwebtoken`'s `rust_crypto` backend feature, which we
    # need explicitly — jsonwebtoken 10.x's default `["use_pem"]` ships without a crypto
    # backend and panics at the first JWT operation ("Could not automatically determine
    # the process-level CryptoProvider"). The `aws_lc_rs` alternative requires modern
    # gcc/clang in every build environment, which we don't want to mandate.
    #
    # Exposure under the current architecture:
    # v0.11.0 signs and verifies JWTs as RS256 against an `RsaSigningKey` (see
    # `crates/infra/security/src/keys/mod.rs` and `crates/domain/oauth/src/services/generation.rs`).
    # Token signing exercises the rsa private-key code path on every mint, so the Marvin
    # Attack timing sidechannel is in scope.
    #
    # Mitigations to plan for: (a) switch jsonwebtoken to `aws_lc_rs` and drop the `rsa`
    # crate from the dep tree, (b) move JWT signing to ES256 or EdDSA (no Marvin Attack
    # surface), or (c) wait for an upstream rsa fix. Until then the advisory is ignored
    # to keep CI green; this is a known accepted risk, not a clean bill of health.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0235 — rkyv 0.7 out-of-bounds read validating untrusted archives.
    #
    # rkyv appears in the lockfile only through rust_decimal's optional `rkyv`
    # feature, which no crate in this workspace enables: `cargo tree -i rkyv`
    # prints nothing, so the code is never compiled or linked. rust_decimal's
    # 1.x line pins rkyv 0.7 (the patched 0.8.17 is a breaking bump upstream).
    # Drop the ignore when rust_decimal moves to rkyv 0.8.
    "RUSTSEC-2026-0235",
    # RUSTSEC-2026-0387 — crypto-bigint 0.5.5 timing variation, reached only
    # through jsonwebtoken's rust_crypto backend (p256/p384 0.13). Only ES256/ES384
    # keys run that arithmetic and none is ever built: keys are RSA or HMAC and
    # every verifier pins RS256/HS256. Drop when jsonwebtoken moves to
    # elliptic-curve 0.14 (see deny.toml).
    "RUSTSEC-2026-0387",
    # RUSTSEC-2026-0459 — bundled C SQLite in libsqlite3-sys 0.37.0 (CVE-2026-119375).
    #
    # libsqlite3-sys appears in the root and tests lockfiles only as an optional
    # dependency of sqlx-sqlite 0.9.0. No workspace enables sqlx's `sqlite`
    # feature, so `cargo tree -i libsqlite3-sys --target all` prints nothing and
    # no artifact links SQLite; cargo-deny walks the feature-resolved graph and
    # does not report it, cargo-audit reads the raw lockfile. sqlx-sqlite 0.9.0
    # caps libsqlite3-sys below the fixed 0.39 and sqlx 0.9.0 is the latest
    # release. Same reasoning as core's deny.toml. Drop when sqlx ships against
    # libsqlite3-sys >=0.39.
    "RUSTSEC-2026-0459",
]
