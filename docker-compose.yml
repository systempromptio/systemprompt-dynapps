services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: systemprompt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-systemprompt}
      POSTGRES_DB: systemprompt
    volumes:
      # pgvector/pgvector:pg18 is the official postgres:18 image plus the
      # `vector` extension. Nothing needs `vector` any more; the image is kept
      # so volumes created by earlier releases (which installed it) still work.
      # postgres:18+ images store data under major-version subdirectories of
      # /var/lib/postgresql — mounting the old .../data path aborts startup.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemprompt -d systemprompt"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # The prebuilt image .github/workflows/release.yml publishes on every push
    # to main. Pin a release with SYSTEMPROMPT_TAG=X.Y.Z in .env; pulling needs
    # `docker login ghcr.io` with a token holding read:packages
    # (docs/install/docker.md). To build from source instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
    image: ghcr.io/astound-digital/systemprompt-astound:${SYSTEMPROMPT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Override in .env to point at a remote Postgres (Oracle VM setups) and
      # stop the bundled one with `docker compose up -d app`.
      DATABASE_URL: ${DATABASE_URL:-postgres://systemprompt:${POSTGRES_PASSWORD:-systemprompt}@postgres:5432/systemprompt}
      EXTERNAL_URL: ${EXTERNAL_URL:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - app_web:/app/web
      - app_storage_data:/app/storage/data
      - app_profiles:/app/.systemprompt/profiles/docker

volumes:
  postgres_data:
  app_web:
  app_storage_data:
  app_profiles:
